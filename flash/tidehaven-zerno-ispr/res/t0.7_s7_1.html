<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tidehaven — a coastal diorama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..900,0..60,0..1&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
<style>
/* ==================================================================
   TIDEHAVEN — UI shell
   ================================================================== */
:root{
  --sea:#0d6a70; --sea-2:#12868c; --turq:#3fc9bd;
  --copper:#b96b3c; --copper-2:#e0915a;
  --sand:#f1dfbd; --paper:#fbf5ea;
  --ink:#153039; --ink-2:#43626d;
  --line:rgba(21,48,57,.14);
  --panel:rgba(251,245,234,.80);
  --shadow:0 18px 40px -22px rgba(6,38,44,.55), 0 2px 0 rgba(255,255,255,.55) inset;
  --r-l:16px; --r-m:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b1d24;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-family:"DM Sans",ui-sans-serif,sans-serif;color:var(--ink);
  font-variant-numeric:tabular-nums;overscroll-behavior:none;touch-action:none}
canvas{display:block;width:100%;height:100%}
#stage{position:fixed;inset:0}

/* atmosphere overlays */
#uw{position:fixed;inset:0;pointer-events:none;opacity:0;
  background:
    radial-gradient(120% 90% at 50% 8%, rgba(190,255,244,.20), transparent 60%),
    linear-gradient(180deg, rgba(20,150,150,.30), rgba(3,44,58,.62));
  mix-blend-mode:screen;transition:opacity .35s linear}
#uw::after{content:"";position:absolute;inset:-20%;
  background:repeating-linear-gradient(115deg, rgba(255,255,255,.055) 0 2px, transparent 2px 26px);
  animation:causticDrift 14s linear infinite;opacity:.8}
@keyframes causticDrift{to{transform:translate3d(-14%,9%,0) rotate(.5deg)}}
#vig{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(115% 95% at 50% 42%, transparent 42%, rgba(4,24,30,.42) 100%)}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.055;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}

/* generic panel */
.panel{background:var(--panel);backdrop-filter:blur(14px) saturate(1.35);
  -webkit-backdrop-filter:blur(14px) saturate(1.35);
  border:1px solid rgba(255,255,255,.55);outline:1px solid var(--line);outline-offset:-1px;
  box-shadow:var(--shadow);border-radius:var(--r-l)}

/* brand */
#brand{position:fixed;left:20px;top:18px;padding:14px 20px 13px;pointer-events:auto;
  animation:riseIn .9s cubic-bezier(.2,.8,.2,1) both .15s}
#brand .kicker{display:flex;align-items:center;gap:8px;font-size:9.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--copper);font-weight:700}
#brand .kicker i{display:block;width:16px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--copper),var(--copper-2))}
#brand h1{font-family:"Fraunces",serif;font-weight:900;font-size:clamp(30px,4.2vw,44px);
  line-height:.94;letter-spacing:-.028em;margin:5px 0 3px;color:#0f2a33;
  font-variation-settings:"SOFT" 40,"WONK" 1,"opsz" 100}
#brand h1 em{font-style:italic;color:var(--sea-2);font-weight:700}
#brand p{font-size:11.5px;color:var(--ink-2);max-width:250px;line-height:1.45}

/* camera dock */
#cams{position:fixed;left:20px;bottom:20px;display:flex;gap:6px;padding:6px;pointer-events:auto;
  animation:riseIn .9s cubic-bezier(.2,.8,.2,1) both .3s}
#cams button{font:600 11.5px/1 "DM Sans";letter-spacing:.02em;color:var(--ink-2);
  background:transparent;border:0;padding:9px 13px;border-radius:9px;cursor:pointer;
  display:flex;align-items:center;gap:7px;transition:.18s ease}
#cams button svg{width:13px;height:13px;opacity:.75}
#cams button:hover{background:rgba(18,134,140,.10);color:var(--sea);transform:translateY(-1px)}
#cams button.on{background:linear-gradient(180deg,#12868c,#0b5d64);color:#eafffb;
  box-shadow:0 6px 14px -8px rgba(9,80,86,.9)}
#cams button.on svg{opacity:1}

/* right rail */
#rail{position:fixed;right:18px;top:18px;bottom:18px;width:290px;display:flex;flex-direction:column;
  gap:10px;pointer-events:none;animation:riseIn .9s cubic-bezier(.2,.8,.2,1) both .45s}
.card{pointer-events:auto;padding:12px 13px 13px;border-radius:14px}
.card h2{font-family:"Fraunces",serif;font-size:11px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:#8a5a35;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
button.btn{font:600 11.5px/1 "DM Sans";color:var(--ink);background:rgba(255,255,255,.62);
  border:1px solid rgba(21,48,57,.12);border-radius:9px;padding:10px 8px;cursor:pointer;
  transition:.16s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
button.btn:hover{transform:translateY(-1.5px);border-color:rgba(18,134,140,.42);
  box-shadow:0 8px 16px -12px rgba(9,80,86,.8);background:#fff}
button.btn:active{transform:translateY(0) scale(.985)}
button.btn.on{background:linear-gradient(180deg,#15947f,#0c6a5c);color:#eafff9;border-color:transparent;
  box-shadow:0 8px 18px -10px rgba(12,106,92,.95)}
button.btn.warm.on{background:linear-gradient(180deg,#c4753f,#9a4f24)}
button.btn .sub{display:block;font-size:9px;font-weight:500;opacity:.62;margin-top:3px;letter-spacing:.04em}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(19,60,68,.07);
  padding:4px;border-radius:11px}
.seg button{border:0;background:transparent;font:600 11px/1 "DM Sans";color:var(--ink-2);
  padding:8px 4px;border-radius:8px;cursor:pointer;transition:.18s}
.seg button:hover{color:var(--sea)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 3px 8px -4px rgba(20,50,60,.45)}

/* sliders */
.ctl{margin:11px 0 3px}
.ctl:first-of-type{margin-top:0}
.ctl label{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin-bottom:7px}
.ctl label b{font-family:"Fraunces",serif;font-size:13px;font-weight:800;letter-spacing:0;
  text-transform:none;color:var(--sea)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:grab}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:99px;
  background:linear-gradient(90deg,var(--turq),var(--sea) 60%,rgba(19,60,68,.18) 60%)}
input[type=range]::-moz-range-track{height:5px;border-radius:99px;background:rgba(19,60,68,.16)}
input[type=range]::-moz-range-progress{height:5px;border-radius:99px;background:linear-gradient(90deg,var(--turq),var(--sea))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:#fffdf8;border:2px solid var(--sea);margin-top:-5.5px;
  box-shadow:0 3px 8px -3px rgba(9,60,66,.7);transition:transform .15s}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fffdf8;border:2px solid var(--sea)}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.18)}
input[type=range]:active{cursor:grabbing}

/* status */
#status{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;display:flex;gap:2px;
  padding:7px 8px;pointer-events:none;font-size:10.5px;color:var(--ink-2);
  animation:riseIn .9s cubic-bezier(.2,.8,.2,1) both .6s}
#status span{padding:4px 11px;border-right:1px solid var(--line);white-space:nowrap}
#status span:last-child{border:0}
#status b{color:var(--sea);font-weight:700}

/* toast */
#toast{position:fixed;left:50%;bottom:76px;transform:translate(-50%,14px);opacity:0;
  padding:9px 16px;border-radius:99px;font-size:11.5px;font-weight:600;color:#eafffb;
  background:linear-gradient(180deg,rgba(17,84,90,.95),rgba(9,54,60,.95));pointer-events:none;
  transition:.4s cubic-bezier(.2,.8,.2,1);box-shadow:0 14px 30px -18px #000;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* boot */
#boot{position:fixed;inset:0;z-index:50;display:grid;place-content:center;gap:16px;justify-items:center;
  background:radial-gradient(90% 80% at 50% 40%,#12454e,#07171d 70%);transition:opacity .7s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot h1{font-family:"Fraunces",serif;font-weight:900;font-size:clamp(38px,7vw,72px);letter-spacing:-.03em;
  color:#f4e6c8;font-variation-settings:"SOFT" 50,"WONK" 1}
#boot p{color:#8fc4c2;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
#boot .bar{width:min(260px,60vw);height:3px;border-radius:9px;background:rgba(255,255,255,.13);overflow:hidden}
#boot .bar i{display:block;height:100%;width:34%;border-radius:9px;
  background:linear-gradient(90deg,#3fc9bd,#e0915a);animation:sweep 1.15s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

#sheetToggle{display:none}

/* ---------- mobile ---------- */
@media (max-width:900px){
  #brand{left:12px;top:10px;padding:10px 14px 9px;border-radius:13px}
  #brand h1{font-size:26px} #brand p{display:none}
  #cams{left:50%;transform:translateX(-50%);bottom:auto;top:12px;padding:5px;gap:3px}
  #cams button{padding:8px 10px;font-size:10.5px} #cams button span{display:none}
  #status{display:none}
  #sheetToggle{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;
    align-items:center;justify-content:center;gap:9px;height:52px;border:0;width:100%;
    font:700 12px "DM Sans";letter-spacing:.1em;text-transform:uppercase;color:#eafffb;
    background:linear-gradient(180deg,rgba(15,74,80,.96),rgba(8,44,50,.98));cursor:pointer}
  #sheetToggle i{width:26px;height:3px;border-radius:9px;background:rgba(255,255,255,.4)}
  #rail{left:8px;right:8px;width:auto;top:auto;bottom:52px;max-height:56vh;overflow-y:auto;
    padding:10px;border-radius:18px 18px 0 0;background:rgba(251,245,234,.94);
    backdrop-filter:blur(16px);box-shadow:0 -18px 40px -20px rgba(0,0,0,.5);
    transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.85,.2,1);gap:8px}
  #rail.open{transform:none}
  .card{background:rgba(255,255,255,.66);box-shadow:none;border:1px solid rgba(21,48,57,.09)}
  #toast{bottom:auto;top:70px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="uw"></div><div id="vig"></div><div id="grain"></div>

<header id="brand" class="panel">
  <div class="kicker"><i></i>Living diorama · no.07</div>
  <h1>Tide<em>haven</em></h1>
  <p>A one-cabin island, cut open like a geode — lanterns above, manta rays below.</p>
</header>

<nav id="cams" class="panel" aria-label="Camera views">
  <button data-cam="iso" class="on" title="Isometric overview">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/></svg><span>Isometric</span></button>
  <button data-cam="cabin" title="Cabin &amp; pier">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M6 10v9h12v-9"/></svg><span>Cabin &amp; Pier</span></button>
  <button data-cam="under" title="Underwater">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.4"/></svg><span>Underwater</span></button>
</nav>

<aside id="rail">
  <section class="card panel">
    <h2>Conditions</h2>
    <div class="ctl"><label>Tide level <b id="v-tide">+0.06</b></label>
      <input id="s-tide" type="range" min="-0.62" max="0.42" step="0.01" value="0.06"></div>
    <div class="ctl"><label>Wind <b id="v-wind">Calm</b></label>
      <input id="s-wind" type="range" min="0" max="1" step="0.01" value="0.32"></div>
    <div class="ctl" style="margin-bottom:2px"><label>Time of day <b id="v-time">Day</b></label>
      <div class="seg" id="seg-time">
        <button data-time="day" class="on">Daylight</button>
        <button data-time="dusk">Sunset</button>
        <button data-time="night">Night</button>
      </div></div>
  </section>

  <section class="card panel">
    <h2>Visit</h2>
    <div class="grid2">
      <button class="btn" id="b-kayak">Launch kayak<span class="sub" id="kayak-sub">circle the lagoon</span></button>
      <button class="btn warm" id="b-leap">Ray leap<span class="sub">breach &amp; splash</span></button>
      <button class="btn" id="b-pause">Pause world<span class="sub">freeze the tide</span></button>
      <button class="btn" id="b-reset">Reset<span class="sub">back to first light</span></button>
    </div>
  </section>

  <section class="card panel">
    <h2>Ambience</h2>
    <div class="grid2" style="margin-bottom:4px">
      <button class="btn" id="b-music">Music<span class="sub">organism · generative</span></button>
      <button class="btn on" id="b-sfx">Ambience<span class="sub">surf · breeze</span></button>
    </div>
    <div class="ctl"><label>Volume <b id="v-vol">60</b></label>
      <input id="s-vol" type="range" min="0" max="1" step="0.01" value="0.6"></div>
    <div class="ctl" style="margin-bottom:0"><label>Render quality <b id="v-q">High</b></label>
      <div class="seg" id="seg-q">
        <button data-q="low">Low</button><button data-q="med">Medium</button><button data-q="high" class="on">High</button>
      </div></div>
  </section>
</aside>
<button id="sheetToggle"><i></i>Controls<i></i></button>

<div id="status" class="panel">
  <span>Tide <b id="st-tide">+0.06</b></span>
  <span>Wind <b id="st-wind">0.32</b></span>
  <span>Hour <b id="st-time">Midday</b></span>
  <span>Cam <b id="st-cam">Isometric</b></span>
</div>
<div id="toast"></div>

<div id="boot"><h1>Tidehaven</h1><p id="bootMsg">pouring the lagoon…</p><div class="bar"><i></i></div></div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =================================================================================
   0 · CONFIG, MATH & FIELD HELPERS
   ================================================================================= */
const FOOT_X = 7.2, FOOT_Z = 5.8;          // diorama footprint (metres)
const Y_TOP  = 0.72;                        // rim of the block
const Y_BOT  = -2.80;                       // underside of the water block
const HX = FOOT_X/2, HZ = FOOT_Z/2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry(20240607);
const rr=(a,b)=>a+rnd()*(b-a);

/* --- the island's height field.  Identical in JS and GLSL — keep in sync! ------ */
const GLSL_TF = `
float tf(vec2 p){
  float ex = (p.x + 0.85);
  float ez = (p.z + 0.60) * 1.30;
  float d  = sqrt(ex*ex + ez*ez);
  float base = -2.45
    + 0.09*sin(p.x*1.6+0.4)*cos(p.z*1.8-0.7)
    + 0.05*sin(p.x*4.3)*cos(p.z*3.1)
    + 0.04*sin(p.x*8.7+2.0)*cos(p.z*7.3);
  float t = clamp((3.912 - d)/2.60, 0.0, 1.0);
  float s = t*t*(3.0-2.0*t);
  float h = base + 3.60*s;
  vec2 h1 = vec2(p.x + 0.42, p.z + 0.28);
  h += 0.62*exp(-dot(h1,h1)/1.05);
  vec2 h2 = vec2((p.x - 1.35)*1.5, (p.z - 0.15)*0.5);
  h += 0.26*exp(-dot(h2,h2)/0.85);
  h += 0.085*sin(p.x*2.7+1.3)*cos(p.z*2.5-0.5)*s;
  vec2 c1 = vec2(p.x - 0.15, p.z + 1.35);
  h -= 0.34*exp(-dot(c1,c1)/0.55);
  vec2 bs = vec2((p.x - 1.9)*0.75, (p.z - 1.0)*0.6);
  h -= 0.42*exp(-dot(bs,bs)/1.6);
  float padR = length(vec2((p.x - 0.62)*0.85, (p.z - 0.30)*1.05));
  float pad = 1.0 - smoothstep(0.85, 1.75, padR);
  h = mix(h, 0.52, pad*0.9*smoothstep(-0.15, 0.20, h));
  return max(h, -2.62);
}`;
function TF(x,z){
  const ex=(x+0.85), ez=(z+0.60)*1.30;
  const d=Math.hypot(ex,ez);
  let base=-2.45+0.09*Math.sin(x*1.6+.4)*Math.cos(z*1.8-.7)+0.05*Math.sin(x*4.3)*Math.cos(z*3.1)+0.04*Math.sin(x*8.7+2)*Math.cos(z*7.3);
  const t=clamp((3.912-d)/2.60,0,1), s=t*t*(3-2*t);
  let h=base+3.60*s;
  const a1=x+0.42,a2=z+0.28; h+=0.62*Math.exp(-(a1*a1+a2*a2)/1.05);
  const b1=(x-1.35)*1.5,b2=(z-0.15)*0.5; h+=0.26*Math.exp(-(b1*b1+b2*b2)/0.85);
  h+=0.085*Math.sin(x*2.7+1.3)*Math.cos(z*2.5-0.5)*s;
  const c1=x-0.15,c2=z+1.35; h-=0.34*Math.exp(-(c1*c1+c2*c2)/0.55);
  const s1=(x-1.9)*0.75,s2=(z-1.0)*0.6; h-=0.42*Math.exp(-(s1*s1+s2*s2)/1.6);
  const padR=Math.hypot((x-0.62)*0.85,(z-0.30)*1.05);
  const pad=1-smooth(0.85,1.75,padR);
  h=lerp(h,0.52,pad*0.9*smooth(-0.15,0.20,h));
  return Math.max(h,-2.62);
}
/** march outward from the island until the ground drops below `lvl` */
function shoreXZ(ox,oz,dx,dz,lvl=0.02){
  let x=ox,z=oz;
  for(let i=0;i<240;i++){ if(TF(x,z)<lvl) return {x,z}; x+=dx*0.03; z+=dz*0.03; }
  return {x,z};
}

/* --- shared GLSL snippets ------------------------------------------------------- */
const GLSL_NOISE = `
float hash21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y);}
float fbm2(vec2 p){float a=0.5,s=0.0;for(int i=0;i<4;i++){s+=a*vnoise(p);p*=2.04;a*=0.5;}return s;}
float caustPat(vec2 uv,float t){
  vec2 p=uv*1.9; vec2 i=p; float c=1.0; float inten=0.0055;
  for(int n=0;n<3;n++){
    float tt=t*0.33*(1.0-(3.0/float(n+1)));
    i=p+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));
    c+=1.0/length(vec2(p.x/(sin(i.x+tt)/inten),p.y/(cos(i.y-tt)/inten)));
  }
  c/=3.0; c=1.15-pow(c,1.4);
  return clamp(pow(abs(c),7.0),0.0,1.6);
}`;

/* =================================================================================
   1 · RENDERER / SCENE / CAMERA
   ================================================================================= */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',stencil:false});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.outputColorSpace=THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene=new THREE.Scene();

  side:THREE.BackSide,depthWrite:false,uniforms:{
    uTop:U.skyTop,uHor:U.skyHor,uBot:{value:cur.skyBot},uSunDir:U.sunDir,uSunCol:U.sunCol,

  fragmentShader:GLSL_NOISE+`
    varying vec3 vD;uniform vec3 uTop,uHor,uBot,uSunDir,uSunCol;uniform float uSunI,uStar,uTime;
    void main(){
      vec3 d=normalize(vD); float y=d.y;
      vec3 c=mix(uHor,uTop,pow(clamp(y,0.0,1.0),0.62));
      c=mix(c,uBot,pow(clamp(-y*2.2,0.0,1.0),0.8));
      float sd=max(dot(d,normalize(uSunDir)),0.0);
      c+=uSunCol*pow(sd,320.0)*2.2*clamp(uSunI*0.5,0.15,1.0);
      c+=uSunCol*pow(sd,9.0)*0.16*clamp(uSunI*0.45,0.1,1.0);
      if(uStar>0.01&&y>-0.05){
        vec3 q=d*140.0; vec2 g=floor(q.xy+q.z*7.3);
        float h=hash21(g); float tw=0.55+0.45*sin(uTime*1.7+h*40.0);
        c+=vec3(0.85,0.92,1.0)*step(0.9965,h)*tw*uStar*1.3;
      }
      gl_FragColor=vec4(c,1.0);
    }`
});

const terrainMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.95,metalness:0});
terrainMat.onBeforeCompile=(sh)=>{
  Object.assign(sh.uniforms,{uTime:U.time,uWaterY:U.waterY,uCaust:U.caust,uSunI:U.sunI,uDeep:U.deep});
  sh.vertexShader='varying vec3 vWP;\n'+sh.vertexShader.replace('#include <begin_vertex>',
    '#include <begin_vertex>\n vWP=(modelMatrix*vec4(transformed,1.0)).xyz;');
  sh.fragmentShader=`varying vec3 vWP;uniform float uWaterY,uCaust,uSunI;uniform vec3 uDeep;${GLSL_TF}${GLSL_NOISE}
  `+sh.fragmentShader.replace('#include <fragment>',`#include <fragment>
    float landH=tf(vWP.xz);
    float wet=1.0-smoothstep(uWaterY-0.30,uWaterY+0.03,vWP.y);
    float dep=clamp((uWaterY-vWP.y)/2.6,0.0,1.0);
    diffuseColor.rgb=mix(diffuseColor.rgb,diffuseColor.rgb*vec3(0.40,0.86,0.98)+uDeep*0.10,wet*0.80);
    diffuseColor.rgb*=mix(1.0,0.46,dep*wet);
    float ca=caustPat(vWP.xz*0.85+vec2(0.13,0.07)*uTime,uTime);
    diffuseColor.rgb+=ca*uCaust*wet*(0.16+0.20*uSunI)*(1.0-dep*0.45);
    float ring=exp(-abs(vWP.y-uWaterY)/0.05)*14.0;
    diffuseColor.rgb*=1.0-ring*0.05*wet;
  `);
};
terrainMat.customProgramCacheKey=()=>'terrain';
function buildTerrain(){
  const SX=196,SZ=150, g=new THREE.PlaneGeometry(FOOT_X,FOOT_Z,SX,SZ);
  g.rotateX(-Math.PI/2);
  const pos=g.attributes.position, n=pos.count;
  const col=new Float32Array(n*3), c=new THREE.Color();
  for(let i=0;i<n;i++){
    const x=pos.getX(i), z=pos.getZ(i); pos.setY(i,TF(x,z));
    // slope from finite differences -> rock on steep ground
    const e=0.06;
    const hx=TF(x+e,z)-TF(x-e,z), hz=TF(x,z+e)-TF(x,z-e);
    const slp=Math.min(1.6,Math.hypot(hx,hz)/(2*e));
    const h=pos.getY(i);
    const nz=fbmJS(x*1.7,z*1.7)*0.16;
    if(h<-0.9) c.setHex(0x8d8a68).lerp(new THREE.Color(0xd9c193),smooth(-2.6,-1.2,h));      // mud->sand
    else if(h<-0.05) c.setHex(0xcbb187).lerp(new THREE.Color(0xf2ddb2),smooth(-0.9,-0.05,h)); // wet sand
    else if(h<0.30) c.setHex(0xf3e0b8);                                                        // beach
    else { const g0=new THREE.Color(0x5f8f4e),g1=new THREE.Color(0x8fae62),g2=new THREE.Color(0x7b8155);
      c.copy(g0).lerp(g1,smooth(0.3,1.0,h+nz)).lerp(g2,smooth(1.35,1.9,h)); }
    c.lerp(new THREE.Color(0x766f66),smooth(0.55,1.15,slp)*0.85);                              // rock
    c.lerp(new THREE.Color(0x6d7f4a),smooth(0.55,1.2,slp)*0.25);
    c.offsetHSL(0,0,nz*0.35);
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
  }
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,terrainMat); m.receiveShadow=true; m.castShadow=true; scene.add(m); return m;
}
function fbmJS(x,y){let a=.5,s=0;for(let i=0;i<3;i++){s+=a*(0.5+0.5*Math.sin(x*1.7+i)*Math.cos(y*1.9-i));x*=2.03;y*=2.01;a*=.5;}return s;}

/* 5a — four block walls: they turn to glass on whichever faces the camera  */
const wallMatProto={
  rock:new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,
    uniforms:{uWaterY:U.waterY,uTime:U.time,uSunDir:U.sunDir,uSunI:U.sunI,uDeep:U.deep,uSky:U.skyHor,
      uShallow:U.shallow,uFogCol:U.fogCol,uFogD:U.fogD,uCut:{value:0},uNrm:{value:new THREE.Vector3(0,0,1)},
      uFade:{value:1},uSize:{value:new THREE.Vector2(1,1)}},
    vertexShader:`varying vec3 vW;varying vec2 vUv;
      void main(){vUv=uv;vec4 w=modelMatrix*vec4(position,1.0);vW=w.xyz;
        gl_Position=projectionMatrix*viewMatrix*w;}`,
    fragmentShader:`varying vec3 vW;varying vec2 vUv;
      uniform float uWaterY,uTime,uSunI,uCut,uFade,uFogD;
      uniform vec3 uSunDir,uDeep,uSky,uShallow,uNrm,uFogCol,uSize;
      ${GLSL_NOISE}
      void main(){
        float y=vW.y;
        float water=1.0-smoothstep(uWaterY-0.06,uWaterY+0.03,y);
        float dep=clamp((uWaterY-y)/2.6,0.0,1.0);
        /* --- rock / earth face of the block --- */
        float lay=fbm2(vec2(vUv.x*11.0,y*2.6));
        vec3 rock=mix(vec3(0.40,0.335,0.275),vec3(0.56,0.49,0.40),lay);
        rock=mix(rock,vec3(0.33,0.31,0.295),smoothstep(0.45,0.95,fbm2(vec2(vUv.x*46.0,y*7.0))));
        rock=mix(rock,vec3(0.46,0.42,0.36),smoothstep(0.55,1.0,fbm2(vec2(vUv.x*3.0,y*1.1))));
        float ndl=0.42+0.58*max(dot(-normalize(uNrm),normalize(uSunDir)),0.0);
        rock*=ndl*(0.30+0.34*clamp(uSunI,0.2,3.0));
        rock=mix(rock,uDeep*0.85,water*0.70);
        rock+=caustPat(vW.xz*0.7,y*0.25)*water*0.10*clamp(uSunI*0.4,0.05,1.0);
        rock+=vec3(0.35,0.22,0.10)*exp(-abs(y-uWaterY)/0.05)*0.35;   // tide stain
        float rockA=1.0;
        /* --- glass face (the cut) --- */
        float tint=water*mix(0.16,0.58,dep);
        vec3 glass=mix(uSky*1.02,uShallow*0.85,water*0.9);
        float sheen=0.030*smoothstep(0.55,1.0,sin(vUv.x*26.0+vUv.y*4.0+uTime*0.25));
        float e=min(min(vUv.x,1.0-vUv.x)*uSize.x,min(vUv.y,1.0-vUv.y)*uSize.y);
        float edge=0.13*exp(-e/0.022)+0.05*exp(-abs(y-uWaterY)/0.03);
        float glassA=tint+sheen+edge;
        vec3 col=mix(rock,glass,uCut);
        float a=mix(rockA,glassA,uCut)*uFade;
        float fd=length(vW-cameraPosition)*uFogD;
        col=mix(col,uFogCol,1.0-exp(-fd*fd));
        gl_FragColor=vec4(col,clamp(a,0.0,1.0));
      }`})
};
const walls=[];
const wallDefs=[
  {n:[0,0,1],  p:[0,(Y_TOP+Y_BOT)/2, HZ], ry:0,          w:FOOT_X},
  {n:[0,0,-1], p:[0,(Y_TOP+Y_BOT)/2,-HZ], ry:Math.PI,    w:FOOT_X},

  {n:[-1,0,0], p:[-HX,(Y_TOP+Y_BOT)/2,0], ry:-Math.PI/2, w:FOOT_Z},

}

/* 5b — animated water surface (discarded over land, foam at the shore) */
const surfMat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,side:THREE.DoubleSide,
  uniforms:{uTime:U.time,uWind:U.wind,uWaterY:U.waterY,uNight:U.night,uSunDir:U.sunDir,uSunCol:U.sunCol,
    uSunI:U.sunI,uSky:U.skyHor,uDeep:U.deep,uShallow:U.shallow,uFoam:U.foam,uFogCol:U.fogCol,uFogD:U.fogD,
    uRip:U.ripples},
  vertexShader:`
    uniform float uTime,uWind,uWaterY; uniform vec4 uRip[6];
    varying vec3 vW; varying vec3 vN; varying float vDisp;
    ${GLSL_TF}
    float surf(vec2 p,out vec2 dh){
      float h=0.0; dh=vec2(0.0);
      float A=0.012+0.055*uWind;
      vec2 d1=normalize(vec2(0.8,0.35)),d2=normalize(vec2(-0.45,0.9)),d3=normalize(vec2(0.2,-0.98));
      vec3 w1=vec3(d1*2.6,0.9,1.7),w2=vec3(d2*4.3,1.6,2.3),w3=vec3(d3*8.1,2.6,3.1);
      float a1=A,a2=A*0.62,a3=A*0.30;
      h    += a1*sin(dot(w1.xy,p)*1.0+uTime*w1.z); dh+=w1.xy*a1*cos(dot(w1.xy,p)+uTime*w1.z);
      h    += a2*sin(dot(w2.xy,p)*1.0+uTime*w2.z); dh+=w2.xy*a2*cos(dot(w2.xy,p)+uTime*w2.z);
      h    += a3*sin(dot(w3.xy,p)*1.0+uTime*w3.z); dh+=w3.xy*a3*cos(dot(w3.xy,p)+uTime*w3.z);
      for(int i=0;i<6;i++){
        float str=uRip[i].w; if(str<0.002) continue;
        float age=uRip[i].y; vec2 c=uRip[i].xy; float r=length(p-c); float R=age*2.35;
        float d=r-R; float env=exp(-abs(d)/0.30)*exp(-age*1.05)*str;
        h+=env*sin(d*7.5)*0.075;
        dh+=normalize(p-c+vec2(1e-4))*env*cos(d*7.5)*0.075*7.5*0.14;
      }
      return h;
    }
    void main(){
      vec2 p=position.xz; vec2 dh;
      float h=surf(p,dh);
      vec3 tp=vec3(position.x,h,position.y);
      vDisp=h;
      vN=normalize(vec3(-dh.x,1.0,-dh.y));
      vec4 w=modelMatrix*vec4(tp,1.0);
      vW=w.xyz;
      gl_Position=projectionMatrix*viewMatrix*w;
    }`,
  fragmentShader:`
    precision highp float;
    uniform float uTime,uWind,uWaterY,uNight,uSunI,uFogD;
    uniform vec3 uSunDir,uSunCol,uSky,uDeep,uShallow,uFoam,uFogCol;
    uniform vec4 uRip[6];
    varying vec3 vW; varying vec3 vN; varying float vDisp;
    ${GLSL_TF}${GLSL_NOISE}
    void main(){
      float land=tf(vW.xz);
      if(land>vW.y-0.004) discard;
      float depth=uWaterY-land;
      vec3 N=normalize(vN); if(!gl_FrontFacing) N=-N;
      vec3 V=normalize(cameraPosition-vW);
      float fres=pow(1.0-clamp(abs(dot(N,V)),0.0,1.0),3.0);
      float dmask=smoothstep(0.03,1.25,depth);
      vec3 base=mix(uShallow,uDeep,dmask);
      float ca=caustPat(vW.xz*0.9+vec2(0.02,0.05)*uTime,uTime);
      base+=uSunCol*ca*0.09*(1.0-dmask*0.55)*(0.35+uSunI*0.25);
      float shore=1.0-smoothstep(0.0,0.24,vW.y-land);
      float streak=0.55+0.45*sin(vW.x*13.0+vW.z*9.0+uTime*2.1+fbm2(vW.xz*2.2)*4.0);
      float foam=shore*streak*(0.72+0.28*sin(uTime*1.4));
      foam+=smoothstep(0.02,0.16,vDisp)*0.22*uWind;
      base=mix(base,uFoam,clamp(foam,0.0,0.92));
      vec3 H=normalize(normalize(uSunDir)+V);
      float spec=pow(max(dot(N,H),0.0),260.0)*3.2*clamp(uSunI*0.45,0.1,1.4);
      spec+=pow(max(dot(N,H),0.0),26.0)*0.06*uSunI;
      base+=uSunCol*spec;
      float alpha=mix(0.30,0.80,dmask)+fres*0.30+foam*0.35;
      for(int i=0;i<6;i++){
        float str=uRip[i].w; if(str<0.002) continue;

const swayers=[];
function swayMat(baseMat,{amp=1,useInstance=false,uvSway=false}={}){
  const m=baseMat.clone();
  m.onBeforeCompile=(sh)=>{
    Object.assign(sh.uniforms,{uTime:U.time,uWind:U.wind});
    sh.vertexShader='uniform float uTime,uWind;\n'+sh.vertexShader.replace('#include <begin_vertex>',
      `#include <begin_vertex>
       #ifdef USE_INSTANCING
         vec3 iOrigin=(modelMatrix*instanceMatrix*vec4(0.0,0.0,0.0,1.0)).xyz;
       #else
         vec3 iOrigin=(modelMatrix*vec4(0.0,0.0,0.0,1.0)).xyz;
       #endif
       float seed=iOrigin.x*3.7+iOrigin.z*2.3+iOrigin.y*1.1;
       float bb=clamp(transformed.y/${uvSway||'1.0'},0.0,1.0);
       float s1=sin(uTime*1.55+seed+transformed.y*1.4);
       float s2=cos(uTime*1.15+seed*1.7);
       float amp=(0.035+0.20*uWind)*${amp.toFixed(2)};
       transformed.x+=s1*amp*bb*bb;
       transformed.z+=s2*amp*0.7*bb*bb;`);
  };
  m.customProgramCacheKey=()=>'sway'+amp+(useInstance?'i':'')+(uvSway||'');
  swayers.push(m); return m;
}

/* --- manta geometry -------------------------------------------------------------- */
function mantaGeometry(){
  const SU=14,SV=7,verts=[],idx=[],uvs=[],vs=[];
  const L=[[0,0.32],[0.5,0.20],[1.0,0.02],[1.45,-0.34],[1.60,-0.60],[1.62,-0.80]];
  const T=[[0,-0.26],[0.5,-0.40],[1.0,-0.60],[1.40,-0.78],[1.58,-0.86],[1.62,-0.80]];
  const cu=(c,t)=>{const n=c.length-1,f=clamp(t,0,1)*n,i=Math.min(Math.floor(f),n-1),k=f-i;
    return [lerp(c[i][0],c[Math.min(i+1,n)][0],k),lerp(c[i][1],c[Math.min(i+1,n)][1],k)];};
  for(let i=0;i<SU;i++){
    const u=i/(SU-1);
    const [lx,lz]=cu(L,u), [tx,tz]=cu(T,u);
    for(let j=0;j<SV;j++){
      const v=j/(SV-1);
      const x=lerp(lx,tx,v), z=lerp(lz,tz,v);
      const camber=Math.sin(v*Math.PI)*(1-u*0.82)*0.085 - u*u*0.02;
      verts.push(x,camber,z); uvs.push(u,v); vs.push(v);
    }
  }
  for(let i=0;i<SU-1;i++)for(let j=0;j<SV-1;j++){
    const a=i*SV+j,b=a+1,c=a+SV,d=c+1; idx.push(a,c,b,b,c,d);
  }
  // tail
  const base=verts.length/3, tseg=6;
  const tw=[[0,-0.02],[0.14,-0.015],[0.20,0]];
  for(let i=0;i<tseg;i++){
    const t=i/(tseg-1), z=-0.78-t*0.85, w=lerp(0.10,0.012,t);
    verts.push(-w,-0.01,z); uvs.push(0,t); vs.push(0);
    verts.push( w,-0.01,z); uvs.push(1,t); vs.push(1);
  }
  for(let i=0;i<tseg-1;i++){const a=base+i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex(idx); g.computeVertexNormals();
  const col=[],c=new THREE.Color();
  for(let i=0;i<verts.length/3;i++){
    const v=vs[i]!==undefined?vs[i]:0.5;
    c.setHSL(0.55,0.30,0.16).lerp(new THREE.Color(0xf2ece0),smooth(0.42,0.58,v)*0.92);
    col.push(c.r,c.g,c.b);
  }
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  return g;
}
const mantaGeo=mantaGeometry();
function mantaMat(tint){
  const m=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.72,metalness:0,side:THREE.DoubleSide});
  m.onBeforeCompile=(sh)=>{
    Object.assign(sh.uniforms,{uT:U.time,uAmp:{value:1}});
    sh.vertexShader='uniform float uT,uAmp;\n'+sh.vertexShader.replace('#include <begin_vertex>',
      `#include <begin_vertex>
       float sp=abs(transformed.x);
       float al=transformed.z;
       transformed.y+=sin(sp*3.1-uT*2.35+al*0.5)*0.10*pow(clamp(sp/1.6,0.0,1.0),1.35)*uAmp;
       transformed.y+=sin(al*1.7+uT*2.1)*0.022*uAmp;
       transformed.x+=sin(al*2.3+uT*2.6)*0.035*clamp(-al*0.9,0.0,1.0)*uAmp;

function mergeGeos(list){
  let vc=0,ic=0;
  const pre=list.map(g=>{const gg=g.index?g:g; if(!gg.index)gg.setIndex([...Array(gg.attributes.position.count).keys()]);
    vc+=gg.attributes.position.count; ic+=gg.index.count; return gg;});
  const pos=new Float32Array(vc*3), nor=new Float32Array(vc*3), col=new Float32Array(vc*3);
  const idx=new Uint16Array(ic);
  let vo=0,io=0;
  for(const g of pre){
    pos.set(g.attributes.position.array,vo*3);
    g.computeVertexNormals(); nor.set(g.attributes.normal.array,vo*3);
    const ii=g.index.array;
    for(let i=0;i<ii.length;i++) idx[io+i]=ii[i]+vo;
    vo+=g.attributes.position.count; io+=ii.length;
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  out.setIndex(new THREE.BufferAttribute(idx,1));
  return out;
}

const Audio=(()=>{

    return b;}
  function noise(){const len=ctx.sampleRate*3,b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0);
    let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.4;}return b;}

    const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;if(q)f.Q.value=q;

    uw=loopNoise(0.0,'lowpass',170);
    // slow LFOs on the ambience

      if(rnd()<0.62){
        const n=SCALE[Math.floor(rnd()*SCALE.length)];
        tone(next+rr(-0.04,0.09),220*Math.pow(2,n/12),rr(0.9,1.9),'triangle',0.055,0.42);
      }
      if(beat%4===2&&rnd()<0.5){
        const n=SCALE[4+Math.floor(rnd()*3)];
        tone(next+0.12,220*Math.pow(2,n/12),0.7,'sine',0.03,0.5);
      }
      next+=spb; beat++;
    }
  }
  return {
    start(){init();},
    ready(){return !!ctx;},
    setVol(v){vol=v;if(ctx)master.gain.setTargetAtTime(v,ctx.currentTime,0.15);},
    music(on){musicOn=on;if(ctx){musG.gain.setTargetAtTime(on?0.85:0.0,ctx.currentTime,0.6);
      if(on){next=Math.max(next,ctx.currentTime+0.2);}}},
    sfx(on){sfxOn=on;if(ctx)ambG.gain.setTargetAtTime(on?1:0,ctx.currentTime,0.4);},
    wind(v){if(ctx&&breeze){breeze.g.gain.setTargetAtTime(0.02+v*0.11,ctx.currentTime,0.4);
      breeze.f.frequency.setTargetAtTime(360+v*900,ctx.currentTime,0.5);
      wash.g.gain.setTargetAtTime(0.05+v*0.09,ctx.currentTime,0.5);}},
    under(w){if(ctx&&uw){uw.g.gain.setTargetAtTime(w*0.16,ctx.currentTime,0.4);
      filt.frequency.setTargetAtTime(lerp(17000,700,w),ctx.currentTime,0.4);}},
    splash(){if(!ctx||!sfxOn)return;const t=ctx.currentTime;
      const s=ctx.createBufferSource();s.buffer=noiseBuf;
      const f=ctx.createBiquadFilter();f.type='bandpass';f.Q.value=1.1;
      f.frequency.setValueAtTime(1500,t);f.frequency.exponentialRampToValueAtTime(220,t+0.55);
      const g=ctx.createGain();g.gain.setValueAtTime(0.28,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.7);
      s.connect(f).connect(g).connect(ambG);s.start(t);s.stop(t+0.8);},
    blip(){if(!ctx||!sfxOn)return;const t=ctx.currentTime;
      const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';
      o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(230,t+0.12);
      g.gain.setValueAtTime(0.03,t);g.gain.exponentialRampToValueAtTime(0.0005,t+0.15);
      o.connect(g).connect(ambG);o.start(t);o.stop(t+0.2);},
    click(){if(!ctx||!sfxOn)return;const t=ctx.currentTime;
      const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';
      o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(660,t+0.05);
      g.gain.setValueAtTime(0.05,t);g.gain.exponentialRampToValueAtTime(0.0005,t+0.09);
      o.connect(g).connect(ambG);o.start(t);o.stop(t+0.12);},
    bubble(){if(!ctx||!sfxOn)return;const t=ctx.currentTime+Math.random()*0.05;
      const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';
      o.frequency.setValueAtTime(280+Math.random()*280,t);
      o.frequency.exponentialRampToValueAtTime(900+Math.random()*400,t+0.07);
      g.gain.setValueAtTime(0.02+Math.random()*0.02,t);g.gain.exponentialRampToValueAtTime(0.0005,t+0.1);
      o.connect(g).connect(ambG);o.start(t);o.stop(t+0.14);},
  };
})();

/* =================================================================================
   16 · RAY LEAP CHOREOGRAPHY
   ================================================================================= */
function deepSpot(){
  for(let i=0;i<60;i++){
    const x=rr(1.7,3.05), z=rr(0.6,2.35);
    const d=Math.hypot((x+0.85),(z+0.6)*1.30);
    if(d>3.35&&Math.abs(z)<HZ-0.5&&TF(x,z)<-1.5) return {x,z};
  }
  return {x:2.4,z:1.5};
}
function doLeap(){
  let best=null,bd=-1;
  for(const r of rays){ if(r.jumping)continue;
    const d=r.g.position.x+r.g.position.z*0.6; if(d>bd){bd=d;best=r;} }
  if(!best)return;
  jumper=best; jumpT=0; jumped=false;
  jumpFrom=best.g.position.clone();
  jumpTo=new THREE.Vector3(jumpFrom.x+rr(-0.5,0.9),0,jumpFrom.z+rr(-0.4,0.7));
  jumpArc=rr(1.15,1.5);
  best.jumping=true;
  best.mesh.material.uniforms?0:0;
  toast('A ray breaches!');
}
function updateLeap(dt){
  if(!jumper)return;
  const wy=U.waterY.value;
  jumpT+=dt/2.15;
  const j=jumper;
  if(jumpT<1){
    const t=jumpT;
    const x=lerp(jumpFrom.x,jumpTo.x,t), z=lerp(jumpFrom.z,jumpTo.z,t);
    const h=-Math.sin(Math.PI*t)*jumpArc*(1-Math.abs(t-0.5)*0.5);
    const y=wy+h*1.0;
    j.g.position.set(x,y,z);
    j.g.rotation.y=lerp(j.g.rotation.y,Math.atan2(jumpTo.x-jumpFrom.x,jumpTo.z-jumpFrom.z),dt*4);
    j.g.rotation.x=-(0.55-t)*1.6;
    j.g.rotation.z=Math.sin(t*6.28)*0.35;
    const sc=j.mesh.scale.x;
    j.g.scale.setScalar(lerp(1,0.94,Math.abs(0.5-t)*2));
    if(t>0.5&&!jumped){
      jumped=true; addRipple(x,z,1.0); Audio.splash();
      for(let i=0;i<70;i++){
        const s=sprayS.find(s=>s.life<=0)||sprayS[0];
        s.life=rr(0.5,1.3);
        s.p.set(x,wy+0.05,z);
        s.v.set(rr(-1.6,1.6),rr(1.4,4.2),rr(-1.6,1.6));
      }
      addRipple(x+rr(-.3,.3),z+rr(-.3,.3),0.55);
    }
  }else{
    j.jumping=false; j.g.position.y=clamp(j.g.position.y,wy-0.7,wy-0.35);
    j.target=j.ring(); jumper=null;
  }
}

/* =================================================================================
   17 · MAIN LOOP
   ================================================================================= */
const clock=new THREE.Clock();
let uwLast=0, bubTimer=0;
const _v=new THREE.Vector3();
function frame(){
  const dt=Math.min(0.05,clock.getDelta());
  const wt=S.paused?0:dt;
  const t=U.time.value+=wt;

  blendPalette(dt);

  /* tide (smooth) + wind */
  S.tide=lerp(S.tide,S.tideT,1-Math.exp(-dt*3.2));
  S.wind=lerp(S.wind,S.windT,1-Math.exp(-dt*2.2));
  U.waterY.value=S.tide; U.wind.value=S.wind;
  surface.position.y=S.tide;
  U.night.value=smooth(0.4,1.0,cur.lights);
  U.lights.value=cur.lights;
  U.caust.value=clamp(cur.sunI/2.9,0.12,1.0);
  U.sunI.value=cur.sunI; U.sunCol.value.copy(cur.sun);
  U.skyTop.value.copy(cur.skyTop); U.skyHor.value.copy(cur.skyHor);
  U.deep.value.copy(cur.deep); U.shallow.value.copy(cur.shallow); U.foam.value.copy(cur.foam);
  skyMat.uniforms.uBot.value.copy(cur.skyBot); skyMat.uniforms.uStar.value=cur.star;
  U.fogCol.value.copy(cur.fog); U.fogD.value=cur.fogD;

  /* sun / sky / lights */
  const el=cur.el, az=cur.az;
  U.sunDir.value.set(Math.cos(el)*Math.sin(az),Math.max(0.05,Math.sin(el)),Math.cos(el)*Math.cos(az)).normalize();
  sun.position.copy(U.sunDir.value).multiplyScalar(16);
  sun.target.position.set(0,-0.4,0);
  sun.color.copy(cur.sun); sun.intensity=cur.sunI;
  hemi.color.copy(cur.hemiSky); hemi.groundColor.copy(cur.hemiGnd); hemi.intensity=cur.hemiI;
  amb.intensity=cur.ambI;
  ground.material.color.copy(cur.ground);
  scene.fog.color.copy(cur.fog); scene.fog.density=cur.fogD;
  renderer.toneMappingExposure=cur.expo;
  for(const l of lampLights) l.intensity=cur.lights*7.0;
  MAT.win.emissiveIntensity=cur.lights*2.6; MAT.bulb.emissiveIntensity=cur.lights*3.4;
  for(const s of glowSprites) s.material.opacity=cur.lights*0.85;

  /* walls: glass on the camera-facing sides */
  for(const w of walls){
    _v.copy(camera.position).sub(w.c).normalize();
    const f=_v.dot(w.n);
    const target=smooth(0.02,0.30,f);
    w.cut=lerp(w.cut,target,1-Math.exp(-dt*6));
    w.mat.uniforms.uCut.value=w.cut;
    w.mat.uniforms.uFade.value=1.0-smooth(0.55,1.0,Math.abs(f))*0.0;
  }

  /* ripples age */
  for(const r of rips){ if(r.w>0.002){ r.z+=dt; if(r.z>3.4) r.w=0; } }

  /* life */
  if(!S.paused){
    for(const r of rays) r.update(dt);
    updateLeap(dt);
    for(const s of schools) s.update(dt,t);
    updateBubbles(dt,t);
    updateKayak(dt,t);
    // smoke
    const sp=smoke.geometry.attributes;
    for(let i=0;i<smokeS.length;i++){
      const s=smokeS[i]; s.t+=dt*0.16; if(s.t>1)s.t-=1;
      const rise=s.t*2.6, drift=S.wind*s.t*s.t*1.9;
      sp.position.setXYZ(i,PAD.x-0.32*Math.cos(cabin.rotation.y)+drift+Math.sin(i*3.1+s.t*4)*0.14,
        PAD.y+1.75+rise, PAD.z+0.32*Math.sin(cabin.rotation.y)+drift*0.35+Math.cos(i*2.3+s.t*3)*0.14);
      sp.aSize.setX(i,(0.5+s.t*3.4)*1.6); sp.aAlpha.setX(i=Math.floor(i),0);
    }
    // (rewrite alpha/size properly)
    for(let i=0;i<smokeS.length;i++){
      const s=smokeS[i]; const a=Math.sin(Math.min(1,s.t)*Math.PI)*0.30*(1-s.t*0.35);
      smoke.geometry.attributes.aAlpha.setX(i,a*(0.25+cur.lights*0.75));
      smoke.geometry.attributes.aSize.setX(i,(0.6+s.t*4.0)*1.4);
    }
    smoke.geometry.attributes.position.needsUpdate=true;
    smoke.geometry.attributes.aAlpha.needsUpdate=true;
    smoke.geometry.attributes.aSize.needsUpdate=true;
    // spray / droplets
    const sp2=spray.geometry.attributes;
    for(let i=0;i<sprayS.length;i++){
      const s=sprayS[i];
      if(s.life>0){ s.life-=dt; s.v.y-=9.4*dt; s.p.addScaledVector(s.v,dt);
        if(s.p.y<S.tide){s.life=0;} }
      sp2.position.setXYZ(i,s.p.x,s.p.y,s.p.z);
      sp2.aAlpha.setX(i,s.life>0?clamp(s.life*1.4,0,1)*0.9:0);
      sp2.aSize.setX(i,s.life>0?0.55:0);
    }
    spray.geometry.attributes.position.needsUpdate=true;
    spray.geometry.attributes.aAlpha.needsUpdate=true;
    spray.geometry.attributes.aSize.needsUpdate=true;
    // gulls
    for(const g of gulls){
      const u=g.userData; u.a+=dt*u.sp;
      g.position.set(Math.cos(u.a)*u.r,u.y+Math.sin(u.a*2.1)*0.25,Math.sin(u.a)*u.r*0.8);
      g.rotation.y=-u.a+Math.PI/2;
      const fl=Math.sin(t*6.5+u.a*3)*0.6;
      u.L.rotation.z=fl; u.R.rotation.z=-fl;
    }
    // fireflies / motes
    const mp=motes.geometry.attributes;
    for(let i=0;i<moteS.length;i++){
      const m=moteS[i];
      mp.position.setXYZ(i,m.x+Math.sin(t*0.5+m.ph)*0.5,m.y+Math.sin(t*0.8+m.ph*2)*0.25,
        m.z+Math.cos(t*0.42+m.ph)*0.5);
      mp.aAlpha.setX(i,(0.35+0.65*Math.max(0,Math.sin(t*2.2+m.ph*3)))*U.night.value);
      mp.aSize.setX(i,0.35);
    }
    motes.geometry.attributes.position.needsUpdate=true;
    motes.geometry.attributes.aAlpha.needsUpdate=true;
    // random bubble blips when underwater
    if(camera.position.y<S.tide){
      bubTimer-=dt; if(bubTimer<=0){bubTimer=rr(0.35,1.6);Audio.bubble();}
    }
  }

  /* underwater camera mood */
  const uw=clamp((S.tide-camera.position.y)/1.1,0,1);
  document.getElementById('uw').style.opacity=(uw*0.85).toFixed(3);
  if(Math.abs(uw-uwLast)>0.02){Audio.under(uw);uwLast=uw;}
  scene.fog.density=cur.fogD*(1+uw*4.2);
  scene.fog.color.lerp(cur.deep,uw*0.8);

  /* controls + camera */
  updateTween(dt);
  if(!tween.on){
    controls.target.x=clamp(controls.target.x,-3.2,3.2);
    controls.target.y=clamp(controls.target.y,-2.6,2.6);
    controls.target.z=clamp(controls.target.z,-2.6,2.6);
  }
  controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
