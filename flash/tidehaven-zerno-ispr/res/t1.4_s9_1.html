<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tidehaven — an interactive island diorama</title>
<meta name="description" content="Tidehaven: a cozy coastal island inside an aquarium, with a cut-away lagoon, rays, a kayak and a day that you can turn." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">

<style>
/* ============================================================================
   TIDEHAVEN — interface
   Palette: deep petrol teal ambience, sand bone, copper, jade.
   Type: Fraunces (display, optical serif) + Manrope (ui sans).
   ========================================================================== */
:root{
  --ink:#14252a; --ink-2:#40606a; --ink-3:#6f8b93;
  --cream:rgba(247,240,227,.93); --cream-solid:#f7f0e3;
  --line:rgba(255,255,255,.38);
  --edge:rgba(14,32,37,.42);
  --copper:#bd6a40; --copper-d:#8c4a2a; --copper-l:#e8916a;
  --jade:#3fbfa3; --jade-d:#1d7f6f;
  --amber:#f2b352;
  --glass:linear-gradient(178deg, rgba(246,238,223,.90), rgba(240,230,213,.82));
  --shadow:0 18px 44px -20px rgba(3,16,20,.72), 0 2px 0 rgba(255,255,255,.30) inset;
  --r:15px;
  --amb-a:rgba(6,20,24,.62); --amb-b:rgba(2,10,13,.78);
  --amb-hi:rgba(255,210,150,.20);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#061216;color:var(--ink);
  font-family:"Manrope",ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;
  touch-action:none}
/* soft ambient frame + time-of-day tint, no layout work per frame */
#veil{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:
    radial-gradient(120% 90% at 50% 42%, transparent 42%, var(--amb-a) 78%, var(--amb-b) 100%),
    linear-gradient(178deg, var(--amb-hi) 0%, transparent 34%);
  mix-blend-mode:multiply; transition:opacity .8s ease}
#veil::after{content:"";position:absolute;inset:0;
  background:radial-gradient(70% 55% at 62% 30%, rgba(255,255,255,.12), transparent 70%);
  mix-blend-mode:screen}
#dive{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;
  background:radial-gradient(100% 80% at 50% 55%, rgba(28,150,140,.16), rgba(3,34,42,.52) 90%);
  transition:opacity .55s ease}
body.under #dive{opacity:1}
#dive::after{content:"";position:absolute;inset:-10%;opacity:.5;
  background:repeating-linear-gradient(101deg, rgba(255,255,255,.10) 0 2px, transparent 2px 26px);
  animation:shafts 9s linear infinite; mix-blend-mode:screen}
@keyframes shafts{from{transform:translate3d(-4%,0,0)}to{transform:translate3d(6%,0,0)}}

/* ---------------- shell ---------------- */
#shell{position:fixed;inset:0;z-index:6;pointer-events:none;
  display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;
  gap:14px;padding:clamp(10px,1.6vw,22px)}
#shell > *{pointer-events:auto}

/* ---------------- brand ---------------- */
.brand{grid-column:1;grid-row:1;align-self:start;max-width:min(44ch,52vw);
  pointer-events:none}
.brand h1{margin:0;font-family:Fraunces,Georgia,serif;font-weight:600;
  font-size:clamp(34px,5.2vw,68px);line-height:.88;letter-spacing:-.022em;
  color:#fbf5e8;text-shadow:0 2px 0 rgba(255,255,255,.22), 0 20px 46px rgba(0,20,25,.66)}
.brand h1 span{color:#eaa46f}
.brand .sub{margin:9px 0 0;font-family:Fraunces,serif;font-style:italic;font-weight:400;
  font-size:clamp(12.5px,1.15vw,16px);color:rgba(247,240,227,.86);
  text-shadow:0 1px 12px rgba(0,20,25,.65)}
.meta{margin:12px 0 0;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  padding:5px 10px;border-radius:999px;color:#f6efe2;
  background:linear-gradient(180deg, rgba(15,40,47,.74), rgba(9,26,32,.84));
  border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px);
  box-shadow:0 10px 22px -14px rgba(0,0,0,.8)}
.badge b{color:#f4c483;font-weight:800;font-variant-numeric:tabular-nums}
.badge.wind b{color:#9de4cd}
.dot-live{width:6px;height:6px;border-radius:999px;background:#8ee0c4;
  box-shadow:0 0 0 0 rgba(142,224,196,.7);animation:pulse 2.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(142,224,196,0)}100%{box-shadow:0 0 0 0 rgba(142,224,196,0)}}

/* ---------------- panels ---------------- */
.panels{grid-column:2;grid-row:1/span 2;align-self:start;width:290px;max-height:78vh;
  overflow:visible;display:flex;flex-direction:column;gap:10px;
  padding-right:2px;padding-bottom:4px;
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 26px),transparent);
          mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 26px),transparent)}
.sheet-head{display:none}
.group{background:var(--glass);backdrop-filter:blur(14px) saturate(1.18);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  overflow:hidden;transition:box-shadow .3s ease}
.group.collapsed .body{max-height:0;opacity:0;pointer-events:none}
.body{max-height:420px;opacity:1;overflow:hidden;transition:max-height .42s cubic-bezier(.4,0,.2,1),opacity .25s ease}
.body-pad{padding:11px 13px 13px;display:flex;flex-direction:column;gap:11px}
.grp-h{width:100%;display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;
  background:none;border:0;color:var(--ink);text-align:left}
.grp-h::before{content:"";width:3px;height:14px;border-radius:2px;flex:none;
  background:linear-gradient(180deg,var(--copper-l),var(--copper))}
.grp-t{font-size:10.5px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}
.grp-x{margin-left:auto;font-size:9px;color:var(--ink-3);transition:transform .3s ease}
.group.collapsed .grp-x{transform:rotate(-90deg)}
.group[data-key=camera] .grp-h::before{background:linear-gradient(180deg,#8fd8ea,#3a8ba0)}
.group[data-key=play]   .grp-h::before{background:linear-gradient(180deg,#c9e3a8,#6c9b4e)}
.group[data-key=sound]  .grp-h::before{background:linear-gradient(180deg,#f5cf85,#c78a2d)}

.ctrl{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.lab{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.005em}
.val{margin-left:auto;font:700 10.5px/1 "Manrope",sans-serif;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);font-variant-numeric:tabular-nums}
hr.seps{border:0;border-top:1px solid rgba(20,50,58,.12);margin:1px 0}

/* range */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:none;cursor:ew-resize}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:99px;
  background:linear-gradient(90deg,var(--copper) 0%,var(--copper) calc(var(--fill,50%)),rgba(20,50,58,.16) calc(var(--fill,50%)))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  margin-top:-5px;background:#fdf7ec;border:2px solid var(--copper);
  box-shadow:0 3px 8px -2px rgba(30,20,10,.6);transition:transform .14s}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.16)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(.94)}
input[type=range]::-moz-range-track{height:5px;border-radius:99px;background:rgba(20,50,58,.16)}
input[type=range]::-moz-range-progress{height:5px;border-radius:99px;background:var(--copper)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fdf7ec;border:2px solid var(--copper)}
input[type=range].jade::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--jade) 0%,var(--jade) var(--fill,50%),rgba(20,50,58,.16) var(--fill,50%))}
input[type=range].jade::-webkit-slider-thumb{border-color:var(--jade-d)}

/* buttons */
.btn{font:inherit;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--ink);
  border:1px solid var(--edge);background:rgba(255,255,255,.42);border-radius:10px;
  padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:transform .15s ease, background .22s ease, box-shadow .22s ease, color .22s}
.btn:hover{background:rgba(255,255,255,.78);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.975)}
.btn:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.btn.active{color:#fff8ef;
  background:linear-gradient(180deg,#d3814f,var(--copper-d));
  border-color:rgba(80,34,16,.55);
  box-shadow:0 8px 18px -10px rgba(120,52,20,.9), 0 1px 0 rgba(255,255,255,.4) inset}
.btn.on{color:#eafff8;background:linear-gradient(180deg,#3ec1a5,var(--jade-d));
  border-color:rgba(12,70,62,.6);
  box-shadow:0 8px 18px -10px rgba(20,110,96,.9), 0 1px 0 rgba(255,255,255,.35) inset}
.btn.mini{padding:4px 7px;min-width:26px;justify-content:center;font-variant-numeric:tabular-nums}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.chips.tri{grid-template-columns:repeat(3,1fr)}
.chip{font:inherit;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  padding:8px 4px;border-radius:11px;cursor:pointer;color:var(--ink-2);
  border:1px solid var(--edge);background:rgba(255,255,255,.38);
  transition:transform .16s ease, background .25s, color .25s, box-shadow .25s}
.chip:hover{background:rgba(255,255,255,.7);transform:translateY(-1px)}
.chip.active{color:#fff6ea;background:linear-gradient(180deg,#d3814f,#94502c);border-color:rgba(80,34,16,.5);
  box-shadow:0 9px 20px -11px rgba(120,52,20,.95), 0 1px 0 rgba(255,255,255,.34) inset}
.chip.active.cool{background:linear-gradient(180deg,#4fb6cd,#20707f);border-color:rgba(10,56,68,.5);
  box-shadow:0 9px 20px -11px rgba(20,90,110,.95)}
.chip.active.green{background:linear-gradient(180deg,#7fb85f,#3f7038);border-color:rgba(30,60,24,.5)}
.ic{font-size:12px;line-height:1}

/* switch */
label.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
label.sw input{position:absolute;opacity:0;width:0;height:0}
label.sw i{width:28px;height:16px;border-radius:999px;background:rgba(20,50,58,.2);
  border:1px solid rgba(20,50,58,.2);position:relative;transition:background .3s ease;flex:none}
label.sw i::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:99px;
  background:#fbf6ea;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .28s cubic-bezier(.5,1.6,.4,1)}
label.sw input:checked+i{background:var(--jade-d)}
label.sw input:checked+i::after{transform:translateX(12px)}
label.sw span{font-size:12px;font-weight:600;color:var(--ink-2)}

/* ---------------- transport ---------------- */
.transport{grid-column:1;grid-row:3;align-self:end;justify-self:start;
  display:flex;align-items:center;gap:8px;padding:9px;border-radius:18px;
  background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid var(--line);box-shadow:var(--shadow);
  max-width:min(74vw,760px);overflow-x:auto;scrollbar-width:none}
.transport::-webkit-scrollbar{display:none}
.tb{position:relative;font:inherit;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;
  border:1px solid var(--edge);border-radius:12px;background:rgba(255,255,255,.42);
  padding:9px 13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  transition:transform .16s, background .22s, color .22s, box-shadow .22s}
.tb:hover{background:#fffdf7;transform:translateY(-1.5px)}
.tb:active{transform:translateY(0) scale(.97)}
.tb .glyph{font-size:13px}
.tb.primary{color:#fff8ef;background:linear-gradient(180deg,#d3814f,var(--copper-d));border-color:rgba(80,34,16,.55);
  box-shadow:0 10px 22px -12px rgba(120,52,20,.9), 0 1px 0 rgba(255,255,255,.4) inset}
.tb.wide{color:#0e3b36;background:linear-gradient(180deg,#9ee5cd,#3f9d8b);border-color:rgba(15,80,70,.5);
  box-shadow:0 10px 22px -12px rgba(20,110,96,.9), 0 1px 0 rgba(255,255,255,.4) inset}
.tb[aria-pressed=true],.tb.on{color:#eafff8;background:linear-gradient(180deg,#3ec1a5,#1c7a6b);
  border-color:rgba(12,70,62,.6);box-shadow:0 10px 22px -12px rgba(20,110,96,.95)}
.tb .num{margin-left:4px;font-variant-numeric:tabular-nums;font-size:10.5px;opacity:.72}
.tb::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 9px);
  transform:translate(-50%,4px);opacity:0;pointer-events:none;white-space:nowrap;
  font:600 10px/1 "Manrope",sans-serif;letter-spacing:.09em;text-transform:uppercase;
  color:#f6efe2;background:rgba(10,30,36,.92);padding:6px 8px;border-radius:7px;
  transition:opacity .22s ease, transform .22s ease}
@media (hover:hover){.tb:hover::after{opacity:1;transform:translate(-50%,0)}}
.sep{width:1px;height:22px;background:rgba(20,50,58,.16);flex:none}

/* ---------------- hints & toast ---------------- */
#hint{grid-column:1;grid-row:3;align-self:end;justify-self:end;margin-bottom:2px;
  font:600 10.5px/1.7 "Manrope",sans-serif;letter-spacing:.055em;color:rgba(246,239,226,.72);
  text-align:right;text-shadow:0 1px 8px rgba(0,20,25,.7);transition:opacity .8s ease;pointer-events:none}
#hint b{color:#f3c48c;font-weight:800}
#hint.gone{opacity:0}
#toast{position:fixed;left:50%;bottom:96px;z-index:8;transform:translate(-50%,14px);opacity:0;
  padding:9px 15px;border-radius:999px;background:rgba(10,30,36,.9);border:1px solid rgba(255,255,255,.2);
  color:#f6efe2;font:700 11px/1 "Manrope",sans-serif;letter-spacing:.12em;text-transform:uppercase;
  backdrop-filter:blur(8px);pointer-events:none;transition:opacity .3s ease, transform .35s ease;
  box-shadow:0 18px 40px -20px #000;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------------- loader ---------------- */
#loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:radial-gradient(120% 100% at 50% 30%, #0d2c34, #041115 70%);
  color:#f4ecdd;text-align:center;gap:0}
#loader.gone{opacity:0;pointer-events:none;transition:opacity .9s ease}
#loader .l1{font-family:Fraunces,serif;font-weight:600;font-size:clamp(30px,6vw,58px);letter-spacing:-.02em}
#loader .l1 i{color:#e08a5c;font-style:normal}
#loader .bar{width:min(240px,56vw);height:2px;margin:22px auto 12px;background:rgba(255,255,255,.16);border-radius:2px;overflow:hidden}
#loader .bar i{display:block;height:100%;width:24%;background:linear-gradient(90deg,#e0965f,#7fe0c4);
  animation:sweep 1.15s cubic-bezier(.6,0,.4,1) infinite}
@keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(560%)}}
#loader p{margin:0;font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:rgba(244,236,221,.6)}

/* ---------------- mobile ---------------- */
@media (max-width:880px){
  :root{--r:13px}
  #shell{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;gap:10px;padding:10px 10px 0}
  .brand{max-width:none}
  .brand h1{font-size:clamp(28px,9.6vw,44px)}
  .meta .badge.opt{display:none}
  .panels{grid-column:1;grid-row:2;align-self:end;justify-self:stretch;width:auto;
    max-height:min(48vh,420px);padding:0 2px 6px;
    background:linear-gradient(180deg,rgba(8,26,32,.66),rgba(5,18,22,.86));
    backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.2);
    border-radius:20px 20px 0 0;box-shadow:0 -18px 50px -22px rgba(0,0,0,.85);
    padding-inline:10px}
  .sheet-head{display:flex;align-items:center;gap:10px;padding:11px 2px 9px;position:sticky;top:0;z-index:2}
  .sheet-head .grab{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
  .sheet-head b{font:800 10px/1 "Manrope",sans-serif;letter-spacing:.18em;text-transform:uppercase;color:rgba(247,240,227,.85)}
  .sheet-head .btn{margin-left:auto;background:rgba(255,255,255,.16);color:#f7f0e3;border-color:rgba(255,255,255,.28)}
  .group{background:linear-gradient(178deg,rgba(247,240,227,.93),rgba(240,231,214,.9))}
  .transport{max-width:calc(100vw - 20px);border-radius:16px;margin:0 auto 10px;grid-row:3;
    scroll-snap-type:x proximity;justify-content:flex-start}
  .tb{scroll-snap-align:center;padding:8px 11px;font-size:11.5px}
  .tb .num{display:none}
  #hint{display:none}
  #toast{bottom:auto;top:calc(env(safe-area-inset-top) + 74px)}
}
@media (max-height:620px){ .brand .sub{display:none} }
</style>
</head>

<body>
<canvas id="gl"></canvas>
<div id="veil"></div>
<div id="dive"></div>

<div id="shell">
  <!-- ============ brand ============ -->
  <header class="brand">
    <h1>Tide<span>haven</span></h1>
    <p class="sub">A cottage, a pier, and a lagoon cut clean in half.</p>
    <div class="meta">
      <span class="badge dot-wrap"><span class="dot-live"></span>&nbsp;<span id="mTime">Daylight</span></span>
      <span class="badge">tide <b id="mTide">0.00</b> m</span>
      <span class="badge wind">breeze <b id="mWind">1.8</b> m/s</span>
      <span class="badge opt" id="mQual">High</span>
    </div>
  </header>

  <!-- ============ control panel (auto-injected) ============ -->
  <aside class="panels" id="panels" aria-label="Tidehaven controls"></aside>

  <!-- ============ transport ============ -->
  <nav class="transport" id="transport" aria-label="Main actions"></nav>

  <div id="hint">
    <div><b>drag</b> to orbit &nbsp;·&nbsp; <b>scroll</b> to zoom</div>
    <div><b>1 2 3 4</b> cameras &nbsp;·&nbsp; <b>space</b> pause &nbsp;·&nbsp; <b>J</b> ray &nbsp;·&nbsp; <b>K</b> kayak</div>
    <div><b>[ ]</b> tide &nbsp;·&nbsp; <b>T</b> time &nbsp;·&nbsp; <b>M</b> sound</div>
  </div>
</div>

<div id="toast"></div>

<div id="loader">
  <div>
    <div class="l1">Tide<i>haven</i></div>
    <div class="bar"><i></i></div>
    <p id="loadTxt">raising the island</p>
  </div>
</div>

<script>
/* CDN watchdog — if the ESM bundle never boots, recover with the legacy build. */
window.__TIDEHAVEN_BOOTED = false;
window.addEventListener('DOMContentLoaded', function () {
  setTimeout(function(){
    if (window.__TIDEHAVEN_BOOTED) return;
    var t = document.getElementById('loadTxt'); if (t) t.textContent = 'retrying with the backup renderer';
    document.createElement('script').src =
      'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js';
    setTimeout(function(){
      if (!window.__TIDEHAVEN_BOOTED && t)
        t.textContent = 'offline? tidehaven needs three.js from a cdn';
    }, 6000);
  }, 9000);
});
</script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
window.__THREE__ = THREE;
window.__TIDEHAVEN_BOOTED__ = true;
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';


/* ============================================================================
   0 · WORLD CONSTANTS
   ========================================================================== */
const BOX  = { W: 19.2, D: 19.2 };          // diorama footprint  (x: ±9.6, z: ±9.6)
const RIM  = 0.55;                           // top of the acrylic walls
const FLOOR= -4.4;                           // visible seabed floor
const SEA  = 0.0;                            // still water level
const WATER_R = 10.12;                       // water surface plane radius
const TAU = Math.PI * 2;
const clamp = THREE.MathUtils.clamp;
const lerp  = THREE.MathUtils.lerp;
const easeIO= t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;

/* water levels by tide (-1 .. 1) */
const tideToLevel = t => t <= 0 ? lerp(-0.72, -0.02, (t+1)/1) : lerp(-0.02, 0.14, t);

/* ============================================================================
   1 · PROCEDURAL TEXTURES (canvas + noise, generated once, shared)
   ========================================================================== */
function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return [c, c.getContext('2d')]; }
const rnd = (seed=>()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; })(97);

/** seamless vertical noise band → used for bark and plank grain */

function makeBark(){

  for(let i=0;i<12;i++){ g.strokeStyle='rgba(255,230,200,.05)'; g.lineWidth=1+rnd()*3;
    g.beginPath(); const x0=rnd()*256; g.moveTo(x0,0);
    for(let y=0;y<=256;y+=16) g.lineTo(x0+Math.sin(y*.06+rnd())*6, y); g.stroke(); }
  for(let i=0;i<400;i++){ const x=rnd()*256,y=rnd()*256;
    g.fillStyle='rgba('+(165+rnd()*50|0)+','+(120+rnd()*40|0)+',70,.16)'; g.fillRect(x,y,1,1); }

}
function makeDeck(){
  const [c,g]=mkCanvas(256,256);

    g.fillStyle='rgb('+(150*s|0)+','+(104*s|0)+','+(64*s|0)+')'; g.fillRect(p*pw,0,pw,256);
    for(let i=0;i<44;i++){ const x=p*pw+2+rnd()*(pw-4);
      g.strokeStyle='rgba(0,0,0,'+(0.02+0.08*rnd())+')'; g.lineWidth=1+rnd()*1.6;
      g.beginPath(); g.moveTo(x,0); for(let y=0;y<=256;y+=20) g.lineTo(x+Math.sin(y*.05+p+x*.01)*2.2,y); g.stroke(); }
    g.fillStyle='rgba(0,0,0,.32)'; g.fillRect(p*pw,0,1.6,256);
    g.fillStyle='rgba(255,240,210,.10)'; g.fillRect(p*pw+1.6,0,1,256);
    for(let k=0;k<8;k++){ const yy=rnd()*256; g.fillStyle='rgba(30,18,10,.5)';
      g.beginPath(); g.arc(p*pw+pw*0.16,yy,1.5,0,TAU); g.arc(p*pw+pw*0.84,yy,1.5,0,TAU); g.fill(); }

function makeRoof(){
  const [c,g]=mkCanvas(256,256);

  for(let x=0;x<256;x+=seam){                                    // standing-seam copper
    const gr=g.createLinearGradient(x,0,x+seam,0);
    gr.addColorStop(0,'rgba(255,190,150,.20)'); gr.addColorStop(.35,'rgba(150,72,44,.10)');
    gr.addColorStop(.5,'rgba(40,14,6,.42)');   gr.addColorStop(.62,'rgba(210,140,105,.16)');
    gr.addColorStop(1,'rgba(120,54,30,.20)'); g.fillStyle=gr; g.fillRect(x,0,seam,256);
  }

function makeSand(){
  const [c,g]=mkCanvas(256,256);
  g.fillStyle='#e2cfa7'; g.fillRect(0,0,256,256);
  for(let i=0;i<9000;i++){ const x=rnd()*256,y=rnd()*256,r=rnd();
    g.fillStyle = r>.62 ? 'rgba(255,248,226,'+(0.06+0.20*rnd())+')'
              : r>.28 ? 'rgba(150,116,72,'+(0.04+0.10*rnd())+')'
                      : 'rgba(196,158,108,'+(0.05+0.12*rnd())+')';
    g.fillRect(x,y,1,1); }
  for(let i=0;i<26;i++){                                            // pebbles + shells
    const x=rnd()*256,y=rnd()*256,r=1.5+rnd()*3.4;
    g.fillStyle='rgba(120,98,72,.30)'; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
    g.fillStyle='rgba(255,240,220,.34)'; g.beginPath(); g.arc(x-r*.3,y-r*.4,r*.5,0,TAU); g.fill(); }
  for(let i=0;i<3;i++){ const x=rnd()*256,y=rnd()*256;              // a starfish & driftwood hint
    g.save(); g.translate(x,y); g.fillStyle='rgba(228,142,104,.55)';
    for(let k=0;k<5;k++){ g.rotate(TAU/5); g.beginPath(); g.moveTo(0,0); g.lineTo(4,7); g.lineTo(-4,7); g.fill(); }
    g.restore(); }
  return c;
}

function island(p){
  const x=p.x, z=p.z, r=Math.hypot(x,z);
  // rounded-rect blend: keeps the island flush against the acrylic walls
  const hb=7.10, cr=2.05;
  const dx=Math.abs(x)-hb, dz=Math.abs(z)-hb;
  const rr = (Math.max(Math.max(dx,dz),0) + Math.min(Math.max(dx,dz),0))*0.72 + Math.hypot(dx,dz);
  const dr = Math.max(r, rr + 3.3);
  const base = 3.55*(1-smooth01(dr/7.75));
  let h = base - 3.05;
  const ang = Math.atan2(z,x);
  h += 1.14*bump(dr,1.72,0.152)*bump(ang-0.98,1.22,0.55);      // west heath
  h += 0.88*bump(dr,2.58,0.121)*bump(ang-3.06,0.95,0.50);      // south shoulder
  h += 0.64*bump(dr,1.44,0.131)*bump(ang+1.95,0.88,0.52);      // east knoll
  h += 1.05*bump((x-0.72)/1.80,0,1)*bump((z+3.05)/2.20,0,1);   // cabin plateau
  h += 1.70*bump((x+1.05)/1.35,0,1)*bump((z+1.95)/1.25,0,1);   // north knoll
  h += 0.055*Math.sin(x*2.05)*Math.cos(z*1.72)
     + 0.032*Math.sin(x*4.30+1.10)*Math.cos(z*3.90-0.70)
     + 0.018*Math.sin(x*7.70-2.00)*Math.cos(z*8.30+1.30);
  const pierNear = (x>1.2 && z>1.4);
  const bar = 0.70*smooth01((x-1.4)/1.6)*smooth01((z-1.5)/1.9);
  h += bar;
  h = Math.max(h, -0.02)*1.05;
  if (pierNear) h = Math.min(h, 0.16 + bar*0.55);
  // build pads (deck / foundation / fire pit)

  h = pad(h, 3.00,-1.80, 3.0, 2.6, 1.12);       // cabin + deck
  h = pad(h, 3.95,-4.60, 1.9, 1.5, 1.42);       // garden & crates
  h = pad(h,-1.50,-4.05, 1.6, 1.4, 1.30);       // fire pit clearing
  h = pad(h,-4.20, 3.90, 1.7, 1.5, 0.52);       // drying-line flat
  h = pad(h, 7.40, 0.20, 1.35, 2.3, 0.66);      // east path
  return h;
}
function smooth01(x){ x=clamp(x,0,1); return x*x*(3-2*x); }
function bump(u,m,s){ return Math.exp(-(u*u)/(2*s*s))*(m||1); }
/** carve a soft flat plateau at height H */
function pad(h,cx,cz,rx,rz,H){
  return h; // replaced below
}
/* NOTE: `pad` is re-defined with real args at module scope so island() can use it. */
function islandH(x,z){ return island({x:x,z:z}); }

// PCF shadow lookup for fully custom ShaderMaterials. `#define` (not the enum!)
// because shadow.glsl.js does `#if SHADOWMAP_TYPE_PCF`.
const GETSHADOW = `
uniform sampler2D directionalShadowMap[1];
varying vec4 vDirectionalShadowCoord[1];
struct DirectionalLightShadow { float shadowBias; float shadowNormalBias; float shadowRadius;
  vec2 shadowMapSize; };
uniform DirectionalLightShadow directionalShadowMap[1];
float texture2DCompare(sampler2D t, vec2 uv, float compare){
  return step(compare, texture2D(t, uv).r);
}
float texture2DShadowLerp(sampler2D t, vec2 size, vec2 uv, float compare){
  vec2 texelSize = vec2(1.0)/size;
  vec2 f = fract(uv*size+0.5);
  vec2 centroidUV = floor(uv*size+0.5)*texelSize;
  float lb=texture2DCompare(t,centroidUV+vec2(0.0,1.0)*texelSize,compare);
  float lt=texture2DCompare(t,centroidUV+vec2(0.0,0.0)*texelSize,compare);
  float rb=texture2DCompare(t,centroidUV+vec2(1.0,1.0)*texelSize,compare);
  float rt=texture2DCompare(t,centroidUV+vec2(1.0,0.0)*texelSize,compare);
  return mix(mix(lb,lt,f.x),mix(rb,rt,f.x),f.y);
}
float getShadow(sampler2D sm, vec2 smSize, vec3 sColor, vec4 sc){
  vec3 proj = sc.xyz / sc.w; proj = proj*0.5+0.5;
  float b = proj.z - directionalShadowMap[0].shadowBias*clamp(dot(normalize(normal),normalize(lightDirectionToLight)),0.0,1.0)*directionalShadowMap[0].shadowNormalBias;
  float vis = step(0.0, proj.x)*step(proj.x,1.0)*step(0.0, proj.y)*step(proj.y,1.0)*step(0.0,proj.z);
  float radius = directionalShadowMap[0].shadowRadius;
  float shadow = 0.0;
  for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){
    shadow += texture2DShadowLerp(sm, smSize, proj.xy + vec2(float(x),float(y))*radius*smSize*0.25, b);
  }
  shadow /= 9.0;
  return mix(1.0, mix(1.0, sColor.r, 0.92), shadow) * mix(1.0, vis, 0.999);
}
`;
const GETSHADOW_VARYING = `varying vec4 vDirectionalShadowCoord[1];`;

const NOISE2D = `
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){
  vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  float a=hash21(i), b=hash21(i+vec2(1.0,0.0)), c=hash21(i+vec2(0.0,1.0)), d=hash21(i+vec2(1.0,1.0));
  return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
}
float fbm2(vec2 p){ return vnoise(p)*0.5 + vnoise(p*2.03+7.1)*0.28 + vnoise(p*4.11-3.7)*0.14; }
`;

const HEIGHT_GLSL = `
float s01(float x){ x=clamp(x,0.0,1.0); return x*x*(3.0-2.0*x); }
float bp(float u,float m,float s){ return exp(-(u*u)/(2.0*s*s))*m; }
float gpad(float h,float H,float dx,float dz,float rx,float rz){
  float d = length(vec2(dx/rx, dz/rz));
  float w = 1.0 - s01((d-0.35)/0.85);
  return mix(h, min(h,H), w);
}
float terrainH(vec2 p){
  float x=p.x, z=p.y, r=length(p);
  vec2 ab=abs(p)-vec2(7.10);
  float rr=(max(max(ab.x,ab.y),0.0)+min(max(ab.x,ab.y),0.0))*0.72+length(ab-vec2(2.05)*sign(ab)*(step(0.0001,max(ab.x,ab.y))));
  float dr=max(r, rr+3.3);
  float h = 3.55*(1.0-s01(dr/7.75)) - 3.05;
  float a=atan(z,x);
  h += 1.14*bp(dr-1.72,0.152,1.0)*bp(a-0.98,0.55,1.22);
  h += 0.88*bp(dr-2.58,0.121,1.0)*bp(a-3.06,0.50,0.95);
  h += 0.64*bp(dr-1.44,0.131,1.0)*bp(a+1.95,0.52,0.88);
  h += 1.05*bp((x-0.72)/1.80,1.0,1.0)*bp((z+3.05)/2.20,1.0,1.0);
  h += 1.70*bp((x+1.05)/1.35,1.0,1.0)*bp((z+1.95)/1.25,1.0,1.0);
  h += 0.055*sin(x*2.05)*cos(z*1.72)+0.032*sin(x*4.30+1.10)*cos(z*3.90-0.70)+0.018*sin(x*7.70-2.00)*cos(z*8.30+1.30);
  float bar = 0.70*s01((x-1.4)/1.6)*s01((z-1.5)/1.9);
  h += bar;
  h = max(h,-0.02)*1.05;
  if (x>1.2 && z>1.4) h = min(h, 0.16+bar*0.55);
  h = gpad(h,1.12,(x-3.00),0.0-z+1.80,3.0,2.6)*0.0 + mix(h,min(h,1.12),0.0);
  h = gpad(h,1.12,(x-3.00),(z+1.80),3.0,2.6);
  h = gpad(h,1.42,(x-3.95),(z+4.60),1.9,1.5);
  h = gpad(h,1.30,(x+1.50),(z+4.05),1.6,1.4);
  h = gpad(h,0.52,(x+4.20),(z-3.90),1.7,1.5);
  h = gpad(h,0.66,(x-7.40),(z-0.20),1.35,2.3);
  return h;
}
`;

const CAUSTICS = `
uniform float uTime; uniform float uCaus;
vec2 hash2(vec2 p){ p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))); return fract(sin(p)*43758.5453); }
vec3 caustics(vec2 p){
  float t=uTime*0.30; p*=1.25;
  vec2 i=floor(p), f=fract(p); vec2 b=vec2(0.0); float bb=8.0;
  for(int dy=-1;dy<=1;dy++) for(int dx=-1;dx<=1;dx++){
    vec2 g=vec2(float(dx),float(dy)), o=hash2(i+g);
    o=0.5+0.5*sin(t+TAU*o);
    vec2 r=g+o-f, v=r*r; float d=dot(v,vec2(0.7));
    float w=exp(-d*2.6); bb=min(bb,d); b+=o*w;
  }
  float c = 1.0-bb, c2 = 1.0-bb*0.62;
  c=pow(max(c,0.0),3.0); c2=pow(max(c2,0.0),7.0);
  return vec3(0.62,1.0,0.88)*c*1.15 + vec3(1.0,0.94,0.74)*c2*0.7;
}
`;

  side:THREE.DoubleSide, depthWrite:true, envMapIntensity:1.35

bodyMat.onBeforeCompile = sh=>{
  sh.uniforms.uTime=U.uTime; sh.uniforms.uWL=U.uWaterLevel; sh.uniforms.uDeep=U.uDeep;
  sh.uniforms.uHz=U.uHz; sh.uniforms.uHalfD=U.uHalfD; sh.uniforms.uHalfW=U.uHalfW;
  sh.uniforms.uNight=U.uNight; sh.uniforms.uCaus=U.uCaus; sh.uniforms.uRipple=U.uRipple;
  sh.fragmentShader = `
    uniform float uTime,uWL,uHalfD,uHalfW,uNight,uCaus; uniform vec3 uDeep,uHz;
    uniform vec4 uRipple; varying vec3 vWP;
    ${NOISE2D} float TAU=6.2831853; ${CAUSTICS}
    vec3 skyEnv(vec3 d){ float y=d.y;
      return mix(mix(uHz,uDeep,0.45), uHz, smoothstep(-0.06,0.35,y)) + vec3(0.35,0.45,0.4)*max(y,0.0)*0.15; }
  `.replace('void main() {','void main() {\n\t') + sh.fragmentShader.replace(
   '#include <alphamap_fragment>', `
   vec3 Vw = normalize(cameraPosition - vWP);
   vec3 dS = vec3(Vw.x, 0.0, Vw.z); float dl = length(dS);
   float sHit = 0.0;
   if(dl > 0.012){
     dS/=dl;
     vec2 p0 = vWP.xz, d2 = vec2(dS.x, dS.z), c = vec2(uHalfD-0.07);
     float B = 2.0*dot(p0-c, d2);
     float C = dot(p0-c,p0-c) - dot(c,c);
     float disc = B*B - 4.0*C;
     sHit = disc<=0.0 ? 30.0 : (-B - sqrt(max(disc,0.0)))*0.5;
   }
   float front = max( max(vWP.z - uHalfD + 0.02), max(-vWP.x - uHalfW + 0.02, vWP.x - uHalfW + 0.02) );
   float edgeSoft = smoothstep(0.0, 0.95, front);
   float sideSoft = 0.42 + 0.58*smoothstep(0.0, 1.1, max(-vWP.x - uHalfW + 0.02, vWP.x - uHalfW + 0.02));
   float capFade = edgeSoft*sideSoft;
   float farFade = 1.0 - exp(-max(sHit,0.0)*${BODY_HAZE_K.toFixed(3)});
   if (front > 0.0 && dot(normalize(vNormal), Vw) > 0.0) discard;
   if (capFade < 0.005 && vWP.y < uWL - 0.02) discard;
   float depth = clamp((uWL + 0.06 - vWP.y)/3.7, 0.0, 1.0);
   vec3 tint = mix(mix(uColor, vec3(0.66,0.80,0.70), 0.35*(1.0-depth)), uDeep, pow(depth,0.75));
   float dA = max(max(-dS.z*(uHalfD-vWP.z)/max(-vWP.z+uHalfD,1e-3),0.0), 0.0);
   tint += caustics(vWP.xz*0.62 + vec2(uTime*0.03)) * (0.11*uCaus) * smoothstep(0.8,0.0,depth);
   float rip = max(0.0, 1.0 - abs(length(vWP.xz-uRipple.xy)-uRipple.z)*2.4);
   tint += rip*uRipple.w*vec3(0.55,0.95,0.85)*smoothstep(1.0,0.1,depth);
   vec3 refl = skyEnv(reflect(-Vw, normalize(vNormal)));
   float fres = 0.045 + 0.10*pow(1.0-max(dot(normalize(vNormal),Vw),0.0),4.0);
   vec3 col = mix(tint, refl, fres*capFade*(0.35+farFade*1.5));
   col = mix(col, mix(uHz, uDeep, 0.35), (1.0-capFade)*0.55);

   gl_FragColor.a = clamp(capFade*(0.20 + 0.60*farFade), 0.0, 1.0);
   gl_FragColor.rgb = mix(vec3(0.0), gl_FragColor.rgb, gl_FragColor.a);
   if (gl_FragColor.a < 0.5) discard;
   gl_FragColor.rgb /= max(gl_FragColor.a, 1e-4);   // back to normal-over after the test
   #include <tonemapping_fragment>
   #define discardBeforeFragment
   #ifdef USE_ALPHATEST_DISCARD
   #endif
  `);
  sh.vertexShader = 'varying vec3 vWP;\n'+sh.vertexShader.replace('#include <project_vertex>',
    '#include <project_vertex>\n vWP=(modelMatrix*vec4(transformed,1.0)).xyz;');
};

  vertexShader:`
    uniform float uTime,uWL,uWave,uWindA,uTideS;
    varying vec2 vXZ; varying float vCrest,vFoam,vWind; varying vec3 vN;
    ${NOISE2D} ${HEIGHT_GLSL}
    float waveH(vec2 p, float t){
      float h = 0.0;
      h += sin(p.x*0.92 + t*1.10)*0.045;
      h += sin(p.y*1.18 - t*1.36)*0.038;
      h += sin(dot(vec2(0.71,-0.70),p)*1.55 + t*2.05)*0.030;
      h += (fbm2(p*0.85 + vec2(t*0.17, -t*0.11)) - 0.5)*0.16;

    }
    void main(){
      vec4 wp = modelMatrix*vec4(position,1.0);
      vec2 p = wp.xz; vXZ = p; vWind = uWave;
      float L = uWL;
      float h = waveH(p, uTime);
      float tH = terrainH(p);
      float shore = 1.0 - s01((tH - (L-0.30))/0.52);
      h *= (0.25 + 0.75*shore);
      float e = 0.30;
      float dh = (waveH(p+vec2(e,0.0),uTime)-waveH(p-vec2(e,0.0),uTime)
               +  waveH(p+vec2(0.0,e),uTime)-waveH(p-vec2(0.0,e),uTime))*0.5;
      vCrest = h;
      float cr = h + 0.075 - max(0.0, dh);
      vFoam = (1.0 - smoothstep(0.016, 0.085, abs(cr))) + smoothstep(0.030,0.17, cr);
      vFoam *= 0.85;

    ${NOISE2D} float TAU=6.2831853; ${CAUSTICS} ${HEIGHT_GLSL}
    void main(){
      vec2 p = vXZ;

function swayMat(color, rough, stiffness, blade){
  const m=new THREE.MeshStandardMaterial({color, roughness:rough===undefined?0.85:rough, side:THREE.DoubleSide});
  m.onBeforeCompile=(sh,mat)=>{
    sh.uniforms.uTime=U.uTime; sh.uniforms.uWind=U.uWindV; sh.uniforms.uPhase=null;
    sh.vertexShader = `
      uniform float uTime,uWind;
      #ifdef USE_INSTANCING
      attribute float aPhase;
      #endif
      void main(){
      `+ sh.vertexShader.replace('#include <begin_vertex>', `
        #include <begin_vertex>
        float y=clamp(transformed.y,0.0,2.2);
        float ph=${stiffness.toFixed(2)};
        #ifdef USE_INSTANCING
          ph *= (0.65+0.75*aPhase);
        #endif
        float s1=sin(uTime*1.25+ph), s2=sin(uTime*2.7+ph*1.7);
        float amp=(0.055+0.15*uWind)*(y*y)*ph;
        transformed.x += (s1*0.8+s2*0.35)*amp;
        transformed.z += (cos(uTime*1.05+ph*1.2)*0.7+s2*0.25)*amp*0.6;
      `);
    if(blade) sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>','');
  };
  m.userData.sway=true; return m;
}
function instancedSway(geo,mat,n,place,seedBase){
  const im=new THREE.InstancedMesh(geo,mat,n);
  const ph=new Float32Array(n);
  const d=new THREE.Object3D();
  let k=0;
  for(let i=0;i<n;i++){ const r=place(i,n,d); if(r===false){continue;} k=i;
    d.updateMatrix(); im.setMatrixAt(i,d.matrix); ph[i]=seedBase+rnd()*6.0;
    if (im.instanceColor) im.setColorAt(i, new THREE.Color().setHSL(0.2+rnd()*0.08, 0.45+rnd()*0.2, 0.45+rnd()*0.15)); }
  im.count=k+1;
  geo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(ph,1));
  im.castShadow=true; im.receiveShadow=true; im.frustumCulled=false;
  return im;
}

const bladeGeo=(h,w)=>{
  const g=new THREE.BoxGeometry(w,h,0.03,1,3,1);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){ const t=(p.getY(i)+h/2)/h;
    p.setX(i,p.getX(i)*(1-0.86*t)); p.setZ(i,p.getZ(i)+t*t*0.05); }
  g.translate(0,h/2,0); g.computeVertexNormals(); return g;
};

function makeTree(size, kind){

  trunk.position.y=0.72*size; trunk.castShadow=true; g.add(trunk);
  const cGeo=new THREE.CylinderGeometry(0.02,0.055,0.5*size,5);
  const folG=new THREE.IcosahedronGeometry(0.9,0);
  const folMat=swayMat(0x6d9c3c,0.88,1.25);
  const nC = kind==='pine' ? 6 : (kind==='palm'?0:5);
  const fol=new THREE.InstancedMesh(folG,folMat,Math.max(nC,1)), d=new THREE.Object3D();
  const ph=new Float32Array(Math.max(nC,1));
  if(kind==='pine'){
    trunk.material=std(0x6b4d34,.9);
    for(let i=0;i<6;i++){ const t=i/5;
      d.position.set(Math.sin(i*2.2)*0.22*size, (1.05+t*1.75)*size, Math.cos(i*2.2)*0.22*size);
      d.rotation.set(rnd(),rnd()*TAU,rnd());
      const s=(1.02-t*0.5)*size; d.scale.set(s,s*0.78,s); d.updateMatrix(); fol.setMatrixAt(i,d.matrix);
      fol.setColorAt(i,new THREE.Color().setHSL(0.30+(rnd()*0.05),0.35,0.24+t*0.10)); ph[i]=rnd()*6; }
    folG.setAttribute('aPhase',new THREE.InstancedBufferAttribute(ph,1));
  } else {
    for(let i=0;i<5;i++){
      d.position.set(Math.sin(i*1.9)*0.60*size,(1.42+Math.sin(i*1.3)*0.35)*size,Math.cos(i*1.9)*0.60*size);
      d.rotation.set(rnd(),rnd()*TAU,rnd());
      const s=(1.0-i*0.11)*size; d.scale.set(s,s*0.8,s); d.updateMatrix(); fol.setMatrixAt(i,d.matrix);
      fol.setColorAt(i,new THREE.Color().setHSL(0.20+rnd()*0.09,0.5,0.36+rnd()*0.16)); ph[i]=rnd()*6; }
    folG.setAttribute('aPhase',new THREE.InstancedBufferAttribute(ph,1));
    if(size>0.8){ const bn=new THREE.Mesh(new THREE.IcosahedronGeometry(0.30,0),M.stone);

  }
  fol.castShadow=true; fol.receiveShadow=true; g.add(fol); g.userData.fol=fol;
  return g;
}
function makePalm(size){

    new THREE.Vector3(0.30,1.7,-0.04),new THREE.Vector3(0.30,2.2,0.06)]);
  const t=new THREE.Mesh(new THREE.TubeGeometry(cur,14,0.10,7,false),std(0x8d6c48,.88));
  t.scale.set(size,size,size); t.castShadow=true; g.add(t);
  const frond=new THREE.Mesh(new THREE.PlaneGeometry(0.55,1.75,1,7),swayMat(0x3f8f57,.86,1.5));
  const pos=frond.geometry.attributes.position;
  for(let i=0;i<pos.count;i++){ const y=(pos.getY(i)+0.875)/1.75;
    pos.setZ(i,pos.getZ(i)-y*y*0.9); pos.setX(i,pos.getX(i)*(1-y*0.72)); }
  frond.geometry.translate(0,0.875,0); frond.geometry.computeVertexNormals();
  frond.material.side=THREE.DoubleSide;
  const crown=new THREE.Group();
  for(let i=0;i<7;i++){ const f=frond.clone(); f.geometry=frond.geometry;
    f.rotation.set(0.55,i/7*TAU,0); f.position.y=0; crown.add(f); }
  crown.position.set(0.30*size,2.18*size,0.06*size); crown.scale.setScalar(size);
  crown.traverse(o=>{if(o.isMesh){o.castShadow=true;}}); g.add(crown);
  const cocos=new THREE.InstancedMesh(new THREE.SphereGeometry(0.1,7,6),std(0x6b4a2c,.8),3);
  const d=new THREE.Object3D();
  for(let i=0;i<3;i++){ d.position.set(0.30*size+(i-1)*0.14, 2.08*size, 0.1*size); d.updateMatrix(); cocos.setMatrixAt(i,d.matrix);} cocos.castShadow=true; g.add(cocos);
  return g;
}

const seaWorld = new THREE.Group(); world.add(seaWorld);
/* --- shared animated material factory ----------------------------------- */
function marineMaterial(base, fn, opaque){
  base.userData.sea=true;
  base.onBeforeCompile = (sh)=>{
    sh.uniforms.uTime=U.uTime; sh.uniforms.uWL=U.uWaterLevel; sh.uniforms.uTideSp=U.uTideSpeed;
    sh.uniforms.uWindA=U.uWindV; sh.uniforms.uWaveF=U.uWaveF; sh.uniforms.uNight=U.uNight;
    sh.uniforms.uDeep=U.uDeep; sh.uniforms.uHz=U.uHz;
    fn(sh);
    /* per-fragment depth tint keeps everything readable through the acrylic */
    if (opaque!==false){
      sh.fragmentShader = 'uniform float uWL; uniform vec3 uDeep,uHz; varying vec3 vWP2;\n'+
      sh.fragmentShader.replace('#include <colorspace_fragment>',
       `float dep = clamp((uWL+0.06-vWP2.y)/3.3,0.0,1.0);
        vec3 wat = mix(uHz, uDeep, 0.45)*vec3(0.60,1.05,0.95);
        gl_FragColor.rgb *= mix(vec3(1.0), wat, pow(dep,0.7)*0.86);
        gl_FragColor.rgb += wat*0.06*dep;
        #include <tonemapping_fragment>
        #include <colorspace_fragment>`);
      sh.vertexShader = 'varying vec3 vWP2;\n'+sh.vertexShader.replace('#include <project_vertex>',
        '#include <project_vertex>\n vWP2=(modelMatrix*vec4(transformed,1.0)).xyz;');
    }
    sh.fragmentShader = 'float _dummy2=0.0;\n'+sh.fragmentShader.replace('#include <fog_fragment>',
      '#include <fog_fragment>\n gl_FragColor.rgb += vec3(0.0);');
  };
  base.customProgramCacheKey=()=>'sea'+(base.uuid||'');
  return base;
}

const rayGeo = (()=>{ const N=26,S=15,V=[],VC=[],UV=[],IDX=[];
  const prof=t=>{ const s=Math.sin(Math.PI*Math.pow(t,0.78));
    return { w:Math.pow(Math.max(s,0),0.72)*(1-0.28*t), b:0.10*s+0.055*Math.sin(Math.PI*t)+0.02*(1-t) }; };
  for(let i=0;i<=N;i++){ const t=i/N, p=prof(t);
    for(let j=0;j<=S;j++){ const u=j/S;
      const th=u*TAU;
      V.push( t*1.35-0.40, p.w*Math.cos(th)*0.5, p.b*Math.sin(th) );
      VC.push(0,  p.w*1.10+0.34+0.35*t, 1.2-t*0.6 ); }
    UV.push(t,0, 1,0.34, t,1 ); }
  for(let i=0;i<N;i++) for(let j=0;j<S;j++){ const a=i*(S+1)+j,b=a+S+1;
    IDX.push(a,b,a+1, b,b+1,a+1); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(V,3));
  g.setAttribute('aC',new THREE.Float32BufferAttribute(VC,3));
  g.setIndex(IDX); g.computeVertexNormals(); return g; })();

    camera.fov=lerp(camera.fov, camera.userData.fovTo||CAMS.iso.fov, 0.10);
    if(state.camT>=1){ camMoving=false; camera.fov=camera.userData.fovTo; camera.updateProjectionMatrix(); }
  }
}

const audio = {
  ctx:null, master:null, sfxG:null, musG:null, started:false, noise:null,
  init(){ if(this.ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ctx=this.ctx=new AC();
    const master=this.master=ctx.createGain(); master.gain.value=0; master.connect(ctx.destination);
    const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=3;
    comp.connect(master);
    const sfx=this.sfxG=ctx.createGain(); sfx.connect(comp);
    const mus=this.musG=ctx.createGain(); mus.connect(comp);
    /* a little convolution reverb from a synthesised impulse */
    const conv=ctx.createConvolver(); const len=ctx.sampleRate*2.2;
    const ib=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){ const d=ib.getChannelData(c);
      for(let i=0;i<len;i++){ const t=i/len; d[i]=(Math.random()*2-1)*Math.pow(1-t,2.6)*(0.35+0.65*t); } }
    conv.buffer=ib; const wet=ctx.createGain(); wet.gain.value=0.30;
    conv.connect(wet); wet.connect(comp); this.conv=conv;
    /* pink-ish noise source (one shared buffer, looping) */
    const nb=ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
    const nd=nb.getChannelData(0); let last=0;
    for(let i=0;i<nd.length;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; nd[i]=last*3.2; }
    this.noiseBuf=nb;
    this.buildWeather(); this.buildPads();
    this.started=true; this.applyVolumes(true);
  },
  buildWeather(){
    const ctx=this.ctx, out=this.sfxG;
    const src=ctx.createBufferSource(); src.buffer=this.noiseBuf; src.loop=true;
    const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=220;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=780; lp.Q.value=0.7;
    const g=ctx.createGain(); g.gain.value=0.0;
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=380; bp.Q.value=1.1;
    const surge=ctx.createGain(); surge.gain.value=0.0;
    src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(out);
    hp.connect(bp); bp.connect(surge); surge.connect(out);
    this.waveG=g; this.waveLP=lp; this.surge=surge;
    /* rain bed */
    const r=ctx.createBufferSource(); r.buffer=this.noiseBuf; r.loop=true;
    const bp2=ctx.createBiquadFilter(); bp2.type='bandpass'; bp2.frequency.value=1750; bp2.Q.value=0.55;
    const bp3=ctx.createBiquadFilter(); bp3.type='peaking'; bp3.frequency.value=3400; bp3.gain.value=4;
    const rg=ctx.createGain(); rg.gain.value=0;
    r.connect(bp2); bp2.connect(bp3); bp3.connect(rg); rg.connect(out); rg.connect(this.conv);
    this.rainG=rg;
    /* breeze */
    const b=ctx.createBufferSource(); b.buffer=this.noiseBuf; b.loop=true;
    const lp2=ctx.createBiquadFilter(); lp2.type='lowpass'; lp2.frequency.value=420;
    const bg=ctx.createGain(); bg.gain.value=0;
    b.connect(lp2); lp2.connect(bg); bg.connect(out);
    this.breezeG=bg;
    [src,r,b].forEach(s=>{ try{s.start(0);}catch(e){} });
  },
  buildPads(){
    const ctx=this.ctx, mus=this.musG;
    const chords=[[45,52,57,64],[41,48,53,60],[48,55,60,67],[43,50,55,62]];
    const bus=ctx.createGain(); bus.gain.value=0.19; bus.connect(mus); bus.connect(this.conv);
    chords.forEach((ch,ci)=>{ ch.forEach((n,i)=>{
      const o=ctx.createOscillator(), o2=ctx.createOscillator();
      o.type='sine'; o2.type='triangle';
      o.frequency.value=mtof(n); o2.frequency.value=mtof(n)*2.003;
      const g=ctx.createGain(); g.gain.value=0.0;
      const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=760; lp.Q.value=0.5;
      o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(bus);
      o.start(); o2.start();
      this.pads=this.pads||[]; this.pads.push({o,o2,g,lp,chord:ci,i}); }); });
    /* the progression sequencer runs on a lookahead scheduler */
    this.step=0; this.next=ctx.currentTime+0.15; this.chords=chords; this.bus=bus;
    this.sched=setInterval(()=>this.tick(),180);
    function mtof(n){ return 440*Math.pow(2,(n-69)/12); }
  },
  tick(){
    if(!this.ctx) return;
    const ctx=this.ctx, spb=2.05;
    while(this.next < ctx.currentTime+1.4){
      const bar=this.step%4, ch=this.chords[bar];
      /* pad swell */
      this.pads.filter(p=>p.chord===bar).forEach(p=>{
        const g=p.g.gain, t=this.next;
        g.cancelScheduledValues(t); g.setValueAtTime(g.value,t);
        g.linearRampToValueAtTime(0.075/(1+p.i*0.6), t+1.2);
        g.linearRampToValueAtTime(0.010, t+spb*0.98);
        p.lp.frequency.setTargetAtTime(600+bar*130, t, 0.6);
      });
      /* music-box melody, 5th chord tone an octave up, sometimes a 9th */
      const n = ch[(this.step*3+bar)%4] + (rnd()<0.42?24:12);
      if(rnd()<0.75) this.ping(n, this.next+0.10+rnd()*0.6, 0.16);
      if(rnd()<0.28) this.ping(ch[0]+12, this.next+spb*0.5, 0.09);
      this.step++; this.next+=spb;
    }
  },
  ping(midi,t,amp){
    const ctx=this.ctx, f=440*Math.pow(2,(midi-69)/12);
    const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
    const o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.value=f*2.01;
    const g=ctx.createGain(); g.gain.value=0;
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=clamp(f*2,600,3000); bp.Q.value=1.6;
    o.connect(bp); o2.connect(bp); bp.connect(g); g.connect(this.bus);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(amp*1.1,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0006,t+1.5);
    o.start(t); o2.start(t); o.stop(t+1.7); o2.stop(t+1.7);
    setTimeout(()=>{try{o.disconnect();o2.disconnect();g.disconnect();bp.disconnect();}catch(e){}},2600);
  },
  splash(power){
    if(!this.ctx||this.ctx.state!=='running') return;
    const ctx=this.ctx, t=ctx.currentTime;
    const len=Math.max(0.14,(power||1)*0.30);
    const b=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*len),ctx.sampleRate);
    const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++){ const x=i/d.length; d[i]=(Math.random()*2-1)*Math.pow(1-x,2.0); }
    const s=ctx.createBufferSource(); s.buffer=b;
    const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=420;
    const g=ctx.createGain(); g.gain.value=0.5*(power||1)*state.sfx;
    s.connect(hp); hp.connect(g); g.connect(this.sfxG); g.connect(this.conv);
    s.start(t);
    [1180,1690,2270,3010].forEach((f,i)=>{
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
      const gg=ctx.createGain(); gg.gain.value=0;
      o.connect(gg); gg.connect(this.sfxG);
      const t0=t+0.012*i;
      gg.gain.linearRampToValueAtTime(0.055*(power||1)*state.sfx/(1+i*0.7), t0+0.004);
      gg.gain.exponentialRampToValueAtTime(0.0005, t0+0.32+0.06*i);
      o.start(t0); o.stop(t0+0.55);
      setTimeout(()=>{try{o.disconnect();gg.disconnect();}catch(e){}},1200);
    });
  },
  blip(f,dur,vol){
    if(!this.ctx) return; const ctx=this.ctx,t=ctx.currentTime;
    const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
    const g=ctx.createGain(); g.gain.value=0; o.connect(g); g.connect(this.sfxG);
    g.gain.linearRampToValueAtTime((vol||0.08)*state.sfx,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0002,t+(dur||0.13));
    o.start(t); o.stop(t+(dur||0.13)+0.05);
    setTimeout(()=>{try{o.disconnect();g.disconnect();}catch(e){}},900);
  },
  whoosh(kind){
    if(!this.ctx) return; const ctx=this.ctx,t=ctx.currentTime;
    const s=ctx.createBufferSource(); s.buffer=this.noiseBuf;
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.8;
    bp.frequency.setValueAtTime(kind<0?240:900,t);
    bp.frequency.exponentialRampToValueAtTime(kind<0?90:1800, t+0.55);
    const g=ctx.createGain(); s.connect(bp); bp.connect(g); g.connect(this.sfxG);
    g.gain.linearRampToValueAtTime(0.09*state.sfx,t+0.08);
    g.gain.exponentialRampToValueAtTime(0.0002,t+0.65);
    s.start(t); s.stop(t+0.8);
    setTimeout(()=>{try{s.disconnect();bp.disconnect();g.disconnect();}catch(e){}},1400);
  },
  frame(dt){
    if(!this.ctx || this.ctx.state!=='running') return;
    const w=state.windNow, wave=0.3+0.7*w;
    this.waveG.gain.setTargetAtTime(0.055*wave*state.sfx, this.ctx.currentTime, 0.4);
    this.waveLP.frequency.setTargetAtTime(520+700*w, this.ctx.currentTime, 0.6);
    this.surge.gain.setTargetAtTime(0.035*wave*state.sfx, this.ctx.currentTime, 0.9);
    this.breezeG.gain.setTargetAtTime(0.020+0.05*w*state.sfx, this.ctx.currentTime, 0.5);
    const rainT = state.rain? U.uRain.value : 0;
    this.rainG.gain.setTargetAtTime(0.05*rainT*state.sfx, this.ctx.currentTime, 0.7);
    /* raindrops: sparse jittered ticks */
    this.dropAcc=(this.dropAcc||0)+dt*(rainT*4.2+0.15);
    while(this.dropAcc>1){ this.dropAcc-=1;
      if(rainT>0.05) this.ping(76+(Math.random()*18|0), this.ctx.currentTime+Math.random()*0.2, 0.035*(rainT)); }
  },
  applyVolumes(instant){
    if(!this.ctx) return;
    const t=this.ctx.currentTime, tc=instant?0.001:0.45;
    this.master.gain.setTargetAtTime(state.muted?0:state.volume, t, tc);
    this.sfxG.gain.setTargetAtTime(state.sfx, t, 0.02);
    this.musG.gain.setTargetAtTime(state.music*0.9, t, tc);
  },
  start(){ if(!this.ctx) this.init(); if(this.ctx && this.ctx.state==='suspended') this.ctx.resume();
    this.applyVolumes(true); }
};

/* fast tube rebuild for the mooring rope (low-poly, no new geometry) */
const tubeCache=new Map();
function rebuildTube(mesh,pts,segs,radius){
  const key=mesh.uuid;
  if(!tubeCache.has(key)){
    mesh.geometry.dispose();
    mesh.geometry=new THREE.TubeGeometry(curveOf(pts),segs,radius,5,false);
    tubeCache.set(key,{segs,radius}); return; }
  const c=tubeCache.get(key);
  if(c.segs!==segs||c.radius!==radius){ mesh.geometry.dispose();
    mesh.geometry=new THREE.TubeGeometry(curveOf(pts),segs,radius,5,false);
    tubeCache.set(key,{segs,radius}); return; }
  /* update in place by rebuilding vertices along the same curve structure */
  mesh.geometry.dispose();
  mesh.geometry=new THREE.TubeGeometry(curveOf(pts),segs,radius,5,false);
}
function curveOf(pts){ return new THREE.CatmullRomCurve3(pts); }

const kPos=new THREE.Vector3(), kTan=new THREE.Vector3();

  const kayak=PIER.userData.kayak;
  const lvl=state.level;
  if(KAYAK.mode==='out'){ KAYAK.t=Math.min(1,KAYAK.t+dt*(1/46)); }
  else if(KAYAK.mode==='return'){ KAYAK.t=Math.max(0,KAYAK.t-dt*(1/34)); }
  KAYAK.trip=KAYAK.t;
  if(KAYAK.mode==='moored'){
    kayak.position.set(KAYAK.home.x, lvl-0.05, KAYAK.home.z);
    kayak.rotation.set(Math.sin(tAnim*1.1)*0.05*(0.4+state.windNow), KAYAK.homeRot+Math.sin(tAnim*0.7)*0.05,
      Math.cos(tAnim*1.3)*0.05*(0.4+state.windNow));
    PIER.userData.paddle.rotation.z=Math.sin(tAnim*0.8)*0.1;
    return;
  }
  kayakPoint(KAYAK.t, kPos); kayakPoint(clamp(KAYAK.t+0.004,0,1), kTan);
  const dx=kTan.x-kPos.x, dz=kTan.z-kPos.z;
  const head=Math.atan2(dx,dz);
  const speed=0.9+0.8*Math.sin(tAnim*1.6);
  kayak.position.set(kPos.x, lvl-0.055+Math.sin(tAnim*1.5)*0.02, kPos.z);
  kayak.rotation.set(Math.sin(tAnim*1.7)*0.045*(0.4+state.windNow), head, Math.sin(tAnim*1.2)*0.06);
  PIER.userData.paddle.rotation.set(0, Math.sin(tAnim*1.8)*0.9, Math.sin(tAnim*1.8)*0.35);
  if(!KAYAK.lastT||Math.abs(KAYAK.t-KAYAK.lastT)>0.001){
    if(rnd()<dt*6) makeRipple(kPos.x,kPos.z,0.20,0.7);
    KAYAK.lastT=KAYAK.t; }
  if(KAYAK.mode==='out'&&KAYAK.t>=1){ KAYAK.mode='return'; toast('the kayak turns for home'); }
  if(KAYAK.mode==='return'&&KAYAK.t<=0){ KAYAK.mode='moored'; toast('moored up');
    kayak.position.set(KAYAK.home.x,lvl-0.05,KAYAK.home.z); }
}

/* --- marine life ------------------------------------------------------- */
const vTmp=new THREE.Vector3(), vTmp2=new THREE.Vector3();
const rayDummy=new THREE.Object3D();
function stepLife(dt){
  if(!state.running) return;
  const L=state.level;
  /* ---- rays ---------------------------------------------------------- */
  const top=clamp(L-0.45,-1.15,-0.75), bot=Math.max(-3.75,L-3.35);
  const ySpan=Math.max(0.5,bot-top), yMid=(bot+top)/2;
  rays.seeds.forEach((s,i)=>{
    if(i===0) return;                                   // index 0 is the hero
    const a=TAU*(U.uTime.value*s.w)+s.ph2||(i*2.2);
    const ang=U.uTime.value*(s.d)+i*2.1;
    const x=s.c.x+Math.sin(ang)*s.a, z=s.c.z+Math.cos(ang*1.0+0.4)*s.b;
    const y=yMid+ySpan*0.42*Math.sin(U.uTime.value*0.5+i*2.4);
    rays.setMatrixAt(i, matrixA(vTmp.set(x,y,z), vTmp2.set(
        Math.cos(ang)*s.a, 0, -Math.sin(ang*1.0+0.4)*s.b ), rays.scArr? rays.scArr[i]:0.9+i*0.12));
    const c=new THREE.Color(); c.copy(rays.cols[i]);
  });
  if(!rays.scArr){ rays.scArr=[1.35,1.10,0.92]; rays.cols=[
      new THREE.Color(0x1b2b3a),new THREE.Color(0x22303f),new THREE.Color(0x172530)]; }
  rays.seeds.forEach((s,i)=>{ if(i===0) return;
    const ang=U.uTime.value*(s.w)+i*2.1;
    const x=s.c.x+Math.sin(ang)*s.a, z=s.c.z+Math.cos(ang*1.0+0.4)*s.b;
    const y=yMid+ySpan*0.42*Math.sin(U.uTime.value*0.5+i*2.4);
    const tgt=vTmp.set(x,y,z), tan=vTmp2.set(Math.cos(ang)*s.a,0,-Math.sin(ang*1.0+0.4)*s.b);
    rays.mesh.setMatrixAt(i, matFor(tgt,tan,rays.scArr[i])); });
  /* hero ---------------------------------------------------------------- */
  const h=HERO;
  if(h.state==='swim'){
    const s=h.seed, ang=U.uTime.value*s.w+s.ph;
    const x=s.c.x+Math.sin(ang)*s.a, z=s.c.z+Math.cos(ang*1.0+0.3)*s.b;
    const y=yMid+ySpan*0.45*Math.sin(U.uTime.value*0.45+1.1);
    h.prev.copy(h.pos); h.pos.set(x,y,z);
    h.pos.x=clamp(h.pos.x,-7.5,-0.6); h.pos.z=clamp(h.pos.z,1.4,8.9);
    h.yawA=Math.atan2(h.pos.z-(h.prevV?h.prevV.z:h.pos.z), h.pos.x-(h.prevV?h.prevV.x:h.pos.x));
    if(!h.prevV){ h.prevV=h.pos.clone(); } else {
      const d=vTmp.copy(h.pos).sub(h.prevV); if(d.lengthSq()>1e-5){
        h.yawA=Math.atan2(d.z,d.x); h.prevV.copy(h.pos); } }
    /* the hero also keeps the shared ray instance list honest */
    rays.mesh.setMatrixAt(0, matFor(vTmp.set(-30,y,-30), vTmp2.set(1,0,0),0.001));
    h.mesh.visible=false;
  } else if(h.state==='flight'){
    h.t+=dt; const T=h.t;
    if(!rays.mesh.visible){}
    h.mesh.visible=true;
    if(T<h.T){
      const k=T/h.T;
      h.pos.set( h.from.x + (h.to.x-h.from.x)*k,
                 lerp(h.from.y,h.from.y+0.5,1) + h.v0*0 + (h.vy*T - 0.5*8.4*T*T),
                 h.from.z + (h.to.z-h.from.z)*k );
      h.pos.y = h.from.y + h.vy*T - 0.5*8.4*T*T;
      h.pitch = -Math.atan2(h.vy-8.4*T, h.vh);
      h.roll = 0;
      const spd = h.pos.y;
      h.q.setFromEuler(new THREE.Euler(0, Math.atan2(-h.nz,-h.nx), 0));
      h.mesh.rotation.set(h.pitch, Math.atan2(-h.nz,-h.nx), Math.sin(k*3.0)*0.12);
      h.mesh.position.copy(h.pos); h.mesh.position.y+=0;
      h.mesh.scale.setScalar(h.sc||1.18);
      if(T>h.T*0.5 && rnd()<dt*4) makeRipple(h.pos.x,h.pos.z,0.16,0.6);
      h.state='flight';
    } else {
      h.state='diving'; h.t=0; h.pos.y=L+0.02;
      audio.splash(1.1); makeRipple(h.to.x,h.to.z,1.0,1.2);
      for(let i=0;i<30;i++) shootDrop(vTmp.set(h.to.x,L,h.to.z),1.6+rnd()*2.6);
    }
  } else if(h.state==='diving'){
    h.t+=dt; const k=Math.min(1,h.t/1.35);
    const y0=L+0.05, y1=yMid+ySpan*0.30*Math.sin(U.uTime.value*0.45+1.1);
    h.pos.set(lerp(h.to.x,h.to.x,easeIO(k)), lerp(y0,y1,easeIO(k)), lerp(h.to.z,h.to.z,easeIO(k)));
    h.mesh.visible=true; h.mesh.position.copy(h.pos);
    h.mesh.rotation.set(lerp(0.9,-0.05,easeIO(k)), Math.atan2(-h.nz,-h.nx), 0);
    h.mesh.scale.setScalar(1.18);
    if(k>=1){ h.state='swim'; h.mesh.visible=false; h.t=0; h.pos.y=yMid; }
  } else h.mesh.visible=false;

  /* ---- bubbles -------------------------------------------------------- */
  const d=new THREE.Object3D(); const n=BUBBLE_MAX;
  for(let i=0;i<BUBBLE_MAX;i++){ const b=BUB[i];
    b.life+=dt*(0.3+rnd()*0.1);
    if(b.life>1.0){ b.life=-rnd()*0.9; const src=BUBBLE_SRC[(rnd()*BUBBLE_SRC.length)|0];
      b.x=src.x+(rnd()-0.5)*0.55; b.z=src.z+(rnd()-0.5)*0.55; b.y=clamp(islandH(b.x,b.z)+0.15,-4.0,-1.0);
      b.r=0.016+rnd()*0.036; b.vy=0.20+rnd()*0.30; }
    if(b.life<0){ d.scale.setScalar(0.0001); d.position.set(0,-99,0); }
    else { const y=b.y+b.life*(L-b.y+0.12);
      if(y>L-0.05) b.life=1.2;
      const wob=Math.sin(tAnim*4.0+b.seed)*0.05*b.life;
      d.position.set(b.x+wob, y, b.z+wob*0.6); d.scale.setScalar(b.r*(0.5+0.5*b.life));
      d.rotation.set(0,0,0); }
    d.updateMatrix(); bubbles.setMatrixAt(i,d.matrix); }
  bubbles.instanceMatrix.needsUpdate=true;
  /* ---- anemone sway / kelp follows wind: handled by the shader --------- */
  /* ---- ripples -------------------------------------------------------- */
  U.uRipple.value.x = U.uRipple.value.x; U.uRipple.value.w = Math.max(0,U.uRipple.value.w-dt*0.75);
  U.uRipple.value.z += dt*2.2;
  RINGS.forEach((r,i)=>{
    if(r.t<2.4){ r.t+=dt*r.s;
      const k=clamp(r.t/1.85,0,1);
      const rad=0.2+9.0*Math.pow(k,0.62);
      r.m.position.set(r.x,state.level+0.015,r.z);
      r.m.scale.setScalar(rad);
      r.m.material.opacity=Math.pow(1-k,1.7)*0.95*r.p;
      r.m.visible=true;
      if(r.t>1.6&&k<0.4){ makeRipple(r.x,r.z,r.p*0.4,1); }
    } else { r.m.visible=false; }
  });
  /* ---- droplets ------------------------------------------------------- */
  const dm=new THREE.Object3D();
  for(let i=0;i<DROPS;i++){ const p=DROP[i];
    if(p.t<2.2){ p.t+=dt; p.v.y-=9.4*dt; p.p.addScaledVector(p.v,dt);
      const s=clamp(1-p.t*0.3,0.2,1);
      dm.position.copy(p.p); dm.scale.set(s,s*(1+Math.min(Math.abs(p.v.y)*0.05,0.9)),s);
      dm.scale.y=clamp(1+Math.abs(p.v.y)*0.04,1,2.4)*s;
      if(p.p.y<state.level){ p.t=99; if(rnd()<0.35) makeRipple(p.p.x,p.p.z,0.10,1.0); }
    } else { dm.position.set(0,-99,0); dm.scale.setScalar(0.0001); }
    dm.updateMatrix(); drops.setMatrixAt(i,dm.matrix); }
  drops.instanceMatrix.needsUpdate=true;
}
/* build a look-along matrix: target, tangent, scale */
const _m=new THREE.Matrix4(), _mtx=new THREE.Matrix4(), _pos=new THREE.Vector3(), _q=new THREE.Quaternion();
const _f=new THREE.Vector3(), _r=new THREE.Vector3(), _u=new THREE.Vector3();
function matFor(target, tan, scale){
  _f.copy(tan); if(_f.lengthSq()<1e-8) _f.set(1,0,0); _f.normalize();
  _f.y*=0.4; _f.normalize();
  _r.crossVectors(new THREE.Vector3(0,1,0),_f);
  if(_r.lengthSq()<1e-6) _r.set(1,0,0); _r.normalize();
  _u.crossVectors(_f,_r);
  _m.makeBasis(_r,_u,_f); _m.scale(new THREE.Vector3(scale,scale,scale));
  _m.setPosition(target.x,target.y,target.z);
  return _m;
}

function onResize(){
  renderer.setPixelRatio(Math.min(devicePixelRatio||1, QUALITY[state.quality].dpr));
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect=innerWidth/Math.max(1,innerHeight); camera.updateProjectionMatrix();
  invalidateShadow();
}

/* --- keyboard ---------------------------------------------------------- */
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  const k=e.key.toLowerCase();
  if(k===' '){ e.preventDefault(); setPaused(!state.paused); }
  else if(k==='1') { state.camUser=false; setCamera('iso'); }
  else if(k==='2') { state.camUser=false; setCamera('nest'); }
  else if(k==='3') { state.camUser=false; setCamera('deep'); }
  else if(k==='4') { state.camUser=false; setCamera('wander'); }
  else if(k==='j') rayJump();
  else if(k==='k') toggleKayak();
  else if(k==='r') resetWorld();
  else if(k==='m') setMuted(!state.muted);
  else if(k==='p') { ui.orb.checked=!ui.orb.checked; setOrbit(ui.orb.checked); }
  else if(k==='['||k===']'){ state.tideTarget=clamp(state.tideTarget+(k==='['?-0.12:0.12),-1,1);
    ui.tide.value=state.tideTarget; setFill(ui.tide);
    $('vTide').textContent=tideToLevel(state.tideTarget).toFixed(2)+' m'; }
  else if(k==='t'){ const o=['day','sunset','night']; setTime(o[(o.indexOf(state.timeA)+1)%3]); }
  document.getElementById('hint').classList.add('gone');
});
/* audio needs a gesture */
