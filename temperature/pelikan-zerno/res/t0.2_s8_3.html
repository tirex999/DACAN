<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pelican Riding a Bicycle</title>
  <style>
    :root {
      color-scheme: light;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      width: min(960px, 100%);
      background: #f8fafc;
      border-radius: 28px;
      padding: 20px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
      color: #0f172a;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 20px;
      background: #e0f2fe;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: #0f766e;
      color: white;
      box-shadow: 0 8px 18px rgba(15, 118, 110, 0.25);
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:active {
      transform: translateY(1px);
    }

    button.secondary {
      background: #334155;
      box-shadow: 0 8px 18px rgba(51, 65, 85, 0.22);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Pelican Riding a Bicycle</h1>

    <svg id="scene" viewBox="0 0 800 600" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
      <title id="title">A pelican riding a bicycle</title>
      <desc id="desc">A cartoon pelican with a large orange beak rides a teal bicycle across a grassy field.</desc>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#bae6fd" />
          <stop offset="1" stop-color="#e0f2fe" />
        </linearGradient>

        <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4ade80" />
          <stop offset="1" stop-color="#16a34a" />
        </linearGradient>
      </defs>

      <rect width="800" height="600" fill="url(#sky)" />

      <circle cx="680" cy="95" r="48" fill="#fde047" opacity=".95" />

      <g fill="#ffffff" opacity=".92">
        <ellipse cx="150" cy="110" rx="48" ry="26" />
        <ellipse cx="195" cy="100" rx="36" ry="22" />
        <ellipse cx="115" cy="100" rx="30" ry="18" />
      </g>

      <g id="motionLines" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" opacity=".65">
        <animateTransform
          attributeName="transform"
          type="translate"
          values="0 0; -35 0; 0 0"
          dur="0.8s"
          repeatCount="indefinite"
          data-base-dur="0.8"
        />
        <path d="M120 250 L190 250" />
        <path d="M80 300 L170 300" />
        <path d="M100 350 L180 350" />
        <path d="M130 400 L200 400" />
      </g>

      <path d="M0 520 Q400 490 800 520 L800 600 L0 600 Z" fill="url(#grass)" />
      <path d="M0 520 Q400 490 800 520" fill="none" stroke="#15803d" stroke-width="6" />

      <ellipse cx="400" cy="525" rx="260" ry="18" fill="#000000" opacity=".12" />

      <g id="bikeBird">
        <animateTransform
          attributeName="transform"
          type="translate"
          values="0 0; 0 -6; 0 0"
          dur="0.6s"
          repeatCount="indefinite"
          data-base-dur="0.6"
        />

        <g id="bike">
          <g id="rearWheel">
            <animateTransform
              attributeName="transform"
              type="rotate"
              from="0 250 450"
              to="360 250 450"
              dur="1.2s"
              repeatCount="indefinite"
              data-base-dur="1.2"
            />

            <circle cx="250" cy="450" r="75" fill="none" stroke="#111827" stroke-width="14" />
            <circle cx="250" cy="450" r="62" fill="none" stroke="#94a3b8" stroke-width="4" />

            <g stroke="#cbd5e1" stroke-width="3">
              <line x1="250" y1="450" x2="250" y2="375" />
              <line x1="250" y1="450" x2="303" y2="397" />
              <line x1="250" y1="450" x2="325" y2="450" />
              <line x1="250" y1="450" x2="303" y2="503" />
              <line x1="250" y1="450" x2="250" y2="525" />
              <line x1="250" y1="450" x2="197" y2="503" />
              <line x1="250" y1="450" x2="175" y2="450" />
              <line x1="250" y1="450" x2="197" y2="397" />
            </g>

            <circle cx="250" cy="450" r="10" fill="#111827" />
          </g>

          <g id="frontWheel">
            <animateTransform
              attributeName="transform"
              type="rotate"
              from="0 550 450"
              to="360 550 450"
              dur="1.2s"
              repeatCount="indefinite"
              data-base-dur="1.2"
            />

            <circle cx="550" cy="450" r="75" fill="none" stroke="#111827" stroke-width="14" />
            <circle cx="550" cy="450" r="62" fill="none" stroke="#94a3b8" stroke-width="4" />

            <g stroke="#cbd5e1" stroke-width="3">
              <line x1="550" y1="450" x2="550" y2="375" />
              <line x1="550" y1="450" x2="603" y2="397" />
              <line x1="550" y1="450" x2="625" y2="450" />
              <line x1="550" y1="450" x2="603" y2="503" />
              <line x1="550" y1="450" x2="550" y2="525" />
              <line x1="550" y1="450" x2="497" y2="503" />
              <line x1="550" y1="450" x2="475" y2="450" />
              <line x1="550" y1="450" x2="497" y2="397" />
            </g>

            <circle cx="550" cy="450" r="10" fill="#111827" />
          </g>

          <path d="M250 438 L390 408" stroke="#475569" stroke-width="5" stroke-linecap="round" />
          <path d="M250 462 L390 452" stroke="#475569" stroke-width="5" stroke-linecap="round" />

          <circle cx="250" cy="450" r="12" fill="#334155" stroke="#1e293b" stroke-width="3" />
          <circle cx="390" cy="430" r="22" fill="#334155" stroke="#1e293b" stroke-width="3" />

          <g id="frame" fill="none" stroke="#0f766e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
            <path d="M250 450 L390 430 L345 320 Z" />
            <path d="M390 430 L495 360 L505 315" />
            <path d="M345 320 L505 315" />
            <path d="M505 315 L550 450" />
          </g>

          <path d="M345 320 L345 300" stroke="#0f766e" stroke-width="8" stroke-linecap="round" />
          <path d="M318 300 Q345 286 372 300 Q345 312 318 300 Z" fill="#111827" />

          <path d="M505 315 L520 290" stroke="#111827" stroke-width="8" stroke-linecap="round" />
          <circle cx="520" cy="290" r="7" fill="#111827" />

          <g id="crank">
            <line x1="390" y1="430" x2="350" y2="460" stroke="#111827" stroke-width="8" stroke-linecap="round" />
            <rect x="335" y="455" width="30" height="10" rx="4" fill="#111827" />

            <line x1="390" y1="430" x2="430" y2="400" stroke="#111827" stroke-width="8" stroke-linecap="round" />
            <rect x="415" y="395" width="30" height="10" rx="4" fill="#111827" />
          </g>
        </g>

        <g id="pelican">
          <animateTransform
            attributeName="transform"
            type="translate"
            values="0 0; 0 -4; 0 0"
            dur="0.6s"
            repeatCount="indefinite"
            data-base-dur="0.6"
          />

          <!-- Legs -->
          <path d="M330 315 C320 360 330 420 350 455" fill="none" stroke="#f97316" stroke-width="16" stroke-linecap="round" />
          <path d="M370 315 C385 345 405 370 430 395" fill="none" stroke="#fb923c" stroke-width="16" stroke-linecap="round" />

          <!-- Webbed feet -->
          <path d="M332 455 L368 455 L350 472 Z" fill="#f97316" stroke="#ea580c" stroke-width="2" />
          <path d="M412 395 L448 395 L430 412 Z" fill="#fb923c" stroke="#ea580c" stroke-width="2" />

          <!-- Tail -->
          <path d="M260 250 C225 230 195 235 180 255 C210 260 235 272 258 288 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3" />

          <!-- Body -->
          <ellipse cx="350" cy="260" rx="95" ry="70" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />

          <!-- Body wing -->
          <path d="M290 240 C325 215 380 225 405 255 C370 285 315 285 290 265 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="3" />

          <!-- Arm wing reaching handlebar -->
          <path d="M365 230 C415 215 470 250 515 282 L528 298 C470 288 415 268 368 262 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" />
          <path d="M385 238 C425 238 465 260 505 285" fill="none" stroke="#cbd5e1" stroke-width="2" />
          <path d="M380 250 C420 250 455 268 495 290" fill="none" stroke="#cbd5e1" stroke-width="2" />

          <!-- Neck -->
          <path d="M395 245 C415 215 425 195 445 185" fill="none" stroke="#ffffff" stroke-width="52" stroke-linecap="round" />

          <!-- Head -->
          <circle cx="450" cy="185" r="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />

          <!-- Small crest -->
          <path d="M425 152 Q440 132 460 150" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />

          <!-- Beak -->
          <path d="M468 172 L585 192 L578 204 L468 196 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2" stroke-linejoin="round" />
          <path d="M468 196 C500 260 545 250 578 204 C545 225 500 225 468 208 Z" fill="#fb923c" stroke="#ea580c" stroke-width="2" stroke-linejoin="round" />

          <!-- Nostril -->
          <path d="M478 182 L492 185" stroke="#d97706" stroke-width="2" stroke-linecap="round" />

          <!-- Eye -->
          <circle cx="445" cy="175" r="6" fill="#0f172a" />
          <circle cx="447" cy="173" r="2" fill="#ffffff" />
        </g>
      </g>
    </svg>

    <div class="controls">
      <button id="playPause" type="button" aria-pressed="false">Pause</button>
      <button class="secondary" type="button" data-speed="0.5">Slow</button>
      <button class="secondary" type="button" data-speed="1">Normal</button>
      <button class="secondary" type="button" data-speed="2">Fast</button>
    </div>
  </main>

  <script>
    const svg = document.getElementById("scene");
    const playPauseBtn = document.getElementById("playPause");
    const animations = Array.from(svg.querySelectorAll("animateTransform"));

    animations.forEach((a) => {
      const dur = a.getAttribute("dur");
      if (dur) a.dataset.baseDur = parseFloat(dur);
    });

    let paused = false;

    function setPaused(value) {
      paused = value;

      if (typeof svg.pauseAnimations === "function") {
        if (paused) {
          svg.pauseAnimations();
        } else {
          svg.unpauseAnimations();
        }
      }

      playPauseBtn.textContent = paused ? "Play" : "Pause";
      playPauseBtn.setAttribute("aria-pressed", String(paused));
    }

    function setSpeed(speed) {
      animations.forEach((a) => {
        const base = parseFloat(a.dataset.baseDur);
        if (Number.isFinite(base)) {
          a.setAttribute("dur", (base / speed).toFixed(3) + "s");
        }
      });

      if (typeof svg.setCurrentTime === "function") {
        svg.setCurrentTime(0);
      }

      if (paused && typeof svg.pauseAnimations === "function") {
        svg.pauseAnimations();
      }
    }

    playPauseBtn.addEventListener("click", () => setPaused(!paused));

    document.querySelectorAll("[data-speed]").forEach((btn) => {
      btn.addEventListener("click", () => setSpeed(parseFloat(btn.dataset.speed)));
    });

    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    if (reducedMotion.matches) {
      setPaused(true);
    }

    reducedMotion.addEventListener("change", (event) => setPaused(event.matches));
  </script>
</body>
</html>
