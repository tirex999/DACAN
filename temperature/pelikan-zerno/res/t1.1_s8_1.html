<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelican Riding a Bicycle</title>
  <style>
    :root {
      color-scheme: dark;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, #223b54, #0b1118 70%);
      padding: 24px;
      box-sizing: border-box;
    }

    .wrap {
      width: min(96vw, 1100px);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 22px;
      background: linear-gradient(180deg, #7ec8ff, #eefaff 64%, #bde3ff);
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.38),
        inset 0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    .caption {
      margin-top: 12px;
      text-align: center;
      color: rgba(255, 255, 255, 0.66);
      font-size: clamp(12px, 1.5vw, 15px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <svg id="scene" viewBox="0 0 800 600" role="img" aria-labelledby="svgTitle svgDesc" xmlns="http://www.w3.org/2000/svg">
      <title id="svgTitle">Pelican Riding a Bicycle</title>
      <desc id="svgDesc">A cartoon pelican with a large orange pouch pedals a red bicycle along a road under a sunny sky.</desc>

      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#78c8ff" />
          <stop offset="0.62" stop-color="#d6f2ff" />
          <stop offset="1" stop-color="#f8ffff" />
        </linearGradient>

        <radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#fff89a" />
          <stop offset="0.72" stop-color="#ffd447" />
          <stop offset="1" stop-color="#ffb300" />
        </radialGradient>

        <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffffff" />
          <stop offset="0.62" stop-color="#f1f6fb" />
          <stop offset="1" stop-color="#cfdce8" />
        </linearGradient>

        <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#f19d24" />
          <stop offset="1" stop-color="#f9c84b" />
        </linearGradient>

        <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd466" />
          <stop offset="1" stop-color="#eb9d1f" />
        </linearGradient>

        <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#d1a77b" />
          <stop offset="1" stop-color="#86583a" />
        </linearGradient>

        <linearGradient id="hillGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#91d27f" />
          <stop offset="1" stop-color="#5c9a54" />
        </linearGradient>

        <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ff6f52" />
          <stop offset="1" stop-color="#c7371f" />
        </linearGradient>

        <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f3f6fa" />
          <stop offset="0.55" stop-color="#9fa9b3" />
          <stop offset="1" stop-color="#5d6772" />
        </linearGradient>
      </defs>

      <!-- Sky -->
      <rect x="0" y="0" width="800" height="600" fill="url(#skyGrad)" />

      <!-- Sun -->
      <g>
        <circle cx="716" cy="82" r="47" fill="url(#sunGrad)" opacity="0.95" />
        <g id="sunRays" stroke="#ffd54a" stroke-linecap="round" stroke-width="7" opacity="0.58">
          <animateTransform attributeName="transform" type="rotate" values="0 716 82;360 716 82" dur="40s" repeatCount="indefinite" />
          <line x1="716" y1="18" x2="716" y2="0" />
          <line x1="716" y1="146" x2="716" y2="164" />
          <line x1="652" y1="82" x2="634" y2="82" />
          <line x1="780" y1="82" x2="798" y2="82" />
          <line x1="671" y1="37" x2="658" y2="24" />
          <line x1="761" y1="127" x2="774" y2="140" />
          <line x1="671" y1="127" x2="658" y2="140" />
          <line x1="761" y1="37" x2="774" y2="24" />
        </g>
      </g>

      <!-- Clouds -->
      <g fill="#ffffff" opacity="0.9">
        <g>
          <animateTransform attributeName="transform" type="translate" values="-220 0;920 0" dur="34s" repeatCount="indefinite" />
          <ellipse cx="140" cy="100" rx="42" ry="28" />
          <ellipse cx="178" cy="92" rx="34" ry="25" />
          <ellipse cx="198" cy="108" rx="28" ry="20" />
        </g>
      </g>

      <g fill="#ffffff" opacity="0.78">
        <g>
          <animateTransform attributeName="transform" type="translate" values="-380 140;980 140" dur="48s" repeatCount="indefinite" />
          <ellipse cx="250" cy="90" rx="48" ry="30" />
          <ellipse cx="290" cy="80" rx="34" ry="24" />
          <ellipse cx="316" cy="100" rx="30" ry="22" />
        </g>
      </g>

      <!-- Distant hills -->
      <path d="M0 470 C120 408 218 452 320 432 C422 412 545 468 800 420 L800 470 Z" fill="url(#hillGrad)" />
      <path d="M0 470 C165 424 270 488 420 448 C570 408 690 472 800 434 L800 470 Z" fill="#62a459" opacity="0.85" />

      <!-- Ground -->
      <rect x="0" y="470" width="800" height="130" fill="url(#roadGrad)" />
      <line x1="0" y1="470" x2="800" y2="470" stroke="#755437" stroke-width="8" />
      <line x1="30" y1="526" x2="770" y2="526" stroke="#ffffff" stroke-opacity="0.72" stroke-width="7" stroke-dasharray="44 34" stroke-linecap="round" />

      <!-- Small motion marks on road -->
      <g stroke="#7b5537" stroke-width="5" stroke-linecap="round" opacity="0.35">
        <line x1="120" y1="500" x2="170" y2="500" />
        <line x1="90" y1="512" x2="138" y2="512" />
        <line x1="650" y1="540" x2="725" y2="540" />
        <line x1="620" y1="552" x2="688" y2="552" />
      </g>

      <!-- Wheel shadows -->
      <ellipse cx="250" cy="471" rx="72" ry="11" fill="#3b291d" opacity="0.18" />
      <ellipse cx="560" cy="471" rx="72" ry="11" fill="#3b291d" opacity="0.18" />
      <ellipse cx="400" cy="473" rx="115" ry="12" fill="#3b291d" opacity="0.12" />

      <!-- Rear wheel -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 250 403;360 250 403" dur="1.7s" repeatCount="indefinite" />
        <circle cx="250" cy="403" r="62" fill="none" stroke="#1f1f1f" stroke-width="15" />
        <circle cx="250" cy="403" r="52" fill="none" stroke="url(#rimGrad)" stroke-width="7" />
        <g stroke="#cfd7de" stroke-width="4" opacity="0.95">
          <line x1="298" y1="403" x2="202" y2="403" />
          <line x1="283.94" y1="369.06" x2="216.06" y2="436.94" />
          <line x1="250" y1="355" x2="250" y2="451" />
          <line x1="216.06" y1="369.06" x2="283.94" y2="436.94" />
        </g>
        <circle cx="250" cy="403" r="8" fill="#555d65" />
        <circle cx="250" cy="403" r="3" fill="#c7ced6" />
      </g>

      <!-- Front wheel -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 560 403;360 560 403" dur="1.7s" repeatCount="indefinite" />
        <circle cx="560" cy="403" r="62" fill="none" stroke="#1f1f1f" stroke-width="15" />
        <circle cx="560" cy="403" r="52" fill="none" stroke="url(#rimGrad)" stroke-width="7" />
        <g stroke="#cfd7de" stroke-width="4" opacity="0.95">
          <line x1="608" y1="403" x2="512" y2="403" />
          <line x1="593.94" y1="369.06" x2="526.06" y2="436.94" />
          <line x1="560" y1="355" x2="560" y2="451" />
          <line x1="526.06" y1="369.06" x2="593.94" y2="436.94" />
        </g>
        <circle cx="560" cy="403" r="8" fill="#555d65" />
        <circle cx="560" cy="403" r="3" fill="#c7ced6" />
      </g>

      <!-- Rear sprocket and chain -->
      <circle cx="250" cy="403" r="12" fill="#8f99a3" stroke="#555d65" stroke-width="3" />
      <path d="M372 360 L242 389 M372 366 L242 417"
            fill="none" stroke="#444b52" stroke-width="7" stroke-dasharray="10 8" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="0.65s" repeatCount="indefinite" />
      </path>

      <!-- Bicycle frame -->
      <g fill="none" stroke="url(#frameGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
        <path d="M250 403 L400 363 L350 243 Z" />
        <path d="M350 243 L505 238" />
        <path d="M400 363 L516 240" />
        <path d="M505 238 L497 276" />
        <path d="M497 276 L560 403" />
        <path d="M505 238 L478 224" />
      </g>

      <!-- Seat post and seat -->
      <path d="M350 243 L348 226" stroke="#8c939a" stroke-width="7" stroke-linecap="round" />
      <ellipse cx="348" cy="221" rx="31" ry="9" fill="#5b3622" transform="rotate(-5 348 221)" />

      <!-- Handlebar -->
      <path d="M446 230 Q462 216 478 224 Q502 234 528 220"
            fill="none" stroke="#1f1f1f" stroke-width="8" stroke-linecap="round" />

      <!-- Crank and pedals -->
      <circle cx="400" cy="363" r="28" fill="#68727c" stroke="#9fa9b3" stroke-width="4" />
      <circle cx="400" cy="363" r="7" fill="#2b2f33" />
      <g stroke="#4b525a" stroke-width="9" stroke-linecap="round">
        <line x1="400" y1="363" x2="370" y2="333" />
        <line x1="400" y1="363" x2="430" y2="393" />
      </g>
      <rect x="356" y="329" width="28" height="9" rx="4" fill="#22282d" transform="rotate(28 370 333)" />
      <rect x="416" y="389" width="28" height="9" rx="4" fill="#22282d" transform="rotate(28 430 393)" />

      <!-- Pelican legs and webbed feet -->
      <g>
        <!-- Far leg -->
        <path d="M304 255 C308 320 360 365 426 391" fill="none" stroke="#e97b19" stroke-width="9" stroke-linecap="round" />
        <path d="M418 387 L454 402 L422 406 Z" fill="#e97b19" />

        <!-- Near leg -->
        <path d="M330 248 C334 286 352 311 365 331" fill="none" stroke="#ff9f2d" stroke-width="12" stroke-linecap="round" />
        <path d="M359 329 L397 343 L363 348 Z" fill="#ff9f2d" />
      </g>

      <!-- Pelican -->
      <g id="pelican">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.9s" repeatCount="indefinite" />

        <!-- Tail -->
        <path d="M225 185 Q178 156 182 208 Q220 237 258 203 Z"
              fill="#f4f7fb" stroke="#c5d2de" stroke-width="3" stroke-linejoin="round" />

        <!-- Body -->
        <ellipse cx="315" cy="195" rx="86" ry="72" fill="url(#bodyGrad)" stroke="#c5d2de" stroke-width="3" />

        <!-- Wing -->
        <g id="wing">
          <animateTransform attributeName="transform" type="rotate" values="0 252 182;-10 252 182;0 252 182" dur="0.75s" repeatCount="indefinite" />
          <path d="M248 176 Q315 132 390 186 Q336 248 256 210 Z"
                fill="#dbe6f1" stroke="#a9bccd" stroke-width="3" stroke-linejoin="round" />
          <path d="M275 172 Q330 154 368 182" fill="none" stroke="#a9bccd" stroke-width="3" stroke-linecap="round" />
        </g>

        <!-- Neck -->
        <path d="M360 150 Q366 98 437 91 Q477 88 524 100 L521 134 Q468 125 434 133 Q397 145 390 207 Q384 222 372 216 Z"
              fill="url(#bodyGrad)" stroke="#c5d2de" stroke-width="3" stroke-linejoin="round" />

        <!-- Head -->
        <ellipse cx="524" cy="112" rx="36" ry="29" fill="#f8fbff" stroke="#c5d2de" stroke-width="3" />

        <!-- Head crest feather -->
        <path d="M503 88 Q507 70 523 74 Q535 77 533 90 Z" fill="#e9f2fa" stroke="#c5d2de" stroke-width="2" />

        <!-- Eye -->
        <circle cx="526" cy="106" r="9" fill="#ffffff" stroke="#98abbf" stroke-width="2" />
        <circle cx="527" cy="105" r="4" fill="#1f2430" />
        <circle cx="529" cy="103" r="1.6" fill="#ffffff" />

        <!-- Upper beak -->
        <polygon points="545,101 668,89 672,102 545,120" fill="url(#beakGrad)" stroke="#d78c18" stroke-width="2" stroke-linejoin="round" />

        <!-- Lower pouch -->
        <path d="M545 111 L664 98 C650 162 590 186 544 133 Z"
              fill="url(#pouchGrad)" stroke="#d78c18" stroke-width="3" stroke-linejoin="round" />

        <!-- Pouch lines -->
        <g fill="none" stroke="#c77915" stroke-width="3" stroke-linecap="round" opacity="0.75">
          <path d="M561 128 C595 158 630 145 655 108" />
          <path d="M575 145 C602 164 624 156 640 132" />
        </g>

        <!-- Beak nostril hint -->
        <line x1="570" y1="101" x2="628" y2="96" stroke="#b86d11" stroke-width="2" stroke-linecap="round" opacity="0.55" />
      </g>

      <!-- Small club sign -->
      <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="700">
        <text x="46" y="50" font-size="24" fill="#ffffff" opacity="0.75" letter-spacing="1.5">PELICAN CYCLING CLUB</text>
        <text x="48" y="74" font-size="14" fill="#123452" opacity="0.38" letter-spacing="1.5">SCENIC COASTAL RIDE</text>
      </g>
    </svg>

    <p class="caption">Open this HTML file directly in a browser</p>
  </main>

  <script>
    const svg = document.getElementById("scene");

    // Pause animations when the browser tab is hidden.
    document.addEventListener("visibilitychange", () => {
      if (svg && typeof svg.pauseAnimations === "function" && typeof svg.unpauseAnimations === "function") {
        if (document.hidden) {
          svg.pauseAnimations();
        } else {
          svg.unpauseAnimations();
        }
      }
    });
  </script>
</body>
</html>
