<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelican Riding a Bicycle</title>
  <style>
    :root {
      --wheel-speed: 1.4s;
      --road-speed: .75s;
      --cloud-speed: 28s;
      --bob-speed: 1.35s;
      --chain-speed: 1.1s;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top, #ffffff 0%, #e7f3ff 38%, #d8e9ff 100%);
      color: #1d3557;
    }

    main {
      width: min(1080px, 100%);
      display: grid;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 3.2vw, 2.3rem);
      line-height: 1.05;
      letter-spacing: -.02em;
    }

    p.sub {
      margin: 0;
      color: #345;
      font-size: .98rem;
    }

    .stage {
      background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.7));
      border: 1px solid rgba(29,53,87,.12);
      border-radius: 28px;
      padding: 12px;
      box-shadow:
        0 22px 60px rgba(13, 45, 80, .14),
        inset 0 1px 0 rgba(255,255,255,.7);
      overflow: hidden;
    }

    svg#scene {
      display: block;
      width: 100%;
      height: auto;
      cursor: pointer;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border-radius: 18px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(29,53,87,.12);
      box-shadow: 0 10px 28px rgba(13,45,80,.08);
    }

    .ctl {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 650;
      color: #1d3557;
    }

    .ctl span { min-width: 52px; }

    .ctl output {
      width: 42px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 180px;
      accent-color: #0077b6;
      cursor: pointer;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 750;
      color: white;
      background: #1d3557;
      box-shadow: 0 8px 18px rgba(13,45,80,.16);
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease, background .15s ease;
    }

    button:hover { transform: translateY(-1px); filter: brightness(1.12); }
    button:active { transform: translateY(0); }
    button[aria-pressed="true"] { background: #0077b6; }
    .pink { background: #ef476f; }
    .pink[aria-pressed="true"] { background: #c9184a; }
    .teal { background: #06a77d; }

    .hidden { display: none !important; }

    .anim {
      animation-play-state: running;
    }

    .root.paused .anim,
    .root.paused .wheel {
      animation-play-state: paused !important;
    }

    .wheel {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin var(--wheel-speed) linear infinite;
    }

    .rays {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin calc(var(--wheel-speed) * 3.2) linear infinite;
    }

    .roadLine {
      animation: roadScroll var(--road-speed) linear infinite;
    }

    .chain {
      animation: chainScroll var(--chain-speed) linear infinite;
    }

    .cloud {
      transform-box: fill-box;
      transform-origin: center;
      animation: floatCloud var(--cloud-speed) ease-in-out infinite;
    }

    #bikeGroup {
      transform-box: fill-box;
      transform-origin: 50% 85%;
      animation: bob var(--bob-speed) ease-in-out infinite;
    }

    .bubble {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: 58% 18%;
      transform: scale(.2) translateY(18px);
      transition: opacity .18s ease, transform .22s cubic-bezier(.2, 1.35, .4, 1);
      pointer-events: none;
    }

    #honk.show {
      opacity: 1;
      transform: scale(1) translateY(0);
      animation: pop .62s ease-out;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes roadScroll {
      to { stroke-dashoffset: -360; }
    }

    @keyframes chainScroll {
      to { stroke-dashoffset: -180; }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(.28deg); }
    }

    @keyframes floatCloud {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(18px, -6px); }
    }

    @keyframes pop {
      0% { transform: scale(.35) translateY(24px); }
      60% { transform: scale(1.12) translateY(-3px); }
      100% { transform: scale(1) translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (max-width: 560px) {
      input[type="range"] { width: 130px; }
      button { padding: 9px 11px; font-size: .94rem; }
    }
  </style>
</head>

  <script>
    (() => {
      const root = document.getElementById('root');
      const scene = document.getElementById('scene');

      const speedInput = document.getElementById('speed');
      const speedValue = document.getElementById('speedValue');

      const playPauseBtn = document.getElementById('playPause');
      const helmetBtn = document.getElementById('helmetBtn');
      const goggleBtn = document.getElementById('goggleBtn');
      const honkBtn = document.getElementById('honkBtn');

      const helmet = document.getElementById('helmet');
      const goggles = document.getElementById('goggles');
      const honkBubble = document.getElementById('honk');

      const nearCrank = document.getElementById('nearCrank');
      const farCrank = document.getElementById('farCrank');
      const pedalNear = document.getElementById('pedalNear');
      const pedalFar = document.getElementById('pedalFar');
      const nearLeg = document.getElementById('nearLeg');
      const farLeg = document.getElementById('farLeg');
      const nearFoot = document.getElementById('nearFoot');
      const farFoot = document.getElementById('farFoot');

      const bb = { x: 425, y: 355 };
      const crankRadius = 40;
      const hips = {
        near: { x: 328, y: 236 },
        far: { x: 305, y: 232 }
      };
      const bends = {
        near: 24,
        far: -26
      };

      let angle = -Math.PI / 2.1;
      let speed = 1;
      let playing = true;
      let last = performance.now();

      function applySpeed() {
        speed = parseFloat(speedInput.value);
        speedValue.textContent = `${speed.toFixed(1)}×`;

        root.style.setProperty('--wheel-speed', `${Math.max(0.28, 1.35 / speed).toFixed(2)}s`);
        root.style.setProperty('--road-speed', `${Math.max(0.12, 0.72 / speed).toFixed(2)}s`);
        root.style.setProperty('--chain-speed', `${Math.max(0.16, 0.92 / speed).toFixed(2)}s`);
        root.style.setProperty('--cloud-speed', `${Math.max(7, 30 / speed).toFixed(1)}s`);
        root.style.setProperty('--bob-speed', `${Math.max(0.65, 1.4 / speed).toFixed(2)}s`);
      }

      function updateLeg(crankLine, pedal, legPath, foot, hip, a, bend) {
        const fx = bb.x + crankRadius * Math.cos(a);
        const fy = bb.y + crankRadius * Math.sin(a);

        crankLine.setAttribute('x2', fx.toFixed(2));
        crankLine.setAttribute('y2', fy.toFixed(2));

        pedal.setAttribute('cx', fx.toFixed(2));
        pedal.setAttribute('cy', fy.toFixed(2));

        const dx = fx - hip.x;
        const dy = fy - hip.y;
        const len = Math.hypot(dx, dy) || 1;

        const midX = (hip.x + fx) / 2;
        const midY = (hip.y + fy) / 2;

        // Perpendicular direction gives a simple knee-bend.
        const kneeX = midX - (dy / len) * bend;
        const kneeY = midY + (dx / len) * bend;

        legPath.setAttribute('d', `M ${hip.x} ${hip.y} Q ${kneeX.toFixed(2)} ${kneeY.toFixed(2)} ${fx.toFixed(2)} ${fy.toFixed(2)}`);

        // Move the webbed foot to the pedal.
        foot.setAttribute('transform', `translate(${(fx - 6).toFixed(2)} ${(fy - 6).toFixed(2)})`);
      }

      function drawCrank() {
        updateLeg(nearCrank, pedalNear, nearLeg, nearFoot, hips.near, angle, bends.near);
        updateLeg(farCrank, pedalFar, farLeg, farFoot, hips.far, angle + Math.PI, bends.far);
      }

      function frame(ts) {
        const dt = Math.min(3.5, (ts - last) / 16.667);
        last = ts;

        if (playing) {
          angle += 0.024 * speed * dt;
          if (angle > Math.PI * 6) angle -= Math.PI * 6;
          drawCrank();
        }

        requestAnimationFrame(frame);
      }

      function makeHonk() {
        honkBubble.classList.add('show');
        clearTimeout(makeHonk._t);
        makeHonk._t = setTimeout(() => honkBubble.classList.remove('show'), 1150);
      }

      playPauseBtn.addEventListener('click', () => {
        playing = !playing;
        root.classList.toggle('paused', !playing);
        playPauseBtn.textContent = playing ? 'Pause' : 'Play';
        playPauseBtn.setAttribute('aria-pressed', String(!playing));
      });

      helmetBtn.addEventListener('click', () => {
        helmet.classList.toggle('hidden');
        helmetBtn.setAttribute('aria-pressed', String(!helmet.classList.contains('hidden')));
      });

      goggleBtn.addEventListener('click', () => {
        goggles.classList.toggle('hidden');
        goggleBtn.setAttribute('aria-pressed', String(!goggles.classList.contains('hidden')));
      });

      honkBtn.addEventListener('click', makeHonk);

      scene.addEventListener('click', makeHonk);

      speedInput.addEventListener('input', applySpeed);

      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        playing = false;
        root.classList.add('paused');
        playPauseBtn.textContent = 'Play';
      }

      applySpeed();
      drawCrank();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
