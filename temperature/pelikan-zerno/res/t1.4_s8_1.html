<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelican Riding a Bicycle — SVG</title>
  <style>
    :root {
      --ink: #0c1520;
      --panel: rgba(255, 255, 255, 0.92);
      --line: rgba(12, 21, 32, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.08), transparent 35%),
        linear-gradient(180deg, #081426 0%, #10233f 42%, #1b2a3a 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(1100px, 100%);
    }

    .app {
      display: grid;
      gap: 16px;
      place-items: stretch;
    }

    .stage {
      position: relative;
      width: 100%;
      padding: clamp(10px, 2vw, 24px);
      border-radius: 26px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.04)),
        rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 22px;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .art-frame {
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      background: #d9efff;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08), 0 16px 36px rgba(0, 0, 0, 0.2);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: transparent;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px 18px;
      justify-content: space-between;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.12);
    }

    .control-copy {
      display: grid;
      gap: 2px;
    }

    .title {
      margin: 0;
      font-size: clamp(1.05rem, 2.3vw, 1.4rem);
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .subtle {
      margin: 0;
      font-size: 0.95rem;
      color: rgba(12, 21, 32, 0.62);
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 650;
    }

    input[type="range"] {
      width: min(280px, 44vw);
      accent-color: #ff4f3d;
      cursor: pointer;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 88px;
      padding: 8px 12px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #ff6f3d, #f7b42c);
      box-shadow: 0 10px 24px rgba(247, 115, 61, 0.28);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* SVG animations */
    .cloud-a {
      animation: drift 38s linear infinite;
    }

    .cloud-b {
      animation: drift 52s linear infinite;
      animation-delay: -18s;
    }

    .cloud-c {
      animation: drift 64s linear infinite;
      animation-delay: -34s;
    }

    .rays {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 24s linear infinite;
    }

    .sun-glow {
      animation: sunPulse 3.2s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .bird-bob {
      animation: bob 1.75s ease-in-out infinite;
    }

    .wing-flap {
      transform-box: fill-box;
      transform-origin: 12% 82%;
      animation: flap 1.05s ease-in-out infinite;
    }

    .pouch-sway {
      transform-box: fill-box;
      transform-origin: 10% 10%;
      animation: sway 1.35s ease-in-out infinite;
    }

    #chain {
      stroke-dasharray: 15 11;
    }

    @keyframes drift {
      0% {
        transform: translateX(-320px);
      }
      100% {
        transform: translateX(1260px);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes sunPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.04);
        opacity: 0.92;
      }
    }

    @keyframes bob {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(4px);
      }
    }

    @keyframes flap {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(-3deg);
      }
    }

    @keyframes sway {
      0%, 100% {
        transform: translateY(0px) scaleY(1);
      }
      50% {
        transform: translateY(2px) scaleY(1.035);
      }
    }

    @media (max-width: 680px) {
      .controls {
        align-items: stretch;
        flex-direction: column;
      }

      label,
      input[type="range"] {
        width: 100%;
      }

      .badge {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cloud-a,
      .cloud-b,
      .cloud-c,
      .rays,
      .sun-glow,
      .bird-bob,
      .wing-flap,
      .pouch-sway {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="app">
      <div class="stage" role="img" aria-label="An illustrated pelican wearing a red helmet riding a red bicycle.">
        <div class="art-frame">
          <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
            <title>A pelican riding a bicycle</title>
            <desc>A friendly pelican in a cycling helmet pedals a red bicycle under a bright cartoon sky.</desc>

            <defs>
              <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#75ccff" />
                <stop offset="55%" stop-color="#bde9ff" />
                <stop offset="100%" stop-color="#e8f7ff" />
              </linearGradient>

              <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#9ee07b" />
                <stop offset="100%" stop-color="#5d9f51" />
              </linearGradient>

              <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#fff7a8" />
                <stop offset="62%" stop-color="#ffd54a" />
                <stop offset="100%" stop-color="#ffb619" />
              </radialGradient>

              <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffd54a" stop-opacity="0.28" />
                <stop offset="100%" stop-color="#ffd54a" stop-opacity="0" />
              </radialGradient>

              <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#5f6c79" />
                <stop offset="100%" stop-color="#3f4a58" />
              </linearGradient>

              <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#fffdf7" />
                <stop offset="100%" stop-color="#efe1c0" />
              </linearGradient>

              <filter id="softShadow" x="-25%" y="-25%" width="150%" height="160%">
                <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#052030" flood-opacity="0.16" />
              </filter>

              <filter id="birdShadow" x="-25%" y="-25%" width="150%" height="150%">
                <feDropShadow dx="3" dy="7" stdDeviation="9" flood-color="#122533" flood-opacity="0.18" />
              </filter>

              <g id="spokeSet" stroke="#bdd1dc" stroke-width="3" stroke-linecap="round">
                <line x1="0" y1="-80" x2="0" y2="80" />
                <line x1="-56.6" y1="-56.6" x2="56.6" y2="56.6" />
                <line x1="-80" y1="0" x2="80" y2="0" />
                <line x1="-56.6" y1="56.6" x2="56.6" y2="-56.6" />
              </g>

              <clipPath id="sceneClip">
                <rect x="0" y="0" width="1000" height="620" rx="20" />
              </clipPath>
            </defs>

            <g clip-path="url(#sceneClip)">
              <!-- Background -->
              <rect x="0" y="0" width="1000" height="620" fill="url(#skyGrad)" />

              <!-- Sun -->
              <g transform="translate(842, 94)">
                <circle class="sun-glow" r="100" fill="url(#sunHalo)" />
                <g class="rays" opacity="0.62">
                  <g stroke="#ffd54a" stroke-width="7" stroke-linecap="round">
                    <line x1="64" y1="0" x2="86" y2="0" />
                    <line x1="45" y1="45" x2="61" y2="61" />
                    <line x1="0" y1="64" x2="0" y2="86" />
                    <line x1="-45" y1="45" x2="-61" y2="61" />
                    <line x1="-64" y1="0" x2="-86" y2="0" />
                    <line x1="-45" y1="-45" x2="-61" y2="-61" />
                    <line x1="0" y1="-64" x2="0" y2="-86" />
                    <line x1="45" y1="-45" x2="61" y2="-61" />
                  </g>
                </g>
                <circle r="56" fill="url(#sunGrad)" stroke="#f8c519" stroke-width="3" />
                <circle cx="-18" cy="-17" r="20" fill="#fff3a1" opacity="0.75" />
              </g>

              <!-- Clouds -->
              <g transform="translate(0 90)">
                <g class="cloud-a">
                  <g fill="#ffffff" opacity="0.94">
                    <ellipse cx="0" cy="0" rx="48" ry="23" />
                    <ellipse cx="37" cy="-14" rx="35" ry="25" />
                    <ellipse cx="-34" cy="-8" rx="29" ry="20" />
                    <ellipse cx="12" cy="12" rx="36" ry="18" />
                  </g>
                </g>
              </g>

              <g transform="translate(130 170)">
                <g class="cloud-b">
                  <g fill="#ffffff" opacity="0.86">
                    <ellipse cx="0" cy="0" rx="40" ry="20" />
                    <ellipse cx="28" cy="-10" rx="28" ry="20" />
                    <ellipse cx="-28" cy="-5" rx="24" ry="16" />
                    <ellipse cx="8" cy="9" rx="28" ry="14" />
                  </g>
                </g>
              </g>

              <g transform="translate(60 250)">
                <g class="cloud-c">
                  <g fill="#ffffff" opacity="0.72">
                    <ellipse cx="0" cy="0" rx="55" ry="24" />
                    <ellipse cx="40" cy="-14" rx="32" ry="22" />
                    <ellipse cx="-38" cy="-9" rx="27" ry="18" />
                  </g>
                </g>
              </g>

              <!-- Ground / landscape -->
              <path d="M0,478
                       C150,432 235,505 385,472
                       C560,434 650,504 1000,450
                       L1000,620 L0,620 Z"
                    fill="url(#grassGrad)" />

              <!-- Bushes and tree -->
              <g opacity="0.95">
                <ellipse cx="128" cy="486" rx="64" ry="40" fill="#68bd53" />
                <ellipse cx="162" cy="476" rx="48" ry="31" fill="#7fd365" />
                <ellipse cx="94" cy="491" rx="36" ry="23" fill="#55a345" />

                <rect x="842" y="432" width="16" height="68" rx="7" fill="#8a5a3b" />
                <ellipse cx="850" cy="426" rx="52" ry="44" fill="#64bf51" />
                <ellipse cx="878" cy="412" rx="35" ry="30" fill="#82d368" />
                <ellipse cx="824" cy="420" rx="31" ry="26" fill="#55a345" />
              </g>

              <!-- Road -->
              <rect x="0" y="500" width="1000" height="54" fill="url(#roadGrad)" />
              <rect x="0" y="498" width="1000" height="4" fill="rgba(255,255,255,0.35)" />
              <line x1="0" y1="527" x2="1000" y2="527" stroke="rgba(255,255,255,0.72)" stroke-width="7" stroke-dasharray="38 42" stroke-linecap="round" />

              <!-- Bicycle / bird shadow -->
              <ellipse cx="305" cy="509" rx="74" ry="13" fill="rgba(0,0,0,0.18)" />
              <ellipse cx="705" cy="509" rx="74" ry="13" fill="rgba(0,0,0,0.18)" />
              <ellipse cx="520" cy="506" rx="165" ry="22" fill="rgba(0,0,0,0.11)" />

              <!-- BICYCLE: wheels and chain -->
              <g id="bike">
                <!-- Rear wheel -->
                <g transform="translate(305 420)">
                  <circle r="92" fill="#29343a" stroke="#151f25" stroke-width="11" />
                  <circle r="79" fill="none" stroke="#d9e5eb" stroke-width="7" />
                  <g id="rearSpin" transform="rotate(0)">
                    <use href="#spokeSet" />
                  </g>
                  <circle r="11" fill="#78909c" stroke="#37474f" stroke-width="4" />
                </g>

                <!-- Front wheel -->
                <g transform="translate(705 420)">
                  <circle r="92" fill="#29343a" stroke="#151f25" stroke-width="11" />
                  <circle r="79" fill="none" stroke="#d9e5eb" stroke-width="7" />
                  <g id="frontSpin" transform="rotate(0)">
                    <use href="#spokeSet" />
                  </g>
                  <circle r="11" fill="#78909c" stroke="#37474f" stroke-width="4" />
                </g>

                <!-- Cog and chainring -->
                <circle cx="305" cy="420" r="18" fill="#8d98a3" stroke="#4b555e" stroke-width="4" />
                <circle cx="550" cy="420" r="27" fill="#8d98a3" stroke="#4b555e" stroke-width="4" />
                <circle cx="550" cy="420" r="14" fill="#eef2f5" stroke="#4b555e" stroke-width="3" />

                <!-- Chain -->
                <path id="chain"
                      d="M310,404
                         C390,398 500,396 539,401
                         A26,26 0 1 1 539,439
                         C500,446 380,445 312,436
                         A17,17 0 1 1 310,404 Z"
                      fill="none"
                      stroke="#3b444d"
                      stroke-width="6"
                      stroke-linecap="round" />

                <!-- Far crank -->
                <g filter="url(#softShadow)">
                  <line id="crankFarLine" x1="550" y1="420" x2="488" y2="426" stroke="#4d5864" stroke-width="10" stroke-linecap="round" />
                  <g id="pedalFar" transform="translate(488 426)">
                    <rect x="-13" y="0" width="26" height="8" rx="4" fill="#22292f" stroke="#11161a" stroke-width="2" />
                  </g>
                </g>
              </g>

              <!-- FAR PELICAN LEG -->
              <g>
                <path id="farLegPath"
                      d="M432,257 Q485,332 488,426"
                      fill="none"
                      stroke="#d9c299"
                      stroke-width="17"
                      stroke-linecap="round" />

                <g id="farFoot" transform="translate(479 419)">
                  <path d="M0,0
                           C7,-9 22,-11 36,-3
                           C32,7 14,13 4,6
                           C-2,3 -2,2 0,0 Z"
                        fill="#df7b1f"
                        stroke="#a74c0d"
                        stroke-width="2" />
                  <path d="M22,-1 C28,2 34,1 36,-2" fill="none" stroke="#ffca91" stroke-width="2.3" stroke-linecap="round" />
                </g>
              </g>

              <!-- BICYCLE FRAME / saddle / handlebars -->
              <g id="frame" stroke="#ff3f57" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
                <!-- chainstay -->
                <line x1="550" y1="420" x2="305" y2="420" />
                <!-- seatstay -->
                <line x1="305" y1="420" x2="415" y2="245" />
                <!-- seat tube -->
                <line x1="550" y1="420" x2="415" y2="245" />
                <!-- top tube -->
                <path d="M415,245 C475,250 585,260 647,278" />
                <!-- down tube -->
                <path d="M550,420 C575,370 610,310 647,278" />
                <!-- head tube -->
                <line x1="645" y1="278" x2="665" y2="250" />
                <!-- front fork -->
                <line x1="652" y1="255" x2="705" y2="420" />
                <!-- seatpost -->
                <line x1="415" y1="245" x2="409" y2="212" />
              </g>

              <!-- Saddle -->
              <path d="M370,218
                       C388,196 455,199 446,222
                       C420,228 386,229 370,218 Z"
                    fill="#33272e" stroke="#1f161b" stroke-width="2" />

              <!-- Handlebars -->
              <g stroke="#2a2a2f" stroke-width="10" stroke-linecap="round" fill="none">
                <line x1="665" y1="250" x2="623" y2="222" />
                <path d="M623,222 L613,258" />
                <path d="M623,222 C605,228 592,240 588,254" />
              </g>
              <circle cx="588" cy="254" r="6" fill="#17171a" />
              <circle cx="613" cy="258" r="6" fill="#17171a" />

              <!-- PELICAN BODY GROUP -->
              <g id="pelican" filter="url(#birdShadow)">
                <g class="bird-bob">
                  <!-- Tail feathers -->
                  <g>
                    <path d="M386,258
                             C315,206 245,242 273,318
                             C304,340 349,316 384,291 Z"
                          fill="#f3e1b8"
                          stroke="#caa473"
                          stroke-width="2.5" />
                    <path d="M348,234
                             C320,225 300,251 309,284"
                          fill="none"
                          stroke="#d8b889"
                          stroke-width="4"
                          stroke-linecap="round"
                          opacity="0.72" />
                    <path d="M370,247
                             C341,244 323,272 333,303"
                          fill="none"
                          stroke="#d8b889"
                          stroke-width="4"
                          stroke-linecap="round"
                          opacity="0.66" />
                  </g>

                  <!-- Neck -->
                  <path d="M582,180
                           C605,116 642,100 694,126"
                        fill="none"
                        stroke="url(#bodyGrad)"
                        stroke-width="57"
                        stroke-linecap="round" />

                  <!-- Body -->
                  <path d="M362,290
                           C290,294 246,246 290,224
                           C315,150 418,100 494,103
                           C604,108 658,164 642,202
                           C627,255 568,288 510,290
                           C432,295 395,296 362,290 Z"
                        fill="url(#bodyGrad)"
                        stroke="#d8bc8f"
                        stroke-width="3" />

                  <!-- Body shading -->
                  <path d="M355,280
                           C405,303 532,299 610,261
                           C574,281 500,296 432,296
                           C382,299 363,294 355,280 Z"
                        fill="#e7d2ac"
                        opacity="0.78" />

                  <!-- Far wing -->
                  <g transform="translate(-2 -6)">
                    <path d="M602,132
                             C624,160 652,207 671,248
                             C678,263 668,279 652,273
                             C625,246 588,191 563,154
                             Z"
                          fill="#e2cca5"
                          stroke="#c9aa77"
                          stroke-width="2.5" />
                  </g>

                  <!-- Near wing, reaches handlebars -->
                  <g class="wing-flap">
                    <path d="M452,183
                             C492,147 558,158 586,216
                             C602,240 618,254 632,260
                             C639,269 629,284 614,278
                             C564,253 505,210 461,223
                             Z"
                          fill="#f9ecd3"
                          stroke="#cfad7b"
                          stroke-width="3" />
                    <path d="M484,175 C506,167 534,180 550,205" fill="none" stroke="#e0bb8c" stroke-width="5" stroke-linecap="round" opacity="0.85" />
                    <path d="M497,197 C522,197 553,218 572,245" fill="none" stroke="#e0bb8c" stroke-width="5" stroke-linecap="round" opacity="0.78" />
                    <path d="M481,216 C509,224 542,244 568,258" fill="none" stroke="#e0bb8c" stroke-width="5" stroke-linecap="round" opacity="0.72" />
                  </g>
                </g>

                <!-- Head -->
                <circle cx="703" cy="124" r="36" fill="#fffdf8" stroke="#e2cba7" stroke-width="3" />

                <!-- Helmet -->
                <path d="M664,124
                         C656,60 748,61 759,122
                         L738,123
                         C733,85 681,85 679,124
                         Z"
                      fill="#ef3f36"
                      stroke="#a71c28"
                      stroke-width="3" />
                <path d="M700,70 L702,118" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round" />
                <path d="M730,74 L732,118" stroke="#ffffff" stroke-opacity="0.42" stroke-width="5" stroke-linecap="round" />

                <!-- Helmet strap -->
                <path d="M742,123
                         C754,155 726,180 685,179
                         C670,179 654,172 650,158"
                      fill="none"
                      stroke="#25343d"
                      stroke-width="6"
                      stroke-linecap="round" />

                <!-- Eye -->
                <ellipse cx="722" cy="112" rx="10" ry="11" fill="#fff" stroke="#6d543b" stroke-width="2.5" />
                <circle cx="725" cy="113" r="5" fill="#20232a" />
                <circle cx="727" cy="110" r="2" fill="#fff" />

                <!-- Beak -->
                <g class="pouch-sway">
                  <!-- upper beak -->
                  <path d="M722,108
                           C772,97 838,103 867,120
                           C832,132 769,138 723,138
                           Z"
                        fill="#ff8f28"
                        stroke="#d65b05"
                        stroke-width="3" />
                  <path d="M866,120
                           C873,117 879,116 882,118
                           C875,124 869,124 866,122
                           Z"
                        fill="#ff8f28"
                        stroke="#d65b05"
                        stroke-width="2" />
                  <!-- pouch -->
                  <path d="M723,136
                           C774,207 831,191 867,120
                           C841,154 773,160 721,148
                           Z"
                        fill="#ffd17c"
                        stroke="#e6ab35"
                        stroke-width="3" />
                  <!-- beak details -->
                  <path d="M729,116
                           C770,113 819,116 857,124"
                        fill="none"
                        stroke="#d65b05"
                        stroke-width="3"
                        opacity="0.58" />
                  <path d="M748,142
                           C788,180 824,177 854,131"
                        fill="none"
                        stroke="#edbd5b"
                        stroke-width="4"
                        opacity="0.7"
                        stroke-linecap="round" />
                </g>
              </g>

              <!-- NEAR BICYCLE CRANK and NEAR PELICAN LEG -->
              <g filter="url(#softShadow)">
                <line id="crankNearLine" x1="550" y1="420" x2="612" y2="414" stroke="#3f4b58" stroke-width="12" stroke-linecap="round" />
                <g id="pedalNear" transform="translate(612 414)">
                  <rect x="-13" y="0" width="26" height="8" rx="4" fill="#1a1f23" stroke="#090c0e" stroke-width="2" />
                </g>
              </g>

              <g>
                <path id="nearLegPath"
                      d="M520,255 Q603,330 612,414"
                      fill="none"
                      stroke="#f6e7c8"
                      stroke-width="20"
                      stroke-linecap="round" />

                <g id="nearFoot" transform="translate(602 407)">
                  <path d="M0,0
                           C8,-9 24,-11 38,-2
                           C34,9 15,14 4,6
                           C-1,4 -2,2 0,0 Z"
                        fill="#ff9137"
                        stroke="#c6530c"
                        stroke-width="2.5" />
                  <path d="M23,0 C29,3 35,2 37,-1" fill="none" stroke="#ffd7ac" stroke-width="2.5" stroke-linecap="round" />
                </g>
              </g>
            </g>
          </svg>
        </div>
      </div>

      <section class="controls" aria-label="Animation controls">
        <div class="control-copy">
          <h1 class="title">Pelican Riding a Bicycle</h1>
          <p class="subtle">Inline SVG, animated pedals, chain, wheels, clouds, and pelican legs.</p>
        </div>

        <label for="speed">
          Pedaling speed
          <input id="speed" type="range" min="0" max="3" step="0.1" value="1" />
        </label>

        <output class="badge" id="speedOut" aria-live="polite">1.0×</output>
      </section>
    </div>
  </main>

  <script>
    (function () {
      const ids = [
        "rearSpin",
        "frontSpin",
        "chain",
        "crankFarLine",
        "pedalFar",
        "farLegPath",
        "farFoot",
        "crankNearLine",
        "pedalNear",
        "nearLegPath",
        "nearFoot",
        "speed",
        "speedOut"
      ];

      const el = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));

      if (ids.some(id => !el[id])) {
        console.warn("Missing required SVG/HTML elements.");
        return;
      }

      const bb = { x: 550, y: 420 };
      const crankR = 62;

      const hipNear = { x: 520, y: 254 };
      const hipFar = { x: 432, y: 257 };

      let speed = Number(el.speed.value);
      let angle = 0.75;
      let last = performance.now();

      el.speed.addEventListener("input", () => {
        speed = Number(el.speed.value);
        el.speedOut.textContent = speed.toFixed(1) + "×";
      });

      el.speedOut.textContent = speed.toFixed(1) + "×";

      function legPath(hip, foot) {
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const len = Math.max(1, Math.hypot(dx, dy));

        const mx = (hip.x + foot.x) / 2;
        const my = (hip.y + foot.y) / 2;

        const bend = 54;
        const nx = dy / len;
        const ny = -dx / len;

        const kx = mx + nx * bend;
        const ky = my + ny * bend;

        return `M${hip.x},${hip.y} Q${kx},${ky} ${foot.x},${foot.y}`;
      }

      function setLine(lineEl, from, to) {
        lineEl.setAttribute("x1", String(from.x));
        lineEl.setAttribute("y1", String(from.y));
        lineEl.setAttribute("x2", String(to.x));
        lineEl.setAttribute("y2", String(to.y));
      }

      function draw() {
        const near = {
          x: bb.x + Math.cos(angle) * crankR,
          y: bb.y + Math.sin(angle) * crankR
        };

        const far = {
          x: bb.x - Math.cos(angle) * crankR,
          y: bb.y - Math.sin(angle) * crankR
        };

        setLine(el.crankNearLine, bb, near);
        setLine(el.crankFarLine, bb, far);

        el.pedalNear.setAttribute("transform", `translate(${near.x.toFixed(2)} ${near.y.toFixed(2)})`);
        el.pedalFar.setAttribute("transform", `translate(${far.x.toFixed(2)} ${far.y.toFixed(2)})`);

        el.nearLegPath.setAttribute("d", legPath(hipNear, near));
        el.farLegPath.setAttribute("d", legPath(hipFar, far));

        el.nearFoot.setAttribute("transform", `translate(${(near.x - 10).toFixed(2)} ${(near.y - 7).toFixed(2)})`);
        el.farFoot.setAttribute("transform", `translate(${(far.x - 10).toFixed(2)} ${(far.y - 7).toFixed(2)})`);

        const wheelAngle = (angle * 320) % 360;
        el.rearSpin.setAttribute("transform", `rotate(${wheelAngle.toFixed(3)})`);
        el.frontSpin.setAttribute("transform", `rotate(${wheelAngle.toFixed(3)})`);

        el.chain.style.strokeDashoffset = String((-angle * 180).toFixed(3));
      }

      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;

        angle += dt * speed * 1.55;

        draw();
        requestAnimationFrame(frame);
      }

      draw();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
