<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pelican Riding a Bicycle — Inline SVG</title>
  <style>
    :root {
      --spin: 3.8s;
      --bob: 0.92s;
      --wing: 0.72s;
      --cloud1: 20s;
      --cloud2: 28s;
      --cloud3: 16s;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,.75), transparent 32%),
        linear-gradient(135deg, #eef7ff 0%, #e2f4ff 100%);
      color: #1c2a39;
    }

    main {
      width: min(1040px, calc(100% - 28px));
      padding: 28px 0 40px;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      letter-spacing: -.03em;
      line-height: 1.05;
    }

    p.subtle {
      margin: 0;
      color: #4e6b86;
      font-size: 1rem;
    }

    .card {
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.9);
      box-shadow: 0 28px 70px rgba(45, 77, 113, .22), 0 8px 24px rgba(45, 77, 113, .10);
      border-radius: 28px;
      padding: 16px;
      overflow: hidden;
    }

    svg#scene {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
      background: linear-gradient(180deg, #dff5ff 0%, #b9ebff 100%);
    }

    .controls {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px 18px;
      padding: 12px 16px;
      background: rgba(255,255,255,.70);
      border: 1px solid rgba(125, 163, 197, .32);
      border-radius: 18px;
      backdrop-filter: blur(8px);
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 11px 18px;
      background: linear-gradient(180deg, #4368ff, #2345d8);
      color: white;
      font-weight: 700;
      font-size: .95rem;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(35, 69, 216, .28);
    }

    button:hover { filter: brightness(1.07); }
    button:active { transform: translateY(1px); }

    label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 650;
      color: #24445f;
    }

    input[type="range"] {
      width: 190px;
      accent-color: #2b51e4;
    }

    output {
      min-width: 170px;
      text-align: center;
      font-weight: 750;
      color: #22455f;
      background: rgba(255,255,255,.68);
      border: 1px solid rgba(125,163,197,.32);
      padding: 9px 13px;
      border-radius: 12px;
      font-variant-numeric: tabular-nums;
    }

    /* Animation */
    .spokes,
    #pelican,
    #wing,
    #head,
    .cloud {
      transform-box: fill-box;
    }

    .spokes {
      transform-origin: center;
      animation: spin var(--spin) linear infinite;
    }

    .cloud {
      animation-name: drift;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .cloud1 { animation-duration: var(--cloud1); }
    .cloud2 { animation-duration: var(--cloud2); }
    .cloud3 { animation-duration: var(--cloud3); }

    #pelican {
      transform-origin: 22% 75%;
      animation: bob var(--bob) ease-in-out infinite;
    }

    #wing {
      transform-origin: 68% 88%;
      animation: flap var(--wing) ease-in-out infinite;
    }

    #head {
      transform-origin: 16% 45%;
      animation: nod var(--bob) ease-in-out infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes drift {
      from { transform: translateX(0); }
      to   { transform: translateX(1020px); }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-2.5px) rotate(.35deg); }
    }

    @keyframes flap {
      0%, 100% { transform: rotate(-6deg) translateY(0); }
      50%      { transform: rotate(10deg) translateY(-3px); }
    }

    @keyframes nod {
      0%, 100% { transform: translateY(0) rotate(-1.2deg); }
      50%      { transform: translateY(1.2px) rotate(1.8deg); }
    }

    #scene.paused * {
      animation-play-state: paused !important;
    }

    @media (prefers-reduced-motion: reduce) {
      .spokes,
      #pelican,
      #wing,
      #head,
      .cloud {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Pelican Riding a Bicycle</h1>
      <p class="subtle">Inline SVG scene · play/pause · speed control</p>
    </header>

    <div class="card">
      <svg id="scene" viewBox="0 0 900 600" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">A pelican riding a bicycle</title>
        <desc id="svgDesc">A cartoon pelican with a helmet rides a red bicycle across a bright landscape.</desc>

        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#bdf1ff" />
            <stop offset="70%" stop-color="#e6f8ff" />
            <stop offset="100%" stop-color="#f5fdff" />
          </linearGradient>

          <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6d8f43" />
            <stop offset="100%" stop-color="#324521" />
          </linearGradient>

          <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff79b" stop-opacity=".72" />
            <stop offset="65%" stop-color="#fff79b" stop-opacity=".16" />
            <stop offset="100%" stop-color="#fff79b" stop-opacity="0" />
          </radialGradient>

          <radialGradient id="sunGrad" cx="42%" cy="40%" r="55%">
            <stop offset="0%" stop-color="#fff9c2" />
            <stop offset="70%" stop-color="#ffd93d" />
            <stop offset="100%" stop-color="#ff9f2e" />
          </radialGradient>

          <radialGradient id="tireGrad" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#6d7886" />
            <stop offset="55%" stop-color="#2a303a" />
            <stop offset="100%" stop-color="#0a0d12" />
          </radialGradient>

          <radialGradient id="hubGrad" cx="35%" cy="32%" r="72%">
            <stop offset="0%" stop-color="#f2f6fa" />
            <stop offset="100%" stop-color="#8a9aae" />
          </radialGradient>

          <linearGradient id="bodyGrad" x1="35%" y1="8%" x2="72%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#d9e6f0" />
          </linearGradient>

          <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="65%">
            <stop offset="0%" stop-color="#ffd76b" />
            <stop offset="100%" stop-color="#ff9a17" />
          </linearGradient>

          <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffad8b" />
            <stop offset="100%" stop-color="#ff776c" />
          </linearGradient>

          <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ff6971" />
            <stop offset="100%" stop-color="#d02130" />
          </linearGradient>
        </defs>

        <!-- Sky -->
        <rect x="0" y="0" width="900" height="600" fill="url(#skyGrad)" />

        <!-- Sun -->
        <circle cx="810" cy="92" r="74" fill="url(#sunGlow)" />
        <circle cx="810" cy="92" r="44" fill="url(#sunGrad)" />

        <!-- Clouds -->
        <g fill="#ffffff" opacity=".88">
          <g class="cloud cloud1" style="animation-delay:-4s">
            <g transform="translate(140 132)">
              <ellipse cx="-32" cy="0" rx="24" ry="18" />
              <ellipse cx="8" cy="-8" rx="30" ry="23" />
              <ellipse cx="46" cy="3" rx="23" ry="17" />
              <rect x="-32" y="-2" width="94" height="20" rx="10" />
            </g>
          </g>

          <g class="cloud cloud2" style="animation-delay:-13s" opacity=".62">
            <g transform="translate(460 88) scale(.8)">
              <ellipse cx="-32" cy="0" rx="24" ry="18" />
              <ellipse cx="8" cy="-8" rx="30" ry="23" />
              <ellipse cx="46" cy="3" rx="23" ry="17" />
              <rect x="-32" y="-2" width="94" height="20" rx="10" />
            </g>
          </g>

          <g class="cloud cloud3" style="animation-delay:-9s" opacity=".72">
            <g transform="translate(650 168) scale(.65)">
              <ellipse cx="-32" cy="0" rx="24" ry="18" />
              <ellipse cx="8" cy="-8" rx="30" ry="23" />
              <ellipse cx="46" cy="3" rx="23" ry="17" />
              <rect x="-32" y="-2" width="94" height="20" rx="10" />
            </g>
          </g>
        </g>

        <!-- Ground / road -->
        <rect x="0" y="506" width="900" height="94" fill="url(#roadGrad)" />
        <rect x="0" y="516" width="900" height="24" fill="#4e5c68" />
        <line x1="25" y1="528" x2="875" y2="528" stroke="#ffe47a" stroke-width="9"
              stroke-dasharray="36 46" stroke-linecap="round" />
        <g opacity=".7" stroke="#a4d76a" stroke-width="3" stroke-linecap="round">
          <path d="M88,502 C106,484 126,484 142,500" />
          <path d="M88,502 C82,476 108,472 114,495" />
          <path d="M812,502 C832,484 854,484 866,502" />
          <path d="M812,502 C806,478 830,473 842,496" />
        </g>

        <!-- Shadow -->
        <ellipse cx="435" cy="520" rx="232" ry="14" fill="#26381d" opacity=".18" />

        <!-- Wheels -->
        <g transform="translate(260 435)">
          <circle r="84" fill="url(#tireGrad)" stroke="#0b0e12" stroke-width="16" />
          <circle r="71" fill="#1b232b" opacity=".10" />
          <circle r="70" fill="none" stroke="#c7d6e4" stroke-width="3" opacity=".65" />
          <g class="spokes" stroke="#a6b6c7" stroke-width="4.5" stroke-linecap="round">
            <line x1="0" y1="-72" x2="0" y2="72" />
            <line x1="-72" y1="0" x2="72" y2="0" />
            <line x1="-51" y1="-51" x2="51" y2="51" />
            <line x1="51" y1="-51" x2="-51" y2="51" />
            <line x1="-24" y1="-67" x2="24" y2="67" />
            <line x1="-24" y1="67" x2="24" y2="-67" />
            <line x1="-67" y1="-24" x2="67" y2="24" />
            <line x1="67" y1="-24" x2="-67" y2="24" />
          </g>
          <circle r="13" fill="url(#hubGrad)" stroke="#596775" stroke-width="5" />
        </g>

        <g transform="translate(605 435)">
          <circle r="84" fill="url(#tireGrad)" stroke="#0b0e12" stroke-width="16" />
          <circle r="71" fill="#1b232b" opacity=".10" />
          <circle r="70" fill="none" stroke="#c7d6e4" stroke-width="3" opacity=".65" />
          <g class="spokes" stroke="#a6b6c7" stroke-width="4.5" stroke-linecap="round">
            <line x1="0" y1="-72" x2="0" y2="72" />
            <line x1="-72" y1="0" x2="72" y2="0" />
            <line x1="-51" y1="-51" x2="51" y2="51" />
            <line x1="51" y1="-51" x2="-51" y2="51" />
            <line x1="-24" y1="-67" x2="24" y2="67" />
            <line x1="-24" y1="67" x2="24" y2="-67" />
            <line x1="-67" y1="-24" x2="67" y2="24" />
            <line x1="67" y1="-24" x2="-67" y2="24" />
          </g>
          <circle r="13" fill="url(#hubGrad)" stroke="#596775" stroke-width="5" />
        </g>

        <!-- Bicycle frame -->
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <g stroke="#b5303b" stroke-width="12">
            <path d="M260,435 L412,423" />
            <path d="M412,423 L551,360" />
            <path d="M541,327 L550,364" />
          </g>
          <g stroke="#d5434f" stroke-width="10">
            <path d="M260,435 L380,338" />
            <path d="M380,338 L543,334" />
            <path d="M412,423 L378,336" />
            <path d="M546,361 L605,435" />
            <path d="M543,332 L584,322" />
          </g>
          <path d="M380,338 L373,307" stroke="#37424e" stroke-width="8" />
        </g>

        <!-- Saddle -->
        <path d="M349,314 L396,313 L418,299 L362,294 Z"
              fill="#252d37" stroke="#111720" stroke-width="5" stroke-linejoin="round" />

        <!-- Chain ring, chain, rear sprocket -->
        <path d="M393,407 L269,419 A18,18 0 0 0 269,451 L391,437 A24,24 0 0 1 393,407 Z"
              fill="none" stroke="#697786" stroke-width="6" opacity=".8" />
        <path d="M393,407 L269,419 A18,18 0 0 0 269,451 L391,437"
              fill="none" stroke="#2f3a46" stroke-width="4.5" stroke-linecap="round" />
        <circle cx="260" cy="435" r="17" fill="#525d69" stroke="#91a1b3" stroke-width="3"
                stroke-dasharray="5 6" />
        <circle cx="412" cy="423" r="24" fill="none" stroke="#7f8d9c" stroke-width="4"
                stroke-dasharray="6 8" opacity=".85" />
        <circle cx="412" cy="423" r="19" fill="#d1dce6" stroke="#5f7081" stroke-width="5" />
        <circle cx="412" cy="423" r="8" fill="#2c3440" />

        <!-- Dropouts -->
        <circle cx="260" cy="435" r="7" fill="#27313b" />
        <circle cx="605" cy="435" r="7" fill="#27313b" />

        <!-- Crank arms + pedals -->
        <g stroke="#16202a" stroke-width="10" stroke-linecap="round">
          <line x1="412" y1="423" x2="363" y2="454" />
          <line x1="412" y1="423" x2="462" y2="393" />
        </g>
        <rect x="345" y="449" width="34" height="10" rx="5" fill="#101519"
              transform="rotate(16 362 454)" />
        <rect x="451" y="387" width="34" height="11" rx="5" fill="#101519"
              transform="rotate(-18 468 392)" />

        <!-- Handlebars -->
        <g fill="none" stroke-linecap="round">
          <path d="M543,332 L586,322" stroke="#d9e3ef" stroke-width="9" />
          <path d="M585,322 C 626,312 660,324 652,358" stroke="#d9e3ef" stroke-width="9" />
          <path d="M585,322 C 626,312 660,324 652,358" stroke="#f8fbff" stroke-width="3.5"
                opacity=".75" />
          <circle cx="652" cy="358" r="9" fill="#242e38" />
        </g>

        <!-- Pelican -->
        <g id="pelican">
          <!-- back leg -->
          <path d="M361,338 C349,373 348,421 360,444"
                fill="none" stroke="#ef9b24" stroke-width="11" stroke-linecap="round" />
          <g transform="translate(361 452) rotate(7)">
            <path d="M-24 -2 C -8 -13 16 -10 18 0 C 8 13 -10 12 -19 3 Z"
                  fill="#ffb43b" stroke="#b66d10" stroke-width="2" />
            <g stroke="#a45d08" stroke-width="2.5" stroke-linecap="round" fill="none">
              <path d="M-3 -5 C -5 1 -6 6 -8 10" />
              <path d="M8 -5 C 7 2 6 7 5 10" />
            </g>
          </g>

          <!-- body -->
          <path d="M282,344 C296,290 350,274 396,284 C430,245 482,230 512,252
                   C527,263 526,275 512,280 C476,271 443,278 408,298
                   C392,308 378,332 370,367 C329,387 292,371 282,344 Z"
                fill="url(#bodyGrad)" stroke="#304150" stroke-width="7"
                stroke-linejoin="round" />

          <!-- tail feather lines -->
          <g fill="none" stroke="#304150" stroke-width="3" opacity=".58" stroke-linecap="round">
            <path d="M304,335 C293,328 286,322 282,315" />
            <path d="M311,351 C297,348 289,342 284,332" />
            <path d="M318,362 C303,361 292,354 286,344" />
          </g>

          <!-- front leg -->
          <path d="M384,356 C398,384 424,396 448,397"
                fill="none" stroke="#ef9b24" stroke-width="11" stroke-linecap="round" />
          <g transform="translate(461 394) rotate(-12)">
            <path d="M-24 -3 C -8 -13 16 -10 18 0 C 8 13 -10 12 -19 2 Z"
                  fill="#ffb43b" stroke="#b66d10" stroke-width="2" />
            <g stroke="#a45d08" stroke-width="2.5" stroke-linecap="round" fill="none">
              <path d="M-3 -5 C -5 1 -6 6 -8 10" />
              <path d="M8 -5 C 7 2 6 7 5 10" />
            </g>
          </g>

          <!-- wing -->
          <g id="wing">
            <path d="M364,324 C396,289 445,286 485,313 C467,342 397,351 366,338 Z"
                  fill="#eef5fb" stroke="#304150" stroke-width="6" stroke-linejoin="round" />
            <g fill="none" stroke="#304150" stroke-width="3" opacity=".62" stroke-linecap="round">
              <path d="M404,313 C427,324 450,325 469,317" />
              <path d="M387,324 C412,337 438,338 458,331" />
            </g>
          </g>

          <!-- head -->
          <g id="head">
            <!-- little neck feathers -->
            <g fill="none" stroke="#9fb1bf" stroke-width="3.2" stroke-linecap="round" opacity=".9">
              <path d="M491,252 C487,246 487,239 490,233" />
              <path d="M500,247 C496,242 496,235 500,229" />
              <path d="M509,245 C507,240 508,233 514,228" />
            </g>

            <!-- head shape -->
            <ellipse cx="511" cy="268" rx="21.5" ry="18.5" fill="url(#bodyGrad)" />
            <path d="M490,278 A22,21 0 1 1 531,259"
                  fill="none" stroke="#304150" stroke-width="6" stroke-linecap="round" />

            <!-- helmet -->
            <path d="M480,262 C491,220 529,219 540,242 C544,251 540,259 528,255
                     C512,249 496,255 480,262 Z"
                  fill="url(#helmetGrad)" stroke="#991d27" stroke-width="4"
                  stroke-linejoin="round" />
            <g fill="none" stroke="#ffe4e8" stroke-width="3" stroke-linecap="round" opacity=".78">
              <path d="M494,238 C501,235 510,234 517,237" />
              <path d="M497,248 C506,244 517,243 526,247" />
            </g>
            <path d="M513,272 C509,285 494,288 487,280"
                  fill="none" stroke="#263342" stroke-width="3" stroke-linecap="round" />

            <!-- pouch -->
            <path d="M512,281 C552,360 648,365 690,326 C646,341 547,336 507,289 Z"
                  fill="url(#pouchGrad)" stroke="#b6584a" stroke-width="3"
                  stroke-linejoin="round" />

            <!-- eye -->
            <circle cx="505" cy="260" r="6" fill="#fff" stroke="#304150" stroke-width="2" />
            <circle cx="507" cy="261" r="3.4" fill="#17232c" />
            <circle cx="508.3" cy="259.5" r="1.15" fill="#fff" />

            <!-- bill -->
            <path d="M512,269 C566,270 645,293 702,320
                     C712,325 704,334 694,328
                     C630,310 552,294 507,285 Z"
                  fill="url(#beakGrad)" stroke="#b27311" stroke-width="3"
                  stroke-linejoin="round" />
            <ellipse cx="518" cy="265" rx="2.5" ry="1.35" fill="#7b4a09"
                     transform="rotate(8 518 265)" />
            <path d="M513,278 C572,289 642,308 692,325"
                  fill="none" stroke="#5f3313" stroke-width="2.6" opacity=".82" />
          </g>
        </g>
      </svg>
    </div>

    <section class="controls" aria-label="Animation controls">
      <button id="playPause" type="button" aria-pressed="false">Pause</button>
      <label>
        Animation speed
        <input id="speed" type="range" min="1" max="10" value="5" />
      </label>
      <output id="status" aria-live="polite">Speed 5 / 10 · cycle 3.3s</output>
    </section>
  </main>

  <script>
    const root = document.documentElement;
    const scene = document.getElementById('scene');
    const playButton = document.getElementById('playPause');
    const speedInput = document.getElementById('speed');
    const status = document.getElementById('status');

    let playing = true;

    function applySpeed() {
      const v = Number(speedInput.value);

      const spin = Math.max(0.85, (11 - v) * 0.55);
      const bob = Math.max(0.42, spin * 0.28);
      const wing = Math.max(0.32, spin * 0.21);
      const cloud1 = Math.max(6.5, (16 - v) * 1.3);
      const cloud2 = Math.max(8.5, (22 - v) * 1.4);
      const cloud3 = Math.max(5.5, (13 - v) * 1.25);

      root.style.setProperty('--spin', `${spin.toFixed(2)}s`);
      root.style.setProperty('--bob', `${bob.toFixed(2)}s`);
      root.style.setProperty('--wing', `${wing.toFixed(2)}s`);
      root.style.setProperty('--cloud1', `${cloud1.toFixed(2)}s`);
      root.style.setProperty('--cloud2', `${cloud2.toFixed(2)}s`);
      root.style.setProperty('--cloud3', `${cloud3.toFixed(2)}s`);

      status.textContent = `Speed ${v} / 10 · cycle ${spin.toFixed(1)}s`;
    }

    playButton.addEventListener('click', () => {
      playing = !playing;
      scene.classList.toggle('paused', !playing);
      playButton.textContent = playing ? 'Pause' : 'Play';
      playButton.setAttribute('aria-pressed', String(!playing));
    });

    speedInput.addEventListener('input', applySpeed);

    applySpeed();
  </script>
</body>
</html>
