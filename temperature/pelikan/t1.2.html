<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelican Riding a Bicycle</title>
  <style>
    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #dbeafe 0%, #f8fafc 50%, #fef3c7 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      padding: 24px;
      box-sizing: border-box;
    }

    main {
      width: min(96vw, 1100px);
      padding: 16px;
      box-sizing: border-box;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 28px;
      box-shadow:
        0 24px 50px rgba(15, 23, 42, 0.18),
        0 4px 12px rgba(15, 23, 42, 0.10);
      background: #f8fafc;
    }

    .wheel {
      transform-box: view-box;
      animation: spin 2.3s linear infinite;
    }

    .rear-wheel {
      transform-origin: 250px 335px;
    }

    .front-wheel {
      transform-origin: 570px 335px;
      animation-duration: 1.75s;
    }

    .upper {
      transform-box: view-box;
      transform-origin: 340px 250px;
      animation: bob 1.55s ease-in-out infinite;
    }

    .cloud {
      transform-box: view-box;
      animation: drift 9s ease-in-out infinite alternate;
    }

    .c1 {
      transform-origin: 180px 110px;
    }

    .c2 {
      transform-origin: 660px 80px;
      animation-duration: 11s;
    }

    .speed {
      transform-box: view-box;
      animation: speed 1.05s linear infinite;
      stroke-linecap: round;
    }

    .s2 {
      animation-duration: .92s;
      animation-delay: .18s;
    }

    .s3 {
      animation-duration: .84s;
      animation-delay: .42s;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes bob {
      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-5px) rotate(-1deg);
      }
    }

    @keyframes drift {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(18px);
      }
    }

    @keyframes speed {
      0% {
        transform: translateX(25px);
        opacity: .65;
      }
      60% {
        opacity: .32;
      }
      100% {
        transform: translateX(-45px);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <svg
      viewBox="0 0 800 500"
      xmlns="http://www.w3.org/2000/svg"
      role="img"
      aria-labelledby="svgTitle svgDesc"
    >
      <title id="svgTitle">Pelican riding a bicycle</title>
      <desc id="svgDesc">
        An animated cartoon pelican with a big orange beak rides a blue bicycle across a grassy field.
      </desc>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#bfdbfe" />
          <stop offset="55%" stop-color="#e0f2fe" />
          <stop offset="100%" stop-color="#fef3c7" />
        </linearGradient>

        <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#86efac" />
          <stop offset="100%" stop-color="#22c55e" />
        </linearGradient>

        <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="100%" stop-color="#e7eef6" />
        </linearGradient>

        <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff8f37" />
          <stop offset="100%" stop-color="#ffc06b" />
        </linearGradient>

        <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffd7a0" />
          <stop offset="100%" stop-color="#ffab56" />
        </linearGradient>
      </defs>

      <!-- Background -->
      <rect x="0" y="0" width="800" height="500" fill="url(#sky)" />
      <circle cx="716" cy="80" r="52" fill="#fef3c7" opacity=".8" />

      <!-- Clouds -->
      <g class="cloud c1" fill="#ffffff" opacity=".88">
        <ellipse cx="142" cy="112" rx="44" ry="22" />
        <ellipse cx="182" cy="101" rx="39" ry="28" />
        <ellipse cx="217" cy="117" rx="30" ry="19" />
        <rect x="110" y="113" width="116" height="18" rx="9" />
      </g>

      <g class="cloud c2" fill="#ffffff" opacity=".82">
        <ellipse cx="625" cy="78" rx="45" ry="21" />
        <ellipse cx="664" cy="70" rx="34" ry="25" />
        <ellipse cx="691" cy="84" rx="26" ry="16" />
        <rect x="596" y="82" width="108" height="16" rx="8" />
      </g>

      <!-- Ground -->
      <path
        d="M0 436 C130 415 250 432 400 436 C560 440 680 424 800 436 L800 500 L0 500 Z"
        fill="url(#grass)"
      />

      <g stroke="#15803d" stroke-width="3" stroke-linecap="round" fill="none" opacity=".5">
        <path d="M120 438 q5 -18 10 0 q5 -22 10 0 q5 -18 10 0" />
        <path d="M650 432 q5 -18 10 0 q5 -22 10 0 q5 -18 10 0" />
      </g>

      <!-- Bike shadow -->
      <ellipse cx="410" cy="422" rx="235" ry="24" fill="#064e3b" opacity=".16" />

      <!-- Speed lines -->
      <g class="speed s1" stroke="#94a3b8" stroke-width="7" fill="none">
        <path d="M92 258 h84" />
      </g>
      <g class="speed s2" stroke="#94a3b8" stroke-width="7" fill="none">
        <path d="M62 296 h118" />
      </g>
      <g class="speed s3" stroke="#94a3b8" stroke-width="7" fill="none">
        <path d="M112 330 h76" />
      </g>

      <!-- Rear wheel -->
      <g class="wheel rear-wheel">
        <circle cx="250" cy="335" r="72" fill="#ffffff" stroke="#0f172a" stroke-width="11" />
        <circle cx="250" cy="335" r="63" fill="none" stroke="#e5e7eb" stroke-width="5" />
        <path
          d="M250 335 L308 335
             M250 335 L300 364
             M250 335 L279 385
             M250 335 L250 393
             M250 335 L221 385
             M250 335 L200 364
             M250 335 L192 335
             M250 335 L200 306
             M250 335 L221 285
             M250 335 L250 277
             M250 335 L279 285
             M250 335 L300 306"
          stroke="#94a3b8"
          stroke-width="2"
          stroke-linecap="round"
        />
        <circle cx="250" cy="335" r="9" fill="#475569" stroke="#e2e8f0" stroke-width="3" />
      </g>

      <!-- Front wheel -->
      <g class="wheel front-wheel">
        <circle cx="570" cy="335" r="72" fill="#ffffff" stroke="#0f172a" stroke-width="11" />
        <circle cx="570" cy="335" r="63" fill="none" stroke="#e5e7eb" stroke-width="5" />
        <path
          d="M570 335 L628 335
             M570 335 L620 364
             M570 335 L599 385
             M570 335 L570 393
             M570 335 L541 385
             M570 335 L520 364
             M570 335 L512 335
             M570 335 L520 306
             M570 335 L541 285
             M570 335 L570 277
             M570 335 L599 285
             M570 335 L620 306"
          stroke="#94a3b8"
          stroke-width="2"
          stroke-linecap="round"
        />
        <circle cx="570" cy="335" r="9" fill="#475569" stroke="#e2e8f0" stroke-width="3" />
      </g>

      <!-- Bicycle frame -->
      <g fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round">
        <path d="M405 355 L250 335" stroke-width="9" />
        <path d="M405 355 L345 205" stroke-width="10" />
        <path d="M405 355 L483 215" stroke-width="11" />
        <path d="M250 335 L345 205" stroke-width="8" />
        <path d="M345 205 L483 215" stroke-width="9" />
      </g>

      <!-- Head tube and fork -->
      <path
        d="M493 180 L483 215"
        stroke="#1e40af"
        stroke-width="12"
        stroke-linecap="round"
        fill="none"
      />
      <path
        d="M483 215 L570 335"
        stroke="#1e40af"
        stroke-width="7"
        stroke-linecap="round"
        fill="none"
      />

      <!-- Seat -->
      <path
        d="M345 205 L345 188"
        stroke="#334155"
        stroke-width="7"
        stroke-linecap="round"
        fill="none"
      />
      <path
        d="M317 188 C331 178 359 179 368 188 C358 196 329 197 317 188 Z"
        fill="#1f2937"
      />

      <!-- Handlebar -->
      <path
        d="M493 180 L512 184"
        stroke="#111827"
        stroke-width="7"
        stroke-linecap="round"
        fill="none"
      />
      <path
        d="M512 184 L538 197 Q548 206 535 217"
        stroke="#111827"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />

      <!-- Chain -->
      <path
        d="M250 328 Q326 321 405 340"
        stroke="#475569"
        stroke-width="4"
        stroke-linecap="round"
        fill="none"
      />
      <path
        d="M250 342 Q326 370 405 370"
        stroke="#475569"
        stroke-width="4"
        stroke-linecap="round"
        fill="none"
      />

      <!-- Chainring -->
      <circle cx="405" cy="355" r="21" fill="#64748b" stroke="#334155" stroke-width="3" />
      <circle
        cx="405"
        cy="355"
        r="21"
        fill="none"
        stroke="#cbd5e1"
        stroke-width="5"
        stroke-dasharray="5 9"
      />
      <circle cx="405" cy="355" r="9" fill="#e2e8f0" />
      <circle cx="405" cy="355" r="4" fill="#64748b" />

      <!-- Crank arms and pedals -->
      <g stroke="#111827" stroke-width="9" stroke-linecap="round" fill="none">
        <line x1="405" y1="355" x2="462" y2="377" />
        <line x1="405" y1="355" x2="348" y2="333" />
      </g>
      <rect
        x="446"
        y="372"
        width="34"
        height="10"
        rx="5"
        fill="#0f172a"
        transform="rotate(18 463 377)"
      />
      <rect
        x="331"
        y="328"
        width="34"
        height="10"
        rx="5"
        fill="#0f172a"
        transform="rotate(-18 348 333)"
      />

      <!-- Pelican -->
      <g id="pelican">
        <!-- Legs -->
        <g class="legs">
          <!-- Back leg -->
          <path
            d="M335 283 C331 301 340 319 348 333"
            stroke="#fb923c"
            stroke-width="10"
            stroke-linecap="round"
            fill="none"
          />
          <path
            d="M336 332 L351 318 L365 332 L357 342 L341 342 Z"
            fill="#fb923c"
            stroke="#b45309"
            stroke-width="2"
            stroke-linejoin="round"
          />
          <path
            d="M342 332 L351 323 M351 332 L351 323 M360 332 L351 323"
            stroke="#b45309"
            stroke-width="2"
            stroke-linecap="round"
          />

          <!-- Front leg -->
          <path
            d="M352 286 C383 320 416 348 452 372"
            stroke="#fb923c"
            stroke-width="12"
            stroke-linecap="round"
            fill="none"
          />
          <path
            d="M442 370 L465 357 L483 375 L474 388 L450 388 Z"
            fill="#fb923c"
            stroke="#b45309"
            stroke-width="2"
            stroke-linejoin="round"
          />
          <path
            d="M450 372 L464 364 M464 376 L464 364 M478 378 L464 364"
            stroke="#b45309"
            stroke-width="2"
            stroke-linecap="round"
          />
        </g>

        <!-- Upper body -->
        <g class="upper">
          <!-- Tail -->
          <path
            d="M260 252 C224 226 184 225 160 246
               C203 252 228 259 248 268
               C210 280 176 296 156 312
               C222 300 254 284 260 272 Z"
            fill="#f8fafc"
            stroke="#cbd5e1"
            stroke-width="2"
            stroke-linejoin="round"
          />
          <path
            d="M176 247 C196 248 216 253 233 259
               M174 290 C199 282 223 274 242 267"
            fill="none"
            stroke="#cbd5e1"
            stroke-width="2"
            opacity=".8"
          />

          <!-- Body -->
          <path
            d="M252 258 C254 194 286 179 332 176
               C390 172 430 199 430 239
               C430 290 370 302 322 301
               C266 299 250 292 252 258 Z"
            fill="url(#feather)"
            stroke="#cbd5e1"
            stroke-width="2"
          />
          <path
            d="M280 220 C300 195 326 189 356 192
               C386 195 402 210 414 232"
            fill="none"
            stroke="#ffffff"
            stroke-width="14"
            stroke-linecap="round"
            opacity=".8"
          />
          <path
            d="M290 260 C322 254 352 253 380 258
               M296 278 C328 273 358 273 384 277"
            fill="none"
            stroke="#dbe7f0"
            stroke-width="2"
            stroke-linecap="round"
          />

          <!-- Neck -->
          <path
            d="M365 222 C330 167 360 127 405 121"
            fill="none"
            stroke="#f8fafc"
            stroke-width="30"
            stroke-linecap="round"
          />

          <!-- Head -->
          <circle cx="410" cy="126" r="25" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

          <!-- Eye -->
          <circle cx="401" cy="122" r="7" fill="#ffffff" stroke="#475569" stroke-width="2" />
          <circle cx="402" cy="121" r="3.4" fill="#0f172a" />
          <circle cx="401" cy="119" r="1.2" fill="#ffffff" />

          <!-- Upper beak -->
          <path
            d="M416 118 Q502 107 586 131
               Q555 149 529 148
               Q454 146 416 136 Z"
            fill="url(#beak)"
            stroke="#9a3412"
            stroke-width="3"
            stroke-linejoin="round"
          />

          <!-- Lower beak / pouch -->
          <path
            d="M416 136 Q496 202 584 132
               Q527 154 447 149
               Q426 146 416 136 Z"
            fill="url(#pouch)"
            stroke="#9a3412"
            stroke-width="3"
            stroke-linejoin="round"
          />
          <path
            d="M562 134 L581 132"
            stroke="#9a3412"
            stroke-width="2"
            stroke-linecap="round"
            opacity=".55"
            fill="none"
          />

          <!-- Wing gripping handlebar -->
          <path
            d="M352 228 C394 194 452 184 516 191
               C539 194 541 212 520 217
               C458 231 394 253 350 247 Z"
            fill="#ffffff"
            stroke="#cbd5e1"
            stroke-width="2"
            stroke-linejoin="round"
          />
          <path
            d="M372 218 C404 211 434 206 470 205
               M382 231 C418 226 456 222 493 219"
            fill="none"
            stroke="#cbd5e1"
            stroke-width="2"
            stroke-linecap="round"
            opacity=".85"
          />
          <ellipse
            cx="524"
            cy="200"
            rx="14"
            ry="9"
            fill="#ffffff"
            stroke="#cbd5e1"
            stroke-width="2"
            transform="rotate(16 524 200)"
          />
        </g>
      </g>
    </svg>
  </main>
</body>
</html>
