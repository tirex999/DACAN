<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelican Riding a Bicycle</title>
  <style>
    :root {
      --speed: 1;
      --sky-top: #8ed7ff;
      --sky-bottom: #eafaff;
      --cloud: rgba(255, 255, 255, 0.92);
      --hills: #7ed957;
      --hills2: #57c44f;
      --road: #555b66;
      --road-line: #ffd166;
      --bike1: #ef476f;
      --bike2: #ffd166;
      --rim: #f4a261;
      --spoke: #e0e0e0;
      --text: #182230;
      --panel: rgba(255, 255, 255, 0.18);
      --panel-border: rgba(255, 255, 255, 0.35);
      --shadow: rgba(0, 0, 0, 0.18);
      --page-bg1: #dff4ff;
      --page-bg2: #f9fbff;
    }

    body.night {
      --sky-top: #07163a;
      --sky-bottom: #273a66;
      --cloud: rgba(220, 230, 255, 0.16);
      --hills: #143d33;
      --hills2: #0c2f28;
      --road: #242830;
      --road-line: #ffd166;
      --bike1: #ff5d8f;
      --bike2: #ffd166;
      --rim: #f4a261;
      --spoke: #99a3b3;
      --text: #f7fbff;
      --panel: rgba(255, 255, 255, 0.09);
      --panel-border: rgba(255, 255, 255, 0.18);
      --shadow: rgba(0, 0, 0, 0.38);
      --page-bg1: #07132b;
      --page-bg2: #101f3a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(255,255,255,.22), transparent 32%),
        linear-gradient(135deg, var(--page-bg1), var(--page-bg2));
      transition: color .8s ease;
    }

    main {
      width: min(1050px, 100%);
    }

    header {
      margin-bottom: 18px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 4vw, 3rem);
      letter-spacing: -0.03em;
    }

    .sub {
      margin: 0;
      opacity: .86;
      font-size: clamp(0.95rem, 1.6vw, 1.08rem);
    }

    .scene {
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 22px 70px var(--shadow);
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(10px);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .controls {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      padding: 14px;
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      background: var(--panel);
      backdrop-filter: blur(10px);
    }

    button {
      border: 1px solid var(--panel-border);
      background: rgba(255,255,255,.14);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 16px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: transform .18s ease, background .25s ease, color .8s ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.24);
    }

    .speed-group {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      background: rgba(255,255,255,.10);
    }

    label {
      font-weight: 700;
      white-space: nowrap;
    }

    input[type="range"] {
      width: min(220px, 36vw);
      accent-color: #ef476f;
    }

    #speedLabel {
      min-width: 48px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
    }

    /* SVG animated parts */
    .sky-top {
      stop-color: var(--sky-top);
      transition: stop-color .8s ease;
    }

    .sky-bottom {
      stop-color: var(--sky-bottom);
      transition: stop-color .8s ease;
    }

    .frame1 {
      stop-color: var(--bike1);
      transition: stop-color .8s ease;
    }

    .frame2 {
      stop-color: var(--bike2);
      transition: stop-color .8s ease;
    }

    .hills {
      fill: var(--hills);
      transition: fill .8s ease;
    }

    .hills2 {
      fill: var(--hills2);
      transition: fill .8s ease;
    }

    .road {
      fill: var(--road);
      transition: fill .8s ease;
    }

    .road-line {
      stroke: var(--road-line);
      stroke-width: 10;
      stroke-linecap: round;
      stroke-dasharray: 48 34;
      animation: dash calc(1.15s * var(--speed)) linear infinite;
      transition: stroke .8s ease;
    }

    .cloud {
      fill: var(--cloud);
      transition: fill .8s ease;
    }

    .cloud-a {
      animation: drift calc(38s * var(--speed)) linear infinite;
    }

    .cloud-b {
      animation: drift calc(54s * var(--speed)) linear infinite;
      animation-delay: -18s;
    }

    .cloud-c {
      animation: drift calc(70s * var(--speed)) linear infinite;
      animation-delay: -42s;
    }

    .sun {
      opacity: 1;
      transition: opacity .8s ease, transform .8s ease;
    }

    .sun-rays {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin calc(24s * var(--speed)) linear infinite;
    }

    .moon {
      opacity: 0;
      transition: opacity .8s ease, transform .8s ease;
      transform: translateY(-18px);
    }

    body.night .sun {
      opacity: 0;
      transform: translateY(28px);
    }

    body.night .moon {
      opacity: 1;
      transform: translateY(0);
    }

    .star {
      fill: #fff;
      opacity: 0;
      transition: opacity .8s ease;
      animation-delay: var(--d, 0s);
    }

    body.night .star {
      animation: twinkle calc(2.4s * var(--speed)) ease-in-out infinite;
    }

    .wheel {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin calc(0.76s * var(--speed)) linear infinite;
    }

    .crank {
      transform-box: view-box;
      transform-origin: 430px 395px;
      animation: spin calc(0.38s * var(--speed)) linear infinite;
    }

    .pelican {
      transform-box: fill-box;
      transform-origin: center;
      animation: bob calc(0.55s * var(--speed)) ease-in-out infinite;
    }

    .wing {
      transform-box: fill-box;
      transform-origin: 12% 35%;
      animation: flap calc(0.55s * var(--speed)) ease-in-out infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -82;
      }
    }

    @keyframes drift {
      from {
        transform: translateX(-280px);
      }
      to {
        transform: translateX(1050px);
      }
    }

    @keyframes bob {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-5px) rotate(-0.8deg);
      }
    }

    @keyframes flap {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(-6deg);
      }
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: .18;
      }
      50% {
        opacity: 1;
      }
    }

    .motion-off * {
      animation-play-state: paused !important;
    }

    @media (prefers-reduced-motion: reduce) {
      .wheel,
      .road-line,
      .cloud-a,
      .cloud-b,
      .cloud-c,
      .pelican,
      .wing,
      .sun-rays,
      .star,
      .crank {
        animation: none !important;
      }
    }

    @media (max-width: 700px) {
      .controls {
        border-radius: 24px;
      }
      .speed-group {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Pelican Riding a Bicycle</h1>
      <p class="sub">A cartoon pelican pedaling along, with animated wheels, clouds, day/night mode, and a speed slider.</p>
    </header>

    <section class="scene">
      <svg viewBox="0 0 900 560" role="img" aria-labelledby="pelicanTitle pelicanDesc" xmlns="http://www.w3.org/2000/svg">
        <title id="pelicanTitle">A pelican riding a bicycle</title>
        <desc id="pelicanDesc">A cartoon pelican sits on a bicycle, holding the handlebars with its wings, pedaling on a road with hills, clouds, and sun.</desc>

        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop class="sky-top" offset="0" />
            <stop class="sky-bottom" offset="1" />
          </linearGradient>

          <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
            <stop class="frame1" offset="0" />
            <stop class="frame2" offset="1" />
          </linearGradient>

          <clipPath id="sceneClip">
            <rect width="900" height="560" rx="24" />
          </clipPath>
        </defs>

        <g clip-path="url(#sceneClip)">
          <!-- Sky -->
          <rect width="900" height="560" fill="url(#skyGrad)" />

          <!-- Stars -->
          <g>
            <circle class="star" cx="90" cy="80" r="2.5" style="--d:0s" />
            <circle class="star" cx="165" cy="55" r="2" style="--d:.35s" />
            <circle class="star" cx="240" cy="95" r="2.8" style="--d:.7s" />
            <circle class="star" cx="320" cy="60" r="1.8" style="--d:.15s" />
            <circle class="star" cx="420" cy="85" r="2.2" style="--d:.55s" />
            <circle class="star" cx="510" cy="55" r="2.6" style="--d:.8s" />
            <circle class="star" cx="590" cy="92" r="1.7" style="--d:.25s" />
            <circle class="star" cx="670" cy="60" r="2.4" style="--d:.6s" />
            <circle class="star" cx="820" cy="185" r="2.1" style="--d:.45s" />
            <circle class="star" cx="75" cy="180" r="2" style="--d:.9s" />
            <circle class="star" cx="775" cy="220" r="1.7" style="--d:.2s" />
            <circle class="star" cx="250" cy="165" r="1.6" style="--d:.65s" />
          </g>

          <!-- Sun -->
          <g class="sun">
            <g transform="translate(755 95)">
              <g class="sun-rays" stroke="#ffd84d" stroke-width="7" stroke-linecap="round">
                <line x1="0" y1="-62" x2="0" y2="-82" />
                <line x1="0" y1="62" x2="0" y2="82" />
                <line x1="-62" y1="0" x2="-82" y2="0" />
                <line x1="62" y1="0" x2="82" y2="0" />
                <line x1="-44" y1="-44" x2="-58" y2="-58" />
                <line x1="44" y1="-44" x2="58" y2="-58" />
                <line x1="-44" y1="44" x2="-58" y2="58" />
                <line x1="44" y1="44" x2="58" y2="58" />
              </g>
              <circle r="42" fill="#ffd84d" />
              <circle cx="-12" cy="-10" r="9" fill="#ffe98a" opacity=".75" />
            </g>
          </g>

          <!-- Moon -->
          <g class="moon">
            <path d="M772 60 a42 42 0 1 0 0 62 a32 32 0 1 1 0-62 z" fill="#f8f6d7" />
            <circle cx="742" cy="82" r="7" fill="#ddd9b8" opacity=".7" />
            <circle cx="736" cy="106" r="5" fill="#ddd9b8" opacity=".6" />
            <circle cx="750" cy="118" r="4" fill="#ddd9b8" opacity=".55" />
          </g>

          <!-- Clouds -->
          <g transform="translate(140 105)">
            <g class="cloud cloud-a">
              <ellipse cx="0" cy="0" rx="46" ry="22" />
              <ellipse cx="32" cy="8" rx="32" ry="18" />
              <ellipse cx="-34" cy="10" rx="30" ry="17" />
            </g>
          </g>

          <g transform="translate(640 72)">
            <g class="cloud cloud-b">
              <ellipse cx="0" cy="0" rx="54" ry="23" />
              <ellipse cx="38" cy="10" rx="34" ry="18" />
              <ellipse cx="-40" cy="11" rx="30" ry="17" />
            </g>
          </g>

          <g transform="translate(360 150)">
            <g class="cloud cloud-c">
              <ellipse cx="0" cy="0" rx="34" ry="16" />
              <ellipse cx="24" cy="6" rx="22" ry="13" />
              <ellipse cx="-25" cy="7" rx="21" ry="12" />
            </g>
          </g>

          <!-- Hills -->
          <path class="hills" d="M0 376 C115 292 205 328 330 358 C452 388 552 298 692 330 C806 356 855 336 900 346 L900 420 L0 420 Z" />
          <path class="hills2" d="M0 398 C145 350 240 396 420 401 C580 406 665 366 900 390 L900 430 L0 430 Z" />

          <!-- Road -->
          <rect class="road" x="0" y="400" width="900" height="160" />
          <rect x="0" y="400" width="900" height="8" fill="rgba(255,255,255,.18)" />
          <line class="road-line" x1="0" y1="470" x2="900" y2="470" />

          <!-- Shadow under bicycle -->
          <ellipse cx="430" cy="466" rx="190" ry="14" fill="rgba(0,0,0,.16)" />

          <!-- Bicycle -->
          <g>
            <!-- Rear wheel -->
            <g transform="translate(270 395)">
              <g class="wheel">
                <circle r="65" fill="none" stroke="#1f2430" stroke-width="12" />
                <circle r="56" fill="none" stroke="var(--rim)" stroke-width="3" />
                <g stroke="var(--spoke)" stroke-width="3" stroke-linecap="round">
                  <line x1="0" y1="-57" x2="0" y2="57" />
                  <line x1="-57" y1="0" x2="57" y2="0" />
                  <line x1="-40" y1="-40" x2="40" y2="40" />
                  <line x1="40" y1="-40" x2="-40" y2="40" />
                </g>
                <circle r="8" fill="#26303d" />
              </g>
            </g>

            <!-- Front wheel -->
            <g transform="translate(590 395)">
              <g class="wheel">
                <circle r="65" fill="none" stroke="#1f2430" stroke-width="12" />
                <circle r="56" fill="none" stroke="var(--rim)" stroke-width="3" />
                <g stroke="var(--spoke)" stroke-width="3" stroke-linecap="round">
                  <line x1="0" y1="-57" x2="0" y2="57" />
                  <line x1="-57" y1="0" x2="57" y2="0" />
                  <line x1="-40" y1="-40" x2="40" y2="40" />
                  <line x1="40" y1="-40" x2="-40" y2="40" />
                </g>
                <circle r="8" fill="#26303d" />
              </g>
            </g>

            <!-- Rear cog -->
            <circle cx="270" cy="395" r="14" fill="none" stroke="#7b8494" stroke-width="6" />

            <!-- Chain -->
            <path d="M430 377 L270 383 M430 413 L270 407" fill="none" stroke="#353b45" stroke-width="5" stroke-linecap="round" />

            <!-- Chainring -->
            <circle cx="430" cy="395" r="21" fill="#5f6977" stroke="#353b45" stroke-width="4" />

            <!-- Bicycle frame -->
            <g fill="none" stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
              <line x1="430" y1="395" x2="270" y2="395" />
              <line x1="430" y1="320" x2="270" y2="395" />
              <line x1="430" y1="320" x2="430" y2="395" />
              <line x1="430" y1="320" x2="540" y2="320" />
              <line x1="430" y1="395" x2="552" y2="338" />
              <line x1="540" y1="320" x2="555" y2="345" />
              <line x1="555" y1="345" x2="590" y2="395" />
            </g>

            <!-- Seatpost and saddle -->
            <line x1="430" y1="320" x2="430" y2="297" stroke="#353b45" stroke-width="8" stroke-linecap="round" />
            <rect x="395" y="290" width="70" height="10" rx="5" fill="#26303d" />

            <!-- Handlebar -->
            <g fill="none" stroke="#26303d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
              <line x1="540" y1="320" x2="524" y2="298" />
              <path d="M524 298 Q509 287 525 284 L560 284 Q576 284 567 295 L547 302" />
            </g>

            <!-- Bell -->
            <circle cx="548" cy="281" r="5" fill="#ffd166" stroke="#d9822b" stroke-width="2" />

            <!-- Crank and pedals -->
            <g class="crank">
              <line x1="430" y1="395" x2="452" y2="375" stroke="#26303d" stroke-width="7" stroke-linecap="round" />
              <line x1="430" y1="395" x2="408" y2="415" stroke="#26303d" stroke-width="7" stroke-linecap="round" />
              <rect x="442" y="369" width="25" height="10" rx="3" fill="#26303d" />
              <rect x="390" y="411" width="25" height="10" rx="3" fill="#26303d" />
            </g>
          </g>

          <!-- Pelican -->
          <g class="pelican">
            <!-- Back leg -->
            <path d="M415 278 C418 320 412 365 408 412" fill="none" stroke="#f2a65a" stroke-width="13" stroke-linecap="round" />
            <path d="M399 410 L422 404 L428 416 L400 422 Z" fill="#f2a65a" />

            <!-- Tail -->
            <path d="M360 245 C325 228 303 234 292 250 C315 256 334 262 358 272 Z" fill="#f7fbff" stroke="#ccd8e8" stroke-width="3" stroke-linejoin="round" />

            <!-- Neck -->
            <path d="M455 230 C488 208 488 176 522 175" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />

            <!-- Body -->
            <ellipse cx="420" cy="250" rx="58" ry="42" fill="#ffffff" stroke="#ccd8e8" stroke-width="3" />

            <!-- Body shading -->
            <path d="M378 264 C395 290 445 292 465 264 C450 285 395 285 378 264" fill="#e8f1ff" opacity=".75" />

            <!-- Head -->
            <circle cx="525" cy="175" r="24" fill="#ffffff" stroke="#ccd8e8" stroke-width="3" />

            <!-- Upper bill -->
            <path d="M544 168 C566 160 596 168 618 186 L546 184 Z" fill="#f4a261" stroke="#d9822b" stroke-width="3" stroke-linejoin="round" />

            <!-- Pouch -->
            <path d="M546 184 C562 216 596 212 616 187 C596 198 570 193 546 184 Z" fill="#f7b267" stroke="#d9822b" stroke-width="3" stroke-linejoin="round" />

            <!-- Bill line -->
            <line x1="548" y1="180" x2="612" y2="186" stroke="#d9822b" stroke-width="2" opacity=".7" />

            <!-- Eye -->
            <circle cx="532" cy="170" r="4.5" fill="#22313f" />
            <circle cx="533.5" cy="168.5" r="1.5" fill="#ffffff" />

            <!-- Wing reaching handlebar -->
            <path class="wing" d="M402 224 C455 218 495 245 520 290 C502 295 485 292 468 280 C442 262 420 268 398 272 Z" fill="#f7fbff" stroke="#ccd8e8" stroke-width="3" stroke-linejoin="round" />

            <!-- Wing feather lines -->
            <g stroke="#d7e3f3" stroke-width="2" fill="none" opacity=".9">
              <path d="M420 236 C445 242 470 258 492 280" />
              <path d="M412 248 C438 254 462 268 482 283" />
            </g>

            <!-- Front leg -->
            <path d="M425 278 C450 305 451 340 452 372" fill="none" stroke="#f2a65a" stroke-width="13" stroke-linecap="round" />
            <path d="M440 368 L464 361 L470 373 L443 380 Z" fill="#f2a65a" />
          </g>
        </g>
      </svg>
    </section>

    <section class="controls" aria-label="Scene controls">
      <button id="themeBtn" type="button" aria-pressed="false">🌙 Night</button>

      <div class="speed-group">
        <label for="speedInput">Speed</label>
        <input id="speedInput" type="range" min="10" max="100" value="50" />
        <span id="speedLabel">1.0×</span>
      </div>

      <button id="motionBtn" type="button" aria-pressed="false">⏸ Pause</button>
    </section>
  </main>

  <script>
    const root = document.documentElement;
    const body = document.body;

    const themeBtn = document.getElementById("themeBtn");
    const motionBtn = document.getElementById("motionBtn");
    const speedInput = document.getElementById("speedInput");
    const speedLabel = document.getElementById("speedLabel");

    function updateSpeed() {
      const value = Number(speedInput.value);
      const speed = value / 50;
      const factor = 1 / speed;
      root.style.setProperty("--speed", factor.toFixed(3));
      speedLabel.textContent = `${speed.toFixed(1)}×`;
    }

    themeBtn.addEventListener("click", () => {
      const isNight = body.classList.toggle("night");
      themeBtn.textContent = isNight ? "☀️ Day" : "🌙 Night";
      themeBtn.setAttribute("aria-pressed", String(isNight));
    });

    motionBtn.addEventListener("click", () => {
      const isPaused = body.classList.toggle("motion-off");
      motionBtn.textContent = isPaused ? "▶ Play" : "⏸ Pause";
      motionBtn.setAttribute("aria-pressed", String(isPaused));
    });

    speedInput.addEventListener("input", updateSpeed);
    updateSpeed();
  </script>
</body>
</html>
