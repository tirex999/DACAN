<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelican Riding a Bicycle</title>
<style>
  :root { color-scheme: dark; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at top, #1e293b, #020617);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color: #e2e8f0;
    padding: 24px;
    box-sizing: border-box;
  }

  main {
    width: min(960px, 100%);
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 28px;
    padding: 22px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(10px);
  }

  h1 {
    margin: 0 0 14px;
    font-size: clamp(1.2rem, 2.5vw, 2rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    text-align: center;
  }

  p {
    margin: 0 0 18px;
    text-align: center;
    color: #cbd5e1;
    font-size: 0.95rem;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 20px;
    background: #e0f2fe;
    box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.08);
  }

  .wheel {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 1.8s linear infinite;
  }

  .bike {
    transform-box: view-box;
    transform-origin: 400px 430px;
    animation: bob 1.2s ease-in-out infinite;
  }

  .pelican {
    transform-box: view-box;
    transform-origin: 330px 220px;
    animation: bob 1.2s ease-in-out infinite;
  }

  .leg {
    transform-box: view-box;
  }

  .leg-right {
    transform-origin: 345px 265px;
    animation: pedalRight 1.2s ease-in-out infinite;
  }

  .leg-left {
    transform-origin: 325px 270px;
    animation: pedalLeft 1.2s ease-in-out infinite;
  }

  .pouch {
    transform-box: fill-box;
    transform-origin: 0% 50%;
    animation: flap 1.2s ease-in-out infinite;
  }

  .cloud {
    transform-box: view-box;
    animation: drift 16s ease-in-out infinite;
  }

  .cloud-2 {
    animation-duration: 22s;
    animation-delay: -7s;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  @keyframes pedalRight {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(7deg); }
  }

  @keyframes pedalLeft {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-7deg); }
  }

  @keyframes flap {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(1.12); }
  }

  @keyframes drift {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(24px); }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
    }
  }
</style>
</head>
<body>
<main>
  <h1>Pelican Riding a Bicycle</h1>
  <p>A friendly cartoon pelican pedaling along a sunny road.</p>

  <svg viewBox="0 0 800 600" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
    <title id="title">Pelican riding a bicycle</title>
    <desc id="desc">A cartoon pelican with a large orange beak rides a red bicycle on a grassy road under a blue sky.</desc>

    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#bfdbfe" />
        <stop offset="1" stop-color="#e0f2fe" />
      </linearGradient>

      <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#86efac" />
        <stop offset="1" stop-color="#16a34a" />
      </linearGradient>

      <radialGradient id="sun" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#fffbeb" />
        <stop offset="1" stop-color="#fde68a" />
      </radialGradient>
    </defs>

    <rect width="800" height="600" fill="url(#sky)" />

    <circle cx="690" cy="95" r="55" fill="url(#sun)" />

    <g class="cloud" fill="#ffffff" opacity=".92">
      <ellipse cx="150" cy="100" rx="46" ry="24" />
      <ellipse cx="190" cy="90" rx="34" ry="20" />
      <ellipse cx="112" cy="96" rx="28" ry="17" />
    </g>

    <g class="cloud cloud-2" fill="#ffffff" opacity=".82">
      <ellipse cx="520" cy="130" rx="40" ry="20" />
      <ellipse cx="555" cy="122" rx="28" ry="16" />
      <ellipse cx="490" cy="126" rx="24" ry="14" />
    </g>

    <path d="M0 510 Q200 485 400 510 T800 510 V600 H0 Z" fill="url(#ground)" />
    <path d="M0 510 Q200 485 400 510 T800 510" fill="none" stroke="#15803d" stroke-width="6" />
    <path d="M0 510 H800" stroke="#64748b" stroke-width="10" stroke-linecap="round" opacity=".55" />

    <g class="bike">
      <!-- Rear wheel -->
      <g class="wheel">
        <circle cx="250" cy="430" r="80" fill="none" stroke="#111827" stroke-width="12" />
        <circle cx="250" cy="430" r="64" fill="none" stroke="#e5e7eb" stroke-width="6" />
        <g stroke="#94a3b8" stroke-width="2">
          <line x1="250" y1="366" x2="250" y2="494" />
          <line x1="186" y1="430" x2="314" y2="430" />
          <line x1="204.6" y1="384.6" x2="295.4" y2="475.4" />
          <line x1="295.4" y1="384.6" x2="204.6" y2="475.4" />
        </g>
        <circle cx="250" cy="430" r="10" fill="#334155" />
      </g>

      <!-- Front wheel -->
      <g class="wheel">
        <circle cx="550" cy="430" r="80" fill="none" stroke="#111827" stroke-width="12" />
        <circle cx="550" cy="430" r="64" fill="none" stroke="#e5e7eb" stroke-width="6" />
        <g stroke="#94a3b8" stroke-width="2">
          <line x1="550" y1="366" x2="550" y2="494" />
          <line x1="486" y1="430" x2="614" y2="430" />
          <line x1="504.6" y1="384.6" x2="595.4" y2="475.4" />
          <line x1="595.4" y1="384.6" x2="504.6" y2="475.4" />
        </g>
        <circle cx="550" cy="430" r="10" fill="#334155" />
      </g>

      <!-- Chain and gears -->
      <g fill="#cbd5e1" stroke="#475569" stroke-width="4">
        <circle cx="250" cy="430" r="14" />
        <circle cx="400" cy="430" r="28" />
      </g>
      <g stroke="#475569" stroke-width="4" fill="none">
        <path d="M250 416 L400 402" />
        <path d="M250 444 L400 458" />
      </g>

      <!-- Bicycle frame -->
      <path d="M250 430 L400 430 L360 300 L510 320 L400 430 M510 320 L525 280 L550 430 M360 300 L350 270 M525 280 L545 260"
            fill="none"
            stroke="#ef4444"
            stroke-width="10"
            stroke-linecap="round"
            stroke-linejoin="round" />

      <!-- Crank and pedals -->
      <g stroke="#334155" stroke-width="8" stroke-linecap="round">
        <line x1="400" y1="430" x2="430" y2="405" />
        <line x1="400" y1="430" x2="370" y2="455" />
      </g>

      <rect x="418" y="398" width="24" height="10" rx="3" fill="#111827" transform="rotate(-15 430 405)" />
      <rect x="358" y="450" width="24" height="10" rx="3" fill="#111827" transform="rotate(15 370 455)" />

      <!-- Saddle -->
      <path d="M318 270 Q350 252 382 270 Q350 284 318 270 Z" fill="#111827" />

      <!-- Handlebar -->
      <path d="M545 260 C560 242 582 248 576 268" fill="none" stroke="#111827" stroke-width="8" stroke-linecap="round" />
      <circle cx="576" cy="268" r="6" fill="#111827" />
    </g>

    <g class="pelican">
      <!-- Far wing -->
      <path d="M290 215 C315 175 375 165 425 185 C385 205 335 225 290 235 Z"
            fill="#e2e8f0"
            stroke="#cbd5e1"
            stroke-width="2" />

      <!-- Legs -->
      <g class="leg leg-right" stroke="#f59e0b" stroke-width="13" stroke-linecap="round" fill="none">
        <path d="M345 265 C365 305 395 360 422 398" />
        <path d="M410 395 L448 392 L442 414 L418 416 Z"
              fill="#f59e0b"
              stroke="#d97706"
              stroke-width="2"
              stroke-linejoin="round" />
      </g>

      <g class="leg leg-left" stroke="#f59e0b" stroke-width="13" stroke-linecap="round" fill="none">
        <path d="M325 270 C335 330 350 410 365 448" />
        <path d="M352 448 L390 448 L384 470 L360 470 Z"
              fill="#f59e0b"
              stroke="#d97706"
              stroke-width="2"
              stroke-linejoin="round" />
      </g>

      <!-- Tail -->
      <path d="M255 215 C220 195 205 225 240 240 C225 250 235 265 260 255 Z"
            fill="#e2e8f0"
            stroke="#cbd5e1"
            stroke-width="2" />

      <!-- Body -->
      <ellipse cx="330" cy="220" rx="80" ry="58" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" />
      <ellipse cx="320" cy="235" rx="55" ry="35" fill="#e2e8f0" opacity=".55" />

      <!-- Neck -->
      <path d="M365 195 C390 150 415 118 455 122 L468 150 C430 150 400 180 385 215 Z"
            fill="#f8fafc"
            stroke="#cbd5e1"
            stroke-width="3" />

      <!-- Head -->
      <circle cx="465" cy="135" r="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" />
      <circle cx="472" cy="128" r="5" fill="#111827" />
      <circle cx="474" cy="126" r="1.7" fill="#ffffff" />

      <!-- Beak -->
      <path d="M482 128 L615 148 L605 162 L482 148 Z"
            fill="#f59e0b"
            stroke="#d97706"
            stroke-width="2"
            stroke-linejoin="round" />

      <path class="pouch"
            d="M482 148 C510 215 575 205 605 162 L615 148 Z"
            fill="#fbbf24"
            stroke="#d97706"
            stroke-width="2"
            stroke-linejoin="round" />

      <path d="M500 138 L600 154"
            stroke="#d97706"
            stroke-width="2"
            opacity=".45"
            stroke-linecap="round" />

      <!-- Near wing reaching handlebar -->
      <path d="M340 205 C400 190 480 220 555 252 L572 264 C500 252 420 235 350 235 Z"
            fill="#f8fafc"
            stroke="#cbd5e1"
            stroke-width="3" />

      <path d="M555 252 C565 248 575 255 572 264 C565 268 555 262 555 252 Z"
            fill="#f8fafc"
            stroke="#cbd5e1"
            stroke-width="2" />

      <g stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M370 215 C410 210 450 225 485 240" />
        <path d="M365 225 C405 222 445 235 480 248" />
      </g>
    </g>
  </svg>
</main>
</body>
</html>
