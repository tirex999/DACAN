<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelican Riding a Bicycle</title>
  <style>
    :root {
      --paper: #ffffff;
      --ink: #123;
      --shadow: rgba(23, 53, 74, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,.85), transparent 35%),
        linear-gradient(180deg, #e8f7ff, #f6fbff);
    }

    .frame {
      width: min(95vw, 920px);
      padding: clamp(12px, 2.5vw, 28px);
      border: 1px solid #e2e8f0;
      border-radius: 28px;
      background: rgba(255, 255, 255, .93);
      box-shadow: 0 18px 45px var(--shadow);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 20px;
      background: transparent;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .wheel {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 4s linear infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-7px); }
    }

    .bob {
      animation: bob 2s ease-in-out infinite;
    }

    @keyframes driftA {
      from { transform: translateX(0); }
      to   { transform: translateX(28px); }
    }

    @keyframes driftB {
      from { transform: translateX(0); }
      to   { transform: translateX(-24px); }
    }

    .cloud-a {
      animation: driftA 22s ease-in-out infinite alternate;
    }

    .cloud-b {
      animation: driftB 28s ease-in-out infinite alternate;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="frame">
    <svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svgTitle svgDesc">
      <title id="svgTitle">A cartoon pelican riding a bicycle</title>
      <desc id="svgDesc">A white pelican with a long orange beak and throat pouch sits on a red bicycle, holding the handlebars with one wing and placing its webbed feet on the pedals.</desc>

      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#bde8ff"/>
          <stop offset=".55" stop-color="#e5f7ff"/>
          <stop offset="1" stop-color="#f8fdff"/>
        </linearGradient>

        <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#86d8a9"/>
          <stop offset="1" stop-color="#4caf7d"/>
        </linearGradient>

        <linearGradient id="bodyGrad" x1="0" y1="0" x2=".35" y2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset=".65" stop-color="#eaf2f7"/>
          <stop offset="1" stop-color="#d5e4f0"/>
        </linearGradient>

        <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffca3a"/>
          <stop offset="1" stop-color="#ff8f1f"/>
        </linearGradient>

        <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd166"/>
          <stop offset="1" stop-color="#ff9f1c"/>
        </linearGradient>
      </defs>

      <!-- Sky -->
      <rect x="0" y="0" width="800" height="600" fill="url(#skyGrad)"/>

      <!-- Sun -->
      <circle cx="112" cy="96" r="46" fill="#ffd166" opacity=".92"/>
      <circle cx="112" cy="96" r="62" fill="#ffd166" opacity=".12"/>

      <!-- Clouds -->
      <g class="cloud-a" fill="#ffffff" opacity=".88">
        <ellipse cx="220" cy="110" rx="42" ry="22"/>
        <ellipse cx="265" cy="100" rx="34" ry="24"/>
        <ellipse cx="180" cy="118" rx="30" ry="18"/>
      </g>

      <g class="cloud-b" fill="#ffffff" opacity=".78">
        <ellipse cx="615" cy="92" rx="38" ry="20"/>
        <ellipse cx="655" cy="84" rx="28" ry="18"/>
        <ellipse cx="580" cy="100" rx="24" ry="15"/>
      </g>

      <!-- Distant hills -->
      <path d="M0,455 C95,410 190,450 300,430 C420,408 520,455 640,430 C710,415 765,445 800,435 L800,600 L0,600Z" fill="#a7e8bd" opacity=".65"/>

      <!-- Ground -->
      <path d="M0,478 C160,452 300,498 470,470 C610,447 705,495 800,478 L800,600 L0,600Z" fill="url(#groundGrad)"/>

      <!-- Road -->
      <path d="M0,500 C210,488 620,522 800,503 L800,540 C620,556 210,528 0,538 Z" fill="#e9ecef" stroke="#ced4da" stroke-width="2"/>
      <path d="M20,519 C210,510 600,538 790,521" fill="none" stroke="#ffb703" stroke-width="5" stroke-dasharray="28 22" stroke-linecap="round" opacity=".8"/>

      <!-- Ground shadow -->
      <ellipse cx="400" cy="510" rx="250" ry="22" fill="#2d6a4f" opacity=".16"/>

      <!-- Bicycle + pelican, gently bobbing -->
      <g class="bob">

        <!-- Rear wheel -->
        <g class="wheel">
          <circle cx="260" cy="430" r="72" fill="none" stroke="#1f2937" stroke-width="14"/>
          <circle cx="260" cy="430" r="58" fill="none" stroke="#dee2e6" stroke-width="4"/>

          <g stroke="#adb5bd" stroke-width="3" stroke-linecap="round">
            <line x1="260" y1="374" x2="260" y2="486"/>
            <line x1="260" y1="374" x2="260" y2="486" transform="rotate(45 260 430)"/>
            <line x1="260" y1="374" x2="260" y2="486" transform="rotate(90 260 430)"/>
            <line x1="260" y1="374" x2="260" y2="486" transform="rotate(135 260 430)"/>
          </g>

          <circle cx="260" cy="430" r="15" fill="none" stroke="#495057" stroke-width="4"/>
          <circle cx="260" cy="430" r="10" fill="#495057"/>
        </g>

        <!-- Front wheel -->
        <g class="wheel">
          <circle cx="540" cy="430" r="72" fill="none" stroke="#1f2937" stroke-width="14"/>
          <circle cx="540" cy="430" r="58" fill="none" stroke="#dee2e6" stroke-width="4"/>

          <g stroke="#adb5bd" stroke-width="3" stroke-linecap="round">
            <line x1="540" y1="374" x2="540" y2="486"/>
            <line x1="540" y1="374" x2="540" y2="486" transform="rotate(45 540 430)"/>
            <line x1="540" y1="374" x2="540" y2="486" transform="rotate(90 540 430)"/>
            <line x1="540" y1="374" x2="540" y2="486" transform="rotate(135 540 430)"/>
          </g>

          <circle cx="540" cy="430" r="11" fill="#495057"/>
        </g>

        <!-- Bicycle frame -->
        <g fill="none" stroke="#d62828" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
          <!-- Chainstay -->
          <path d="M260,430 L400,432"/>
          <!-- Seatstay -->
          <path d="M260,430 L385,300"/>
          <!-- Seat tube -->
          <path d="M400,432 L385,300"/>
          <!-- Top tube -->
          <path d="M385,300 L480,290"/>
          <!-- Down tube -->
          <path d="M400,432 L485,385"/>
          <!-- Head tube -->
          <path d="M480,290 L485,385"/>
          <!-- Fork -->
          <path d="M485,385 L540,430"/>
          <!-- Stem -->
          <path d="M480,290 L505,265"/>
          <!-- Handlebar -->
          <path d="M505,265 C522,254 534,262 540,280"/>
        </g>

        <!-- Chain -->
        <g fill="none" stroke="#343a40" stroke-width="4" stroke-linecap="round">
          <path d="M274,423 L375,426"/>
          <path d="M274,447 L375,450"/>
        </g>

        <!-- Crankset and pedals -->
        <g>
          <line x1="400" y1="432" x2="345" y2="475" stroke="#212529" stroke-width="10" stroke-linecap="round"/>
          <line x1="400" y1="432" x2="452" y2="395" stroke="#212529" stroke-width="10" stroke-linecap="round"/>

          <circle cx="400" cy="432" r="26" fill="#dee2e6" stroke="#495057" stroke-width="4"/>
          <circle cx="400" cy="432" r="18" fill="none" stroke="#adb5bd" stroke-width="2"/>
          <circle cx="400" cy="432" r="6" fill="#868e96"/>

          <rect x="319" y="470" width="52" height="12" rx="5" fill="#212529" transform="rotate(-10 345 476)"/>
          <rect x="430" y="388" width="44" height="10" rx="5" fill="#495057" transform="rotate(8 452 393)"/>
        </g>

        <!-- Seatpost and saddle -->
        <path d="M385,300 L378,279" fill="none" stroke="#495057" stroke-width="8" stroke-linecap="round"/>
        <path d="M348,277 C362,265 392,265 406,276 C408,283 390,289 373,288 C358,288 349,284 348,277 Z" fill="#212529"/>

        <!-- Handlebar grips -->
        <circle cx="505" cy="265" r="7" fill="#212529"/>
        <circle cx="540" cy="280" r="7" fill="#212529"/>

        <!-- Pelican -->

        <!-- Tail -->
        <path d="M312,232 C275,180 238,188 250,212 C270,215 291,231 302,254 Z" fill="url(#bodyGrad)" stroke="#495057" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M260,203 C277,214 293,231 302,246" fill="none" stroke="#b8c5cf" stroke-width="2.5" stroke-linecap="round"/>

        <!-- Body -->
        <path d="M292,248 C288,188 415,176 432,232 C448,290 392,312 344,307 C304,303 296,285 292,248 Z" fill="url(#bodyGrad)" stroke="#495057" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M305,283 C334,303 379,307 425,278" fill="none" stroke="#cfd8dc" stroke-width="3" stroke-linecap="round" opacity=".75"/>

        <!-- Neck -->
        <path d="M402,248 C424,220 442,176 470,153" fill="none" stroke="#495057" stroke-width="42" stroke-linecap="round"/>
        <path d="M402,248 C424,220 442,176 470,153" fill="none" stroke="url(#bodyGrad)" stroke-width="36" stroke-linecap="round"/>
        <path d="M410,234 C427,213 444,187 465,164" fill="none" stroke="#d9e6f0" stroke-width="4" stroke-linecap="round" opacity=".8"/>

        <!-- Head -->
        <circle cx="478" cy="149" r="31" fill="url(#bodyGrad)" stroke="#495057" stroke-width="2.5"/>
        <circle cx="478" cy="149" r="31" fill="#ffffff" opacity=".65"/>

        <!-- Small head crest -->
        <path d="M456,131 C468,115 488,112 500,127" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity=".8"/>

        <!-- Upper beak -->
        <path d="M499,136 C536,142 578,151 605,157 L605,164 C573,167 528,162 500,163 Z" fill="url(#beakGrad)" stroke="#e76f51" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M503,143 C542,150 578,158 599,161" fill="none" stroke="#ffe8a3" stroke-width="4" stroke-linecap="round" opacity=".85"/>

        <!-- Throat pouch -->
        <path d="M498,158 C504,206 559,222 605,165 L602,160 C565,172 522,167 498,160 Z" fill="url(#pouchGrad)" stroke="#e76f51" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M510,170 C525,198 560,208 590,185" fill="none" stroke="#ff9f1c" stroke-width="3" opacity=".7"/>

        <!-- Eye -->
        <circle cx="489" cy="141" r="7" fill="#212529"/>
        <circle cx="491" cy="139" r="2.2" fill="#ffffff"/>
        <circle cx="486" cy="143" r="1" fill="#ffffff" opacity=".6"/>

        <!-- Far leg -->
        <path d="M405,298 C420,333 436,364 448,387" fill="none" stroke="#fb8500" stroke-width="13" stroke-linecap="round"/>
        <path d="M446,387 L478,391 L469,402 L446,402 Z" fill="#fb8500" stroke="#e76f51" stroke-width="2.5" stroke-linejoin="round"/>

        <!-- Near leg -->
        <path d="M368,302 C356,344 348,432 345,468" fill="none" stroke="#fb8500" stroke-width="15" stroke-linecap="round"/>
        <path d="M332,472 L373,465 L364,482 L344,485 L331,490 Z" fill="#fb8500" stroke="#e76f51" stroke-width="2.5" stroke-linejoin="round"/>

        <!-- Wing gripping the handlebar -->
        <path d="M337,240 C344,184 408,176 484,242 C504,257 516,262 514,268 C499,282 470,276 434,266 C385,253 352,262 337,240 Z" fill="#ffffff" stroke="#495057" stroke-width="2.5" stroke-linejoin="round"/>

        <path d="M345,232 C360,195 410,188 470,235" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".7"/>

        <g fill="none" stroke="#b8c5cf" stroke-width="2.5" stroke-linecap="round">
          <path d="M372,222 C408,223 449,236 491,261"/>
          <path d="M365,239 C398,240 438,250 478,268"/>
          <path d="M350,247 C380,249 417,259 451,271"/>
        </g>

        <path d="M478,242 C498,252 515,261 514,268 C505,272 491,268 475,261 Z" fill="#f1f3f5" stroke="#b8c5cf" stroke-width="2" stroke-linejoin="round"/>
      </g>
    </svg>
  </main>
</body>
</html>
