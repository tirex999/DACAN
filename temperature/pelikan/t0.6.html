<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelican Riding a Bicycle</title>
  <style>
    :root {
      color-scheme: light;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f9fc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
      box-sizing: border-box;
    }

    .stage {
      width: min(92vw, 940px);
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 28px;
      box-shadow:
        0 20px 50px rgba(20, 30, 55, 0.16),
        0 4px 12px rgba(20, 30, 55, 0.08);
      background: #e0f7ff;
    }

    .wheel {
      transform-box: view-box;
      transform-origin: 250px 420px;
      animation: spin 3.2s linear infinite;
    }

    .front-wheel {
      transform-origin: 550px 420px;
    }

    .rays {
      transform-box: view-box;
      transform-origin: 670px 100px;
      animation: spin 24s linear infinite;
    }

    .pelican {
      transform-box: view-box;
      animation: bob 2.6s ease-in-out infinite;
    }

    .wing {
      transform-box: view-box;
      transform-origin: 365px 245px;
      animation: flap 1.8s ease-in-out infinite;
    }

    .cloud {
      transform-box: view-box;
      animation: drift 22s linear infinite;
    }

    .cloud-b {
      animation-duration: 28s;
      animation-delay: -9s;
    }

    .road-line {
      animation: dash 1.1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes bob {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-7px);
      }
    }

    @keyframes flap {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(-7deg);
      }
    }

    @keyframes drift {
      0% {
        transform: translateX(-140px);
      }
      100% {
        transform: translateX(920px);
      }
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -95;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <svg
      viewBox="0 0 800 600"
      role="img"
      aria-labelledby="pelicanTitle pelicanDesc"
      xmlns="http://www.w3.org/2000/svg"
    >
      <title id="pelicanTitle">Pelican riding a bicycle</title>
      <desc id="pelicanDesc">
        A stylized white pelican with a large orange beak and pouch rides a red bicycle
        along a sunny road.
      </desc>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8ecae6" />
          <stop offset="65%" stop-color="#cdeffd" />
          <stop offset="100%" stop-color="#f7fcff" />
        </linearGradient>

        <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff6b6b" />
          <stop offset="100%" stop-color="#c1121f" />
        </linearGradient>

        <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffe066" />
          <stop offset="100%" stop-color="#ff9e00" />
        </linearGradient>

        <linearGradient id="pouchGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffba08" />
          <stop offset="100%" stop-color="#fb8500" />
        </linearGradient>

        <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="100%" stop-color="#e6edf3" />
        </linearGradient>

        <linearGradient id="tireGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#3a3d42" />
          <stop offset="100%" stop-color="#111214" />
        </linearGradient>
      </defs>

      <!-- Sky -->
      <rect x="0" y="0" width="800" height="600" fill="url(#sky)" />

      <!-- Sun -->
      <g class="rays" stroke="#ffd166" stroke-width="7" stroke-linecap="round">
        <line x1="670" y1="28" x2="670" y2="54" />
        <line x1="670" y1="146" x2="670" y2="172" />
        <line x1="598" y1="100" x2="624" y2="100" />
        <line x1="716" y1="100" x2="742" y2="100" />
        <line x1="618" y1="48" x2="636" y2="66" />
        <line x1="704" y1="134" x2="722" y2="152" />
        <line x1="722" y1="48" x2="704" y2="66" />
        <line x1="636" y1="134" x2="618" y2="152" />
      </g>
      <circle cx="670" cy="100" r="45" fill="#ffd166" />
      <circle cx="655" cy="88" r="14" fill="#fff3b0" opacity="0.75" />

      <!-- Clouds -->
      <g class="cloud" opacity="0.93">
        <ellipse cx="125" cy="112" rx="44" ry="24" fill="#ffffff" />
        <ellipse cx="165" cy="100" rx="34" ry="22" fill="#ffffff" />
        <ellipse cx="92" cy="122" rx="28" ry="18" fill="#ffffff" />
      </g>

      <g class="cloud cloud-b" opacity="0.86">
        <ellipse cx="560" cy="150" rx="38" ry="21" fill="#ffffff" />
        <ellipse cx="595" cy="140" rx="28" ry="18" fill="#ffffff" />
        <ellipse cx="532" cy="158" rx="24" ry="15" fill="#ffffff" />
      </g>

      <!-- Hills -->
      <path
        d="M0,490 Q150,400 320,465 T800,448 L800,490 Z"
        fill="#9bd16b"
      />
      <path
        d="M0,490 Q220,430 430,480 T800,470 L800,490 Z"
        fill="#7cb342"
        opacity="0.85"
      />

      <!-- Road -->
      <rect x="0" y="490" width="800" height="110" fill="#4b4f58" />
      <rect x="0" y="490" width="800" height="5" fill="#d8dee9" opacity="0.8" />
      <line
        class="road-line"
        x1="0"
        y1="545"
        x2="800"
        y2="545"
        stroke="#f8f9fa"
        stroke-width="8"
        stroke-linecap="round"
        stroke-dasharray="55 40"
      />

      <!-- Bicycle shadow -->
      <ellipse cx="400" cy="492" rx="230" ry="16" fill="rgba(0,0,0,0.18)" />

      <!-- Rear wheel -->
      <g class="wheel rear-wheel">
        <circle cx="250" cy="420" r="70" fill="none" stroke="url(#tireGrad)" stroke-width="14" />
        <circle cx="250" cy="420" r="58" fill="none" stroke="#dfe7ef" stroke-width="4" />
        <g stroke="#cbd5e1" stroke-width="3" stroke-linecap="round">
          <line x1="250" y1="362" x2="250" y2="478" />
          <line x1="250" y1="362" x2="250" y2="478" transform="rotate(30 250 420)" />
          <line x1="250" y1="362" x2="250" y2="478" transform="rotate(60 250 420)" />
          <line x1="250" y1="362" x2="250" y2="478" transform="rotate(90 250 420)" />
          <line x1="250" y1="362" x2="250" y2="478" transform="rotate(120 250 420)" />
          <line x1="250" y1="362" x2="250" y2="478" transform="rotate(150 250 420)" />
        </g>
        <circle cx="250" cy="420" r="9" fill="#333842" />
        <circle cx="250" cy="420" r="16" fill="none" stroke="#555b66" stroke-width="5" />
      </g>

      <!-- Front wheel -->
      <g class="wheel front-wheel">
        <circle cx="550" cy="420" r="70" fill="none" stroke="url(#tireGrad)" stroke-width="14" />
        <circle cx="550" cy="420" r="58" fill="none" stroke="#dfe7ef" stroke-width="4" />
        <g stroke="#cbd5e1" stroke-width="3" stroke-linecap="round">
          <line x1="550" y1="362" x2="550" y2="478" />
          <line x1="550" y1="362" x2="550" y2="478" transform="rotate(30 550 420)" />
          <line x1="550" y1="362" x2="550" y2="478" transform="rotate(60 550 420)" />
          <line x1="550" y1="362" x2="550" y2="478" transform="rotate(90 550 420)" />
          <line x1="550" y1="362" x2="550" y2="478" transform="rotate(120 550 420)" />
          <line x1="550" y1="362" x2="550" y2="478" transform="rotate(150 550 420)" />
        </g>
        <circle cx="550" cy="420" r="9" fill="#333842" />
      </g>

      <!-- Chain and drivetrain -->
      <g stroke="#5c626d" stroke-width="6" stroke-linecap="round" fill="none">
        <path d="M400,412 L250,412" />
        <path d="M400,428 L250,428" />
      </g>
      <circle cx="400" cy="420" r="20" fill="#444a55" stroke="#666e7a" stroke-width="4" />
      <circle cx="250" cy="420" r="16" fill="#444a55" stroke="#666e7a" stroke-width="4" />

      <!-- Bicycle frame -->
      <g stroke="url(#frameGrad)" stroke-width="13" stroke-linecap="round" fill="none">
        <path d="M400,420 L250,420" />
        <path d="M365,295 L250,420" />
        <path d="M400,420 L365,295" />
        <path d="M400,420 L520,345" />
        <path d="M365,295 L515,300" />
        <path d="M515,300 L527,352" />
        <path d="M527,352 L550,420" />
      </g>

      <!-- Seatpost and saddle -->
      <path d="M365,295 L359,282" stroke="#333842" stroke-width="7" stroke-linecap="round" fill="none" />
      <path
        d="M339,292 Q365,276 393,292 L382,305 L352,305 Z"
        fill="#2f343b"
        stroke="#22262c"
        stroke-width="2"
      />

      <!-- Handlebar -->
      <g stroke="#2f343b" stroke-width="8" stroke-linecap="round" fill="none">
        <path d="M515,300 L538,270" />
        <path d="M538,270 L565,282" />
        <path d="M538,270 L518,292" />
      </g>

      <!-- Crank arms and pedals -->
      <g stroke="#252a31" stroke-width="9" stroke-linecap="round">
        <line x1="400" y1="420" x2="427" y2="448" />
        <line x1="400" y1="420" x2="373" y2="392" />
      </g>
      <rect x="415" y="440" width="26" height="10" rx="5" fill="#1f242a" transform="rotate(20 428 445)" />
      <rect x="359" y="384" width="26" height="10" rx="5" fill="#1f242a" transform="rotate(20 372 389)" />

      <!-- Pelican -->
      <g class="pelican">
        <!-- Legs -->
        <g stroke="#f28b30" stroke-width="10" stroke-linecap="round" fill="none">
          <path d="M395,282 C408,335 418,395 425,438" />
          <path d="M410,278 C402,325 388,360 375,395" />
        </g>

        <!-- Feet -->
        <g fill="#f28b30">
          <path d="M425,438 L447,431 L438,449 Z" />
          <path d="M375,395 L397,388 L388,406 Z" />
        </g>

        <!-- Tail -->
        <path
          d="M318,250 C285,232 262,242 249,262 C278,281 306,277 322,268 Z"
          fill="url(#bodyGrad)"
          stroke="#d9e2ec"
          stroke-width="2"
        />

        <!-- Body -->
        <ellipse
          cx="380"
          cy="250"
          rx="62"
          ry="48"
          transform="rotate(-10 380 250)"
          fill="url(#bodyGrad)"
          stroke="#d9e2ec"
          stroke-width="2"
        />

        <!-- Body shading -->
        <path
          d="M330,270 C350,295 395,302 428,285"
          fill="none"
          stroke="#d8e2ec"
          stroke-width="5"
          stroke-linecap="round"
          opacity="0.8"
        />

        <!-- Neck -->
        <path
          d="M392,238 C400,165 465,138 514,152 L520,188 C475,172 430,202 412,262 Z"
          fill="#ffffff"
          stroke="#d9e2ec"
          stroke-width="2"
        />

        <!-- Head -->
        <circle cx="525" cy="170" r="24" fill="#ffffff" stroke="#d9e2ec" stroke-width="2" />

        <!-- Beak upper -->
        <path
          d="M525,160 Q580,142 632,158 Q605,172 535,179 Z"
          fill="url(#beakGrad)"
          stroke="#e08a00"
          stroke-width="2"
        />

        <!-- Pouch -->
        <path
          d="M525,178 Q575,245 628,162 Q595,198 535,188 Z"
          fill="url(#pouchGrad)"
          stroke="#e07a00"
          stroke-width="2"
        />

        <!-- Mouth line -->
        <path
          d="M525,178 Q575,172 628,158"
          fill="none"
          stroke="#c65d00"
          stroke-width="3"
          stroke-linecap="round"
        />

        <!-- Eye -->
        <circle cx="537" cy="162" r="4.5" fill="#243447" />
        <circle cx="538.5" cy="160.5" r="1.4" fill="#ffffff" />

        <!-- Wing reaching handlebar -->
        <g class="wing">
          <path
            d="M352,238 C392,203 458,218 516,256 C527,264 524,280 511,273 C455,247 400,261 358,272 Z"
            fill="#f8fafc"
            stroke="#d9e2ec"
            stroke-width="2"
          />
          <g stroke="#d7e1ea" stroke-width="3" stroke-linecap="round" fill="none">
            <path d="M378,238 C410,232 445,238 475,252" />
            <path d="M373,252 C405,246 435,251 460,263" />
          </g>
        </g>
      </g>
    </svg>
  </main>
</body>
</html>
