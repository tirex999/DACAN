<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelican Riding a Bicycle</title>
  <style>
    :root {
      --bg: #07101a;
      --panel: #0b1420;
      --ink: #eaf5ff;
      --muted: #95abc2;
      --accent: #ffb703;
      --accent-2: #ff8a00;
      --line: #ffffff18;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 10%, #163553 0, transparent 32%),
        radial-gradient(circle at 80% 0%, #4b2148 0, transparent 34%),
        linear-gradient(135deg, #05101a 0%, #091623 55%, #120b1b 100%);
    }

    .wrap {
      max-width: 1150px;
      margin: 0 auto;
      padding: 26px 16px 40px;
    }

    .masthead {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.25rem, 2.7vw, 2.1rem);
      letter-spacing: .04em;
      text-transform: uppercase;
      font-weight: 900;
    }

    .subtle {
      color: var(--muted);
      font-size: .95rem;
      margin: 4px 0 0;
    }

    .badge {
      border: 1px solid var(--line);
      background: #ffffff10;
      color: #fff;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: .82rem;
      white-space: nowrap;
    }

    .stage {
      overflow: hidden;
      border-radius: 28px;
      border: 1px solid var(--line);
      background: #102038;
      box-shadow:
        0 28px 70px #00000066,
        inset 0 1px #ffffff10;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 14px;
      background: #091322d9;
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }

    .cluster {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 1px solid #ffffff26;
      color: var(--ink);
      background: #14233a;
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }

    .btn:hover {
      background: #1b2f4d;
      border-color: #ffffff42;
      transform: translateY(-1px);
    }

    .btn:active { transform: translateY(0); }

    .speedLabel {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      border: 1px solid #ffffff20;
      border-radius: 999px;
      background: #ffffff0a;
      color: #d9e7ff;
      font-size: .92rem;
    }

    input[type="range"] {
      width: 150px;
      accent-color: var(--accent);
    }

    #status {
      min-width: 64px;
      font-variant-numeric: tabular-nums;
      color: #ffd468;
      font-weight: 800;
    }

    .hint {
      color: var(--muted);
      font-size: .82rem;
      padding: 10px 14px 14px;
      background: #08111d;
      border-top: 1px solid var(--line);
    }

    .hint b { color: #cfe8ff; }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Theme layers */
    .skyDay, .skyNight, .seaDay, .seaNight {
      transition: opacity .75s ease;
    }

    .skyNight, .seaNight { opacity: 0; }

    .night .skyDay,
    .night .seaDay { opacity: 0; }

    .night .skyNight,
    .night .seaNight { opacity: 1; }

    #sun, #moon, #stars, #beam, #tailLight, .cloud, .waves path, .sand, #road, .bikeFrame .tube, .tire {
      transition: opacity .75s ease, fill .75s ease, stroke .75s ease, transform .75s ease;
    }

    #moon, #stars { opacity: 0; }
    .night #sun { opacity: 0; }
    .night #moon, .night #stars { opacity: 1; }

    #beam, #tailLight { opacity: 0; }
    .night #beam { opacity: .27; }
    .night #tailLight { opacity: .95; }

    .night .cloud { fill: #98a6c4; opacity: .58; }
    .night .waves path { stroke: #8da9ff; stroke-opacity: .28; }
    .night .sand { fill: #55445e; }
    .night #road { fill: #27313f; }
    .night #roadMark { fill: #eeb64f; opacity: .78; }
    .night .bikeFrame .tube { stroke: #ff7584; }
    .night .tire { stroke: #2b3651; }

    .bird {
      fill: none;
      animation: birdFly 6s ease-in-out infinite alternate;
    }

    .bird path {
      stroke: #ffffffaa;
      stroke-width: 3;
      stroke-linecap: round;
      fill: none;
    }

    @keyframes birdFly {
      from { transform: translateX(0) translateY(0); }
      to { transform: translateX(55px) translateY(-10px); }
    }

    .cloud {
      fill: #fff;
      animation: drift 58s linear infinite;
      will-change: transform;
    }

    .cloud1 { animation-duration: 62s; }
    .cloud2 { animation-duration: 82s; animation-delay: -28s; opacity: .76; }
    .cloud3 { animation-duration: 104s; animation-delay: -70s; opacity: .56; }

    @keyframes drift {
      from { transform: translateX(-200px); }
      to { transform: translateX(1040px); }
    }

    .waves {
      animation: waves 7s ease-in-out infinite alternate;
    }

    @keyframes waves {
      from { transform: translateX(-24px) translateY(0); }
      to { transform: translateX(24px) translateY(4px); }
    }

    .star {
      animation: twinkle 3.6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes twinkle {
      0%, 100% { opacity: .35; transform: scale(.88); }
      50% { opacity: 1; transform: scale(1.18); }
    }

    body.paused svg * {
      animation-play-state: paused !important;
    }

    .btn:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="masthead">
      <div>
        <h1>Pelican Cycling</h1>
        <p class="subtle">A self-contained animated SVG scene: pelican, bicycle, coast road, day/night lighting.</p>
      </div>
      <div class="badge">Inline SVG + CSS + JS</div>
    </header>

    <section class="stage" aria-label="Animated pelican bicycle scene">
      <div class="controls">
        <div class="cluster">
          <button id="playBtn" class="btn" aria-pressed="true" title="Pause / play motion">Pause</button>
          <button id="themeBtn" class="btn" aria-pressed="false" title="Switch day and night">Night</button>
        </div>

        <div class="cluster">
          <label class="speedLabel" for="speed">
            Speed
            <input id="speed" type="range" min="0.2" max="2.2" step="0.05" value="1">
            <span id="status">1.00×</span>
          </label>
        </div>
      </div>

      <svg id="scene" class="scene" viewBox="0 0 900 540" role="img" aria-labelledby="sceneTitle sceneDesc">
        <title id="sceneTitle">Pelican riding a bicycle</title>
        <desc id="sceneDesc">A cartoon pelican rides a red bicycle along a coastal road, with spinning wheels, pedaling webbed feet, drifting clouds, animated waves, and a day-night lighting toggle.</desc>

        <defs>
          <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#b8e5f5" />
            <stop offset="55%" stop-color="#ffe4bb" />
            <stop offset="100%" stop-color="#ffd4a8" />
          </linearGradient>

          <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#07172f" />
            <stop offset="55%" stop-color="#1d274b" />
            <stop offset="100%" stop-color="#533a5f" />
          </linearGradient>

          <linearGradient id="seaDay" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#85dbe8" />
            <stop offset="100%" stop-color="#2593a9" />
          </linearGradient>

          <linearGradient id="seaNight" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#12304b" />
            <stop offset="100%" stop-color="#0a2030" />
          </linearGradient>

          <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#ffe8a3" stop-opacity=".68" />
            <stop offset="52%" stop-color="#ffcf70" stop-opacity=".18" />
            <stop offset="100%" stop-color="#ffcf70" stop-opacity="0" />
          </radialGradient>

          <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#fff6b8" stop-opacity=".55" />
            <stop offset="35%" stop-color="#fff2a8" stop-opacity=".16" />
            <stop offset="100%" stop-color="#fff2a8" stop-opacity="0" />
          </linearGradient>
        </defs>

        <!-- Base -->
        <rect x="0" y="0" width="900" height="540" fill="#0b1220" />

        <!-- Sky -->
        <rect id="skyDay" class="skyDay" x="0" y="0" width="900" height="365" fill="url(#skyDay)" opacity="1" />
        <rect id="skyNight" class="skyNight" x="0" y="0" width="900" height="365" fill="url(#skyNight)" opacity="0" />

        <!-- Stars -->
        <g id="stars" fill="#ffffff">
          <circle class="star" cx="96" cy="58" r="1.8" style="animation-delay:-0.2s" />
          <circle class="star" cx="168" cy="108" r="1.2" style="animation-delay:-1.1s" />
          <circle class="star" cx="245" cy="76" r="2.2" style="animation-delay:-2.0s" />
          <circle class="star" cx="336" cy="132" r="1.5" style="animation-delay:-0.7s" />
          <circle class="star" cx="425" cy="52" r="2.4" style="animation-delay:-1.6s" />
          <circle class="star" cx="505" cy="110" r="1.3" style="animation-delay:-2.5s" />
          <circle class="star" cx="612" cy="70" r="1.7" style="animation-delay:-0.9s" />
          <circle class="star" cx="662" cy="158" r="1.1" style="animation-delay:-1.8s" />
          <circle class="star" cx="810" cy="186" r="1.9" style="animation-delay:-1.2s" />
          <circle class="star" cx="712" cy="28" r="1.5" style="animation-delay:-2.2s" />
        </g>

        <!-- Sun / Moon -->
        <g id="sun">
          <circle cx="770" cy="102" r="92" fill="url(#sunGlow)" />
          <circle cx="770" cy="102" r="38" fill="#ffd166" />
          <circle cx="770" cy="102" r="27" fill="#fff0a3" />
        </g>

        <g id="moon">
          <circle cx="735" cy="96" r="36" fill="#eaf1ff" />
          <circle cx="721" cy="88" r="27" fill="#07172f" />
          <circle cx="742" cy="84" r="2.6" fill="#c5d0ea" opacity=".85" />
          <circle cx="733" cy="108" r="1.8" fill="#c5d0ea" opacity=".55" />
        </g>

        <!-- Clouds -->
        <g class="clouds">
          <g class="cloud cloud1" style="animation-delay:-6s">
            <g transform="translate(70 84)">
              <ellipse cx="38" cy="4" rx="30" ry="15" />
              <ellipse cx="64" cy="-2" rx="22" ry="14" />
              <ellipse cx="88" cy="7" rx="26" ry="13" />
            </g>
          </g>
          <g class="cloud cloud2" style="animation-delay:-22s">
            <g transform="translate(190 116)">
              <ellipse cx="42" cy="3" rx="28" ry="13" />
              <ellipse cx="67" cy="-3" rx="20" ry="12" />
              <ellipse cx="92" cy="8" rx="23" ry="11" />
            </g>
          </g>
          <g class="cloud cloud3" style="animation-delay:-48s">
            <g transform="translate(320 66)">
              <ellipse cx="55" cy="2" rx="34" ry="17" />
              <ellipse cx="88" cy="-5" rx="24" ry="15" />
              <ellipse cx="112" cy="7" rx="28" ry="14" />
            </g>
          </g>
        </g>

        <!-- Sea -->
        <rect id="seaDay" class="seaDay" x="0" y="350" width="900" height="75" fill="url(#seaDay)" opacity="1" />
        <rect id="seaNight" class="seaNight" x="0" y="350" width="900" height="75" fill="url(#seaNight)" opacity="0" />

        <g class="waves" fill="none" stroke="#ffffff66" stroke-width="3" stroke-linecap="round">
          <path d="M-20 372 Q20 362 60 372 T140 372 T220 372 T300 372 T380 372 T460 372 T540 372 T620 372 T700 372 T780 372 T860 372 T940 372" />
          <path d="M-20 388 Q20 378 60 388 T140 388 T220 388 T300 388 T380 388 T460 388 T540 388 T620 388 T700 388 T780 388 T860 388 T940 388" opacity=".45" />
        </g>

        <!-- Birds -->
        <g class="bird" style="animation-delay:-1s">
          <g transform="translate(132 158)">
            <path d="M-14 0 Q-5 -8 2 0 Q8 -8 18 0" />
          </g>
        </g>
        <g class="bird" style="animation-delay:-3.2s">
          <g transform="translate(242 128)">
            <path d="M-11 0 Q-4 -6 1 0 Q7 -6 14 0" opacity=".75" />
          </g>
        </g>

        <!-- Sand -->
        <rect class="sand" x="0" y="412" width="900" height="18" fill="#e1b97b" />

        <!-- Road -->
        <rect id="road" x="0" y="428" width="900" height="54" fill="#333d4c" />
        <rect x="0" y="428" width="900" height="3" fill="#f4f7fa" opacity=".42" />
        <rect x="0" y="470" width="900" height="4" fill="#222936" />

        <g id="roadMark" fill="#ffd166">
          <rect x="-120" y="449" width="62" height="9" rx="4.5" />
          <rect x="0" y="449" width="62" height="9" rx="4.5" />
          <rect x="120" y="449" width="62" height="9" rx="4.5" />
          <rect x="240" y="449" width="62" height="9" rx="4.5" />
          <rect x="360" y="449" width="62" height="9" rx="4.5" />
          <rect x="480" y="449" width="62" height="9" rx="4.5" />
          <rect x="600" y="449" width="62" height="9" rx="4.5" />
          <rect x="720" y="449" width="62" height="9" rx="4.5" />
          <rect x="840" y="449" width="62" height="9" rx="4.5" />
          <rect x="960" y="449" width="62" height="9" rx="4.5" />
          <rect x="1080" y="449" width="62" height="9" rx="4.5" />
        </g>

        <!-- Headlight beam in night -->
        <polygon id="beam" points="568 247 900 198 900 302" fill="url(#beamGrad)" opacity="0" />

        <!-- Bicycle -->
        <g id="bike">
          <!-- Rear wheel -->
          <g>
            <circle cx="275" cy="385" r="62" class="tire" fill="none" stroke="#212b3e" stroke-width="14" />
            <g id="spokesRear" stroke="#cdd5e0" stroke-width="3" stroke-linecap="round" transform="rotate(0 275 385)">
              <line x1="275" y1="337" x2="275" y2="433" />
              <line x1="275" y1="337" x2="275" y2="433" transform="rotate(30 275 385)" />
              <line x1="275" y1="337" x2="275" y2="433" transform="rotate(60 275 385)" />
              <line x1="275" y1="337" x2="275" y2="433" transform="rotate(90 275 385)" />
              <line x1="275" y1="337" x2="275" y2="433" transform="rotate(120 275 385)" />
              <line x1="275" y1="337" x2="275" y2="433" transform="rotate(150 275 385)" />
            </g>
            <circle cx="275" cy="385" r="50" fill="none" stroke="#f6b73c" stroke-width="6" />
            <circle cx="275" cy="385" r="12" fill="#9da7b6" stroke="#212b3e" stroke-width="4" />
          </g>

          <!-- Front wheel -->
          <g>
            <circle cx="555" cy="385" r="62" class="tire" fill="none" stroke="#212b3e" stroke-width="14" />
            <g id="spokesFront" stroke="#cdd5e0" stroke-width="3" stroke-linecap="round" transform="rotate(0 555 385)">
              <line x1="555" y1="337" x2="555" y2="433" />
              <line x1="555" y1="337" x2="555" y2="433" transform="rotate(30 555 385)" />
              <line x1="555" y1="337" x2="555" y2="433" transform="rotate(60 555 385)" />
              <line x1="555" y1="337" x2="555" y2="433" transform="rotate(90 555 385)" />
              <line x1="555" y1="337" x2="555" y2="433" transform="rotate(120 555 385)" />
              <line x1="555" y1="337" x2="555" y2="433" transform="rotate(150 555 385)" />
            </g>
            <circle cx="555" cy="385" r="50" fill="none" stroke="#f6b73c" stroke-width="6" />
            <circle cx="555" cy="385" r="12" fill="#9da7b6" stroke="#212b3e" stroke-width="4" />
          </g>

          <!-- Frame -->
          <g class="bikeFrame" fill="none" stroke="#e5383b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
            <path class="tube" d="M275 385 L415 385 L408 300 L275 385" />
            <path class="tube" d="M415 385 L408 300 L525 255 L536 292 L415 385" />
            <path class="tube" d="M536 292 L555 385" />
            <path class="tube" d="M525 255 L517 240" />
            <path class="tube" d="M517 240 C494 226 516 200 544 212" stroke-width="9" />
            <path class="tube" d="M408 300 L398 275" stroke-width="8" />
          </g>

          <!-- Frame highlight -->
          <g fill="none" stroke="#ffffff" stroke-opacity=".42" stroke-width="3" stroke-linecap="round">
            <path d="M285 382 L410 382" />
            <path d="M412 378 L406 304" />
            <path d="M415 378 L531 296" />
          </g>

          <!-- Saddle -->
          <path d="M360 276 Q400 258 438 278 Q402 292 362 288 Z" fill="#2d1f1c" stroke="#120e0d" stroke-width="2" />
          <circle id="tailLight" cx="361" cy="272" r="5" fill="#ff5a5f" opacity="0" />

          <!-- Headlight + bell -->
          <g transform="translate(528 254)">
            <rect x="6" y="-13" width="18" height="14" rx="4" fill="#9aa3b1" stroke="#212b3e" stroke-width="3" />
            <circle cx="26" cy="-6" r="6" fill="#ffd166" stroke="#212b3e" stroke-width="3" />
            <circle cx="26" cy="-6" r="3" fill="#fff3b0" />
            <circle cx="-2" cy="-2" r="7" fill="#ffd166" stroke="#212b3e" stroke-width="3" />
          </g>

          <!-- Chain and drivetrain -->
          <g stroke="#8e97a4" stroke-width="5" stroke-linecap="round" fill="none">
            <path d="M302 369 L395 358" />
            <path d="M302 401 L395 412" />
          </g>
          <circle cx="275" cy="385" r="17" fill="#8e97a4" stroke="#212b3e" stroke-width="4" />
          <circle cx="415" cy="385" r="29" fill="#7d8794" stroke="#212b3e" stroke-width="4" />
          <circle cx="415" cy="385" r="20" fill="#a8b2bd" />
          <circle cx="415" cy="385" r="8" fill="#dbe1e9" />

          <line id="crankRear" x1="415" y1="385" x2="369" y2="385" stroke="#212b3e" stroke-width="10" stroke-linecap="round" />
          <line id="crankFront" x1="415" y1="385" x2="461" y2="385" stroke="#39445a" stroke-width="10" stroke-linecap="round" />
          <rect id="pedalRear" x="-17" y="-4" width="34" height="8" rx="4" fill="#48546a" stroke="#1c2432" stroke-width="3" transform="translate(369 385)" />
          <rect id="pedalFront" x="-17" y="-4" width="34" height="8" rx="4" fill="#5b677e" stroke="#1c2432" stroke-width="3" transform="translate(461 385)" />
        </g>

        <!-- Pelican -->
        <g id="pelican" transform="translate(0 0)">
          <!-- Tail -->
          <g id="tailGroup" transform="rotate(0 328 262)">
            <path d="M330 260 C282 234 245 244 246 272 C282 290 318 289 336 281 Z"
                  fill="#dbe7f5" stroke="#233040" stroke-width="3" stroke-linejoin="round" />
          </g>

          <!-- Legs -->
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline id="legFrontRim" points="405,306 435,319 461,373" stroke="#233040" stroke-width="14" />
            <polyline id="legFront" points="405,306 435,319 461,373" stroke="#ff9d3b" stroke-width="8" />
            <polyline id="legRearRim" points="352,304 344,320 369,373" stroke="#233040" stroke-width="14" />
            <polyline id="legRear" points="352,304 344,320 369,373" stroke="#ff9d3b" stroke-width="8" />
          </g>

          <!-- Body -->
          <ellipse cx="393" cy="268" rx="72" ry="52" fill="#fbfdff" stroke="#233040" stroke-width="4" />
          <path d="M345 303 C388 332 452 310 452 288 C420 305 372 301 350 276 Z" fill="#dce9f6" opacity=".92" />

          <!-- Wing -->
          <path d="M350 276 C388 243 449 253 450 301 C414 332 358 318 350 300 Z"
                fill="#e6eff9" stroke="#233040" stroke-width="3" stroke-linejoin="round" />
          <path d="M358 290 Q392 281 428 288 M366 302 Q395 297 423 304"
                fill="none" stroke="#b9d0e6" stroke-width="3" stroke-linecap="round" />

          <!-- Neck -->
          <path d="M362 259 C355 208 425 179 486 184 L498 220 C445 214 398 235 382 258 Z"
                fill="#fbfdff" stroke="#233040" stroke-width="4" stroke-linejoin="round" />

          <!-- Arm to handlebar -->
          <path d="M426 282 C457 261 478 254 505 248" fill="none" stroke="#233040" stroke-width="24" stroke-linecap="round" />
          <path d="M426 282 C457 261 478 254 505 248" fill="none" stroke="#fbfdff" stroke-width="18" stroke-linecap="round" />
          <path d="M502 241 L529 237 M506 252 L533 249" fill="none" stroke="#233040" stroke-width="3" stroke-linecap="round" />

          <!-- Head -->
          <path d="M506 164 C515 139 543 127 554 135 C537 137 523 148 517 165 Z"
                fill="#edf5ff" stroke="#233040" stroke-width="2" stroke-linejoin="round" />
          <circle cx="519" cy="191" r="34" fill="#fbfdff" stroke="#233040" stroke-width="4" />
          <circle cx="527" cy="213" r="7" fill="#ffb3c1" opacity=".7" />

          <!-- Eye -->
          <circle cx="531" cy="182" r="9" fill="#ffffff" stroke="#233040" stroke-width="3" />
          <circle cx="533" cy="182" r="4.2" fill="#17202f" />
          <circle cx="535" cy="179" r="1.6" fill="#ffffff" />

          <!-- Beak and pouch -->
          <path d="M548 172 C594 143 657 148 698 184 C706 191 701 199 693 199 C644 208 590 209 560 199 C544 193 541 182 548 172 Z"
                fill="#ffc300" stroke="#233040" stroke-width="3" stroke-linejoin="round" />

          <g id="pouch" transform="translate(625 218) scale(1 1) translate(-625 -218)">
            <path d="M554 199 C606 213 650 207 694 199 C684 240 614 253 562 231 C545 223 546 207 554 199 Z"
                  fill="#ff8a00" stroke="#233040" stroke-width="3" stroke-linejoin="round" />
            <path d="M560 206 C602 215 639 213 679 206" fill="none" stroke="#c35700" stroke-width="2" opacity=".55" />
            <path d="M568 202 L688 195" fill="none" stroke="#233040" stroke-width="3" stroke-linecap="round" />
          </g>

          <ellipse cx="578" cy="175" rx="11" ry="3" fill="#b86200" opacity=".35" transform="rotate(-7 578 175)" />

          <!-- Webbed feet -->
          <g id="footRear" transform="translate(369 373)">
            <path d="M-9 -3 C-6 -12 13 -16 32 -9 C36 -5 30 -1 12 -1 C25 3 33 11 28 15 C14 9 2 4 -5 1 C3 7 1 13 -2 16 C-10 10 -19 1 -9 -3 Z"
                  fill="#ff9d3b" stroke="#233040" stroke-width="2.5" stroke-linejoin="round" />
          </g>

          <g id="footFront" transform="translate(461 373)">
            <path d="M-9 -3 C-6 -12 13 -16 32 -9 C36 -5 30 -1 12 -1 C25 3 33 11 28 15 C14 9 2 4 -5 1 C3 7 1 13 -2 16 C-10 10 -19 1 -9 -3 Z"
                  fill="#ff9d3b" stroke="#233040" stroke-width="2.5" stroke-linejoin="round" />
          </g>
        </g>
      </svg>

      <div class="hint">
        <b>Controls:</b> Pause/play motion, toggle day/night, change speed. Keyboard: <b>Space</b> pauses motion, <b>N</b> switches night.
      </div>
    </section>
  </main>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);

      const scene = $('scene');
      const pelican = $('pelican');
      const rearSpokes = $('spokesRear');
      const frontSpokes = $('spokesFront');
      const roadMark = $('roadMark');

      const crankFront = $('crankFront');
      const crankRear = $('crankRear');
      const pedalFront = $('pedalFront');
      const pedalRear = $('pedalRear');
      const footFront = $('footFront');
      const footRear = $('footRear');

      const legFRim = $('legFrontRim');
      const legF = $('legFront');
      const legRRim = $('legRearRim');
      const legR = $('legRear');

      const pouch = $('pouch');
      const tail = $('tailGroup');

      const speedInput = $('speed');
      const status = $('status');
      const playBtn = $('playBtn');
      const themeBtn = $('themeBtn');

      const CRANK_X = 415;
      const CRANK_Y = 385;
      const CRANK_R = 46;

      let t = 0;
      let last = 0;
      let angle = 0;
      let roadOffset = 0;
      let speed = parseFloat(speedInput.value);
      let running = true;

      function setLine(el, x2, y2) {
        el.setAttribute('x2', x2.toFixed(2));
        el.setAttribute('y2', y2.toFixed(2));
      }

      function setTransform(el, value) {
        el.setAttribute('transform', value);
      }

      function setLeg(rimEl, fillEl, hipX, hipY, footX, footY, kneeDX, kneeDY) {
        const mx = (hipX + footX) / 2 + kneeDX;
        const my = (hipY + footY) / 2 + kneeDY;
        const points =
          hipX.toFixed(2) + ',' + hipY.toFixed(2) + ' ' +
          mx.toFixed(2) + ',' + my.toFixed(2) + ' ' +
          footX.toFixed(2) + ',' + footY.toFixed(2);
        rimEl.setAttribute('points', points);
        fillEl.setAttribute('points', points);
      }

      function draw() {
        const wheelAngle = angle * 2.25;

        const bobX = running
          ? Math.sin(t * 1.7) * 1.3 * speed
          : 0;

        const bobY = running
          ? Math.sin(t * 3.2) * 2.4 + Math.cos(t * 6.6) * 0.7
          : 0;

        setTransform(pelican, `translate(${bobX.toFixed(2)} ${bobY.toFixed(2)})`);
        setTransform(rearSpokes, `rotate(${wheelAngle.toFixed(2)} 275 385)`);
        setTransform(frontSpokes, `rotate(${wheelAngle.toFixed(2)} 555 385)`);
        setTransform(roadMark, `translate(${(-roadOffset).toFixed(2)} 0)`);

        const rad = angle * Math.PI / 180;

        const fx = CRANK_X + CRANK_R * Math.cos(rad);
        const fy = CRANK_Y + CRANK_R * Math.sin(rad);

        const rx = CRANK_X - CRANK_R * Math.cos(rad);
        const ry = CRANK_Y - CRANK_R * Math.sin(rad);

        setLine(crankFront, fx, fy);
        setLine(crankRear, rx, ry);

        setTransform(pedalFront, `translate(${fx.toFixed(2)} ${fy.toFixed(2)})`);
        setTransform(pedalRear, `translate(${rx.toFixed(2)} ${ry.toFixed(2)})`);

        const frontFootX = fx - bobX;
        const frontFootY = fy - bobY - 12;
        const rearFootX = rx - bobX;
        const rearFootY = ry - bobY - 12;

        setTransform(footFront, `translate(${frontFootX.toFixed(2)} ${frontFootY.toFixed(2)})`);
        setTransform(footRear, `translate(${rearFootX.toFixed(2)} ${rearFootY.toFixed(2)})`);

        setLeg(legFRim, legF, 405, 306, frontFootX, frontFootY, 16, -20);
        setLeg(legRRim, legR, 352, 304, rearFootX, rearFootY, -16, -22);

        const pouchScale = 1 + (running ? Math.sin(t * 4.7) * 0.065 : 0);
        setTransform(pouch, `translate(625 218) scale(1 ${pouchScale.toFixed(3)}) translate(-625 -218)`);

        const tailAngle = running ? Math.sin(t * 5.2) * 4 : 0;
        setTransform(tail, `rotate(${tailAngle.toFixed(2)} 328 262)`);
      }

      function tick(now) {
        if (!last) last = now;
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;

        if (running) {
          speed = parseFloat(speedInput.value);
          t += dt;
          angle = (angle + 160 * dt * speed) % 360;
          roadOffset = (roadOffset + 210 * dt * speed) % 120;
        }

        draw();
        requestAnimationFrame(tick);
      }

      function setRunning(value) {
        running = !!value;
        playBtn.textContent = running ? 'Pause' : 'Play';
        playBtn.setAttribute('aria-pressed', String(running));
        document.body.classList.toggle('paused', !running);
        if (running) last = 0;
      }

      function toggleTheme() {
        const isNight = scene.classList.toggle('night');
        themeBtn.textContent = isNight ? 'Day' : 'Night';
        themeBtn.setAttribute('aria-pressed', String(isNight));
      }

      playBtn.addEventListener('click', () => setRunning(!running));
      themeBtn.addEventListener('click', toggleTheme);

      speedInput.addEventListener('input', () => {
        speed = parseFloat(speedInput.value);
        status.textContent = speed.toFixed(2) + '×';
      });

      document.addEventListener('keydown', (e) => {
        const tag = (e.target && e.target.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;

        if (e.code === 'Space') {
          e.preventDefault();
          setRunning(!running);
        }

        if (e.key === 'n' || e.key === 'N') {
          toggleTheme();
        }
      });

      status.textContent = parseFloat(speedInput.value).toFixed(2) + '×';

      const prefersReducedMotion =
        window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      setRunning(!prefersReducedMotion);
      draw();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
