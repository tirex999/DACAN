<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pelican Riding a Bicycle</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      display: grid;
      place-items: center;
      background: #eef6ff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    main {
      width: min(92vw, 900px);
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
      background: #ffffff;
    }

    .wheel {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 1.8s linear infinite;
    }

    .pelican {
      transform-box: fill-box;
      transform-origin: 50% 85%;
      animation: bob 1.1s ease-in-out infinite;
    }

    .wing-near {
      transform-box: fill-box;
      transform-origin: 12% 50%;
      animation: flap 0.9s ease-in-out infinite;
    }

    .wing-far {
      transform-box: fill-box;
      transform-origin: 12% 50%;
      animation: flap 0.9s ease-in-out infinite reverse;
    }

    .road-line {
      animation: road 0.6s linear infinite;
    }

    .cloud {
      animation: drift 18s linear infinite;
    }

    .cloud2 {
      animation-duration: 26s;
      animation-delay: -8s;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(-1.2deg); }
    }

    @keyframes flap {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-7deg); }
    }

    @keyframes road {
      to { stroke-dashoffset: -80; }
    }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(-160px); }
    }

    body.paused * {
      animation-play-state: paused !important;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 900 560" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
      <title id="title">Pelican riding a bicycle</title>
      <desc id="desc">A cartoon pelican with a large orange beak rides a red bicycle on a road.</desc>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#bde0fe" />
          <stop offset="1" stop-color="#e7f5ff" />
        </linearGradient>

        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6c757d" />
          <stop offset="1" stop-color="#495057" />
        </linearGradient>

        <radialGradient id="sun" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#fff3b0" />
          <stop offset="1" stop-color="#ffd166" />
        </radialGradient>
      </defs>

      <!-- Background -->
      <rect width="900" height="560" fill="url(#sky)" />
      <circle cx="790" cy="85" r="46" fill="url(#sun)" />

      <g class="cloud" fill="#ffffff" opacity="0.9">
        <ellipse cx="180" cy="90" rx="55" ry="28" />
        <ellipse cx="230" cy="80" rx="45" ry="25" />
        <ellipse cx="135" cy="100" rx="35" ry="20" />
      </g>

      <g class="cloud cloud2" fill="#ffffff" opacity="0.85">
        <ellipse cx="620" cy="120" rx="60" ry="26" />
        <ellipse cx="670" cy="110" rx="42" ry="22" />
        <ellipse cx="575" cy="130" rx="34" ry="18" />
      </g>

      <path d="M0,360 C120,300 220,340 320,330 C430,318 520,350 640,325 C740,305 820,330 900,315 L900,470 L0,470 Z" fill="#b7e4c7" />
      <path d="M0,400 C150,360 260,390 390,375 C520,360 650,395 900,360 L900,470 L0,470 Z" fill="#95d5b2" />

      <rect x="0" y="470" width="900" height="90" fill="url(#road)" />
      <line x1="0" y1="515" x2="900" y2="515" stroke="#f8f9fa" stroke-width="8" stroke-dasharray="40 40" class="road-line" />

      <!-- Bicycle -->
      <g id="bicycle">
        <!-- Rear wheel -->
        <g transform="translate(260,390)">
          <g class="wheel">
            <circle r="72" fill="none" stroke="#1d3557" stroke-width="14" />
            <circle r="58" fill="none" stroke="#adb5bd" stroke-width="5" />
            <g stroke="#ced4da" stroke-width="3">
              <line x1="0" y1="-58" x2="0" y2="58" />
              <line x1="-58" y1="0" x2="58" y2="0" />
              <line x1="-41" y1="-41" x2="41" y2="41" />
              <line x1="-41" y1="41" x2="41" y2="-41" />
            </g>
            <circle r="9" fill="#495057" />
          </g>
        </g>

        <!-- Front wheel -->
        <g transform="translate(620,390)">
          <g class="wheel">
            <circle r="72" fill="none" stroke="#1d3557" stroke-width="14" />
            <circle r="58" fill="none" stroke="#adb5bd" stroke-width="5" />
            <g stroke="#ced4da" stroke-width="3">
              <line x1="0" y1="-58" x2="0" y2="58" />
              <line x1="-58" y1="0" x2="58" y2="0" />
              <line x1="-41" y1="-41" x2="41" y2="41" />
              <line x1="-41" y1="41" x2="41" y2="-41" />
            </g>
            <circle r="9" fill="#495057" />
          </g>
        </g>

        <!-- Far leg, behind the bicycle -->
        <g stroke="#e76f51" stroke-width="14" stroke-linecap="round" fill="none">
          <path d="M340,260 Q325,340 385,420" />
        </g>
        <ellipse cx="385" cy="420" rx="18" ry="8" fill="#e76f51" transform="rotate(20 385 420)" />

        <!-- Bicycle frame -->
        <g stroke="#e63946" stroke-width="13" stroke-linecap="round" fill="none">
          <path d="M260,390 L420,390" />
          <path d="M260,390 L390,270" />
          <path d="M390,270 L420,390" />
          <path d="M420,390 L560,270" />
          <path d="M390,270 L560,270" />
          <path d="M560,270 L575,310" />
          <path d="M575,310 L620,390" />
        </g>

        <!-- Seat post and saddle -->
        <path d="M390,270 L375,245" stroke="#495057" stroke-width="8" stroke-linecap="round" />
        <path d="M335,245 Q375,228 410,245 Q375,258 335,245 Z" fill="#212529" />

        <!-- Crankset -->
        <g transform="translate(420,390)">
          <circle r="30" fill="#ced4da" stroke="#495057" stroke-width="4" />
          <circle r="8" fill="#495057" />

          <g>
            <animateTransform
              attributeName="transform"
              attributeType="XML"
              type="rotate"
              from="0 0 0"
              to="360 0 0"
              dur="1.8s"
              repeatCount="indefinite"
            />

            <line x1="0" y1="0" x2="35" y2="-30" stroke="#495057" stroke-width="9" stroke-linecap="round" />
            <line x1="0" y1="0" x2="-35" y2="30" stroke="#495057" stroke-width="9" stroke-linecap="round" />

            <g transform="translate(35,-30)">
              <g>
                <animateTransform
                  attributeName="transform"
                  attributeType="XML"
                  type="rotate"
                  from="0 0 0"
                  to="-360 0 0"
                  dur="1.8s"
                  repeatCount="indefinite"
                />
                <rect x="-14" y="-5" width="28" height="10" rx="3" fill="#212529" />
              </g>
            </g>

            <g transform="translate(-35,30)">
              <g>
                <animateTransform
                  attributeName="transform"
                  attributeType="XML"
                  type="rotate"
                  from="0 0 0"
                  to="-360 0 0"
                  dur="1.8s"
                  repeatCount="indefinite"
                />
                <rect x="-14" y="-5" width="28" height="10" rx="3" fill="#212529" />
              </g>
            </g>
          </g>
        </g>

        <!-- Handlebar -->
        <path d="M560,270 L590,240 L620,250" stroke="#495057" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="620" cy="250" r="7" fill="#212529" />

        <!-- Pelican -->
        <g class="pelican">
          <!-- Far wing -->
          <g class="wing-far">
            <path d="M370,205 C430,185 520,205 575,230 L570,250 C510,238 430,245 375,240 Z" fill="#c5cfd9" stroke="#aeb9c6" stroke-width="2" />
          </g>

          <!-- Tail -->
          <path d="M275,215 C235,205 210,225 220,245 C245,255 270,250 285,245 Z" fill="#e9ecef" stroke="#ced4da" stroke-width="2" />

          <!-- Body -->
          <ellipse cx="350" cy="225" rx="88" ry="62" fill="#f8f9fa" stroke="#ced4da" stroke-width="2" />
          <path d="M300,255 C330,275 380,275 410,250" fill="none" stroke="#e9ecef" stroke-width="10" stroke-linecap="round" />

          <!-- Neck -->
          <path d="M395,210 C425,150 470,130 515,150" fill="none" stroke="#f8f9fa" stroke-width="40" stroke-linecap="round" />
          <path d="M395,210 C425,150 470,130 515,150" fill="none" stroke="#ced4da" stroke-width="40" stroke-linecap="round" opacity="0.18" />

          <!-- Head -->
          <circle cx="520" cy="155" r="29" fill="#f8f9fa" stroke="#ced4da" stroke-width="2" />
          <path d="M505,132 C515,120 530,122 535,132" fill="#f8f9fa" stroke="#ced4da" stroke-width="2" />

          <!-- Beak and pouch -->
          <path d="M538,147 L655,160 L538,164 Z" fill="#f4a261" stroke="#e76f51" stroke-width="2" stroke-linejoin="round" />
          <path d="M538,164 Q600,225 650,162 L655,160 Q600,205 538,164 Z" fill="#f7b267" stroke="#e76f51" stroke-width="2" stroke-linejoin="round" />

          <!-- Eye -->
          <circle cx="525" cy="148" r="4.5" fill="#212529" />
          <circle cx="526.5" cy="146.5" r="1.5" fill="#ffffff" />

          <!-- Near wing -->
          <g class="wing-near">
            <path d="M385,205 C450,188 545,210 612,240 L605,262 C535,245 450,252 390,248 Z" fill="#dfe6ed" stroke="#b5c0d0" stroke-width="2" />
            <path d="M430,218 C470,212 520,224 560,238" fill="none" stroke="#b5c0d0" stroke-width="2" opacity="0.7" />
          </g>
        </g>

        <!-- Near leg, in front of the bicycle -->
        <path d="M360,270 Q410,305 455,360" fill="none" stroke="#f4a261" stroke-width="15" stroke-linecap="round" />
        <ellipse cx="455" cy="360" rx="19" ry="8" fill="#f4a261" transform="rotate(-15 455 360)" />

        <!-- Near pedal, drawn over the foot -->
        <g transform="translate(420,390)">
          <g>
            <animateTransform
              attributeName="transform"
              attributeType="XML"
              type="rotate"
              from="0 0 0"
              to="360 0 0"
              dur="1.8s"
              repeatCount="indefinite"
            />
            <g transform="translate(35,-30)">
              <g>
                <animateTransform
                  attributeName="transform"
                  attributeType="XML"
                  type="rotate"
                  from="0 0 0"
                  to="-360 0 0"
                  dur="1.8s"
                  repeatCount="indefinite"
                />
                <rect x="-14" y="-5" width="28" height="10" rx="3" fill="#212529" />
              </g>
            </g>
          </g>
        </g>
      </g>
    </svg>
  </main>

  <script>
    const svg = document.querySelector("svg");

    function setPaused(paused) {
      document.body.classList.toggle("paused", paused);

      if (paused && svg.pauseAnimations) {
        svg.pauseAnimations();
      } else if (!paused && svg.unpauseAnimations) {
        svg.unpauseAnimations();
      }
    }

    document.addEventListener("visibilitychange", () => {
      setPaused(document.hidden);
    });
  </script>
</body>
</html>
