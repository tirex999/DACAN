<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pelican Riding a Bicycle</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --spin: 2.4s;
      --bob: 1.2s;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .card {
      width: min(960px, 100%);
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(20px, 3vw, 30px);
      color: #0f172a;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
      background: #eaf8ff;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
      color: #0f172a;
      font-size: 15px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      background: #0f172a;
      color: white;
      cursor: pointer;
      font: inherit;
    }

    button:hover {
      background: #1e293b;
    }

    input[type="range"] {
      width: 180px;
    }

    .wheel,
    .pelican,
    .cloud {
      transform-box: fill-box;
      transform-origin: center;
    }

    .wheel {
      animation: spin var(--spin) linear infinite;
    }

    .pelican {
      animation: bob var(--bob) ease-in-out infinite;
    }

    .cloud {
      animation: drift 22s linear infinite;
    }

    .cloud2 {
      animation-duration: 30s;
      animation-delay: -12s;
    }

    .paused * {
      animation-play-state: paused !important;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes bob {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-6px) rotate(-0.6deg);
      }
    }

    @keyframes drift {
      from {
        transform: translateX(-180px);
      }
      to {
        transform: translateX(1080px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .wheel,
      .pelican,
      .cloud {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Pelican Riding a Bicycle</h1>

    <svg id="scene" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
      <title id="title">Pelican riding a bicycle</title>
      <desc id="desc">A cartoon pelican with a large orange pouch rides a red bicycle on a road.</desc>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#bfe9ff" />
          <stop offset="1" stop-color="#eaf8ff" />
        </linearGradient>

        <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#86efac" />
          <stop offset="1" stop-color="#4ade80" />
        </linearGradient>
      </defs>

      <!-- Sky -->
      <rect x="0" y="0" width="900" height="600" fill="url(#sky)" />

      <!-- Sun -->
      <circle cx="770" cy="90" r="60" fill="#fde68a" opacity="0.25" />
      <circle cx="770" cy="90" r="45" fill="#fde68a" opacity="0.95" />

      <!-- Clouds -->
      <g class="cloud" opacity="0.92">
        <ellipse cx="150" cy="100" rx="45" ry="22" fill="white" />
        <ellipse cx="190" cy="90" rx="35" ry="25" fill="white" />
        <ellipse cx="120" cy="95" rx="30" ry="18" fill="white" />
      </g>

      <g class="cloud cloud2" opacity="0.85">
        <ellipse cx="430" cy="70" rx="50" ry="20" fill="white" />
        <ellipse cx="470" cy="60" rx="34" ry="24" fill="white" />
        <ellipse cx="400" cy="65" rx="28" ry="16" fill="white" />
      </g>

      <!-- Ground and road -->
      <rect x="0" y="500" width="900" height="100" fill="url(#ground)" />
      <rect x="0" y="505" width="900" height="18" fill="#4b5563" />
      <g stroke="#facc15" stroke-width="6" stroke-linecap="round" stroke-dasharray="30 25">
        <line x1="0" y1="514" x2="900" y2="514" />
      </g>

      <!-- Shadow -->
      <ellipse cx="440" cy="512" rx="220" ry="12" fill="rgba(0,0,0,0.16)" />

      <!-- Rear wheel -->
      <g class="wheel rear-wheel">
        <circle cx="260" cy="430" r="75" fill="none" stroke="#111827" stroke-width="14" />
        <circle cx="260" cy="430" r="62" fill="none" stroke="#e5e7eb" stroke-width="6" />
        <g stroke="#cbd5e1" stroke-width="3">
          <line x1="260" y1="368" x2="260" y2="492" />
          <line x1="198" y1="430" x2="322" y2="430" />
          <line x1="216" y1="386" x2="304" y2="474" />
          <line x1="304" y1="386" x2="216" y2="474" />
        </g>
        <circle cx="260" cy="430" r="10" fill="#9ca3af" stroke="#4b5563" stroke-width="3" />
      </g>

      <!-- Bicycle frame -->
      <g stroke="#dc2626" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M260 430 L440 430 L390 300 Z" />
        <path d="M440 430 L560 330" />
        <path d="M390 300 L560 300" />
        <path d="M560 300 L570 350" />
        <path d="M570 350 L620 430" />
        <path d="M390 300 L380 270" />
        <path d="M560 300 L590 280" />
      </g>

      <!-- Saddle -->
      <path d="M352 270 Q380 256 408 270 Q380 284 352 270 Z" fill="#1f2937" />

      <!-- Handlebar -->
      <path d="M590 280 C610 265 625 285 605 305" stroke="#111827" stroke-width="8" fill="none" stroke-linecap="round" />
      <circle cx="605" cy="305" r="5" fill="#111827" />

      <!-- Front wheel -->
      <g class="wheel front-wheel">
        <circle cx="620" cy="430" r="75" fill="none" stroke="#111827" stroke-width="14" />
        <circle cx="620" cy="430" r="62" fill="none" stroke="#e5e7eb" stroke-width="6" />
        <g stroke="#cbd5e1" stroke-width="3">
          <line x1="620" y1="368" x2="620" y2="492" />
          <line x1="558" y1="430" x2="682" y2="430" />
          <line x1="576" y1="386" x2="664" y2="474" />
          <line x1="664" y1="386" x2="576" y2="474" />
        </g>
        <circle cx="620" cy="430" r="10" fill="#9ca3af" stroke="#4b5563" stroke-width="3" />
      </g>

      <!-- Chain and gears -->
      <g stroke="#374151" stroke-width="4" fill="none">
        <circle cx="260" cy="430" r="16" fill="#9ca3af" stroke="#4b5563" stroke-width="6" />
        <circle cx="440" cy="430" r="18" fill="#9ca3af" stroke="#4b5563" stroke-width="6" />
        <path d="M260 414 L440 414" />
        <path d="M260 446 L440 446" />
      </g>

      <!-- Crank and pedals -->
      <g class="crank">
        <path d="M440 430 L480 470" stroke="#374151" stroke-width="8" stroke-linecap="round" fill="none" />
        <rect x="466" y="466" width="28" height="8" rx="3" fill="#111827" />

        <path d="M440 430 L400 390" stroke="#374151" stroke-width="8" stroke-linecap="round" fill="none" />
        <rect x="386" y="386" width="28" height="8" rx="3" fill="#111827" />

        <circle cx="440" cy="430" r="10" fill="#1f2937" />
      </g>

      <!-- Pelican legs -->
      <g>
        <path d="M395 295 C410 340 440 400 475 465" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" fill="none" />
        <path d="M475 465 L500 470 L475 478 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2" />

        <path d="M370 295 C360 330 375 365 400 390" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" fill="none" />
        <path d="M400 390 L425 395 L400 403 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2" />
      </g>

      <!-- Pelican -->
      <g class="pelican">
        <!-- Tail -->
        <path d="M315 250 L265 225 L285 255 L260 280 L320 275 Z" fill="#f3f4f6" stroke="#cbd5e1" stroke-width="2" />

        <!-- Body -->
        <ellipse cx="380" cy="250" rx="78" ry="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
        <ellipse cx="370" cy="265" rx="55" ry="35" fill="#f8fafc" opacity="0.85" />

        <!-- Wing -->
        <path d="M355 235 C390 215 445 225 470 255 C445 290 385 295 350 270 Z" fill="#f3f4f6" stroke="#cbd5e1" stroke-width="2" />
        <path d="M370 245 C395 238 425 242 445 255" stroke="#cbd5e1" stroke-width="2" fill="none" />
        <path d="M365 260 C395 255 425 260 445 270" stroke="#cbd5e1" stroke-width="2" fill="none" />

        <!-- Neck -->
        <path d="M420 230 C465 185 505 165 540 185" stroke="#cbd5e1" stroke-width="44" stroke-linecap="round" fill="none" />
        <path d="M420 230 C465 185 505 165 540 185" stroke="#ffffff" stroke-width="38" stroke-linecap="round" fill="none" />

        <!-- Head -->
        <circle cx="555" cy="185" r="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />

        <!-- Helmet -->
        <path d="M528 172 C535 145 575 145 582 172 Z" fill="#22c55e" stroke="#15803d" stroke-width="2" />
        <path d="M535 172 C545 158 565 158 575 172" fill="#4ade80" opacity="0.65" />
        <path d="M545 172 L548 195" stroke="#15803d" stroke-width="3" fill="none" />

        <!-- Eye -->
        <circle cx="566" cy="178" r="5" fill="#111827" />
        <circle cx="568" cy="176" r="1.8" fill="white" />

        <!-- Beak -->
        <path d="M575 178 L705 186 L695 198 L575 196 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2" />
        <path d="M575 196 C600 265 665 255 695 198 C660 215 605 215 575 196 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
        <path d="M575 190 L700 192" stroke="#d97706" stroke-width="2" opacity="0.6" fill="none" />

        <!-- Wing/arm reaching handlebar -->
        <path d="M370 245 C420 225 500 245 585 278 C560 300 470 295 395 280 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
        <path d="M410 250 C450 245 510 255 560 275" stroke="#cbd5e1" stroke-width="2" fill="none" />
        <path d="M405 265 C450 262 505 270 550 285" stroke="#cbd5e1" stroke-width="2" fill="none" />
      </g>
    </svg>

    <div class="controls">
      <button id="toggle" type="button">Pause</button>
      <label for="speed">Speed</label>
      <input id="speed" type="range" min="0.8" max="5" step="0.1" value="2.4" aria-label="Animation speed" />
      <span id="speedValue">2.4s</span>
    </div>
  </main>

  <script>
    const scene = document.getElementById("scene");
    const toggle = document.getElementById("toggle");
    const speed = document.getElementById("speed");
    const speedValue = document.getElementById("speedValue");

    function updateSpeed() {
      const seconds = Number(speed.value);
      document.documentElement.style.setProperty("--spin", seconds + "s");
      document.documentElement.style.setProperty("--bob", (seconds / 2) + "s");
      speedValue.textContent = seconds.toFixed(1) + "s";
    }

    toggle.addEventListener("click", () => {
      const paused = scene.classList.toggle("paused");
      toggle.textContent = paused ? "Play" : "Pause";
    });

    speed.addEventListener("input", updateSpeed);
    updateSpeed();
  </script>
</body>
</html>
