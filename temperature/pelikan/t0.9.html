<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pelican Riding a Bicycle</title>
  <style>
    :root {
      --speed: 1;
      --wheel: calc(1.5s / var(--speed));
      --crank: calc(2.1s / var(--speed));
      --bob: calc(1.15s / var(--speed));
      --chain: calc(2.1s / var(--speed));
      --cloud: calc(38s / var(--speed));
      --road: calc(1.35s / var(--speed));
      --speedline: calc(1.2s / var(--speed));
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #0f172a, #1e293b);
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #111827;
    }

    .stage {
      width: min(100%, 1040px);
      background: #f8fafc;
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
    }

    header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.5rem, 2vw + 1rem, 2.4rem);
      color: #0f172a;
      line-height: 1.15;
    }

    header p {
      margin: 0 0 16px;
      color: #475569;
    }

    .scene {
      background: #e1f5fe;
      border: 1px solid #cbd5e1;
      border-radius: 22px;
      overflow: hidden;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .controls {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      color: #0f172a;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      background: #0f172a;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    label {
      font-weight: 700;
    }

    input[type="range"] {
      width: 220px;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #38bdf8;
      outline-offset: 2px;
    }

    .hint {
      margin: 10px 0 0;
      color: #64748b;
      font-size: 0.95rem;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(-0.6deg); }
    }

    @keyframes flap {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-5deg); }
    }

    @keyframes chain {
      to { stroke-dashoffset: -32; }
    }

    @keyframes road {
      to { stroke-dashoffset: -110; }
    }

    @keyframes cloudMove {
      from { transform: translateX(-320px); }
      to { transform: translateX(920px); }
    }

    @keyframes speedline {
      0% { opacity: 0; transform: translateX(140px); }
      15% { opacity: 0.75; }
      100% { opacity: 0; transform: translateX(-420px); }
    }

    @keyframes glow {
      0%, 100% { transform: scale(1); opacity: 0.92; }
      50% { transform: scale(1.04); opacity: 1; }
    }

    .wheel-rear,
    .wheel-front,
    .crank {
      animation: spin linear infinite;
      transform-box: view-box;
    }

    .wheel-rear {
      transform-origin: 270px 420px;
      animation-duration: var(--wheel);
    }

    .wheel-front {
      transform-origin: 630px 420px;
      animation-duration: var(--wheel);
    }

    .crank {
      transform-origin: 450px 420px;
      animation-duration: var(--crank);
    }

    .chain {
      animation: chain var(--chain) linear infinite;
    }

    .road-line {
      animation: road var(--road) linear infinite;
    }

    .cloud {
      transform-box: view-box;
      transform-origin: center;
      animation: cloudMove var(--cloud) linear infinite;
    }

    .cloud-2 {
      animation-duration: calc(var(--cloud) * 1.35);
      animation-delay: -8s;
    }

    .cloud-3 {
      animation-duration: calc(var(--cloud) * 0.8);
      animation-delay: -22s;
    }

    .pelican {
      transform-box: view-box;
      transform-origin: 450px 360px;
      animation: bob var(--bob) ease-in-out infinite;
    }

    .wing {
      transform-box: view-box;
      transform-origin: 455px 240px;
      animation: flap calc(var(--bob) * 1.8) ease-in-out infinite;
    }

    .speed-line {
      transform-box: view-box;
      transform-origin: center;
      animation: speedline var(--speedline) linear infinite;
    }

    .speed-line.s2 {
      animation-duration: calc(var(--speedline) * 1.2);
      animation-delay: -0.35s;
    }

    .speed-line.s3 {
      animation-duration: calc(var(--speedline) * 0.85);
      animation-delay: -0.7s;
    }

    .sun {
      transform-box: view-box;
      transform-origin: 730px 110px;
      animation: glow 4.5s ease-in-out infinite;
    }

    .paused * {
      animation-play-state: paused !important;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <header>
      <h1>Pelican Riding a Bicycle</h1>
      <p>An inline animated SVG scene. The pelican pedals while the wheels, chain, clouds, road, and sun keep moving.</p>
    </header>

    <div class="scene">
      <svg
        id="scene"
        viewBox="0 0 900 600"
        role="img"
        aria-labelledby="sceneTitle sceneDesc"
        preserveAspectRatio="xMidYMid meet"
      >
        <title id="sceneTitle">Pelican riding a bicycle</title>
        <desc id="sceneDesc">
          A cartoon pelican with a long orange beak and large pouch rides a red bicycle on a road,
          with spinning wheels, moving clouds, and motion lines.
        </desc>

        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e1f5fe" />
            <stop offset="1" stop-color="#b3e5fc" />
          </linearGradient>

          <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="1" stop-color="#e3e8ef" />
          </linearGradient>

          <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ff8f00" />
            <stop offset="1" stop-color="#ffb300" />
          </linearGradient>

          <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#fff9c4" />
            <stop offset="0.7" stop-color="#ffca28" />
            <stop offset="1" stop-color="#ffb300" />
          </radialGradient>
        </defs>

        <!-- Sky -->
        <rect x="0" y="0" width="900" height="600" fill="url(#sky)" />

        <!-- Sun -->
        <g class="sun">
          <circle cx="730" cy="110" r="42" fill="url(#sun)" />
          <g stroke="#fff9c4" stroke-width="7" stroke-linecap="round" opacity="0.8">
            <line x1="730" y1="50" x2="730" y2="28" />
            <line x1="730" y1="170" x2="730" y2="192" />
            <line x1="790" y1="110" x2="812" y2="110" />
            <line x1="670" y1="110" x2="648" y2="110" />
            <line x1="772" y1="68" x2="792" y2="48" />
            <line x1="688" y1="152" x2="668" y2="172" />
            <line x1="772" y1="152" x2="792" y2="172" />
            <line x1="688" y1="68" x2="668" y2="48" />
          </g>
        </g>

        <!-- Clouds -->
        <g transform="translate(160 110)">
          <g class="cloud">
            <ellipse cx="0" cy="0" rx="46" ry="26" fill="#ffffff" opacity="0.92" />
            <ellipse cx="42" cy="8" rx="38" ry="22" fill="#ffffff" opacity="0.92" />
            <ellipse cx="-42" cy="10" rx="34" ry="20" fill="#ffffff" opacity="0.92" />
            <ellipse cx="12" cy="-18" rx="30" ry="20" fill="#ffffff" opacity="0.92" />
          </g>
        </g>

        <g transform="translate(580 86)">
          <g class="cloud cloud-2">
            <ellipse cx="0" cy="0" rx="40" ry="22" fill="#ffffff" opacity="0.88" />
            <ellipse cx="36" cy="7" rx="32" ry="18" fill="#ffffff" opacity="0.88" />
            <ellipse cx="-34" cy="8" rx="28" ry="16" fill="#ffffff" opacity="0.88" />
          </g>
        </g>

        <g transform="translate(340 155)">
          <g class="cloud cloud-3">
            <ellipse cx="0" cy="0" rx="52" ry="28" fill="#ffffff" opacity="0.84" />
            <ellipse cx="46" cy="9" rx="42" ry="24" fill="#ffffff" opacity="0.84" />
            <ellipse cx="-46" cy="11" rx="38" ry="22" fill="#ffffff" opacity="0.84" />
            <ellipse cx="14" cy="-20" rx="32" ry="20" fill="#ffffff" opacity="0.84" />
          </g>
        </g>

        <!-- Distant hills -->
        <path d="M0 472 C120 418, 240 432, 360 472 Z" fill="#c8e6c9" />
        <path d="M540 472 C640 402, 760 420, 900 472 Z" fill="#a5d6a7" />

        <!-- Road -->
        <rect x="0" y="470" width="900" height="130" fill="#37474f" />
        <path d="M0 470 H900" stroke="#263238" stroke-width="8" fill="none" />
        <path
          class="road-line"
          d="M0 535 H900"
          fill="none"
          stroke="#ffd54f"
          stroke-width="9"
          stroke-linecap="round"
          stroke-dasharray="64 46"
        />

        <!-- Shadow under bicycle -->
        <ellipse cx="450" cy="505" rx="205" ry="18" fill="rgba(0, 0, 0, 0.18)" />

        <!-- Speed lines -->
        <g stroke="#90a4ae" stroke-width="6" stroke-linecap="round" opacity="0.8">
          <line class="speed-line" x1="70" y1="320" x2="210" y2="320" />
          <line class="speed-line s2" x1="100" y1="370" x2="260" y2="370" />
          <line class="speed-line s3" x1="60" y1="420" x2="180" y2="420" />
        </g>

        <!-- Rear wheel -->
        <g class="wheel-rear" aria-hidden="true">
          <circle cx="270" cy="420" r="80" fill="none" stroke="#212121" stroke-width="12" />
          <circle cx="270" cy="420" r="70" fill="none" stroke="#b0bec5" stroke-width="3" />
          <path
            d="M270 350 V490 M200 420 H340 M220.7 370.7 L319.3 469.3 M319.3 370.7 L220.7 469.3"
            stroke="#90a4ae"
            stroke-width="3"
            fill="none"
          />
          <circle cx="270" cy="420" r="9" fill="#455a64" />
        </g>

        <!-- Front wheel -->
        <g class="wheel-front" aria-hidden="true">
          <circle cx="630" cy="420" r="80" fill="none" stroke="#212121" stroke-width="12" />
          <circle cx="630" cy="420" r="70" fill="none" stroke="#b0bec5" stroke-width="3" />
          <path
            d="M630 350 V490 M560 420 H700 M580.7 370.7 L679.3 469.3 M679.3 370.7 L580.7 469.3"
            stroke="#90a4ae"
            stroke-width="3"
            fill="none"
          />
          <circle cx="630" cy="420" r="9" fill="#455a64" />
        </g>

        <!-- Chain -->
        <path
          class="chain"
          d="M270 402 L450 394 A26 26 0 0 1 450 446 L270 438 A18 18 0 0 1 270 402 Z"
          fill="none"
          stroke="#616161"
          stroke-width="7"
          stroke-dasharray="9 7"
        />

        <!-- Rear cog -->
        <circle
          cx="270"
          cy="420"
          r="18"
          fill="#eceff1"
          stroke="#78909c"
          stroke-width="4"
          stroke-dasharray="6 5"
        />

        <!-- Bicycle frame -->
        <g stroke="#d32f2f" stroke-width="11" stroke-linecap="round" fill="none">
          <path d="M450 420 L428 312 L594 280 L608 320 L450 420" />
          <path d="M450 420 L270 420" />
          <path d="M428 312 L270 420" />
          <path d="M608 320 L630 420" />
          <path d="M594 280 L632 262" stroke-width="8" />
          <path
            d="M632 262 C660 260,666 292,645 296 C627 299,616 288,619 276"
            stroke-width="8"
          />
        </g>

        <!-- Seatpost -->
        <path d="M428 312 L412 286" stroke="#546e7a" stroke-width="8" stroke-linecap="round" fill="none" />

        <!-- Handlebar grips -->
        <circle cx="645" cy="296" r="6" fill="#212121" />
        <circle cx="619" cy="276" r="6" fill="#212121" />

        <!-- Bell -->
        <circle cx="615" cy="270" r="5" fill="#fdd835" stroke="#f9a825" stroke-width="2" />

        <!-- Saddle -->
        <path
          d="M378 288 C390 273, 434 268, 448 281 C432 295, 393 297, 378 288 Z"
          fill="#37474f"
          stroke="#263238"
          stroke-width="3"
        />

        <!-- Crankset and pedals -->
        <g class="crank">
          <circle
            cx="450"
            cy="420"
            r="26"
            fill="#eceff1"
            stroke="#78909c"
            stroke-width="4"
            stroke-dasharray="7 5"
          />
          <line x1="450" y1="420" x2="422" y2="420" stroke="#263238" stroke-width="10" />
          <rect x="410" y="413" width="24" height="14" rx="3" fill="#37474f" />
          <line x1="450" y1="420" x2="478" y2="420" stroke="#263238" stroke-width="10" />
          <rect x="466" y="413" width="24" height="14" rx="3" fill="#37474f" />
          <circle cx="450" cy="420" r="7" fill="#455a64" />
        </g>

        <!-- Pelican -->
        <g class="pelican">
          <!-- Tail feathers -->
          <path
            d="M355 250 C320 232, 285 238, 258 225 C286 247, 274 252, 248 254 C282 262, 305 272, 342 268 Z"
            fill="#eceff1"
            stroke="#b0bec5"
            stroke-width="2"
          />

          <!-- Body -->
          <ellipse cx="415" cy="248" rx="78" ry="53" fill="url(#body)" stroke="#b0bec5" stroke-width="2" />
          <path
            d="M385 210 C420 195, 470 205, 490 230 C460 215, 415 220, 390 230 Z"
            fill="#ffffff"
            opacity="0.75"
          />

          <!-- Neck -->
          <path
            d="M460 225 C482 160, 530 135, 580 158 L590 203 C542 184, 500 205, 472 258 Z"
            fill="url(#body)"
            stroke="#b0bec5"
            stroke-width="2"
          />

          <!-- Head -->
          <circle cx="600" cy="170" r="31" fill="#ffffff" stroke="#b0bec5" stroke-width="2" />

          <!-- Small head crest -->
          <path
            d="M600 143 C608 128, 620 130, 617 147 C612 140, 606 140, 600 150 Z"
            fill="#ffffff"
            stroke="#b0bec5"
            stroke-width="2"
          />

          <!-- Beak upper -->
          <path
            d="M610 154 L758 175 C767 180,767 188,758 189 L610 184 Z"
            fill="url(#beak)"
            stroke="#ef6c00"
            stroke-width="2"
          />

          <!-- Pouch -->
          <path
            d="M612 176 C655 255, 726 246, 756 188 C762 196,757 206,746 209 C705 257,645 251,610 196 Z"
            fill="#ffcc80"
            stroke="#fb8c00"
            stroke-width="2"
          />

          <!-- Mouth line -->
          <path
            d="M612 180 C660 191, 706 193, 754 186"
            fill="none"
            stroke="#bf360c"
            stroke-width="2"
            opacity="0.45"
          />

          <!-- Nostril -->
          <ellipse cx="648" cy="170" rx="5" ry="2" fill="#bf360c" opacity="0.35" />

          <!-- Eye -->
          <circle cx="604" cy="165" r="5" fill="#212121" />
          <circle cx="606" cy="163" r="2" fill="#ffffff" />

          <!-- Legs -->
          <g stroke="#fb8c00" stroke-width="10" stroke-linecap="round" fill="none">
            <path d="M398 292 C401 335,410 368,426 405" />
            <path d="M432 292 C450 330,463 362,474 405" />
          </g>

          <!-- Webbed feet on pedals -->
          <path
            d="M416 399 L444 415 L428 412 L420 427 Z"
            fill="#fb8c00"
            stroke="#ef6c00"
            stroke-width="2"
          />
          <path
            d="M464 399 L492 415 L476 412 L468 427 Z"
            fill="#fb8c00"
            stroke="#ef6c00"
            stroke-width="2"
          />

          <!-- Wing reaching toward handlebars -->
          <g class="wing">
            <path
              d="M438 228 C470 205,520 212,560 232 C595 248,620 262,640 265 L633 284 C605 285,560 274,520 258 C485 244,455 252,438 260 Z"
              fill="#f7f8fa"
              stroke="#cfd8dc"
              stroke-width="2"
            />
            <path d="M462 222 C488 218,512 222,532 230" fill="none" stroke="#cfd8dc" stroke-width="2" />
            <path d="M478 235 C506 232,534 238,558 248" fill="none" stroke="#cfd8dc" stroke-width="2" />
            <path d="M492 250 C518 248,544 254,568 262" fill="none" stroke="#cfd8dc" stroke-width="2" />
          </g>
        </g>
      </svg>
    </div>

    <div class="controls">
      <button id="toggle" type="button" aria-pressed="false">Pause motion</button>
      <label for="speed">Speed</label>
      <input id="speed" type="range" min="0.3" max="2.5" step="0.1" value="1" />
      <span id="speedValue" aria-live="polite">1.0×</span>
    </div>

    <p class="hint">Tip: press spacebar to pause and resume the animation.</p>
  </main>

  <script>
    const root = document.documentElement;
    const stage = document.getElementById("stage");
    const toggle = document.getElementById("toggle");
    const speed = document.getElementById("speed");
    const speedValue = document.getElementById("speedValue");

    let paused = false;

    function setPaused(value) {
      paused = value;
      stage.classList.toggle("paused", paused);
      toggle.textContent = paused ? "Play motion" : "Pause motion";
      toggle.setAttribute("aria-pressed", String(paused));
    }

    toggle.addEventListener("click", () => {
      setPaused(!paused);
    });

    speed.addEventListener("input", () => {
      const value = Number(speed.value).toFixed(1);
      root.style.setProperty("--speed", value);
      speedValue.textContent = `${value}×`;
    });

    window.addEventListener("keydown", (event) => {
      if (event.code === "Space" && event.target === document.body) {
        event.preventDefault();
        setPaused(!paused);
      }
    });
  </script>
</body>
</html>
