<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelican Riding a Bicycle</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f8fbff 0%, #e9f2ff 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }

    .card {
      width: min(96vw, 980px);
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 28px;
      box-shadow:
        0 20px 60px rgba(30, 41, 59, 0.14),
        0 4px 14px rgba(30, 41, 59, 0.08);
      padding: 24px;
    }

    .title {
      margin: 0 0 16px;
      text-align: center;
      font-size: clamp(1.25rem, 2.5vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #1f2937;
    }

    .subtitle {
      margin: -8px 0 18px;
      text-align: center;
      color: #64748b;
      font-size: 0.95rem;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 22px;
      background: #eaf6ff;
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.28);
      cursor: pointer;
      transition: transform 0.18s ease, filter 0.18s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    button:active {
      transform: translateY(1px);
    }

    .wheel,
    .rays,
    .pelican {
      transform-box: fill-box;
      transform-origin: center;
    }

    .wheel {
      animation: spin 1.7s linear infinite;
    }

    .rays {
      animation: spin 18s linear infinite;
    }

    .pelican {
      animation: bob 1.15s ease-in-out infinite;
    }

    .cloud {
      animation: drift 26s linear infinite;
    }

    .cloud-b {
      animation-duration: 34s;
      animation-delay: -12s;
    }

    .cloud-c {
      animation-duration: 22s;
      animation-delay: -18s;
    }

    #scene.paused * {
      animation-play-state: paused !important;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes bob {
      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-6px) rotate(-0.6deg);
      }
    }

    @keyframes drift {
      from {
        transform: translateX(-240px);
      }
      to {
        transform: translateX(1120px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="title">Pelican Riding a Bicycle</h1>
    <p class="subtitle">Inline SVG cartoon with CSS animation and a play/pause control.</p>

    <svg
      id="scene"
      viewBox="0 0 900 560"
      xmlns="http://www.w3.org/2000/svg"
      role="img"
      aria-labelledby="sceneTitle sceneDesc"
    >
      <title id="sceneTitle">Pelican riding a bicycle</title>
      <desc id="sceneDesc">
        A cartoon pelican with a large orange beak and pouch sits on a red bicycle,
        with one wing on the handlebar and webbed feet on the pedals.
      </desc>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#bde0fe" />
          <stop offset="100%" stop-color="#f7fbff" />
        </linearGradient>

        <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#90be6d" />
          <stop offset="100%" stop-color="#58a55c" />
        </linearGradient>

        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff7cc" />
          <stop offset="70%" stop-color="#ffd166" />
          <stop offset="100%" stop-color="#ffb703" />
        </radialGradient>
      </defs>

      <!-- Sky -->
      <rect width="900" height="560" fill="url(#sky)" />

      <!-- Sun -->
      <g transform="translate(760, 92)">
        <g class="rays" stroke="#ffd166" stroke-width="7" stroke-linecap="round">
          <line x1="0" y1="-58" x2="0" y2="-80" />
          <line x1="41" y1="-41" x2="57" y2="-57" />
          <line x1="58" y1="0" x2="80" y2="0" />
          <line x1="41" y1="41" x2="57" y2="57" />
          <line x1="0" y1="58" x2="0" y2="80" />
          <line x1="-41" y1="41" x2="-57" y2="57" />
          <line x1="-58" y1="0" x2="-80" y2="0" />
          <line x1="-41" y1="-41" x2="-57" y2="-57" />
        </g>
        <circle r="44" fill="url(#sunGlow)" />
      </g>

      <!-- Clouds -->
      <g transform="translate(150, 95)">
        <g class="cloud">
          <ellipse cx="0" cy="0" rx="48" ry="26" fill="#ffffff" opacity="0.94" />
          <ellipse cx="34" cy="8" rx="34" ry="22" fill="#ffffff" opacity="0.94" />
          <ellipse cx="-34" cy="10" rx="30" ry="20" fill="#ffffff" opacity="0.94" />
        </g>
      </g>

      <g transform="translate(430, 72)">
        <g class="cloud cloud-b">
          <ellipse cx="0" cy="0" rx="42" ry="22" fill="#ffffff" opacity="0.88" />
          <ellipse cx="28" cy="7" rx="28" ry="18" fill="#ffffff" opacity="0.88" />
          <ellipse cx="-28" cy="8" rx="26" ry="17" fill="#ffffff" opacity="0.88" />
        </g>
      </g>

      <g transform="translate(650, 125)">
        <g class="cloud cloud-c">
          <ellipse cx="0" cy="0" rx="36" ry="19" fill="#ffffff" opacity="0.82" />
          <ellipse cx="24" cy="6" rx="24" ry="15" fill="#ffffff" opacity="0.82" />
          <ellipse cx="-24" cy="7" rx="22" ry="14" fill="#ffffff" opacity="0.82" />
        </g>
      </g>

      <!-- Ground -->
      <path d="M0,470 Q225,442 450,470 T900,470 L900,560 L0,560 Z" fill="url(#grass)" />
      <path d="M0,488 Q225,464 450,488 T900,488 L900,560 L0,560 Z" fill="#4c9a57" opacity="0.75" />

      <!-- Shadow -->
      <ellipse cx="425" cy="482" rx="270" ry="16" fill="rgba(15, 23, 42, 0.16)" />

      <!-- Bicycle -->
      <g id="bike">
        <!-- Rear wheel -->
        <g transform="translate(250, 400)">
          <g class="wheel">
            <circle r="75" fill="none" stroke="#212529" stroke-width="12" />
            <circle r="62" fill="none" stroke="#adb5bd" stroke-width="5" />
            <g stroke="#dee2e6" stroke-width="3">
              <line x1="-62" y1="0" x2="62" y2="0" />
              <line x1="0" y1="-62" x2="0" y2="62" />
              <line x1="-44" y1="-44" x2="44" y2="44" />
              <line x1="-44" y1="44" x2="44" y2="-44" />
            </g>
            <circle r="9" fill="#495057" stroke="#212529" stroke-width="3" />
          </g>
        </g>

        <!-- Front wheel -->
        <g transform="translate(600, 400)">
          <g class="wheel">
            <circle r="75" fill="none" stroke="#212529" stroke-width="12" />
            <circle r="62" fill="none" stroke="#adb5bd" stroke-width="5" />
            <g stroke="#dee2e6" stroke-width="3">
              <line x1="-62" y1="0" x2="62" y2="0" />
              <line x1="0" y1="-62" x2="0" y2="62" />
              <line x1="-44" y1="-44" x2="44" y2="44" />
              <line x1="-44" y1="44" x2="44" y2="-44" />
            </g>
            <circle r="9" fill="#495057" stroke="#212529" stroke-width="3" />
          </g>
        </g>

        <!-- Frame -->
        <g stroke="#d62828" stroke-width="12" stroke-linecap="round" fill="none">
          <line x1="250" y1="400" x2="425" y2="400" />
          <line x1="350" y1="280" x2="425" y2="400" />
          <line x1="425" y1="400" x2="560" y2="295" />
          <line x1="350" y1="280" x2="555" y2="285" />
          <line x1="250" y1="400" x2="350" y2="280" />
          <line x1="555" y1="285" x2="600" y2="400" />
        </g>

        <!-- Head tube -->
        <line
          x1="555"
          y1="285"
          x2="570"
          y2="325"
          stroke="#d62828"
          stroke-width="14"
          stroke-linecap="round"
        />

        <!-- Seat post and saddle -->
        <line
          x1="350"
          y1="280"
          x2="350"
          y2="262"
          stroke="#495057"
          stroke-width="7"
          stroke-linecap="round"
        />
        <path
          d="M308,262 C328,250 372,250 392,262 C378,274 322,274 308,262 Z"
          fill="#343a40"
        />

        <!-- Handlebar -->
        <path
          d="M555,285 C582,250 612,248 635,270"
          fill="none"
          stroke="#343a40"
          stroke-width="8"
          stroke-linecap="round"
        />
        <circle cx="635" cy="270" r="7" fill="#212529" />

        <!-- Chain -->
        <g fill="none" stroke="#495057" stroke-width="5">
          <path d="M425,372 L250,386" />
          <path d="M425,428 L250,414" />
        </g>

        <!-- Rear cog -->
        <circle cx="250" cy="400" r="14" fill="#ced4da" stroke="#495057" stroke-width="4" />

        <!-- Chainring -->
        <circle cx="425" cy="400" r="28" fill="#ced4da" stroke="#495057" stroke-width="4" />
        <circle cx="425" cy="400" r="7" fill="#495057" />

        <!-- Cranks -->
        <g stroke="#212529" stroke-width="9" stroke-linecap="round">
          <line x1="425" y1="400" x2="455" y2="430" />
          <line x1="425" y1="400" x2="395" y2="370" />
        </g>

        <!-- Pedals -->
        <rect x="438" y="424" width="38" height="12" rx="4" fill="#212529" />
        <rect x="376" y="364" width="38" height="12" rx="4" fill="#212529" />
      </g>

      <!-- Pelican -->
      <g id="pelican" class="pelican">
        <!-- Far leg -->
        <path
          d="M330,255 C325,300 350,340 390,368"
          fill="none"
          stroke="#f77f00"
          stroke-width="11"
          stroke-linecap="round"
        />
        <path
          d="M370,360 L408,360 L402,374 L378,374 Z"
          fill="#f77f00"
          stroke="#343a40"
          stroke-width="3"
          stroke-linejoin="round"
        />

        <!-- Tail -->
        <path
          d="M285,220 C245,205 225,230 235,255 C255,262 275,255 290,242 Z"
          fill="#f8f9fa"
          stroke="#343a40"
          stroke-width="4"
          stroke-linejoin="round"
        />

        <!-- Body -->
        <ellipse
          cx="345"
          cy="225"
          rx="75"
          ry="58"
          fill="#ffffff"
          stroke="#343a40"
          stroke-width="4"
        />

        <!-- Neck -->
        <path
          d="M365,200 C385,135 435,115 485,140 L505,170 C470,178 430,185 395,235 Z"
          fill="#ffffff"
          stroke="#343a40"
          stroke-width="4"
          stroke-linejoin="round"
        />

        <!-- Wing reaching handlebar -->
        <path
          d="M345,205 C420,175 520,210 625,258 L630,280 C540,290 410,275 350,250 Z"
          fill="#f8f9fa"
          stroke="#343a40"
          stroke-width="4"
          stroke-linejoin="round"
        />
        <path
          d="M390,225 C450,220 520,235 590,255"
          fill="none"
          stroke="#ced4da"
          stroke-width="3"
          stroke-linecap="round"
        />
        <path
          d="M375,245 C435,245 510,255 580,270"
          fill="none"
          stroke="#ced4da"
          stroke-width="3"
          stroke-linecap="round"
        />

        <!-- Head -->
        <circle
          cx="492"
          cy="158"
          r="26"
          fill="#ffffff"
          stroke="#343a40"
          stroke-width="4"
        />

        <!-- Upper beak -->
        <path
          d="M508,148 L615,142 L612,156 L512,164 Z"
          fill="#f77f00"
          stroke="#343a40"
          stroke-width="4"
          stroke-linejoin="round"
        />

        <!-- Pouch -->
        <path
          d="M508,164 C530,222 585,222 612,156 L615,142 C590,160 540,165 508,164 Z"
          fill="#ffb703"
          stroke="#343a40"
          stroke-width="4"
          stroke-linejoin="round"
        />

        <!-- Eye -->
        <circle cx="495" cy="152" r="4.5" fill="#212529" />

        <!-- Near leg -->
        <path
          d="M355,260 C360,320 405,380 448,425"
          fill="none"
          stroke="#f77f00"
          stroke-width="12"
          stroke-linecap="round"
        />
        <path
          d="M436,418 C450,412 470,414 478,422 L472,436 C458,438 442,436 436,430 Z"
          fill="#f77f00"
          stroke="#343a40"
          stroke-width="3"
          stroke-linejoin="round"
        />
      </g>
    </svg>

    <div class="controls">
      <button id="toggle" type="button">Pause animation</button>
    </div>
  </main>

  <script>
    const scene = document.getElementById("scene");
    const toggle = document.getElementById("toggle");
    let paused = false;

    toggle.addEventListener("click", () => {
      paused = !paused;
      scene.classList.toggle("paused", paused);
      toggle.textContent = paused ? "Play animation" : "Pause animation";
    });
  </script>
</body>
</html>
