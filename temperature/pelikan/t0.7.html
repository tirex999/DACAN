<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelican Riding a Bicycle</title>
  <style>
    :root {
      --speed: 1s;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    body.night {
      background: #020617;
      color: #e5e7eb;
    }

    .wrap {
      max-width: 920px;
      margin: 2rem auto;
      padding: 1rem;
    }

    h1 {
      margin: 0 0 .5rem;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      letter-spacing: -0.03em;
    }

    p {
      margin: 0 0 1rem;
      color: #4b5563;
    }

    body.night p {
      color: #cbd5e1;
    }

    .stage {
      background: #ffffff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, .12);
    }

    body.night .stage {
      box-shadow: 0 25px 50px rgba(0, 0, 0, .55);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .controls {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      align-items: center;
    }

    button {
      font: inherit;
      font-weight: 700;
      border: 0;
      border-radius: 999px;
      padding: .6rem 1rem;
      background: #2563eb;
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(37, 99, 235, .28);
      transition: transform .15s ease, background .15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: #1d4ed8;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #60a5fa;
      outline-offset: 2px;
    }

    label {
      font-weight: 700;
    }

    input[type="range"] {
      width: 170px;
      accent-color: #2563eb;
    }

    body.night input[type="range"] {
      accent-color: #60a5fa;
    }

    /* Scene colors */
    .sky-top {
      stop-color: #bfe3ff;
    }

    .sky-bottom {
      stop-color: #e0f2fe;
    }

    body.night .sky-top {
      stop-color: #020617;
    }

    body.night .sky-bottom {
      stop-color: #1e3a8a;
    }

    .sun {
      fill: #fde68a;
    }

    body.night .sun {
      fill: #f8fafc;
    }

    .sun-glow {
      stop-color: #fde68a;
      stop-opacity: .55;
    }

    .sun-glow-outer {
      stop-color: #fde68a;
      stop-opacity: 0;
    }

    body.night .sun-glow {
      stop-color: #e2e8f0;
      stop-opacity: .35;
    }

    body.night .sun-glow-outer {
      stop-color: #e2e8f0;
      stop-opacity: 0;
    }

    .cloud {
      fill: white;
      opacity: .82;
    }

    body.night .cloud {
      fill: #cbd5e1;
      opacity: .28;
    }

    .grass-top {
      stop-color: #86efac;
    }

    .grass-bottom {
      stop-color: #16a34a;
    }

    body.night .grass-top {
      stop-color: #14532d;
    }

    body.night .grass-bottom {
      stop-color: #052e16;
    }

    .road {
      fill: #475569;
    }

    body.night .road {
      fill: #334155;
    }

    .road-mark {
      stroke: #fbbf24;
      stroke-width: 6;
      stroke-dasharray: 40 32;
      stroke-linecap: round;
      animation: dash calc(var(--speed) * .8) linear infinite;
    }

    body.night .road-mark {
      stroke: #fde68a;
    }

    .shadow {
      fill: rgba(15, 23, 42, .18);
    }

    body.night .shadow {
      fill: rgba(0, 0, 0, .45);
    }

    /* Bicycle */
    .frame path {
      stroke: #2563eb;
      stroke-width: 11;
      fill: none;
    }

    body.night .frame path {
      stroke: #60a5fa;
    }

    .saddle {
      fill: #111827;
    }

    .handlebar {
      fill: none;
      stroke: #111827;
      stroke-width: 8;
      stroke-linecap: round;
    }

    .chain {
      fill: none;
      stroke: #64748b;
      stroke-width: 5;
    }

    .tire {
      fill: none;
      stroke: #111827;
      stroke-width: 12;
    }

    .rim {
      fill: none;
      stroke: #cbd5e1;
      stroke-width: 3;
    }

    .spokes line {
      stroke: #94a3b8;
      stroke-width: 4;
    }

    .hub,
    .cog {
      fill: #334155;
      stroke: #111827;
      stroke-width: 3;
    }

    .chainring {
      fill: #334155;
      stroke: #111827;
      stroke-width: 6;
    }

    .crank {
      stroke: #111827;
      stroke-width: 10;
      stroke-linecap: round;
    }

    .pedal {
      fill: #334155;
      stroke: #111827;
      stroke-width: 2;
    }

    /* Pelican */
    .body {
      fill: #f8fafc;
      stroke: #334155;
      stroke-width: 3;
    }

    .wing {
      fill: #e2e8f0;
      stroke: #334155;
      stroke-width: 3;
    }

    .beak {
      fill: #f59e0b;
      stroke: #b45309;
      stroke-width: 3;
    }

    .pouch {
      fill: #fcd34d;
      stroke: #b45309;
      stroke-width: 3;
    }

    .eye {
      fill: #111827;
    }

    .leg {
      fill: none;
      stroke: #ea580c;
      stroke-width: 8;
      stroke-linecap: round;
    }

    .foot {
      fill: #ea580c;
    }

    /* Animation */
    .spin,
    .pelican,
    .clouds,
    .road-mark {
      will-change: transform, stroke-dashoffset;
    }

    .spin {
      animation: spin var(--speed) linear infinite;
      transform-box: fill-box;
      transform-origin: 50% 50%;
    }

    .pelican {
      animation: bob calc(var(--speed) * .65) ease-in-out infinite alternate;
      transform-box: fill-box;
      transform-origin: 50% 50%;
    }

    .clouds {
      animation: drift calc(var(--speed) * 24) linear infinite;
      transform-box: fill-box;
      transform-origin: 50% 50%;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes bob {
      from {
        transform: translateY(0) rotate(0deg);
      }
      to {
        transform: translateY(-7px) rotate(1.2deg);
      }
    }

    @keyframes drift {
      from {
        transform: translateX(-260px);
      }
      to {
        transform: translateX(860px);
      }
    }

    @keyframes dash {
      from {
        stroke-dashoffset: 0;
      }
      to {
        stroke-dashoffset: -72;
      }
    }

    #scene.paused .spin,
    #scene.paused .pelican,
    #scene.paused .clouds,
    #scene.paused .road-mark {
      animation-play-state: paused;
    }

    @media (prefers-reduced-motion: reduce) {
      .spin,
      .pelican,
      .clouds,
      .road-mark {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Pelican Riding a Bicycle</h1>
    <p>A tiny cartoon pelican pedals along a road. Pause, change speed, or switch to night mode.</p>

    <div class="stage">
      <svg
        id="scene"
        viewBox="0 0 800 500"
        role="img"
        aria-labelledby="sceneTitle sceneDesc"
        xmlns="http://www.w3.org/2000/svg"
      >
        <title id="sceneTitle">Pelican riding a bicycle</title>
        <desc id="sceneDesc">
          A white pelican with a large orange beak and pouch rides a blue bicycle along a road,
          with spinning wheels, moving clouds, and a sun.
        </desc>

        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop class="sky-top" offset="0%" />
            <stop class="sky-bottom" offset="100%" />
          </linearGradient>

          <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
            <stop class="grass-top" offset="0%" />
            <stop class="grass-bottom" offset="100%" />
          </linearGradient>

          <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
            <stop class="sun-glow" offset="0%" />
            <stop class="sun-glow-outer" offset="100%" />
          </radialGradient>
        </defs>

        <!-- Sky -->
        <rect width="800" height="500" fill="url(#skyGrad)" />

        <!-- Sun -->
        <circle cx="115" cy="95" r="78" fill="url(#sunGlow)" />
        <circle class="sun" cx="115" cy="95" r="40" />

        <!-- Clouds -->
        <g class="clouds">
          <g class="cloud" transform="translate(150 95)">
            <ellipse cx="0" cy="0" rx="42" ry="22" />
            <ellipse cx="30" cy="-14" rx="28" ry="20" />
            <ellipse cx="58" cy="2" rx="26" ry="18" />
            <rect x="-30" y="-2" width="110" height="24" rx="12" />
          </g>

          <g class="cloud" transform="translate(520 75) scale(1.1)">
            <ellipse cx="0" cy="0" rx="42" ry="22" />
            <ellipse cx="30" cy="-14" rx="28" ry="20" />
            <ellipse cx="58" cy="2" rx="26" ry="18" />
            <rect x="-30" y="-2" width="110" height="24" rx="12" />
          </g>

          <g class="cloud" transform="translate(330 145) scale(.8)">
            <ellipse cx="0" cy="0" rx="42" ry="22" />
            <ellipse cx="30" cy="-14" rx="28" ry="20" />
            <ellipse cx="58" cy="2" rx="26" ry="18" />
            <rect x="-30" y="-2" width="110" height="24" rx="12" />
          </g>
        </g>

        <!-- Ground and road -->
        <rect class="grass" x="0" y="360" width="800" height="140" fill="url(#grassGrad)" />
        <rect class="road" x="0" y="405" width="800" height="48" />
        <line class="road-mark" x1="-20" y1="430" x2="820" y2="430" />

        <!-- Shadow -->
        <ellipse class="shadow" cx="415" cy="446" rx="215" ry="14" />

        <!-- Bicycle -->
        <g class="bike">
          <!-- Chain -->
          <path class="chain" d="M250 368 L410 344 M250 392 L410 396" />

          <!-- Rear wheel -->
          <g transform="translate(250 380)">
            <g class="spin">
              <circle class="tire" cx="0" cy="0" r="62" />
              <circle class="rim" cx="0" cy="0" r="50" />
              <g class="spokes">
                <line x1="0" y1="-58" x2="0" y2="58" />
                <line x1="-58" y1="0" x2="58" y2="0" />
                <line x1="-41" y1="-41" x2="41" y2="41" />
                <line x1="41" y1="-41" x2="-41" y2="41" />
              </g>
              <circle class="cog" cx="0" cy="0" r="12" />
              <circle class="hub" cx="0" cy="0" r="7" />
            </g>
          </g>

          <!-- Front wheel -->
          <g transform="translate(580 380)">
            <g class="spin">
              <circle class="tire" cx="0" cy="0" r="62" />
              <circle class="rim" cx="0" cy="0" r="50" />
              <g class="spokes">
                <line x1="0" y1="-58" x2="0" y2="58" />
                <line x1="-58" y1="0" x2="58" y2="0" />
                <line x1="-41" y1="-41" x2="41" y2="41" />
                <line x1="41" y1="-41" x2="-41" y2="41" />
              </g>
              <circle class="hub" cx="0" cy="0" r="7" />
            </g>
          </g>

          <!-- Frame -->
          <g class="frame" stroke-linecap="round" stroke-linejoin="round">
            <path d="M250 380 L410 370" />
            <path d="M410 370 L385 255" />
            <path d="M250 380 L385 255" />
            <path d="M410 370 L530 255" />
            <path d="M385 255 L530 255" />
            <path d="M530 255 L580 380" />
            <path d="M530 255 L548 242" />
          </g>

          <!-- Saddle -->
          <path
            class="saddle"
            d="M355 252 C375 238 395 238 415 252 C408 268 362 268 355 252 Z"
          />

          <!-- Handlebar -->
          <path
            class="handlebar"
            d="M548 242 C570 228 592 238 586 254 C581 265 566 262 558 255"
          />

          <!-- Chainring and cranks -->
          <circle class="chainring" cx="410" cy="370" r="26" />
          <line class="crank" x1="410" y1="370" x2="463" y2="389" />
          <line class="crank" x1="410" y1="370" x2="357" y2="351" />

          <!-- Pedals -->
          <rect
            class="pedal"
            x="448"
            y="383"
            width="30"
            height="12"
            rx="4"
            transform="rotate(18 463 389)"
          />
          <rect
            class="pedal"
            x="342"
            y="345"
            width="30"
            height="12"
            rx="4"
            transform="rotate(-18 357 351)"
          />
        </g>

        <!-- Pelican -->
        <g class="pelican" stroke-linecap="round" stroke-linejoin="round">
          <!-- Tail -->
          <path
            class="body"
            d="M315 205 C285 185 258 193 250 218 C268 236 298 242 320 236 Z"
          />

          <!-- Body -->
          <ellipse class="body" cx="360" cy="220" rx="65" ry="46" />

          <!-- Neck -->
          <path
            class="body"
            d="M385 192 C398 140 450 128 488 156 C488 176 448 184 422 228 Z"
          />

          <!-- Head -->
          <circle class="body" cx="470" cy="158" r="33" />

          <!-- Beak -->
          <path class="beak" d="M492 160 L582 174 L496 186 Z" />

          <!-- Pouch -->
          <path
            class="pouch"
            d="M494 180 C520 230 562 226 580 176 L572 173 C550 210 518 210 498 186 Z"
          />

          <!-- Eye -->
          <circle class="eye" cx="477" cy="150" r="4" />

          <!-- Wing reaching the handlebar -->
          <path
            class="wing"
            d="M342 202 C380 232 460 244 538 247 C546 258 532 266 518 262 C452 258 378 244 336 226 Z"
          />

          <!-- Right leg and foot -->
          <path class="leg" d="M382 258 C395 295 424 348 453 381" />
          <path class="foot" d="M440 376 h32 l-9 13 h-32 z" />

          <!-- Left leg and foot -->
          <path class="leg" d="M352 258 C342 292 346 320 356 344" />
          <path class="foot" d="M338 340 h32 l-9 13 h-32 z" />
        </g>
      </svg>
    </div>

    <div class="controls">
      <button id="playPause" aria-label="Pause animation">Pause</button>
      <label for="speed">Speed</label>
      <input id="speed" type="range" min="0.3" max="3" step="0.1" value="1" aria-label="Animation speed">
      <button id="mode">Night mode</button>
    </div>
  </main>

  <script>
    const scene = document.getElementById("scene");
    const playPause = document.getElementById("playPause");
    const speed = document.getElementById("speed");
    const mode = document.getElementById("mode");

    playPause.addEventListener("click", () => {
      const paused = scene.classList.toggle("paused");
      playPause.textContent = paused ? "Play" : "Pause";
      playPause.setAttribute("aria-label", paused ? "Play animation" : "Pause animation");
    });

    speed.addEventListener("input", () => {
      document.documentElement.style.setProperty("--speed", `${speed.value}s`);
    });

    mode.addEventListener("click", () => {
      const night = document.body.classList.toggle("night");
      mode.textContent = night ? "Day mode" : "Night mode";
    });
  </script>
</body>
</html>
