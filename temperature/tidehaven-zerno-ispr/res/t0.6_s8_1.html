<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tidehaven — a coastal island diorama</title>
<meta name="description" content="Tidehaven: an interactive 3D cutaway island diorama built with Three.js." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TIDEHAVEN — UI shell
   ============================================================ */
:root{
  --ink:#0f0d0c;
  --ink-2:#171413;
  --cream:#f7ece0;
  --cream-dim:rgba(247,236,224,.58);
  --cream-faint:rgba(247,236,224,.34);
  --copper:#d1783a;
  --copper-lt:#f0a468;
  --sea:#4fd0c2;
  --panel:rgba(18,15,14,.60);
  --panel-brd:rgba(255,232,210,.12);
  --panel-hi:rgba(255,236,214,.07);
  --shadow:0 18px 44px -18px rgba(0,0,0,.85), 0 2px 0 0 var(--panel-hi) inset;
  --r:13px;
  --mono:ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 90% at 50% 0%,#1b2a30 0%,#0c0a09 62%);
  color:var(--cream);
  font-family:"Instrument Sans",system-ui,sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}

/* underwater colour wash (driven from JS) */
#uwTint{
  position:fixed;inset:0;pointer-events:none;opacity:0;z-index:2;
  background:
    radial-gradient(85% 65% at 50% 40%,rgba(30,150,146,.10) 0%,rgba(6,60,68,.42) 100%),
    linear-gradient(180deg,rgba(64,206,192,.16),rgba(4,52,64,.30));
  transition:opacity .35s ease;
  mix-blend-mode:screen;
}

/* ---------- brand ---------- */
.brand{
  position:fixed;top:clamp(14px,2.4vh,26px);left:clamp(14px,2.4vw,30px);z-index:6;
  display:flex;gap:14px;align-items:flex-start;pointer-events:none;
  text-shadow:0 6px 26px rgba(0,0,0,.75);
}
.brand__mark{
  width:34px;height:34px;flex:0 0 34px;margin-top:8px;position:relative;
  border:1px solid rgba(255,232,210,.28);border-radius:50%;
  display:grid;place-items:center;
}
.brand__mark::after{
  content:"";width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffd9b3,var(--copper));
  box-shadow:0 0 14px 2px rgba(209,120,58,.65);
  animation:pulse 4.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.32)}}
.brand__title{
  font-family:"Bricolage Grotesque",serif;font-weight:800;
  font-size:clamp(34px,5.2vw,62px);line-height:.86;letter-spacing:-.035em;
  margin:0;font-variation-settings:"opsz" 64;
}
.brand__sub{
  margin:.55em 0 0;font-size:12.5px;letter-spacing:.02em;color:var(--cream-dim);
  max-width:31ch;font-weight:500;
}
.brand__sub b{color:var(--sea);font-weight:600;letter-spacing:.04em}

/* ---------- panels ---------- */
.rail{
  position:fixed;top:clamp(14px,2.4vh,26px);right:clamp(14px,2.2vw,26px);z-index:7;
  width:262px;display:flex;flex-direction:column;gap:10px;
  max-height:calc(100vh - 40px);overflow:auto;scrollbar-width:none;
  padding-bottom:4px;
}
.rail::-webkit-scrollbar{display:none}
.panel{
  background:var(--panel);border:1px solid var(--panel-brd);border-radius:var(--r);
  box-shadow:var(--shadow);backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  overflow:hidden;
}
.panel__head{
  all:unset;display:flex;align-items:center;gap:9px;width:100%;cursor:pointer;
  padding:11px 12px;font-size:9.5px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:var(--cream-dim);
}
.panel__head:hover{color:var(--cream)}
.panel__dot{width:5px;height:5px;border-radius:50%;background:var(--copper);box-shadow:0 0 8px var(--copper)}
.panel__chev{margin-left:auto;transition:transform .3s cubic-bezier(.4,0,.2,1);opacity:.55}
.panel.collapsed .panel__chev{transform:rotate(-90deg)}
.panel__body{
  padding:2px 12px 13px;display:flex;flex-direction:column;gap:11px;
  animation:reveal .35s cubic-bezier(.2,.8,.2,1);
}
.panel.collapsed .panel__body{display:none}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.ctl label{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--cream-faint);
  margin-bottom:7px;font-weight:600;
}
.ctl output{font-family:var(--mono);font-size:11px;color:var(--copper-lt);letter-spacing:0;font-variant-numeric:tabular-nums}

/* range */
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer;margin:0;
}
input[type=range]::-webkit-slider-runnable-track{
  height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--copper) 0 var(--fill,50%),rgba(255,236,214,.16) var(--fill,50%) 100%);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;margin-top:-5px;
  background:radial-gradient(circle at 34% 30%,#ffd9b8,var(--copper));
  box-shadow:0 0 0 3px rgba(209,120,58,.18),0 2px 6px rgba(0,0,0,.5);
  transition:box-shadow .2s,transform .12s;
}
input[type=range]:hover::-webkit-slider-thumb{box-shadow:0 0 0 6px rgba(209,120,58,.22),0 2px 8px rgba(0,0,0,.55);transform:scale(1.1)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:rgba(255,236,214,.16)}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--copper)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--copper-lt)}

/* segmented */
.seg{display:flex;gap:4px;background:rgba(255,236,214,.05);padding:3px;border-radius:9px}
.seg button{
  all:unset;flex:1;text-align:center;padding:7px 4px;border-radius:7px;cursor:pointer;
  font-size:9px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--cream-dim);
  transition:background .22s,color .22s,transform .12s;
}
.seg button:hover{color:var(--cream);background:rgba(255,236,214,.06)}
.seg button:active{transform:scale(.96)}
.seg button.on{background:linear-gradient(180deg,var(--copper-lt),var(--copper));color:#20120a;box-shadow:0 3px 10px -3px rgba(209,120,58,.8)}

.btn{
  all:unset;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;
  padding:9px 11px;border-radius:9px;border:1px solid rgba(255,236,214,.14);
  font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--cream-dim);
  transition:transform .14s cubic-bezier(.3,1.4,.5,1),border-color .2s,color .2s,background .2s;
}
.btn:hover{transform:translateY(-1.5px);color:var(--cream);border-color:rgba(240,164,104,.5);background:rgba(209,120,58,.10)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.on{background:linear-gradient(180deg,var(--copper-lt),var(--copper));color:#20120a;border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}

/* ---------- hero actions ---------- */
.actions{
  position:fixed;left:50%;transform:translateX(-50%);bottom:clamp(16px,3.4vh,34px);z-index:7;
  display:flex;gap:9px;align-items:center;
}
.hero{
  all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;
  padding:12px 18px;border-radius:100px;
  background:linear-gradient(180deg,rgba(28,23,21,.78),rgba(14,11,10,.82));
  border:1px solid rgba(255,232,210,.16);
  box-shadow:0 20px 40px -18px #000, 0 1px 0 rgba(255,236,214,.09) inset;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font-family:"Bricolage Grotesque",serif;font-weight:600;font-size:13px;letter-spacing:-.01em;color:var(--cream);
  transition:transform .18s cubic-bezier(.3,1.5,.5,1),border-color .25s,box-shadow .25s;
}
.hero i{
  font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#ffd9b8,var(--copper));color:#1b0f07;font-size:11px;
  box-shadow:0 0 12px rgba(209,120,58,.5);transition:transform .3s;
}
.hero:hover{transform:translateY(-3px);border-color:rgba(240,164,104,.55);box-shadow:0 26px 46px -18px #000,0 0 26px -6px rgba(209,120,58,.5)}
.hero:hover i{transform:rotate(18deg) scale(1.12)}
.hero:active{transform:translateY(-1px) scale(.985)}
.hero.busy{border-color:rgba(79,208,194,.6)}
.hero.busy i{background:radial-gradient(circle at 35% 30%,#c9fff6,#2ba79b);animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- camera bar ---------- */
.cambar{
  position:fixed;left:clamp(14px,2.4vw,30px);bottom:clamp(16px,3.4vh,34px);z-index:7;
  display:flex;gap:5px;padding:5px;border-radius:12px;
  background:var(--panel);border:1px solid var(--panel-brd);box-shadow:var(--shadow);
  backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
}
.cambar button{
  all:unset;cursor:pointer;padding:8px 12px;border-radius:8px;font-size:9px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--cream-faint);transition:.22s;
}
.cambar button:hover{color:var(--cream);background:rgba(255,236,214,.06)}
.cambar button.on{background:rgba(79,208,194,.16);color:#a8f4ea;box-shadow:inset 0 0 0 1px rgba(79,208,194,.35)}

.hint{
  position:fixed;left:clamp(14px,2.4vw,30px);bottom:calc(clamp(16px,3.4vh,34px) + 52px);z-index:6;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--cream-faint);
  pointer-events:none;transition:opacity .8s ease;
}

/* ---------- mobile ---------- */
.fab{
  position:fixed;right:14px;bottom:calc(clamp(16px,3.4vh,34px) + 62px);z-index:9;display:none;
  all:unset;cursor:pointer;padding:12px 15px;border-radius:100px;background:var(--panel);
  border:1px solid var(--panel-brd);box-shadow:var(--shadow);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--cream);
}
@media (max-width:900px){
  .rail{
    top:auto;bottom:0;right:0;left:0;width:100%;max-height:56vh;
    transform:translateY(102%);transition:transform .42s cubic-bezier(.2,.9,.2,1);
    padding:10px 12px calc(14px + env(safe-area-inset-bottom));gap:8px;
    background:linear-gradient(180deg,rgba(12,10,9,.35),rgba(12,10,9,.92) 24%);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--panel-brd);border-radius:18px 18px 0 0;
  }
  .rail.open{transform:none}
  .fab{display:block}
  .actions{bottom:calc(14px + env(safe-area-inset-bottom));flex-wrap:wrap;justify-content:center;width:100%;padding:0 12px}
  .hero{padding:11px 15px;font-size:12px}
  .cambar{bottom:calc(14px + env(safe-area-inset-bottom) + 58px);left:12px}
  .hint{display:none}
  .brand__sub{max-width:22ch;font-size:11px}
}
@media (max-width:520px){ .cambar button{padding:7px 8px;letter-spacing:.08em} }

/* ---------- loader ---------- */
#loader{
  position:fixed;inset:0;z-index:30;display:grid;place-items:center;
  background:radial-gradient(90% 70% at 50% 30%,#16252a,#0a0908 70%);
  transition:opacity .9s ease .15s,visibility .9s;
}
#loader.gone{opacity:0;visibility:hidden;pointer-events:none}
.load__in{text-align:center;padding:0 24px}
.load__t{font-family:"Bricolage Grotesque",serif;font-weight:800;font-size:clamp(38px,8vw,74px);letter-spacing:-.04em;margin:0}
.load__s{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--cream-faint);margin:14px 0 0}
.load__wave{
  height:3px;width:min(260px,60vw);margin:26px auto 0;border-radius:3px;overflow:hidden;
  background:rgba(255,236,214,.10);position:relative;
}
.load__wave::after{
  content:"";position:absolute;inset:0;width:40%;border-radius:3px;
  background:linear-gradient(90deg,transparent,var(--sea),var(--copper),transparent);
  animation:sweep 1.5s ease-in-out infinite;
}
@keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="uwTint"></div>

<header class="brand">
  <div class="brand__mark"></div>
  <div>
    <h1 class="brand__title">Tidehaven</h1>
    <p class="brand__sub">A one-island aquarium. Cozy above, <b>alive below</b> — drag to orbit.</p>
  </div>
</header>

<div class="hint" id="hint">Drag · Scroll · Right-drag to pan</div>

<nav class="cambar" id="cambar" aria-label="Camera views">
  <button data-cam="iso" class="on">Isometric</button>
  <button data-cam="cabin">Cabin &amp; Pier</button>
  <button data-cam="under">Underwater</button>
  <button data-cam="free">Free</button>
</nav>

<div class="actions">
  <button class="hero" id="btnKayak"><i>➤</i><span>Launch kayak</span></button>
  <button class="hero" id="btnRay"><i>◗</i><span>Ray leap</span></button>
</div>

<button class="fab" id="fab">Controls</button>

<aside class="rail" id="rail">
  <section class="panel" data-p="world">
    <button class="panel__head"><span class="panel__dot"></span>World
      <svg class="panel__chev" width="10" height="10" viewBox="0 0 10 10"><path d="M2 4l3 3 3-3" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
    </button>
    <div class="panel__body">
      <div class="ctl"><label>Tide <output id="oTide">0.18</output></label>
        <input type="range" id="tide" min="0" max="1" step="0.001" value="0.36" aria-label="Tide level"></div>
      <div class="ctl"><label>Wind <output id="oWind">35%</output></label>
        <input type="range" id="wind" min="0" max="1" step="0.001" value="0.35" aria-label="Wind"></div>
      <div class="ctl"><label>Time of day</label>
        <div class="seg" id="tod">
          <button data-t="day" class="on">Day</button><button data-t="sunset">Sunset</button><button data-t="night">Night</button>
        </div></div>
      <div class="row2">
        <button class="btn" id="btnPause">Pause</button>
        <button class="btn" id="btnReset">Reset</button>
      </div>
    </div>
  </section>

  <section class="panel" data-p="view">
    <button class="panel__head"><span class="panel__dot"></span>Render
      <svg class="panel__chev" width="10" height="10" viewBox="0 0 10 10"><path d="M2 4l3 3 3-3" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
    </button>
    <div class="panel__body">
      <div class="ctl"><label>Quality</label>
        <div class="seg" id="qual">
          <button data-q="low">Low</button><button data-q="med" class="on">Med</button><button data-q="high">High</button>
        </div></div>
      <div class="ctl"><label>Stats <output id="oStats">—</output></label></div>
    </div>
  </section>

  <section class="panel" data-p="sound">
    <button class="panel__head"><span class="panel__dot"></span>Sound
      <svg class="panel__chev" width="10" height="10" viewBox="0 0 10 10"><path d="M2 4l3 3 3-3" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
    </button>
    <div class="panel__body">
      <div class="ctl"><label>Score &amp; ambience</label>
        <div class="row2"><button class="btn" id="btnMusic">Music off</button><button class="btn on" id="btnAmb">Ambience</button></div></div>
      <div class="ctl"><label>Volume <output id="oVol">62%</output></label>
        <input type="range" id="vol" min="0" max="1" step="0.01" value="0.62" aria-label="Volume"></div>
    </div>
  </section>
</aside>

<div id="loader"><div class="load__in">
  <p class="load__t">Tidehaven</p>
  <p class="load__s">Filling the lagoon</p>
  <div class="load__wave"></div>
</div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
function mergeSafe(list,groups){const m=mergeGeometries(list,groups);if(m)return m;const L=list.map(g=>g.index?g.toNonIndexed():g.clone());const names=Object.keys(L[0].attributes).filter(n=>L.every(g=>g.attributes[n]&&g.attributes[n].itemSize===L[0].attributes[n].itemSize));for(const g of L){for(const n of Object.keys(g.attributes))if(!names.includes(n))g.deleteAttribute(n);g.morphAttributes={};}return mergeGeometries(L,groups);} /* fix: mergeGeometries gives null when parts differ in attributes or index - merge on the common ones */

/* ============================================================================
   0 · UTILITIES
   ============================================================================ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const damp=(a,b,l,dt)=>lerp(a,b,1-Math.exp(-l*dt));
const rnd=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;
/** deterministic hash noise (JS + GLSL share the same spirit, not the code) */
function h1(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}
function vnoise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(h1(xi,yi),h1(xi+1,yi),u),lerp(h1(xi,yi+1),h1(xi+1,yi+1),u),v);
}

/* ============================================================================
   1 · THE ISLAND HEIGHT FIELD  (mirrored exactly in GLSL below)
   ============================================================================ */
function coastRadius(a){
  return 1.62 + 0.30*Math.sin(a*2.0+0.6) + 0.14*Math.sin(a*3.0-1.7) + 0.08*Math.sin(a*5.0+2.2);
}
/** Terrain height, above and below water. Shared by mesh generation + water shaders. */
function islandHeight(x,z){
  const r=Math.hypot(x,z), a=Math.atan2(z,x);
  const rc=coastRadius(a);
  let h=0;
  h+=1.30*Math.exp(-((x+0.30)**2+(z+0.62)**2)/(2*0.62*0.62));   // rocky back knoll
  h+=1.05*Math.exp(-((x-0.45)**2+(z-0.00)**2)/(2*1.05*1.05));   // broad cabin shoulder
  h+=0.35*Math.exp(-((x+1.15)**2+(z-0.35)**2)/(2*0.50*0.50));   // west lump
  h+=0.16*Math.sin(a*3.0+0.9)*Math.exp(-(r*r)/3.2);              // coastline lobes
  h+=0.06*Math.sin(x*2.4+1.0)*Math.cos(z*2.2-0.5)*Math.exp(-(r*r)/3.6);
  h-=0.62*Math.exp(-((x-1.10)**2+(z-1.10)**2)/(2*0.55*0.55));   // carved cove (pier side)
  const t=sstep(rc-0.22, rc+0.95, r);
  const bed=-1.60+0.09*Math.sin(x*1.7)*Math.cos(z*1.5)+0.05*Math.sin(x*3.3+2.0);
  return h*(1-t)+bed*t-0.10*t;
}
const GROUND=(x,z)=>islandHeight(x,z);

/* GLSL twin — keep in sync with the JS above. */
const GLSL_ISLAND = /* glsl */`
float th_sstep(float a,float b,float x){float t=clamp((x-a)/(b-a),0.0,1.0);return t*t*(3.0-2.0*t);}
float th_coast(float a){return 1.62+0.30*sin(a*2.0+0.6)+0.14*sin(a*3.0-1.7)+0.08*sin(a*5.0+2.2);}
float islandHeight(float x,float z){
  float r=length(vec2(x,z)); float a=atan(z,x); float rc=th_coast(a);
  float h=0.0;
  h+=1.30*exp(-((x+0.30)*(x+0.30)+(z+0.62)*(z+0.62))/(2.0*0.3844));
  h+=1.05*exp(-((x-0.45)*(x-0.45)+(z)*(z))/(2.0*1.1025));
  h+=0.35*exp(-((x+1.15)*(x+1.15)+(z-0.35)*(z-0.35))/(2.0*0.25));
  h+=0.16*sin(a*3.0+0.9)*exp(-(r*r)/3.2);
  h+=0.06*sin(x*2.4+1.0)*cos(z*2.2-0.5)*exp(-(r*r)/3.6);
  h-=0.62*exp(-((x-1.10)*(x-1.10)+(z-1.10)*(z-1.10))/(2.0*0.3025));

/** Patch a built-in material with extra GLSL + shared uniforms. */
function patch(mat,key,uni,vHead,vMain,fHead,fMain){
  mat.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms,uni);
    if(vHead)sh.vertexShader=vHead+sh.vertexShader;
    if(vMain)sh.vertexShader=sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\n'+vMain);
    if(fHead)sh.fragmentShader=fHead+sh.fragmentShader;
    if(fMain)sh.fragmentShader=sh.fragmentShader.replace('#include <color_fragment>','#include <color_fragment>\n'+fMain);
  };
  mat.customProgramCacheKey=()=>'th_'+key;
  return mat;
}

/* --- 7a · volume: 5 inward quads, no top face (kills coplanar z-fighting) --- */
function inwardBoxGeo(){
  const V=[],IX=[];
  const quad=(a,b,c,d,inward)=>{
    // ensure winding faces inward, else flip
    const e1=[b[0]-a[0],b[1]-a[1],b[2]-a[2]], e2=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
    const n=[e1[1]*e2[2]-e1[2]*e2[1],e1[2]*e2[0]-e1[0]*e2[2],e1[0]*e2[1]-e1[1]*e2[0]];
    const pts=dot3(n,inward)>0?[a,b,c,d]:[a,d,c,b];
    const base=V.length/3;
    pts.forEach(q=>V.push(q[0],q[1],q[2]));
    IX.push(base,base+1,base+2,base,base+2,base+3);
  };
  const dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const T=1,B=0;
  quad([1,B,1],[1,B,-1],[1,T,-1],[1,T,1],[-1,0,0]);   // +x wall
  quad([-1,B,-1],[-1,B,1],[-1,T,1],[-1,T,-1],[1,0,0]);// -x wall
  quad([1,B,1],[-1,B,1],[-1,T,1],[1,T,1],[0,0,-1]);   // +z wall
  quad([-1,B,-1],[1,B,-1],[1,T,-1],[-1,T,-1],[0,0,1]);// -z wall
  quad([-1,B,-1],[1,B,-1],[1,B,1],[-1,B,1],[0,1,0]);  // floor
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(V,3));
  g.setIndex(IX); g.computeVertexNormals();
  return g;
}

      vN=normalize(vec3(-hx/(2.0*e),1.0,-hz/(2.0*e)));

  fragmentShader:/*glsl*/`
    ${GLSL_ISLAND}
    uniform float uTime,uWater,uWind,uNight;
    uniform vec3 uShallow,uDeep,uFoam,uSunCol,uSunDir;
    varying vec3 vW;varying vec3 vN;varying float vWave;
    void main(){
      float h=islandHeight(vW.x,vW.z);
      float d=uWater-h;
      if(d<-0.07) discard;
      vec3 N=normalize(vN);
      vec3 V=normalize(cameraPosition-vW);
      float fres=pow(1.0-clamp(dot(N,V),0.0,1.0),3.0);
      vec3 col=mix(uShallow,uDeep,smoothstep(0.0,1.15,d))*(1.0-uNight*0.55);

function swayMat(base,key,amp,hgt,opts={}){
  return patch(base,key,{uTime:U.time,uWind:U.wind},
    `uniform float uTime;uniform float uWind;`,
    `#ifdef USE_INSTANCING
       vec3 ip=(instanceMatrix*vec4(0.0,0.0,0.0,1.0)).xyz;
     #else
       vec3 ip=vec3(0.0);
     #endif
     float ph=ip.x*2.9+ip.z*2.3+${(opts.phase||0)};
     float hh=clamp(transformed.y/${hgt.toFixed(2)},0.0,1.0);
     float s=sin(uTime*2.1+ph)*0.6+sin(uTime*3.7+ph*1.7)*0.4;
     float a=uWind*${amp.toFixed(2)}*pow(hh,${(opts.pow||1.6)});
     transformed.x+=s*a;
     transformed.z+=cos(uTime*1.8+ph*1.2)*a*0.75;
     ${opts.twist?`transformed.y*=1.0-abs(s)*a*0.9;`:''}`,
    null,null);
}

/* --- RAYS (undulating fins via vertex shader) --- */
function rayGeo(){
  const U2=26,V=10,pos=[],col=[],idx=[],uv=[];
  const L=1.15,SPAN=0.92;
  for(let i=0;i<=U2;i++){
    const u=i/U2, z=(u-0.62)*L;
    const span=SPAN*Math.pow(Math.sin(Math.PI*Math.pow(u,0.72)),0.85);
    for(let j=0;j<=V;j++){
      const v=j/V*2-1;
      const x=v*span;
      const prof=(1-v*v);
      const y=(0.055*prof*(1-Math.pow(Math.abs(u-0.42),1.6)))*(u<0.5?1.15:0.85);
      pos.push(x,y,z);
      uv.push(u,v);
      const top=y>0.006;
      const c=top?new THREE.Color('#33414d').lerp(new THREE.Color('#20282f'),Math.abs(v))
                 :new THREE.Color('#dfe7e4').lerp(new THREE.Color('#9fb0ae'),Math.abs(v)*0.8);
      if(top&&Math.abs(v)<0.22&&u>0.30&&u<0.72)c.lerp(new THREE.Color('#0e1418'),0.55); // gill stripes
      col.push(c.r,c.g,c.b);
    }
  }
  for(let i=0;i<U2;i++)for(let j=0;j<V;j++){
    const a=i*(V+1)+j,b=a+V+1;
    idx.push(a,b,a+1, b,b+1,a+1);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(pos.map(()=>0),3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);g.computeVertexNormals();
  return g;
}

}

/* kayak trip */
const K_A=new THREE.Vector3(), K_B=new THREE.Vector3();
function updKayak(dt){
  const K=state.kayak, w=state.waterY;
  const bob=Math.sin(U.time.value*1.6)*0.012+Math.sin(U.time.value*2.7+1.3)*0.008;
  if(K.mode==='launching'){
    K.t=Math.min(1,K.t+dt/1.7);
    const e=K.t*K.t*(3-2*K.t);
    const p=pathPoint(K.ang);
    K_A.copy(K.from).lerp(p,e);
    kayak.position.copy(K_A);
    kayak.position.y=lerp(MOOR.y+w+0.02,p.y+0.02,e)+bob;
    kayak.rotation.y=lerpAngle(K.fromQ,pathHeading(K.ang),e);
    if(K.t>=1){K.mode='cruising';}
  }else if(K.mode==='cruising'){
    K.ang+=dt*0.17;
    const p=pathPoint(K.ang);
    kayak.position.copy(p);kayak.position.y=w+0.02+bob;
    kayak.rotation.y=pathHeading(K.ang);
    kayak.rotation.z=Math.sin(U.time.value*1.9)*0.05*(0.4+state.wind);
  }else if(K.mode==='returning'){
    K.t=Math.min(1,K.t+dt/2.1);
    const e=K.t*K.t*(3-2*K.t);
    const p=pathPoint(K.ang);
    K_B.copy(MOOR);K_B.y=w+0.02;
    K_A.copy(p);K_A.y=w+0.02;
    kayak.position.lerpVectors(K_A,K_B,e);
    kayak.position.y+=bob;
    kayak.rotation.y=lerpAngle(pathHeading(K.ang),-0.62,e);
    if(K.t>=1){K.mode='moored';setKayakBtn(false);}
  }else{
    kayak.position.set(MOOR.x,w+0.02+MOOR.y,MOOR.z);
    kayak.rotation.y=-0.62+Math.sin(U.time.value*0.9)*0.05;
    kayak.rotation.z=Math.sin(U.time.value*1.5)*0.035*(0.4+state.wind);
  }
  // paddle stroke
  const pd=kayak.userData.paddle;
  const st=K.mode==='cruising'?1:0.28;
  pd.rotation.y=Math.sin(U.time.value*(K.mode==='cruising'?2.1:0.8))*0.85*st;
  pd.rotation.z=Math.sin(U.time.value*(K.mode==='cruising'?2.1:0.8)+1.2)*0.22*st;
}
const lerpAngle=(a,b,t)=>{let d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI;return a+d*t;};
function pathPoint(a){
  const r=2.46+Math.sin(a*2.0)*0.10;

}
function pathHeading(a){return Math.atan2(Math.cos(a),-Math.sin(a))+Math.PI/2*0;}
function setKayakBtn(active){
  const b=document.getElementById('btnKayak');
  b.querySelector('span').textContent=active?'Return kayak':'Launch kayak';
  b.classList.toggle('busy',active);
}

/* ray steering */
const tmpV=new THREE.Vector3();
function steerRay(R,dt){
  R.wanderT-=dt;
  if(R.wanderT<=0){
    R.wanderT=rnd(1.6,3.4);
    R.head+=rnd(-1.1,1.1);
    R.speed=rnd(0.28,0.52);
  }
  // steer away from island + walls + surface + floor
  const r=Math.hypot(R.pos.x,R.pos.z);
  const rc=coastRadius(Math.atan2(R.pos.z,R.pos.x))+0.55;
  if(r<rc)R.head=lerpAngle(R.head,Math.atan2(R.pos.z,R.pos.x),clamp(dt*2.4,0,1));
  if(r>2.72)R.head=lerpAngle(R.head,Math.atan2(-R.pos.z,-R.pos.x),clamp(dt*2.2,0,1));
  let vy=0;
  const ceil=state.waterY-0.30, floor=GROUND(R.pos.x,R.pos.z)+0.28;
  if(R.pos.y>ceil)vy=-(R.pos.y-ceil)*1.6;
  if(R.pos.y<floor)vy=(floor-R.pos.y)*1.6;
  R.pos.y+=vy*dt;
  R.pos.x+=Math.cos(R.head)*R.speed*dt;
  R.pos.z+=Math.sin(R.head)*R.speed*dt;
  R.pos=clampRay(R.pos);
  const tgt=Math.sin(U.time.value*0.7+R.phase)*0.06;
  R.bank=damp(R.bank,tgt,3,dt);
  R.g.position.copy(R.pos);
  R.g.rotation.set(-vy*0.5, -R.head+Math.PI/2, R.bank+Math.sin(U.time.value*1.4+R.phase)*0.10,'YXZ');
}
function clampRay(p){
  p.x=clamp(p.x,-2.86,2.86);p.z=clamp(p.z,-2.86,2.86);
  p.y=clamp(p.y,GROUND(p.x,p.z)+0.22,state.waterY-0.26);
  return p;
}
/* ray leap */
let ripSlot=0;
function leap(R){
  if(!R||R.jump||state.paused)return;
  const dir=Math.atan2(-R.pos.z,R.pos.x); // leap outward toward the glass
  R.jump={u:0,dur:2.5,
    p0:R.pos.clone(),dir:new THREE.Vector2(Math.cos(dir),Math.sin(dir)),
    head0:-R.head+Math.PI/2,splashed:false};
  Audio.splash(0.35);
}
function updJump(R,dt){
  const J=R.jump;if(!J)return;
  J.u+=dt/J.dur;
  const u=Math.min(J.u,1.12);
  const y0=J.p0.y, peak=state.waterY+1.55;
  const H4=4*(peak-y0);
  const y=y0+H4*Math.min(u,1)*(1-Math.min(u,1));
  const travel=1.35*Math.min(u,1.05);
  const px=J.p0.x+J.dir.x*travel, pz=J.p0.y===undefined?0:J.p0.z+J.dir.y*travel;
  R.pos.set(px,y,pz);
  R.g.position.copy(R.pos);
  const slope=(H4*(1-2*Math.min(u,1)));
  const pitch=Math.atan2(-slope,J.dir.length?1.6:1.6)*0.55;
  const spin=sstep(0.35,0.92,u)*Math.PI;
  R.g.rotation.set(pitch, -(J.head0+spin), Math.sin(u*Math.PI)*0.35,'YXZ');
  R.g.scale.setScalar(0.9);
  // splash on the way down through the surface
  if(!J.splashed&&u>0.55&&y<state.waterY){
    J.splashed=true;
    const sx=R.pos.x, sz=R.pos.z;
    splashAt(sx,sz);
  }
  if(J.u>=1.12){
    R.jump=null;
    R.head=Math.atan2(J.dir.y,J.dir.x)+Math.PI; // swim back
    R.pos.y=clamp(R.pos.y,GROUND(R.pos.x,R.pos.z)+0.3,state.waterY-0.35);
    R.wanderT=0.4;
    state.leaping=false;
    document.getElementById('btnRay').classList.remove('busy');
  }
}
function splashAt(x,z){
  Audio.splash(1);
  // ripples: shader rings on the surface + mesh rings
  for(let k=0;k<3;k++){
    const R2=U.rips.value[ripSlot%4];
    R2.set(x,z,U.time.value-k*0.16,1.0-k*0.26);ripSlot++;
  }
  for(let k=0;k<2;k++){
    const rp=ripples.find(r=>r.life<=0)||ripples[0];
    rp.life=1.5+k*0.35;rp.t=0;rp.pos.set(x,state.waterY+0.006+k*0.002,z);
    rp.u.uA.value=1.0-k*0.35;rp.mesh.visible=true;rp.mesh.position.copy(rp.pos);
    rp.sc=1.4+k*1.6;
  }
  // droplets
  let n=0;
  for(let i=0;i<DROP_N&&n<18;i++){
    const d=dropV[i];
    if(d.t<1.2)continue;
    d.t=0;
    d.p.set(x+rnd(-.14,.14),state.waterY+0.03,z+rnd(-.14,.14));
    const a=Math.random()*TAU,sp=rnd(.6,2.1);
    d.v.set(Math.cos(a)*sp*0.42,rnd(1.3,2.7),Math.sin(a)*sp*0.42);
    n++;
  }
  // bubbles
  for(let i=0;i<BUB_N&&i<10;i++){
    const b=bub[(i*5+Math.floor(Math.random()*5))%BUB_N];
    b.x=x+rnd(-.2,.2);b.z=z+rnd(-.2,.2);b.y=state.waterY-0.05;b.sp=rnd(.25,.5);
  }
}

/* fish schools */
function updSchools(dt){
  for(const S of schools){
    S.turn+=(-S.turn)*dt*0.8;
    S.head+=S.turn*dt;
    if(Math.random()<dt*0.35)S.turn=rnd(-0.55,0.55);
    S.center.x+=Math.cos(S.head)*S.speed*dt;
    S.center.z+=Math.sin(S.head)*S.speed*dt;
    S.center.y+=Math.sin(U.time.value*0.6+S.ph)*0.10*dt;
    // keep inside the lagoon, around the island
    const r=Math.hypot(S.center.x,S.center.z);
    const rc=coastRadius(Math.atan2(S.center.z,S.center.x))+0.45;
    if(r<rc)S.head=lerpAngle(S.head,Math.atan2(S.center.z,S.center.x),clamp(dt*2.2,0,1));
    if(r>2.45)S.head=lerpAngle(S.head,Math.atan2(-S.center.z,-S.center.x),clamp(dt*2.2,0,1));
    S.center.y=clamp(S.center.y,-1.25,state.waterY-0.30);
    S.center.x=clamp(S.center.x,-2.7,2.7);S.center.z=clamp(S.center.z,-2.7,2.7);
    const t=U.time.value;
    for(let i=0;i<S.fish.length;i++){
      const f=S.fish[i];
      const wob=Math.sin(t*3.0*f.sp+f.ph);
      tmpV.set(
        f.off.x+Math.sin(t*0.7*f.sp+f.ph)*0.22,
        f.off.y+Math.sin(t*1.1*f.sp+f.ph*1.7)*0.10,
        f.off.z+Math.cos(t*0.6*f.sp+f.ph)*0.18);
      // orient along heading
      const ca=Math.cos(-S.head+Math.PI/2),sa=Math.sin(-S.head+Math.PI/2);
      dummy.position.set(
        S.center.x+tmpV.x*ca-tmpV.z*sa,
        S.center.y+tmpV.y,
        S.center.z+tmpV.x*sa+tmpV.z*ca);
      dummy.rotation.set(wob*0.22,-S.head+Math.PI/2+wob*0.30,wob*0.16,'YXZ');
      dummy.scale.setScalar(f.sc*(0.85+0.15*Math.sin(f.ph)));
      dummy.updateMatrix();
      S.im.setMatrixAt(i,dummy.matrix);
    }
    S.im.instanceMatrix.needsUpdate=true;
  }
}
/* bubbles */
function updBubbles(dt){
  for(let i=0;i<BUB_N;i++){
    const b=bub[i];
    b.y+=b.sp*dt*(0.5+state.wind*0.8);
    const fl=state.waterY-0.02;
    if(b.y>fl){
      const src=[[2.55,-2.35],[2.45,1.30],[-2.35,2.45]][i%3];
      b.x=src[0]+rnd(-.5,.5);b.z=src[1]+rnd(-.5,.5);
      b.y=GROUND(b.x,b.z)+0.05;b.r=rnd(.4,1.4);b.ox=rnd(-.09,.09);b.oz=rnd(-.09,.09);
    }
    const sw=Math.sin(U.time.value*2.2+b.ph)*0.035;
    dummy.position.set(b.x+sw+b.ox,b.y,b.z+Math.cos(U.time.value*1.7+b.ph)*0.03+b.oz);
    dummy.rotation.set(0,0,0);dummy.scale.setScalar(b.r*(0.6+0.4*Math.sin(b.y*8+b.ph)));
    dummy.updateMatrix();bubbles.setMatrixAt(i,dummy.matrix);
  }
  bubbles.instanceMatrix.needsUpdate=true;
}
/* droplets + ripples */
function updFx(dt){
  for(let i=0;i<DROP_N;i++){
    const d=dropV[i];
    if(d.t<90){
      d.t+=dt;d.v.y-=6.4*dt;
      d.p.addScaledVector(d.v,dt);
      if(d.p.y<state.waterY-0.02){d.t=99;d.p.y=-99;}
    }
    dummy.position.copy(d.p);
    const s=d.t<90?clamp(1.2-d.t,0.2,1)*0.9:0.0001;
    dummy.scale.setScalar(s);dummy.rotation.set(0,0,0);dummy.updateMatrix();
    drops.setMatrixAt(i,dummy.matrix);
  }
  drops.instanceMatrix.needsUpdate=true;
  for(const rp of ripples){
    if(rp.life>0){
      rp.life-=dt;rp.t+=dt*0.72;
      rp.u.uT.value=Math.min(rp.t,1);
      const sc=0.5+rp.t*rp.sc;
      rp.mesh.scale.set(sc,1,sc);
      rp.mesh.position.y=state.waterY+0.006;
      rp.u.uA.value=clamp(rp.life,0,1)*0.9;
      if(rp.life<=0)rp.mesh.visible=false;
    }
  }
}
/* gulls + fire */
function updGulls(dt){
  for(const g of gulls){
    const d=g.userData;d.ph+=dt*d.sp;
    g.position.set(Math.cos(d.ph)*d.r,d.y+Math.sin(d.ph*1.7)*0.25,Math.sin(d.ph)*d.r);
    g.rotation.y=-d.ph+Math.PI/2;
    g.userData.wing.rotation.z=Math.sin(U.time.value*6.5+d.ph*4)*0.55;
  }
  if(fireGroup){
    const f=fireGroup.userData.flames;
    for(let i=0;i<f.length;i++){
      const s=0.6+0.4*Math.abs(Math.sin(U.time.value*(7+i*2.3)+i));
      f[i].scale.set(0.7+i*0.12,s*(0.6+curTOD.fire*0.5),0.7+i*0.12);
      f[i].position.y=0.14+f[i].scale.y*0.16;
      f[i].rotation.y=U.time.value*(2+i);
    }
  }
}

/* ============================================================================
   13 · AUDIO — original calm score + ambience (created on first gesture)
   ============================================================================ */
const Audio={
  ctx:null,master:null,music:null,sfx:null,amb:null,started:false,musicOn:false,ambOn:true,vol:0.62,
  noise:null,timer:null,next:0,step:0,chord:0,
  prog:[[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66],[164.81,207.65,246.94]],
  scale:[440,523.25,587.33,659.25,783.99,880,1046.5],
  init(){
    if(this.started)return;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    this.ctx=new AC();
    const c=this.ctx;
    this.master=c.createGain();this.master.gain.value=0;this.master.connect(c.destination);
    const comp=c.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;
    comp.connect(this.master);
    this.music=c.createGain();this.music.gain.value=0.0;this.music.connect(comp);
    this.sfx=c.createGain();this.sfx.gain.value=0.85;this.sfx.connect(comp);
    this.amb=c.createGain();this.amb.gain.value=0.0;this.amb.connect(comp);
    // shared noise buffer
    const nb=c.createBuffer(1,c.sampleRate*2.2,c.sampleRate);
    const nd=nb.getChannelData(0);let last=0;
    for(let i=0;i<nd.length;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;nd[i]=last*3.2;}
    this.noise=nb;
    // breeze
    const bs=c.createBufferSource();bs.buffer=nb;bs.loop=true;
    const bf=c.createBiquadFilter();bf.type='lowpass';bf.frequency.value=430;bf.Q.value=.6;
    const bg=c.createGain();bg.gain.value=0.16;
    const lfo=c.createOscillator();lfo.frequency.value=0.07;
    const lg=c.createGain();lg.gain.value=0.10;
    lfo.connect(lg).connect(bg.gain);
    bs.connect(bf).connect(bg).connect(this.amb);bs.start();lfo.start();
    this.breezeGain=bg;this.breezeFilter=bf;
    // lapping water
    const ws=c.createBufferSource();ws.buffer=nb;ws.loop=true;
    const wf=c.createBiquadFilter();wf.type='bandpass';wf.frequency.value=330;wf.Q.value=1.1;
    const wg=c.createGain();wg.gain.value=0.10;
    const lfo2=c.createOscillator();lfo2.frequency.value=0.16;
    const lg2=c.createGain();lg2.gain.value=0.085;
    lfo2.connect(lg2).connect(wg.gain);
    const lfo3=c.createOscillator();lfo3.frequency.value=0.041;
    const lg3=c.createGain();lg3.gain.value=140;
    lfo3.connect(lg3).connect(wf.frequency);
    ws.connect(wf).connect(wg).connect(this.amb);ws.start();lfo2.start();lfo3.start();
    this.lapGain=wg;
    // pad chord
    this.padGain=c.createGain();this.padGain.gain.value=0.10;this.padGain.connect(this.music);
    const pf=c.createBiquadFilter();pf.type='lowpass';pf.frequency.value=900;pf.Q.value=.8;
    pf.connect(this.padGain);
    this.pad=pf;
    this.padOsc=[-7,0,7].map(det=>{
      const o=c.createOscillator();o.type='triangle';o.detune.value=det;
      const g=c.createGain();g.gain.value=0.33;
      o.connect(g).connect(pf);o.start();return o;
    });
    this.next=c.currentTime+0.2;
    this.timer=setInterval(()=>this.sched(),25);
    this.started=true;
    this.applyGains(true);
  },
  applyGains(ramp){
    if(!this.started)return;
    const t=this.ctx.currentTime,r=ramp?0.6:0.02;
    const v=Math.pow(this.vol,1.6);
    this.master.gain.setTargetAtTime(v*0.9,t,r);
    this.music.gain.setTargetAtTime(this.musicOn?0.55:0,t,0.5);
    this.amb.gain.setTargetAtTime(this.ambOn?0.85:0,t,0.6);
    this.breezeGain.gain.setTargetAtTime(0.05+state.wind*0.22,t,0.8);
    this.lapGain.gain.setTargetAtTime(0.05+state.tide*0.14+state.wind*0.06,t,0.8);
  },
  env(node,g0,g1,atk,dec,t0){
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(g1,t0+atk);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+atk+dec);
    node.connect(g);return g;
  },
  tone(f,t0,dur,type='sine',gain=0.2,dest){
    const c=this.ctx,o=c.createOscillator();o.type=type;o.frequency.value=f;
    const g=this.env(o,0.0001,gain,Math.min(0.12,dur*0.25),dur,t0);
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;
    g.connect(lp).connect(dest||this.music);
    o.start(t0);o.stop(t0+dur+0.2);
  },
  sched(){
    if(!this.started)return;
    const c=this.ctx,spb=60/58;
    while(this.next<c.currentTime+0.35){
      const t0=this.next,s=this.step;
      // chord change every 8 steps
      if(s%8===0){
        this.chord=(this.chord+1)%this.prog.length;
        const ch=this.prog[this.chord];
        this.padOsc.forEach((o,i)=>o.frequency.setTargetAtTime(ch[i]/2,c.currentTime+0.05,1.4));
      }
      const ch=this.prog[this.chord];
      if(s%4===0)this.tone(ch[0]/2,t0,spb*2.4,'sine',0.16);
      if(s%8===2)this.tone(ch[1]/2,t0,spb*2.0,'triangle',0.10);
      // motif
      const seed=Math.sin(s*12.9898+this.chord*78.233)*43758.5453;
      const rr=seed-Math.floor(seed);
      if(rr>0.42){
        const n=this.scale[Math.floor(rr*this.scale.length)%this.scale.length];
        this.tone(n,t0,spb*1.6,rr>0.86?'triangle':'sine',0.115);
        if(rr>0.8){
          const c2=this.ctx;const o=c2.createOscillator();o.type='sine';
          o.frequency.value=n*2.01;
          const g=this.env(o,0.0001,0.05,0.01,1.4,t0+0.02);
          g.connect(this.music);o.start(t0);o.stop(t0+1.6);
        }
      }
      this.step++;this.next+=spb;
    }
  },
  splash(amt=1){
    if(!this.started)return;
    const c=this.ctx,t=c.currentTime;
    const src=c.createBufferSource();src.buffer=this.noise;
    src.playbackRate.value=rnd(0.85,1.15);
    const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.1;
    bp.frequency.setValueAtTime(1800,t);bp.frequency.exponentialRampToValueAtTime(240,t+0.5);
    const g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.5*amt,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.75);
    src.connect(bp).connect(g).connect(this.sfx);
    src.start(t);src.stop(t+0.9);
    // plop
    const o=c.createOscillator();o.type='sine';
    o.frequency.setValueAtTime(360,t+0.06);o.frequency.exponentialRampToValueAtTime(80,t+0.34);
    const g2=this.env(o,0.0001,0.22*amt,0.01,0.3,t+0.06);g2.connect(this.sfx);
    o.start(t+0.06);o.stop(t+0.5);
  },
  swish(){
    if(!this.started)return;
    const c=this.ctx,t=c.currentTime;
    const src=c.createBufferSource();src.buffer=this.noise;
    const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=2;
    bp.frequency.setValueAtTime(420,t);bp.frequency.exponentialRampToValueAtTime(1700,t+0.7);
    const g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.20,t+0.12);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
    src.connect(bp).connect(g).connect(this.sfx);src.start(t);src.stop(t+1.0);
  },
  click(f=640){
    if(!this.started)return;
    const c=this.ctx,t=c.currentTime;
    const o=c.createOscillator();o.type='triangle';o.frequency.value=f;
    const g=this.env(o,0.0001,0.10,0.004,0.07,t);g.connect(this.sfx);
    o.start(t);o.stop(t+0.12);
  }
};

const $=s=>document.querySelector(s);
function fillRange(el){
  const p=(el.value-el.min)/(el.max-el.min)*100;
  el.style.setProperty('--fill',p+'%');
}
function wireRange(id,fn){
  const el=$(id);fillRange(el);
  el.addEventListener('input',()=>{fillRange(el);fn(parseFloat(el.value));});
}

  if(state.camT>=1){state.camMode='free';
    document.querySelectorAll('#cambar button').forEach(b=>b.classList.toggle('on',b.dataset.cam==='free'));}
  const h=$('#hint');if(h)h.style.opacity='0';
});
addEventListener('pointerdown',()=>Audio.init(),{once:true});
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();$('#btnPause').click();}
  if(e.key==='1')goCam('iso');if(e.key==='2')goCam('cabin');
  if(e.key==='3')goCam('under');if(e.key==='4')goCam('free');
});

/* quality */
const QUAL={low:{dpr:1.0,sh:1024},med:{dpr:1.5,sh:1536},high:{dpr:2.0,sh:2048}};
function applyQuality(k){
  state.quality=k;const q=QUAL[k];
  renderer.setPixelRatio(Math.min(devicePixelRatio,q.dpr));
  renderer.setSize(innerWidth,innerHeight);
  sun.shadow.mapSize.set(q.sh,q.sh);
  if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}
}
applyQuality(innerWidth<760?'low':'med');
document.querySelectorAll('#qual button').forEach(x=>x.classList.toggle('on',x.dataset.q===state.quality));

/* resize */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
},{passive:true});

/* ============================================================================
   15 · MAIN LOOP
   ============================================================================ */
const clock=new THREE.Clock();
const uwTint=$('#uwTint');
let uwAmt=0, statT=0;
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05);
  const wdt=state.paused?0:dt;
  U.time.value+=wdt;

  updTOD(dt);
  updTide(dt);
  updCam(dt);
  if(!state.paused){
    updKayak(wdt);
    rays.forEach(R=>{ if(R.jump)updJump(R,wdt); else steerRay(R,wdt); });
    updSchools(wdt);
    updBubbles(wdt);
    updFx(wdt);
    updGulls(wdt);
  }
  // underwater colour wash
  const want=camera.position.y<state.waterY-0.02?1:0;
  uwAmt=damp(uwAmt,want,6,dt);
  if(Math.abs(uwAmt-(camera.position.y<state.waterY?1:0))>0.002)
    uwTint.style.opacity=(uwAmt*0.92).toFixed(3);

  controls.update();
  renderer.render(scene,camera);

  statT+=dt;
  if(statT>0.6){statT=0;
    const info=renderer.info.render;
    $('#oStats').textContent=`${(info.triangles/1000).toFixed(0)}k tris · ${info.calls} draws`;
  }
}
tick();

/* boot */
setTOD('day');todT=1;
goCam('iso');
setTimeout(()=>$('#loader').classList.add('gone'),520);
setTimeout(()=>{const h=$('#hint');if(h)h.style.opacity='0';},11000);
</script>
</body>
