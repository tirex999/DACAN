<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tidehaven — a cutaway lagoon diorama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f8eeddff; --ink-2:#f8eedda6; --ink-3:#f8eedd66;
  --panel:rgba(8,30,35,.52); --panel-2:rgba(8,30,35,.72);
  --brd:#f8eedd29; --brd-2:#f8eedd5c;
  --copper:#f0a35f; --copper-d:#d97b38; --sea:#63d6c6; --sand:#f0dcb4;
  --sh:0 18px 44px rgba(1,12,16,.5);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#06171d;color:var(--ink);
  font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;display:block;touch-action:none}

/* ---------- layout ---------- */
.ui{position:fixed;inset:0;z-index:10;pointer-events:none;display:grid;
  grid-template-rows:auto 1fr auto;gap:10px;padding:clamp(12px,1.8vw,24px)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.row--bottom{align-items:flex-end}
.col{display:flex;flex-direction:column;gap:10px;align-items:flex-start;max-width:min(46vw,420px)}
.col--end{align-items:flex-end}

/* ---------- brand ---------- */
.brand{display:flex;gap:14px;align-items:flex-start;pointer-events:none;
  animation:rise .9s cubic-bezier(.2,.8,.2,1) both .15s}
.mark{width:42px;height:42px;flex:none;border-radius:13px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#12525c,#0a2a33 60%,#1b6b6a);
  border:1px solid #f8eedd33;box-shadow:var(--sh),inset 0 1px 0 #ffffff26}
.mark::after{content:"";position:absolute;left:-20%;right:-20%;top:56%;height:3px;border-radius:3px;
  background:linear-gradient(90deg,transparent,#8ef0dd,transparent);
  box-shadow:0 6px 0 -1px #ffffff33;animation:lap 3.6s ease-in-out infinite}
.mark::before{content:"";position:absolute;left:50%;top:14%;width:12px;height:12px;margin-left:-6px;
  border-radius:50% 50% 50% 0;transform:rotate(45deg);background:linear-gradient(180deg,#f7c98b,#e08a4c)}
h1{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:clamp(30px,4.4vw,50px);
  line-height:.92;letter-spacing:-.028em;margin:0 0 2px;text-shadow:0 4px 26px rgba(0,0,0,.45)}
.sub{margin:0;font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--ink-2);
  font-weight:500;max-width:34ch}
.sub b{color:var(--sea);font-weight:600;letter-spacing:.19em}

/* ---------- panels ---------- */
.panel{pointer-events:auto;background:var(--panel);backdrop-filter:blur(16px) saturate(1.3);
  -webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--brd);border-radius:var(--r);
  box-shadow:var(--sh),inset 0 1px 0 #ffffff14;overflow:hidden;
  animation:rise .8s cubic-bezier(.2,.8,.2,1) both;transition:box-shadow .3s,border-color .3s}
.panel:hover{border-color:var(--brd-2)}
.panel:nth-child(1){animation-delay:.05s}.panel:nth-child(2){animation-delay:.13s}
.panel--view{animation-delay:.2s}.panel--audio{animation-delay:.28s}
.panel__head{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:9px 12px;background:none;border:0;color:var(--ink-2);cursor:pointer;
  font:600 10px/1 'Instrument Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase}
.panel__head:hover{color:var(--ink)}
.panel__head .chev{transition:transform .35s cubic-bezier(.2,.8,.2,1);font-size:9px;opacity:.7}
.panel:not(.is-open) .panel__head .chev{transform:rotate(-90deg)}
.panel__body{padding:2px 12px 12px;display:flex;flex-direction:column;gap:10px;
  transition:max-height .42s cubic-bezier(.2,.8,.2,1),opacity .3s,padding .3s;max-height:70vh;opacity:1}
.panel:not(.is-open) .panel__body{max-height:0;opacity:0;padding-top:0;padding-bottom:0}
.grp{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  display:flex;justify-content:space-between;align-items:center}
.lbl span{color:var(--sea);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--brd);background:#f8eedd0f;color:var(--ink);
  font:600 10.5px/1 'Instrument Sans',sans-serif;letter-spacing:.13em;text-transform:uppercase;
  padding:9px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:transform .2s cubic-bezier(.2,.8,.2,1),background .2s,border-color .2s,box-shadow .2s,color .2s}
.btn:hover{background:#f8eedd21;transform:translateY(-1.5px);border-color:var(--brd-2)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.is-on{background:linear-gradient(180deg,#f4ad6d,#dd7b3a);border-color:transparent;color:#22120a;
  box-shadow:0 6px 18px #e2833f5c}
.btn.is-on.sea{background:linear-gradient(180deg,#7ee6d5,#33b3a5);color:#04231f;box-shadow:0 6px 18px #46c9b85c}
.btn--wide{width:100%;justify-content:center;text-align:center}
.btn .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#f8eedd55;margin-right:7px;
  vertical-align:1px;transition:.25s}
.btn.is-on .dot{background:#22120a;box-shadow:0 0 0 3px #22120a33}

/* sliders */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;
  background:linear-gradient(90deg,var(--copper) var(--p,50%),#f8eedd22 var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:#f8eedd22}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--copper)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff5e6,#eaa15c 60%,#c96f2f);margin-top:-5.5px;
  border:1px solid #00000033;box-shadow:0 2px 8px #00000066;transition:transform .18s}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.18)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;border:1px solid #00000033;
  background:radial-gradient(circle at 35% 30%,#fff5e6,#eaa15c 60%,#c96f2f);box-shadow:0 2px 8px #00000066}
input[type=range].sea::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--sea) var(--p,50%),#f8eedd22 var(--p,50%))}
input[type=range].sea::-webkit-slider-thumb{background:radial-gradient(circle at 35% 30%,#eafffb,#5fd3c4 60%,#2a9c92)}

/* hint + mobile toggle */
.hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;pointer-events:none;
  font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);
  background:#06171d5c;border:1px solid var(--brd);padding:6px 14px;border-radius:999px;
  backdrop-filter:blur(8px);transition:opacity .6s;white-space:nowrap}
.hint.gone{opacity:0}
#panelToggle{position:fixed;right:12px;top:12px;z-index:12;display:none;pointer-events:auto}

/* loader */
#loader{position:fixed;inset:0;z-index:40;display:grid;place-content:center;justify-items:center;gap:18px;
  background:radial-gradient(120% 90% at 50% 40%,#12454f,#06171d 70%);transition:opacity .8s,visibility .8s}
#loader.gone{opacity:0;visibility:hidden}
#loader h2{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(34px,7vw,64px);margin:0;letter-spacing:-.03em}
#loader p{margin:0;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3)}
.bar{width:min(240px,60vw);height:2px;background:#f8eedd1f;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:34%;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--sea),var(--copper),transparent);
  animation:sweep 1.5s cubic-bezier(.6,0,.4,1) infinite}
@keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(340%)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lap{0%,100%{transform:translateY(-3px)}50%{transform:translateY(3px)}}

@media (max-width:900px){
  #panelToggle{display:block}
  .ui{padding:10px;gap:8px}
  .col{max-width:100%;width:100%}
  .row{flex-direction:column;align-items:stretch}
  .row--bottom{flex-direction:column-reverse}
  .panel{width:100%}
  .brand{padding-right:56px}
  .sub{max-width:none}
  .hint{display:none}
  .panel__body{max-height:0;opacity:0;padding-top:0;padding-bottom:0}
  .panel.is-open .panel__body{max-height:52vh;opacity:1;overflow:auto;padding-bottom:12px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="ui">
  <!-- TOP -->
  <div class="row">
    <div class="brand">
      <div class="mark"></div>
      <div>
        <h1>Tidehaven</h1>
        <p class="sub">Cutaway lagoon diorama · <b>cozy above, alive below</b></p>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-end">
      <section class="panel panel--view is-open" data-panel>
        <button class="panel__head" data-collapse>View <span class="chev">▾</span></button>
        <div class="panel__body">
          <div class="grp">
            <div class="lbl">Camera</div>
            <div class="seg" id="camSeg">
              <button class="btn is-on" data-cam="iso">Isometric</button>
              <button class="btn" data-cam="cabin">Cabin</button>
              <button class="btn" data-cam="under">Underwater</button>
            </div>
          </div>
          <div class="grp">
            <div class="lbl">Quality</div>
            <div class="seg" id="qSeg">
              <button class="btn" data-q="low">Low</button>
              <button class="btn" data-q="medium">Med</button>
              <button class="btn is-on" data-q="high">High</button>
            </div>
          </div>
        </div>
      </section>
      <section class="panel panel--audio is-open" data-panel>
        <button class="panel__head" data-collapse>Sound <span class="chev">▾</span></button>
        <div class="panel__body">
          <div class="grp">
            <div class="seg">
              <button class="btn" id="btnMusic"><span class="dot"></span>Music</button>
              <button class="btn is-on sea" id="btnSfx"><span class="dot"></span>Ambience</button>
            </div>
          </div>
          <div class="grp">
            <div class="lbl">Volume <span id="volVal">70%</span></div>
            <input type="range" id="vol" class="sea" min="0" max="100" value="70">
          </div>
        </div>
      </section>
    </div>
  </div>

  <div></div>

  <!-- BOTTOM -->
  <div class="row row--bottom">
    <div class="col">
      <section class="panel is-open" data-panel>
        <button class="panel__head" data-collapse>World <span class="chev">▾</span></button>
        <div class="panel__body">
          <div class="grp">
            <div class="lbl">Actions</div>
            <div class="seg">
              <button class="btn sea" id="btnKayak"><span class="dot"></span>Launch kayak</button>
              <button class="btn" id="btnRay">Ray leap</button>
              <button class="btn" id="btnPause"><span class="dot"></span>Pause</button>
              <button class="btn" id="btnReset">Reset</button>
            </div>
          </div>
          <div class="grp">
            <div class="lbl">Time of day</div>
            <div class="seg" id="todSeg">
              <button class="btn is-on" data-tod="0">Daytime</button>
              <button class="btn" data-tod="1">Sunset</button>
              <button class="btn" data-tod="2">Night</button>
            </div>
          </div>
        </div>
      </section>
    </div>
    <div class="col col--end">
      <section class="panel is-open" data-panel style="min-width:min(300px,86vw)">
        <button class="panel__head" data-collapse>Elements <span class="chev">▾</span></button>
        <div class="panel__body">
          <div class="grp">
            <div class="lbl">Tide <span id="tideVal">+0.00 m</span></div>
            <input type="range" id="tide" min="-100" max="100" value="0">
          </div>
          <div class="grp">
            <div class="lbl">Wind <span id="windVal">35%</span></div>
            <input type="range" id="wind" min="0" max="100" value="35">
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<button class="btn" id="panelToggle" style="background:var(--panel-2);backdrop-filter:blur(14px)">☰ Panels</button>
<div class="hint" id="hint">Drag to orbit · scroll to zoom · click a camera preset</div>

<div id="loader">
  <h2>Tidehaven</h2>
  <p>Filling the lagoon</p>
  <div class="bar"><i></i></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
const smoke=new THREE.Group();
const lampLights=[]; let cabinLight; /* fix: declared before first use */

/* ════════════════════════════════════════════════════════════════════════
   0 · UTILITIES
   ══════════════════════════════════════════════════════════════════════ */
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const damp  = (a,b,l,dt)=>lerp(a,b,1-Math.exp(-l*dt));
const TAU   = Math.PI*2;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(0x7DEA17);
const rr  = (a,b)=>a+rnd()*(b-a);
const Y_AXIS = new THREE.Vector3(0,1,0);

/* value noise (JS mirror of the GLSL helpers below) */
function hash2(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}
function vnoise(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  return lerp(lerp(hash2(ix,iy),hash2(ix+1,iy),u),lerp(hash2(ix,iy+1),hash2(ix+1,iy+1),u),v);}
function fbm(x,y){return .5*vnoise(x,y)+.25*vnoise(x*2.03,y*2.03)+.125*vnoise(x*4.07,y*4.07);}

/* ── island silhouette: identical in JS and GLSL ─────────────────────── */
function islandHeight(x,z){
  let d = Math.hypot(x,z);
  const a = Math.atan2(z,x);
  d *= 1 + .13*Math.sin(a*3+1.2) + .09*Math.sin(a*5-.6) + .05*Math.sin(a*7+2.4);
  const dome = 3.35*Math.exp(-Math.pow(d/4.2,2));
  const berm = .55*Math.exp(-Math.pow((d-5.4)/1.3,2));
  const drop = -6 * smoothstep(4.6,9.6,d);
  const rip  = .10*Math.sin(d*3.1-a*4)*smoothstep(9,3,d);
  return dome+berm+drop+rip;
}
const GLSL_TH = /* glsl */`
  float thS(float a,float b,float x){float t=clamp((x-a)/(b-a),0.0,1.0);return t*t*(3.0-2.0*t);}
  float thHeight(vec2 p){
    float d=length(p); float a=atan(p.y,p.x);
    d*=1.0+0.13*sin(a*3.0+1.2)+0.09*sin(a*5.0-0.6)+0.05*sin(a*7.0+2.4);
    float dome=3.35*exp(-pow(d/4.2,2.0));
    float berm=0.55*exp(-pow((d-5.4)/1.3,2.0));
    float drop=-6.0*thS(4.6,9.6,d);
    float rip=0.10*sin(d*3.1-a*4.0)*thS(9.0,3.0,d);
    return dome+berm+drop+rip;
  }
  float thHash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float thHash3(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
  float thNoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
    return mix(mix(thHash(i),thHash(i+vec2(1,0)),f.x),mix(thHash(i+vec2(0,1)),thHash(i+vec2(1,1)),f.x),f.y);}
  float thFbm(vec2 p){return 0.5*thNoise(p)+0.25*thNoise(p*2.03)+0.125*thNoise(p*4.07);}
  float thCaustic(vec2 p,float t){
    vec2 i=p; float c=1.0; const float inten=0.0045;
    for(int n=0;n<4;n++){
      float tt=t*0.55*(1.0-3.0/float(n+1));
      i=p+vec2(cos(tt-i.x)+sin(tt+i.y), sin(tt-i.y)+cos(tt+i.x));
      c+=1.0/length(vec2(p.x/(sin(i.x+tt)/inten+0.0001), p.y/(cos(i.y+tt)/inten+0.0001)));
    }
    c/=4.0; c=1.17-pow(c,1.4);
    return clamp(pow(abs(c),8.0),0.0,2.5);
  }
  const float TH_BED = -6.0;
  const float TH_HALF = 11.0;
`;

/* ── material patcher (keeps unique program cache keys) ──────────────── */
const INJECT = {
  'v:head'   : ['vertexShader','#include <common>'],
  'v:begin'  : ['vertexShader','#include <begin_vertex>'],
  'f:head'   : ['fragmentShader','#include <common>'],
  'f:emis'   : ['fragmentShader','#include <emissivemap_fragment>'],
  'f:final'  : ['fragmentShader','#include <dithering_fragment>'],
};
function patch(mat,key,code,uniforms){
  mat.onBeforeCompile=(sh)=>{
    if(uniforms) Object.assign(sh.uniforms,uniforms);
    for(const k in code){
      const [target,token]=INJECT[k];
      if(sh[target].indexOf(token)<0){console.warn('missing token',token,key);continue;}
      sh[target]=sh[target].replace(token,token+'\n'+code[k]);
    }
  };
  mat.customProgramCacheKey=()=>'th_'+key;
  if(uniforms) mat.userData.uni=uniforms;
  return mat;
}
/* lit-material registry: emissive scaled by time-of-day */
const LIT={};
function lit(name,mat,init={win:0,glow:0,fire:0}){
  const u={uWin:{value:init.win},uGlow:{value:init.glow},uFire:{value:init.fire},
           uWinCol:{value:new THREE.Color('#ffbd6e')},uGlowCol:{value:new THREE.Color('#ffb066')},
           uFireCol:{value:new THREE.Color('#ff8a3a')}};
  patch(mat,name,{
    'f:head':`uniform float uWin;uniform float uGlow;uniform float uFire;
              uniform vec3 uWinCol;uniform vec3 uGlowCol;uniform vec3 uFireCol;`,
    'f:emis':`totalEmissiveRadiance += uWinCol*uWin + uGlowCol*uGlow + uFireCol*uFire;`
  },u);
  mat.userData.lit=u; LIT[name]=mat; return mat;
}
function litSet(name,key,v){const m=LIT[name];if(m&&m.userData.lit[key])m.userData.lit[key].value=v;}

/* ════════════════════════════════════════════════════════════════════════
   1 · CONFIG + STATE
   ══════════════════════════════════════════════════════════════════════ */
const HALF=11, BED=-6, RIM=1.8, PIER_ANG=0.97;
const state={
  sim:0, tide:0, wind:.35, tod:0, todTarget:0,
  paused:false, kayak:'docked', quality:'high',
  waterY:0, underwater:0, musicOn:false, sfxOn:true, vol:.7
};

/* ════════════════════════════════════════════════════════════════════════
   2 · RENDERER / SCENE / CAMERA
   ══════════════════════════════════════════════════════════════════════ */
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(new THREE.Color('#d6e9e8'),.010);

const camera=new THREE.PerspectiveCamera(40,1,.1,400);
camera.position.set(15.5,12.5,16.5);

const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true; controls.dampingFactor=.06;
controls.minDistance=4; controls.maxDistance=48;
controls.maxPolarAngle=Math.PI*.495;
controls.target.set(0,.2,0);
controls.addEventListener('start',()=>{camTween=null;hideHint();});

function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,
    state.quality==='high'?2:state.quality==='medium'?1.5:1));
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);

/* ════════════════════════════════════════════════════════════════════════
   3 · LIGHTING · SKY · TIME OF DAY

  uStars:{value:0}, uTime:{value:0}, uMoon:{value:0}
};
const sky=new THREE.Mesh(
  new THREE.SphereGeometry(150,32,20),
  new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false, fog:false, uniforms:skyU,
    vertexShader:`varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*viewMatrix*modelMatrix*vec4(position,1.0);}`,
    fragmentShader:GLSL_TH+`
      uniform vec3 uZenith,uHorizon,uSunDir,uSunCol;uniform float uStars,uTime,uMoon;varying vec3 vD;
      void main(){

/* time-of-day keyframes (values are interpolated smoothly) */
const TOD=[
 {az:0.85,el:1.02,sunCol:'#fff3dd',sunInt:2.8,hemiSky:'#cfeaf2',hemiGnd:'#c0a87c',hemiInt:.8,
  zen:'#7fc2e6',hor:'#e2f0ef',fog:'#d6e9e8',fogD:.010,amb:.28,lantern:0,win:.10,fire:.15,
  stars:0,light:1.0,exp:1.0,shal:'#6fe0cb',deep:'#0d6c80',moon:0},
 {az:2.42,el:0.09,sunCol:'#ff9a4d',sunInt:2.3,hemiSky:'#6f6fa4',hemiGnd:'#c07a52',hemiInt:.5,
  zen:'#2b3a63',hor:'#ffb26b',fog:'#e8a077',fogD:.014,amb:.22,lantern:.85,win:1.0,fire:.8,
  stars:.18,light:.72,exp:1.05,shal:'#7fd4c4',deep:'#124a63',moon:0},
 {az:3.95,el:0.72,sunCol:'#a8c6ff',sunInt:.55,hemiSky:'#26425f',hemiGnd:'#182531',hemiInt:.30,
  zen:'#061220',hor:'#16304a',fog:'#0c2033',fogD:.020,amb:.16,lantern:1.7,win:1.9,fire:1.6,
  stars:1,light:.30,exp:1.15,shal:'#2f95a2',deep:'#04222e',moon:1}
];
const _cA=new THREE.Color(),_cB=new THREE.Color();
function mixNum(a,b,t){return lerp(a,b,t);}
function mixCol(out,a,b,t){out.set(a);_cB.set(b);out.lerp(_cB,t);return out;}
const tod={sunCol:new THREE.Color(),hemiSky:new THREE.Color(),hemiGnd:new THREE.Color(),
  zen:new THREE.Color(),hor:new THREE.Color(),fog:new THREE.Color(),shal:new THREE.Color(),deep:new THREE.Color()};
function applyTOD(){
  const t=clamp(state.tod,0,2), i=Math.min(1,Math.floor(t)), f=t-i, A=TOD[i], B=TOD[i+1];
  const el=lerp(A.el,B.el,f), az=lerp(A.az,B.az,f);
  const dir=new THREE.Vector3(Math.cos(el)*Math.cos(az),Math.sin(el),Math.cos(el)*Math.sin(az));
  sun.position.copy(dir).multiplyScalar(34);
  sun.intensity=lerp(A.sunInt,B.sunInt,f);
  mixCol(tod.sunCol,A.sunCol,B.sunCol,f); sun.color.copy(tod.sunCol);
  hemi.intensity=lerp(A.hemiInt,B.hemiInt,f);
  mixCol(tod.hemiSky,A.hemiSky,B.hemiSky,f); hemi.color.copy(tod.hemiSky);
  mixCol(tod.hemiGnd,A.hemiGnd,B.hemiGnd,f); hemi.groundColor.copy(tod.hemiGnd);
  amb.intensity=lerp(A.amb,B.amb,f);
  mixCol(tod.zen,A.zen,B.zen,f); mixCol(tod.hor,A.hor,B.hor,f);
  mixCol(tod.fog,A.fog,B.fog,f);
  scene.fog.color.copy(tod.fog); scene.fog.density=lerp(A.fogD,B.fogD,f);
  renderer.toneMappingExposure=lerp(A.exp,B.exp,f);
  mixCol(tod.shal,A.shal,B.shal,f); mixCol(tod.deep,A.deep,B.deep,f);
  const light=lerp(A.light,B.light,f);
  skyU.uZenith.value.copy(tod.zen); skyU.uHorizon.value.copy(tod.hor);
  skyU.uSunDir.value.copy(dir); skyU.uSunCol.value.copy(tod.sunCol);
  skyU.uStars.value=lerp(A.stars,B.stars,f); skyU.uMoon.value=lerp(A.moon,B.moon,f);
  /* lamps */
  const lan=lerp(A.lantern,B.lantern,f), win=lerp(A.win,B.win,f), fire=lerp(A.fire,B.fire,f);
  litSet('glass',   'glow',lan*2.6);
  litSet('lanternG','glow',lan*3.4);
  litSet('win',     'win', win*1.5);
  litSet('winGlow', 'win', win*2.2);
  litSet('fire',    'fire',fire*2.4);
  for(const L of lampLights) L.intensity=L.userData.base*lan;
  cabinLight.intensity=10*win; fireLight.intensity=(4+flicker*3)*fire;
  waterU.uLight.value=light; volU.uLight.value=light; glassU.uLight.value=light;
  waterU.uSunCol.value.copy(tod.sunCol); waterU.uSunDir.value.copy(dir);
  waterU.uShallow.value.copy(tod.shal);  waterU.uDeep.value.copy(tod.deep);
  volU.uShallow.value.copy(tod.shal);    volU.uDeep.value.copy(tod.deep);
  glassU.uDeep.value.copy(tod.deep);     glassU.uSky.value.copy(tod.hor);
  terrainU.uCaustic.value=light*.9+.15;
  plantU.uLight.value=light*.6+.4;
  skyU.uTime.value=state.sim;
}

/* ════════════════════════════════════════════════════════════════════════
   5 · TERRAIN (island + seabed, one watertight mesh)
   ══════════════════════════════════════════════════════════════════════ */
const terrainU={uTime:{value:0},uWaterY:{value:0},uCaustic:{value:1}};
const C={
  sand:new THREE.Color('#f0dfb6'), sandDk:new THREE.Color('#d3b789'),
  grass:new THREE.Color('#87ab5e'), grassDk:new THREE.Color('#5d8247'),
  rock:new THREE.Color('#8d8578'), seabed:new THREE.Color('#e6d3a8'),
  seagrass:new THREE.Color('#4f7d52')
};
const terrainGeo=new THREE.PlaneGeometry(22,22,150,150);
terrainGeo.rotateX(-Math.PI/2);
{
  const pos=terrainGeo.attributes.position, n=pos.count;
  const col=new Float32Array(n*3), tmp=new THREE.Color();
  for(let i=0;i<n;i++){
    const x=pos.getX(i), z=pos.getZ(i);
    const y=islandHeight(x,z); pos.setY(i,y);
    const e=.14;
    const nx=(islandHeight(x-e,z)-islandHeight(x+e,z))/e;
    const nz=(islandHeight(x,z-e)-islandHeight(x,z+e))/e;
    const ny=1/Math.hypot(nx,1,nz);
    const n1=fbm(x*.55,z*.55), n2=fbm(x*.32+11.3,z*.32-4.7);
    tmp.copy(C.sand).lerp(C.sandDk,clamp(n1*.9,0,1));
    tmp.lerp(C.grass,clamp(smoothstep(.72,1.55,y)*smoothstep(.52,.86,ny),0,1));
    tmp.lerp(C.grassDk,clamp(smoothstep(.55,.9,n2)*smoothstep(1.4,2.6,y)*.8,0,1));
    tmp.lerp(C.rock,clamp(smoothstep(.80,.56,ny)*.9,0,1));
    const under=smoothstep(-1.1,-2.4,y);
    tmp.lerp(C.seabed,under*.9);
    tmp.lerp(C.seagrass,smoothstep(.52,.82,fbm(x*.34,z*.34))*under);
    tmp.offsetHSL(0,0,(hash2(x*7.1,z*7.7)-.5)*.055);
    col[i*3]=tmp.r; col[i*3+1]=tmp.g; col[i*3+2]=tmp.b;
  }
  terrainGeo.setAttribute('color',new THREE.BufferAttribute(col,3));
  terrainGeo.computeVertexNormals();
}
const terrainMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.94,metalness:0});
patch(terrainMat,'terrain',{
  'v:head':'varying vec3 vWP;',
  'v:begin':'vWP=(modelMatrix*vec4(transformed,1.0)).xyz;',
  'f:head':GLSL_TH+`varying vec3 vWP;uniform float uTime,uWaterY,uCaustic;`,
  'f:emis':`
    float h=vWP.y;
    float wet=thS(uWaterY+0.55,uWaterY-0.25,h);
    float under=thS(uWaterY+0.05,uWaterY-0.35,h);
    diffuseColor.rgb*=mix(1.0,0.52,wet);
    float ca=thCaustic(vWP.xz*0.55+vec2(uTime*0.02,uTime*0.015),uTime*0.55);
    float ca2=thCaustic(vWP.xz*1.15-vec2(uTime*0.03),uTime*0.4+3.0);
    float dFade=thS(-5.6,-0.6,h);
    totalEmissiveRadiance+=(vec3(0.55,0.95,0.80)*ca*0.55+vec3(0.75,1.0,0.85)*ca2*0.22)
                            *under*dFade*uCaustic;
  `
},terrainU);
const terrain=new THREE.Mesh(terrainGeo,terrainMat);
terrain.castShadow=true; terrain.receiveShadow=true; scene.add(terrain);

/* ════════════════════════════════════════════════════════════════════════
   6 · WATER — volume, surface, glass walls, bubbles, droplets, ripples
   ══════════════════════════════════════════════════════════════════════ */
const RIPPLES=6, rippleArr=Array.from({length:RIPPLES},()=>new THREE.Vector4(0,0,-99,0));
let rippleIdx=0;
function addRipple(x,z,t){rippleArr[rippleIdx++%RIPPLES].set(x,z,t,1);}

const GLSL_WAVE=/* glsl */`
  uniform vec4 uRipples[${RIPPLES}];
  float waveH(vec2 p,float t,float w){
    float a=0.026+w*0.085; float h=0.0;
    h+=sin(p.x*1.15+t*1.55)*0.45;
    h+=sin(p.y*1.35-t*1.22)*0.40;
    h+=sin((p.x*0.72+p.y*0.92)*1.35+t*2.05)*0.34;
    h+=sin((p.x*1.9-p.y*1.15)*1.7-t*3.1)*0.20*(0.25+w);
    return h*a;
  }
  float rippleH(vec2 p,float t){
    float s=0.0;
    for(int i=0;i<${RIPPLES};i++){
      vec4 R=uRipples[i];
      if(R.w<0.5) continue;
      float age=t-R.z; if(age<0.0||age>3.4) continue;
      float d=distance(p,R.xy); float front=age*3.3;
      s+=sin((d-front)*7.5)*exp(-d*0.30)*exp(-age*1.45)*0.16*exp(-abs(d-front)*1.3);
    }
    return s;
  }
  float waveAt(vec2 p,float t,float w){return waveH(p,t,w)+rippleH(p,t);}
`;

/* ── surface ─────────────────────────────────────────────────────────── */
const waterU={
  uTime:{value:0},uWaterY:{value:0},uWind:{value:.35},uLight:{value:1},
  uSunDir:{value:new THREE.Vector3(0,1,0)},uSunCol:{value:new THREE.Color('#fff2dc')},
  uSkyCol:{value:new THREE.Color('#dfeef0')},uShallow:{value:new THREE.Color('#6fe0cb')},
  uDeep:{value:new THREE.Color('#0d6c80')},uRipples:{value:rippleArr}
};
const waterSurf=new THREE.Mesh(
  new THREE.PlaneGeometry(22,22,110,110).rotateX(-Math.PI/2),
  new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,side:THREE.DoubleSide,uniforms:waterU,
    vertexShader:GLSL_TH+GLSL_WAVE+`
      uniform float uTime,uWaterY,uWind; varying vec3 vWP;
      void main(){
        vec4 wp=modelMatrix*vec4(position,1.0);
        wp.y=uWaterY+waveAt(wp.xz,uTime,uWind);
        vWP=wp.xyz;
        gl_Position=projectionMatrix*viewMatrix*wp;
      }`,
    fragmentShader:GLSL_TH+GLSL_WAVE+`
      uniform float uTime,uWaterY,uWind,uLight;
      uniform vec3 uSunDir,uSunCol,uSkyCol,uShallow,uDeep;
      varying vec3 vWP;
      void main(){
        vec2 p=vWP.xz;
        float land=thHeight(p);
        float depth=uWaterY-land;
        if(depth<0.012) discard;
        float e=0.10;
        float hL=waveAt(p-vec2(e,0.0),uTime,uWind), hR=waveAt(p+vec2(e,0.0),uTime,uWind);
        float hD=waveAt(p-vec2(0.0,e),uTime,uWind), hU=waveAt(p+vec2(0.0,e),uTime,uWind);
        vec3 N=normalize(vec3(hL-hR,2.0*e,hD-hU));
        vec3 V=normalize(cameraPosition-vWP);
        float fres=pow(1.0-max(dot(N,V),0.0),3.2);
        float dFac=1.0-exp(-depth*0.40);
        vec3 col=mix(uShallow,uDeep,dFac);
        vec3 H=normalize(normalize(uSunDir)+V);
        col+=uSunCol*pow(max(dot(N,H),0.0),110.0)*2.2*uLight;
        col+=uShallow*0.40*thS(1.2,0.0,depth)*uLight;
        col=mix(col,uSkyCol*0.85,fres*0.55);
        float n=thFbm(p*1.9+vec2(uTime*0.10,-uTime*0.07));
        float shore=1.0-thS(0.05,0.85,depth);
        float lap=thS(0.30,0.0,abs(depth-(0.16+0.13*sin(uTime*1.35+p.x*0.8+p.y*0.5))));
        float rf=clamp(abs(rippleH(p,uTime))*9.0,0.0,0.9);
        float foam=clamp(shore*shore*(0.35+1.2*n)+lap*0.9*shore+rf,0.0,1.0);
        col=mix(col,vec3(0.97,0.99,1.0),foam*0.9);
        float alpha=(0.55+0.42*dFac)*thS(0.0,0.17,depth)+foam*0.45+fres*0.22;
        col*=mix(0.30,1.0,uLight);
        gl_FragColor=vec4(col,clamp(alpha,0.0,1.0));
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  })
);
waterSurf.renderOrder=12; waterSurf.frustumCulled=false; scene.add(waterSurf);

/* ── volume (BackSide → near faces culled = cutaway) ─────────────────── */
const volU={uTime:{value:0},uWaterY:{value:0},uLight:{value:1},
  uShallow:{value:new THREE.Color('#6fe0cb')},uDeep:{value:new THREE.Color('#0d6c80')}};
const waterVol=new THREE.Mesh(
  new THREE.BoxGeometry(22,1,22),
  new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,side:THREE.BackSide,uniforms:volU,
    vertexShader:`varying vec3 vWP;void main(){vec4 wp=modelMatrix*vec4(position,1.0);vWP=wp.xyz;
      gl_Position=projectionMatrix*viewMatrix*wp;}`,
    fragmentShader:GLSL_TH+`
      uniform float uTime,uWaterY,uLight;uniform vec3 uShallow,uDeep;varying vec3 vWP;
      void main(){
        float d01=clamp((uWaterY-vWP.y)/(uWaterY-TH_BED),0.0,1.0);
        vec3 col=mix(uShallow,uDeep,pow(d01,0.85));
        float ca=thCaustic(vWP.xz*0.38+vec2(uTime*0.02),uTime*0.5);
        col+=uShallow*ca*0.30*thS(-0.8,-4.2,vWP.y);
        col+=uShallow*0.10*(1.0-d01);
        col*=mix(0.28,1.0,uLight);
        gl_FragColor=vec4(col,0.16+0.34*d01);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  })
);
waterVol.renderOrder=11; waterVol.frustumCulled=false; scene.add(waterVol);
function updateVolume(){
  const h=Math.max(.2,state.waterY-(BED+.05));
  waterVol.scale.set(1,h,1);
  waterVol.position.y=(state.waterY+BED+.05)/2;
}

/* ── aquarium glass on the two cut faces ─────────────────────────────── */
const glassU={uTime:{value:0},uWaterY:{value:0},uLight:{value:1},
  uDeep:{value:new THREE.Color('#0d6c80')},uSky:{value:new THREE.Color('#dfeef0')}};
const glassMat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,side:THREE.DoubleSide,uniforms:glassU,
  vertexShader:`varying vec3 vWP;varying vec2 vUv;
    void main(){vUv=uv;vec4 wp=modelMatrix*vec4(position,1.0);vWP=wp.xyz;
    gl_Position=projectionMatrix*viewMatrix*wp;}`,
  fragmentShader:GLSL_TH+`
    uniform float uTime,uWaterY,uLight;uniform vec3 uDeep,uSky;varying vec3 vWP;varying vec2 vUv;
    void main(){
      float under=thS(uWaterY+0.03,uWaterY-0.30,vWP.y);
      float band=exp(-pow((vWP.y-uWaterY)*26.0,2.0));
      float streak=thNoise(vec2(vUv.x*46.0,vUv.y*1.6+uTime*0.02))*0.05;
      float layers=smoothstep(0.46,0.0,abs(fract(vWP.y*1.7)-0.5))*0.05*under;
      float edge=min(min(vUv.x,1.0-vUv.x),min(vUv.y,1.0-vUv.y));
      float rim=thS(0.010,0.0,edge);
      vec3 col=mix(uSky*0.35,uDeep*1.25,under);
      col+=vec3(1.0)*band*0.85;
      col+=vec3(1.0)*streak*(0.4+under);
      col+=vec3(0.9,0.85,0.75)*layers;
      col+=vec3(0.85,0.80,0.70)*rim*0.55;

function mantaGeo(){
  const NU=20,NV=16,pos=[],uv=[],col=[],idx=[];
  const dark=new THREE.Color('#2b3d49'),mid=new THREE.Color('#3f5a69'),lite=new THREE.Color('#7d9aa6');
  const c=new THREE.Color();
  for(let j=0;j<NV;j++){
    const v=-1+2*j/(NV-1);
    const hs=1.85*Math.pow(Math.max(0,1-v*v),.62);
    for(let i=0;i<NU;i++){
      const u=-1+2*i/(NU-1);
      const x=u*Math.max(hs,.001);
      const z=v*1.72;
      const y=.15*Math.pow(Math.max(0,1-u*u),.6)*Math.pow(Math.max(0,1-v*v),.5)-.07*u*u*(1-v*v);
      pos.push(x,y,z); uv.push((u+1)/2,(v+1)/2);
      c.copy(dark).lerp(mid,Math.abs(u)*.85).lerp(lite,Math.max(0,-v)*.35*(1-Math.abs(u)));
      col.push(c.r,c.g,c.b);
    }
  }
  for(let j=0;j<NV-1;j++)for(let i=0;i<NU-1;i++){
    const a=j*NU+i,b=a+NU;
    idx.push(a,b,a+1, b,b+1,a+1);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}

      const z=r.R*Math.sin(r.a1*r.t+r.ph1)*.62+r.R*.38*Math.sin(r.a2*r.t*1.3+r.ph2);
      let y=r.yBase+Math.sin(r.a3*r.t+r.ph3)*r.yAmp;

/* instanced helper */
function inst(geo,mat,items,parent=props){

  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),p=new THREE.Vector3(),s=new THREE.Vector3();

    if(it.col&&im.instanceColor===null){}
  });

}

function kayakHull(){
  const SEG=26,RING=14,L=3.0,W=.34,Hh=.3,pos=[],idx=[],uv=[];
  for(let i=0;i<=SEG;i++){
    const u=i/SEG, z=(u-.5)*L;
    const prof=Math.pow(Math.sin(Math.PI*u),.55);
    const w=W*Math.max(prof,.02), h=Hh*Math.max(prof,.02);
    for(let j=0;j<=RING;j++){
      const a=j/RING*Math.PI*2;
      pos.push(Math.cos(a)*w, Math.sin(a)*h*.55-h*.12, z);
      uv.push(j/RING,u);
    }
  }
  for(let i=0;i<SEG;i++)for(let j=0;j<RING;j++){
    const a=i*(RING+1)+j,b=a+RING+1;
    idx.push(a,b,a+1, b,b+1,a+1);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}

const kayakState={mode:'docked',t:0,angle:PIER_ANG,rad:8.3,dir:1,pos:new THREE.Vector3(),yaw:0};
function dockedPose(){
  const p=new THREE.Vector3(P1.x+pierPerp.x*.95,0,P1.y+pierPerp.y*.95);
  return {p,yaw:Math.atan2(pierDir.x,pierDir.y)+.12};
}
function updateKayak(dt){
  const k=kayakState;
  const dock=dockedPose();
  if(k.mode==='launching'){
    k.t+=dt*.55;
    if(k.t>=1){k.mode='sailing';k.t=1;}
    const a=smoothstep(0,1,Math.min(1,k.t));
    const target=new THREE.Vector3(Math.cos(k.angle)*k.rad,0,Math.sin(k.angle)*k.rad);
    k.pos.lerpVectors(dock.p,target,a);
    k.yaw=lerp(dock.yaw,k.angle+Math.PI/2,a);
  }else if(k.mode==='sailing'){
    k.angle+=dt*.16*k.dir;
    k.rad=damp(k.rad,8.3,2,dt);
    k.pos.set(Math.cos(k.angle)*k.rad,0,Math.sin(k.angle)*k.rad);
    k.yaw=k.angle+Math.PI/2;
  }else if(k.mode==='returning'){
    k.t+=dt*.42;
    const a=smoothstep(0,1,Math.min(1,k.t));
    const cur=new THREE.Vector3(Math.cos(k.angle)*k.rad,0,Math.sin(k.angle)*k.rad);
    k.pos.lerpVectors(cur,dock.p,a*a*(3-2*a)*.999+a*.001);
    k.yaw=lerp(k.angle+Math.PI/2,dock.yaw,a);
    if(k.t>=1){k.mode='docked';}
  }else{ k.pos.copy(dock.p); k.yaw=dock.yaw; }
  /* bob + tide */
  const bob=Math.sin(state.sim*1.5)*.035*(0.4+state.wind);
  kayak.position.set(k.pos.x,state.waterY+.06+bob,k.pos.z);
  kayak.rotation.set(Math.sin(state.sim*1.3)*.05*(.4+state.wind),k.yaw,
    Math.sin(state.sim*1.05+1.)*.07*(.4+state.wind),'YXZ');
}

const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function flyTo(name,ms=1500){
  const c=CAMS[name]; if(!c) return;
  camTween={t:0,ms,fp:camera.position.clone(),tp:c.pos.clone(),
            ft:controls.target.clone(),tt:c.tgt.clone(),ff:camera.fov,tf:c.fov};
}
function updateCam(dt){
  if(camTween){
    camTween.t+=dt*1000;
    const k=easeIO(clamp(camTween.t/camTween.ms,0,1));
    camera.position.lerpVectors(camTween.fp,camTween.tp,k);
    controls.target.lerpVectors(camTween.ft,camTween.tt,k);
    const f=lerp(camTween.ff,camTween.tf,k);
    if(Math.abs(camera.fov-f)>.01){camera.fov=f;camera.updateProjectionMatrix();}
    if(k>=1) camTween=null;
  }
  controls.update();
  camera.position.y=clamp(camera.position.y,-5.55,40);
  camera.position.x=clamp(camera.position.x,-30,30);
  camera.position.z=clamp(camera.position.z,-30,30);

/* ════════════════════════════════════════════════════════════════════════
   10 · PROCEDURAL AUDIO
   ══════════════════════════════════════════════════════════════════════ */
const Audio=(()=>{
  let ctx=null,master,musicBus,sfxBus,ambBus,lp,musicTimer=null,nextT=0,step=0;
  let noiseBuf=null,started=false,windG,windF,waterG,waterF,waterLfo;
  const CH=[[45,52,57,60,64],[41,48,53,57,60],[43,50,55,59,62],[40,47,52,55,59]];
  const m2f=m=>440*Math.pow(2,(m-69)/12);
  function makeNoise(sec){
    const b=ctx.createBuffer(1,ctx.sampleRate*sec,ctx.sampleRate);
    const d=b.getChannelData(0); let last=0;
    for(let i=0;i<d.length;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.2;}
    return b;
  }
  function makeIR(sec,dec){
    const b=ctx.createBuffer(2,ctx.sampleRate*sec,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,dec);}
    return b;
  }
  function init(){
    if(ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ctx=new AC();
    master=ctx.createGain(); master.gain.value=state.vol*.9;
    lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=18000; lp.Q.value=.4;
    lp.connect(master); master.connect(ctx.destination);
    const rev=ctx.createConvolver(); rev.buffer=makeIR(2.6,2.4);
    const revG=ctx.createGain(); revG.gain.value=.5; rev.connect(revG); revG.connect(lp);
    musicBus=ctx.createGain(); musicBus.gain.value=0;
    sfxBus=ctx.createGain(); sfxBus.gain.value=state.sfxOn?1:0;
    ambBus=ctx.createGain(); ambBus.gain.value=0;
    musicBus.connect(lp); musicBus.connect(rev); sfxBus.connect(lp); ambBus.connect(lp);
    window.__rev=rev;
    noiseBuf=makeNoise(3);
    /* wind */
    const w=ctx.createBufferSource(); w.buffer=noiseBuf; w.loop=true;
    windF=ctx.createBiquadFilter(); windF.type='bandpass'; windF.frequency.value=620; windF.Q.value=.7;
    windG=ctx.createGain(); windG.gain.value=.02;
    w.connect(windF); windF.connect(windG); windG.connect(ambBus); w.start();
    const wl=ctx.createOscillator(), wlg=ctx.createGain();
    wl.frequency.value=.07; wlg.gain.value=280; wl.connect(wlg); wlg.connect(windF.frequency); wl.start();
    /* water */
    const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    waterF=ctx.createBiquadFilter(); waterF.type='lowpass'; waterF.frequency.value=520;
    waterG=ctx.createGain(); waterG.gain.value=.05;
    s.connect(waterF); waterF.connect(waterG); waterG.connect(ambBus); s.start();
    waterLfo=ctx.createOscillator(); const wg2=ctx.createGain();
    waterLfo.frequency.value=.13; wg2.gain.value=.035;
    waterLfo.connect(wg2); wg2.connect(waterG.gain); waterLfo.start();
    ambBus.gain.setTargetAtTime(state.sfxOn?.9:0,ctx.currentTime,.8);
    started=true;
    startMusic();
  }
  function startMusic(){
    if(!ctx||musicTimer) return;
    nextT=ctx.currentTime+.15;
    musicTimer=setInterval(()=>{
      while(nextT<ctx.currentTime+.4){
        const bar=Math.floor(step/8)%4, ch=CH[bar];
        if(step%8===0){ pad(ch[0]-12,nextT,7.2,.09); pad(ch[1],nextT,7.2,.055); bass(ch[0]-24,nextT); }
        if(rnd()<.5) bell(ch[1+Math.floor(rnd()*4)]+12,nextT);
        if(rnd()<.18) bell(ch[2]+24,nextT+rr(.2,.9));
        step++; nextT+=.92;
      }
    },45);
  }
  function pad(m,t,dur,g){
    const o=ctx.createOscillator(),o2=ctx.createOscillator(),gn=ctx.createGain(),f=ctx.createBiquadFilter();
    o.type='triangle';o2.type='sine';o.frequency.value=m2f(m);o2.frequency.value=m2f(m)*2.003;
    f.type='lowpass';f.frequency.value=1100;
    gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(g,t+1.6);
    gn.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(f);o2.connect(f);f.connect(gn);gn.connect(musicBus);
    o.start(t);o2.start(t);o.stop(t+dur+.1);o2.stop(t+dur+.1);
  }
  function bass(m,t){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.value=m2f(m);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.25);
    g.gain.exponentialRampToValueAtTime(.0005,t+4.5);
    o.connect(g);g.connect(musicBus);o.start(t);o.stop(t+4.6);
  }
  function bell(m,t){
    const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain();
    o.type='triangle';o2.type='sine';
    o.frequency.value=m2f(m);o2.frequency.value=m2f(m)*2.01;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.075,t+.012);
    g.gain.exponentialRampToValueAtTime(.0004,t+1.9);
    o.connect(g);o2.connect(g);g.connect(musicBus);
    o.start(t);o2.start(t);o.stop(t+2);o2.stop(t+2);
  }
  function noiseBurst(dur,type,f0,f1,g0){
    if(!ctx) return null;
    const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    const f=ctx.createBiquadFilter(); f.type=type;
    f.frequency.setValueAtTime(f0,ctx.currentTime);
    f.frequency.exponentialRampToValueAtTime(f1,ctx.currentTime+dur);
    const g=ctx.createGain();
    g.gain.setValueAtTime(g0,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0005,ctx.currentTime+dur);
    s.connect(f);f.connect(g);g.connect(sfxBus);
    s.start(); s.stop(ctx.currentTime+dur+.05);
    return g;
  }
  return {
    unlock(){ init(); if(ctx&&ctx.state==='suspended') ctx.resume(); },
    splash(){
      if(!ctx||!state.sfxOn) return;
      noiseBurst(.75,'bandpass',2200,260,.5);
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.setValueAtTime(120,ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(48,ctx.currentTime+.4);
      g.gain.setValueAtTime(.28,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.0005,ctx.currentTime+.5);
      o.connect(g);g.connect(sfxBus);o.start();o.stop(ctx.currentTime+.55);
      for(let i=0;i<7;i++){
        const t=ctx.currentTime+.12+i*.07+Math.random()*.05;
        const b=ctx.createOscillator(),bg=ctx.createGain();
        b.type='sine';b.frequency.setValueAtTime(1200+Math.random()*1800,t);
        bg.gain.setValueAtTime(.05,t);bg.gain.exponentialRampToValueAtTime(.0004,t+.12);
        b.connect(bg);bg.connect(sfxBus);b.start(t);b.stop(t+.15);
      }
    },
    whoosh(){
      if(!ctx||!state.sfxOn) return;
      const g=noiseBurst(.55,'bandpass',300,1800,.16);
      if(g) g.gain.setValueAtTime(.001,ctx.currentTime),
             g.gain.linearRampToValueAtTime(.16,ctx.currentTime+.25);
    },
    creak(){
      if(!ctx||!state.sfxOn) return;
      const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
      o.type='sawtooth';o.frequency.setValueAtTime(160,ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(95,ctx.currentTime+.3);
      f.type='bandpass';f.frequency.value=420;f.Q.value=6;
      g.gain.setValueAtTime(.06,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.0005,ctx.currentTime+.35);
      o.connect(f);f.connect(g);g.connect(sfxBus);o.start();o.stop(ctx.currentTime+.4);
      noiseBurst(.3,'highpass',900,2400,.08);
    },
    click(f=760){
      if(!ctx||!state.sfxOn) return;
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.05,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.0004,ctx.currentTime+.09);
      o.connect(g);g.connect(sfxBus);o.start();o.stop(ctx.currentTime+.1);
    },
    setMusic(on){ if(ctx) musicBus.gain.setTargetAtTime(on?.55:0,ctx.currentTime,.7); },
    setSfx(on){ if(ctx) ambBus.gain.setTargetAtTime(on?.9:0,ctx.currentTime,.5); },
    setVol(v){ if(ctx) master.gain.setTargetAtTime(v*.9,ctx.currentTime,.1); },
    setWind(w){ if(ctx&&windG) windG.gain.setTargetAtTime(.015+w*.10,ctx.currentTime,.6); },
    underwater(k){ if(ctx&&lp) lp.frequency.setTargetAtTime(lerp(18000,420,k*k),ctx.currentTime,.25); }
  };
})();

  Audio.setSfx(state.sfxOn);
});
/* mobile default: only the world panel open */
if(window.innerWidth<900){
  $$('[data-panel]').forEach(p=>p.classList.remove('is-open'));
  $$('[data-panel]')[0].classList.add('is-open');
}
let hintTimer=setTimeout(()=>$('#hint').classList.add('gone'),9000);
function hideHint(){clearTimeout(hintTimer);$('#hint').classList.add('gone');}

/* quality */
function applyQuality(q){
  state.quality=q;
  const sm=q==='high'?2048:q==='medium'?1024:512;
  sun.shadow.mapSize.set(sm,sm);
  if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}
  renderer.shadowMap.type=q==='high'?THREE.PCFSoftShadowMap:THREE.PCFShadowMap;
  sun.shadow.radius=q==='high'?2.2:1.2;
  resize();
  scene.traverse(o=>{if(o.material&&!Array.isArray(o.material))o.material.needsUpdate=true;});
}
if(window.innerWidth<760) applyQuality('medium');

/* ════════════════════════════════════════════════════════════════════════
   12 · MAIN LOOP
   ══════════════════════════════════════════════════════════════════════ */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dtRaw=Math.min(.05,(now-last)/1000); last=now;
  const dt=state.paused?0:dtRaw;
  state.sim+=dt;

  /* tide + water uniforms */
  state.waterY=damp(state.waterY,state.tide,7,dtRaw);
  waterU.uTime.value=state.sim; waterU.uWaterY.value=state.waterY;
  waterU.uWind.value=damp(waterU.uWind.value,state.wind,4,dtRaw);
  volU.uTime.value=state.sim; volU.uWaterY.value=state.waterY;
  glassU.uTime.value=state.sim; glassU.uWaterY.value=state.waterY;
  terrainU.uTime.value=state.sim; terrainU.uWaterY.value=state.waterY;
  bubMat.uniforms.uTime.value=state.sim; bubMat.uniforms.uWaterY.value=state.waterY;
  treeU.uTime.value=state.sim; treeU.uWind.value=waterU.uWind.value;
  plantU.uTime.value=state.sim; plantU.uWind.value=waterU.uWind.value;
  updateVolume();
  updateDroplets(dt);

  /* time of day */
  state.tod=damp(state.tod,state.todTarget,1.6,dtRaw);
  flicker=Math.sin(state.sim*11)*.5+Math.sin(state.sim*23.3)*.3;
  applyTOD();

  /* life + props */
  updateRays(dt);
  updateFish(dt);
  updateKayak(dt);
  updateSmoke(dt);
  if(fireMeshRef){
    const s=1+Math.sin(state.sim*9)*.12+flicker*.06;
    fireMeshRef.scale.set(s,s*.9,s);
    fireMeshRef.rotation.y+=dt*.7;
  }
  updateCam(dtRaw);
  renderer.render(scene,camera);
}

/* boot */
resize();
applyTOD();
requestAnimationFrame(frame);
setTimeout(()=>$('#loader').classList.add('gone'),650);
</script>
</body>
</html>
